version: 2
updates:
  # One pull request a week for all actions together, and only for releases
  # at least a week old: a compromised release is usually pulled within days.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: actions
