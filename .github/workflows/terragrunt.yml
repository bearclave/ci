              "time_sleep": "Wait",
          }
          # azapi_resource says what it is in its `type`.
          AZAPI_KINDS = {
              "Microsoft.SecurityInsights/alertRules": "Analytic rule",
              "Microsoft.SecurityInsights/automationRules": "Automation rule",
              "Microsoft.SecurityInsights/watchlists": "Watchlist",
              "Microsoft.SecurityInsights/dataConnectors": "Data connector",
              "Microsoft.SecurityInsights/onboardingStates": "Sentinel onboarding",
              "Microsoft.SecurityInsights/settings": "Sentinel setting",
              "Microsoft.Insights/workbooks": "Workbook",
              "Microsoft.Insights/diagnosticSettings": "Diagnostic settings",
              "Microsoft.OperationalInsights/workspaces/tables": "Log Analytics table",
              "Microsoft.Logic/workflows": "Logic App",
              "Microsoft.Logic/workflows/triggers": "Logic App trigger",
              "Microsoft.Web/connections": "API connection",
          }
          # Where the name of a resource is, by type; the generic keys after that.
          NAMES = {
              "github_repository_environment": ("repository", "environment"),
              "github_repository_environment_deployment_policy": ("repository", "environment", "branch_pattern"),
              "github_repository_custom_property": ("repository", "property_name"),
              "github_repository_deploy_key": ("repository", "title"),
              "github_actions_variable": ("repository", "variable_name"),
              "github_actions_secret": ("repository", "secret_name"),
              "github_actions_organization_variable": ("variable_name",),
              "github_organization_custom_properties": ("property_name",),
              "github_team_repository": ("repository",),
              "github_issue_labels": ("repository",),
              "github_repository_dependabot_security_updates": ("repository",),
              "github_actions_repository_access_level": ("repository",),
              "azurerm_security_center_subscription_pricing": ("resource_type",),
              "azurerm_resource_provider_registration": ("name",),
              "azuread_group_member": ("member_object_id",),
          }
          NAME_KEYS = ("display_name", "name", "user_principal_name", "variable_name", "title",
                       "comment", "role_definition_name")
          # Attributes whose change says nothing a reviewer acts on.
          NOISE = re.compile(
              r"^(id|etag|node_id|repo_id|timeouts|output|version|resource_version|last_modified.*"
              r"|.*_url|.*_urls|url|created_at|updated_at|timestamp|.*_timestamp)$")
          # What a resource is reached through: an azapi resource's settings live under
          # `body`, a msgraph one's too.
          WRAPPERS = ("body", "properties")
          REASONS = {
              "delete_because_no_resource_config": "no longer in the code",
              "delete_because_no_module": "its module is no longer in the code",
              "delete_because_each_key": "its key is no longer in the `for_each`",
              "delete_because_count_index": "its index is beyond the `count`",
              "delete_because_wrong_repetition": "`count` and `for_each` swapped",
              "delete_because_no_move_target": "its `moved` target is gone",
              "replace_because_tainted": "tainted",
              "replace_because_cannot_update": "a setting cannot change in place",
              "replace_by_request": "replace requested",
              "replace_by_triggers": "a `replace_triggered_by` changed",
          }
          MAX_VALUE = 60
          MAX_LIST = 4
          NONE = "—"
          RE_RESOURCE_ID = re.compile(r"/subscriptions/[^/\s]+(?:/resourceGroups/[^/\s]+)?(?:/providers/\S+)?"
                                      r"|/providers/Microsoft\.\S+", re.I)
          RE_ADDRESS = re.compile(r'(?:^|\.)(?:data\.)?([a-z0-9]+_[a-z0-9_]+)\.([A-Za-z0-9_-]+)(\[.+\])?$')


          def code(text) -> str:
              """An inline code span that survives backticks and pipes in the text."""
              text = str(text).replace("|", "\\|")
              tick = "``" if "`" in text else "`"
              pad = " " if tick == "``" else ""
              return f"{tick}{pad}{text}{pad}{tick}"


          def kind(rtype: str, values=None) -> str:
              """What a person calls a resource of this type."""
              if rtype == "azapi_resource" and isinstance(values, dict) and values.get("type"):
                  api = str(values["type"]).split("@")[0]
                  if api in AZAPI_KINDS:
                      return AZAPI_KINDS[api]
                  last = api.rsplit("/", 1)[-1]
                  words = re.sub(r"(?<!^)([A-Z])", r" \1", last).lower()
                  return (words[:1].upper() + words[1:]).removesuffix("s")
              if rtype in KINDS:
                  return KINDS[rtype]
              words = re.sub(r"^[a-z0-9]+?_", "", rtype).replace("_", " ")
              return words[:1].upper() + words[1:]


          def short_id(value):
              """The last name in an Azure resource ID; anything else as it is."""
              if isinstance(value, str) and RE_RESOURCE_ID.fullmatch(value):
                  return value.rstrip("/").rsplit("/", 1)[-1]
              return value


          def address_parts(address: str):
              """(type, name, index) of a resource address, without the modules."""
              m = RE_ADDRESS.search(address)
              if not m:
                  return "", address, None
              index = m.group(3)
              if index:
                  index = index[1:-1].strip('"')
              return m.group(1), m.group(2), index


          def name_of(rc: dict) -> str:
              """A name a person would recognise, taken from the values of the resource."""
              change = rc.get("change") or {}
              values = change.get("after") or change.get("before") or {}
              sensitive = change.get("after_sensitive") or change.get("before_sensitive") or {}
              index = rc.get("index")
              rtype = rc.get("type", "")
              if not isinstance(values, dict):
                  values = {}

              def plain(key):
                  v = values.get(key)
                  if isinstance(sensitive, dict) and sensitive.get(key):
                      return None
                  if isinstance(v, (str, int)) and not isinstance(v, bool) and str(v) != "":
                      return str(short_id(v))
                  return None

              if rtype in ("azurerm_role_assignment", "azurerm_pim_eligible_role_assignment"):
                  role = plain("role_definition_name") or short_id(values.get("role_definition_id") or "")
                  who = None
                  if isinstance(index, str) and "/" in index:
                      role, who = index.split("/", 1)
                  who = who or plain("principal_id") or ""
                  scope = plain("scope") or ""
                  return f"{role} for {who}" + (f" on {scope}" if scope else "")
              if rtype == "azapi_resource":
                  body = values.get("body") if isinstance(values.get("body"), dict) else {}
                  props = body.get("properties") if isinstance(body.get("properties"), dict) else {}
                  display = props.get("displayName") or props.get("display_name")
                  if isinstance(display, str) and display:
                      return display
              if rtype in NAMES:
                  parts = [plain(k) for k in NAMES[rtype]]
                  parts = [p for p in parts if p]
                  if parts:
                      return "/".join(parts)
              for key in NAME_KEYS:
                  if v := plain(key):
                      return v
              if index is not None:
                  return str(index)
              return ""


          def crop(before: str, after: str):
              """Two long strings cut to where they start to differ."""
              if len(before) <= MAX_VALUE and len(after) <= MAX_VALUE:
                  return before, after
              same = 0
              while same < min(len(before), len(after)) and before[same] == after[same]:
                  same += 1
              start = max(0, same - 20)
              if start == 0:
                  return before, after
              return "…" + before[start:], "…" + after[start:]


          def fmt(value) -> str:
              """A value as a code span, short enough for a table cell."""
              if value is None:
                  return NONE
              if isinstance(value, str):
                  text = short_id(value)
              else:
                  text = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              text = text.replace("\r", "").replace("\n", "⏎")
              if len(text) > MAX_VALUE:
                  text = text[: MAX_VALUE - 1] + "…"
              return code(text)


          def at(tree, path):
              """The value at a path in before/after or in a sensitive/unknown map."""
              for step in path:
                  tree = as_json(tree)
                  if isinstance(tree, dict):
                      tree = tree.get(step)
                  elif isinstance(tree, list) and isinstance(step, int) and step < len(tree):
                      tree = tree[step]
                  else:
                      return None
              return tree


          def flagged(tree, path) -> bool:
              """True when the path or anything above it is marked in a sensitive/unknown map."""
              if tree is True:
                  return True
              for step in path:
                  if isinstance(tree, dict):
                      tree = tree.get(step)
                  elif isinstance(tree, list) and isinstance(step, int) and step < len(tree):
                      tree = tree[step]
                  else:
                      return False
                  if tree is True:
                      return True
              return False


          def leaves(tree, path=()):
              if tree is True:
                  yield path
              elif isinstance(tree, dict):
                  for k, v in tree.items():
                      yield from leaves(v, path + (k,))
              elif isinstance(tree, list):
                  for i, v in enumerate(tree):
                      yield from leaves(v, path + (i,))


          def anything_flagged(tree, path) -> bool:
              """True when the path, anything above it or anything below it is marked.

              A sensitive map can mark single elements of a list or keys of an object,
              so a value is shown only when nothing inside it is sensitive either.
              """
              if flagged(tree, path):
                  return True
              return any(True for _ in leaves(at(tree, path) or {}))


          def scalars(values) -> bool:
              return isinstance(values, list) and all(not isinstance(v, (dict, list)) for v in values)


          def as_json(value):
              """A string that holds a JSON object or list, parsed; anything else as it is."""
              if isinstance(value, str) and value[:1] in "{[":
                  try:
                      return json.loads(value)
                  except ValueError:
                      pass
              return value


          def diff(before, after, path=()):
              """Paths whose value differs, down to the leaves.

              A missing object counts as an empty one, so a tag that is added is a path
              of its own; lists of scalars and lists that change length stay whole.
              """
              before, after = as_json(before), as_json(after)
              if isinstance(before, dict) or isinstance(after, dict):
                  if isinstance(before, (dict, type(None))) and isinstance(after, (dict, type(None))):
                      b, a = before or {}, after or {}
                      for key in sorted(set(b) | set(a), key=str):
                          yield from diff(b.get(key), a.get(key), path + (key,))
                      return
              if (isinstance(before, list) and isinstance(after, list) and not scalars(before)
                      and not scalars(after) and len(before) == len(after)):
                  for i, (b, a) in enumerate(zip(before, after)):
                      yield from diff(b, a, path + (i,))
              elif before != after and not (before in (None, [], "") and after in (None, [], "")):
                  yield path


          def label(path, rtype: str = "") -> str:
              """How a person says which setting it is: tag `owner`, setting `a.b`."""
              steps = list(path)
              while steps and steps[0] in WRAPPERS and rtype.startswith(("azapi_", "msgraph_")):
                  steps.pop(0)
              if len(steps) == 2 and steps[0] == "tags":
                  return f"tag {code(steps[1])}"
              text = ""
              for step in steps:
                  if isinstance(step, int):
                      text += f"[{step}]" if step else ""
                  else:
                      text += ("." if text else "") + str(step)
              return f"setting {code(text or '(whole resource)')}"


          def summary(value) -> str:
              """A block of a list (a log category, a rule) told by its first scalars."""
              if isinstance(value, dict):
                  parts = [f"{k}={v}" for k, v in value.items()
                           if isinstance(v, (str, int, float, bool)) and v not in ("", None)]
                  return ", ".join(parts[:3]) or json.dumps(value, ensure_ascii=False)
              return str(value)


          def attribute_rows(change: dict, rtype: str = "") -> list:
              """(what, from, to) for every change of an update that matters."""
              before, after = change.get("before") or {}, change.get("after") or {}
              bs, as_ = change.get("before_sensitive") or {}, change.get("after_sensitive") or {}
              unknown = change.get("after_unknown") or {}
              out = []
              for path in diff(before, after):
                  if any(isinstance(s, str) and NOISE.match(s) for s in path):
                      continue
                  if flagged(unknown, path):
                      continue
                  what = label(path, rtype)
                  if anything_flagged(bs, path) or anything_flagged(as_, path):
                      out.append((what, "(sensitive)", "(sensitive)"))
                      continue
                  b, a = as_json(at(before, path)), as_json(at(after, path))
                  if isinstance(b, list) or isinstance(a, list):
                      b, a = b or [], a or []
                      added = [x for x in a if x not in b]
                      removed = [x for x in b if x not in a]
                      if not added and not removed:
                          out.append((f"{what}: order", NONE, NONE))
                          continue
                      for verb, items in (("added", added), ("removed", removed)):
                          shown = items[:MAX_LIST]
                          for x in shown:
                              text = x if not isinstance(x, (dict, list)) else summary(x)
                              out.append((f"{what}: {verb} {fmt(text)}", NONE, NONE))
                          if len(items) > MAX_LIST:
                              out.append((f"{what}: {len(items) - MAX_LIST} more {verb}", NONE, NONE))
                      continue
                  if isinstance(b, str) and isinstance(a, str):
                      b, a = crop(b, a)
                  out.append((what, fmt(b), fmt(a)))
              return out


          def diagnostic(values) -> str:
              """Logs and metrics of a diagnostic setting, and where they go."""
              if not isinstance(values, dict):
                  return ""
              body = values.get("body") if isinstance(values.get("body"), dict) else {}
              values = {**values, **(body.get("properties") or {})}
              logs, metrics = [], []
              for key in ("enabled_log", "log", "logs"):
                  for item in values.get(key) or []:
                      if isinstance(item, dict) and item.get("enabled", True):
                          name = item.get("category") or item.get("categoryGroup") or item.get("category_group")
                          if name:
                              logs.append(name)
              for key in ("enabled_metric", "metric", "metrics"):
                  for item in values.get(key) or []:
                      if isinstance(item, dict) and item.get("enabled", True) and item.get("category"):
                          metrics.append(item["category"])
              target = (values.get("log_analytics_workspace_id") or values.get("workspaceId")
                        or values.get("storage_account_id") or values.get("storageAccountId")
                        or values.get("eventhub_name"))
              parts = []
              if logs:
                  parts.append("logs " + ", ".join(code(x) for x in logs[:MAX_LIST])
                               + (f" and {len(logs) - MAX_LIST} more" if len(logs) > MAX_LIST else ""))
              if metrics:
                  parts.append("metrics " + ", ".join(code(x) for x in metrics[:MAX_LIST]))
              text = "; ".join(parts) or "nothing"
              if target:
                  where = "workspace" if "workspace" in str(target).lower() or values.get(
                      "log_analytics_workspace_id") else "destination"
                  text += f" → {where} {code(short_id(target))}"
              return text


          def verb_of(rc: dict):
              change = rc.get("change") or {}
              actions = tuple(change.get("actions") or [])
              if actions == ("forget",):
                  return "forget"
              verb = {("create",): "create", ("update",): "update", ("delete",): "destroy",
                      ("delete", "create"): "replace", ("create", "delete"): "replace",
                      ("read",): "read"}.get(actions)
              if verb is None:
                  if change.get("importing"):
                      return "import"
                  if rc.get("previous_address") and rc["previous_address"] != rc["address"]:
                      return "move"
              return verb


          def entry(rc: dict, unit: str):
              """What the comment says about one resource change, or None to leave it out."""
              if rc.get("mode") == "data":
                  return None
              verb = verb_of(rc)
              if verb in (None, "read"):
                  return None
              change = rc.get("change") or {}
              rtype = rc.get("type", "")
              values = change.get("after") or change.get("before")
              imported = bool(change.get("importing"))
              moved = rc.get("previous_address") and rc["previous_address"] != rc["address"]
              item = {"unit": unit, "address": rc["address"], "action": verb, "icon": ICONS[verb],
                      "kind": kind(rtype, values), "name": name_of(rc) or address_parts(rc["address"])[1],
                      "rows": [], "why": "", "imported": imported}
              is_diag = item["kind"].endswith("Diagnostic settings")
              if verb == "create":
                  text = "created"
                  if is_diag:
                      text = "diagnostic settings added: " + diagnostic(change.get("after"))
                  item["rows"] = [(text, NONE, NONE)]
              elif verb in ("update", "import", "move"):
                  rows = attribute_rows(change, rtype)
                  if is_diag and rows and verb == "update":
                      rows = [(f"diagnostic settings: {r[0]}", r[1], r[2]) for r in rows]
                  if verb == "import":
                      rows = [("imported", NONE, NONE)] + rows
                  if verb == "move":
                      rows = [(f"moved from {code(rc['previous_address'])}", NONE, NONE)] + rows
                  if verb == "update" and not rows:
                      rows = [("updated; the new values are known only after apply", NONE, NONE)]
                  item["rows"] = rows
              elif verb == "forget":
                  item["rows"] = [("removed from Terraform, left in place", NONE, NONE)]
              elif verb == "destroy":
                  item["why"] = REASONS.get(rc.get("action_reason", ""), "")
                  item["rows"] = [("destroyed", NONE, NONE)]
              elif verb == "replace":
                  paths = [tuple(p) for p in change.get("replace_paths") or []]
                  forced = [r for r in attribute_rows({**change, "after_unknown": {}}, rtype)
                            if any(r[0].startswith(label(p, rtype)) for p in paths)]
                  if forced:
                      item["why"] = "; ".join(
                          f"{r[0]} forces it" + (f": {r[1]} → {r[2]}" if r[1] != NONE or r[2] != NONE else "")
                          for r in forced)
                  elif paths:
                      item["why"] = ", ".join(label(p, rtype) for p in paths) + " forces it"
                  else:
                      item["why"] = REASONS.get(rc.get("action_reason", ""), "")
                  item["rows"] = [("replaced", NONE, NONE)]
              if moved and verb != "move":
                  item["rows"].append((f"moved from {code(rc['previous_address'])}", NONE, NONE))
              if imported and verb not in ("import",):
                  item["rows"].append(("imported", NONE, NONE))
              # An import that changes nothing is counted, not listed.
              item["noop_import"] = verb == "import" and len(item["rows"]) == 1
              return item


          def natural(text: str) -> list:
              """A sort key that puts x[2] before x[10]."""
              return [(0, int(p), "") if p.isdigit() else (1, 0, p) for p in re.split(r"(\d+)", text)]


          def entries(plan: dict, unit: str) -> list:
              out = [e for rc in plan.get("resource_changes") or [] if (e := entry(rc, unit))]
              out.sort(key=lambda e: (ORDER.get(e["action"], 9), natural(e["address"])))
              return out


          TEXT_VERBS = {
              "will be created": "create",
              "will be updated in-place": "update",
              "will be destroyed": "destroy",
              "must be replaced": "replace",
              "is tainted, so must be replaced": "replace",
              "will be replaced, as requested": "replace",
              "will be imported": "import",
          }


          def text_entry(address: str, what: str, unit: str, imported: bool = False):
              """The same entry from the text of the plan alone, for a unit without JSON."""
              if what.startswith("has moved to "):
                  verb, prev, address = "move", address, what[len("has moved to "):]
              elif what.startswith("will no longer be managed"):
                  verb, prev = "forget", None
              else:
                  verb, prev = TEXT_VERBS.get(what), None
              if verb is None:
                  return None
              rtype, name, index = address_parts(address)
              rows = {"create": "created", "update": "updated, see the details", "destroy": "destroyed",
                      "replace": "replaced", "import": "imported",
                      "forget": "removed from Terraform, left in place"}
              text = f"moved from {code(prev)}" if verb == "move" else rows[verb]
              item = {"unit": unit, "address": address, "action": verb, "icon": ICONS[verb],
                      "kind": kind(rtype) if rtype else "Resource", "name": index or name,
                      "rows": [(text, NONE, NONE)], "imported": imported,
                      "why": "tainted" if "tainted" in what else "", "noop_import": verb == "import"}
              if imported and verb != "import":
                  item["rows"].append(("imported", NONE, NONE))
              return item


          def load(path) -> dict:
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)
          __CI_EOF__

      # The VPN script of the jobs that join the home network (vpn-script
      # home-vpn.sh, vpn-up.yml): plan-shard and apply.
      - name: VPN script
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/home-vpn.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # The runner joins the home network as WireGuard peer ci and reaches the REST
          # API of every managed device; run from the root of iac-home
          # (docs/terragrunt.md#home-network-terragrunt-homeyml).
          #
          #   home-vpn.sh up|down
          #
          # Needs ARM_CLIENT_ID, ARM_TENANT_ID, id-token: write and wireguard-tools.
          set -euo pipefail

          net=_common/network.hcl
          # The unit whose output public_key is the WireGuard server.
          server_unit=${HOME_VPN_SERVER_UNIT:-infrastructure/router/wireguard}
          conf=/etc/wireguard/wg-home.conf

          # block_value <file> <block> <key>: a quoted or bare value inside "<block> = {".
          block_value() {
            sed -n "/^ *$2 = {/,/^ *}/s/^ *$3 *= *\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}$/\\1/p" "$1" | head -1
          }

          # inline_value <file> <name> <key>: a quoted key of a one-line object "<name> = { ... }".
          inline_value() {
            sed -n "s/^ *$2 *= *{.*$3 *= *\"\\([^\"]*\\)\".*/\\1/p" "$1" | head -1
          }

          # first_name <file> <name>: the first of names = [...] of a one-line object.
          first_name() {
            sed -n "s/^ *$2 *= *{.*names *= *\\[\"\\([^\"]*\\)\".*/\\1/p" "$1" | head -1
          }

          # The device folders under infrastructure/ whose device.hcl says managed = true.
          managed_devices() {
            local f
            for f in infrastructure/*/device.hcl; do
              [ -f "$f" ] || continue
              if grep -qE '^ *managed *= *true *$' "$f"; then dirname "$f"; fi
            done
          }

          case "${1:?usage: home-vpn.sh up|down}" in
            up)
              mapfile -t devices < <(managed_devices)
              if [ "${#devices[@]}" -eq 0 ]; then
                echo "::error::no device.hcl under infrastructure/ with managed = true"
                exit 1
              fi

              token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
              az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
                --federated-token "$token" --allow-no-subscriptions --output none

              address=$(inline_value "$net" ci address)
              endpoint="$(block_value "$net" wireguard endpoint):$(block_value "$net" wireguard listen_port)"
              port=$(sed -n 's/^ *webfig_port *= *\([0-9]*\)$/\1/p' "$net")

              # Per device: its address, its name (not in public DNS) and its CA, the
              # heredoc ca_bundle of device.hcl.
              allowed=() urls=() cas=()
              for d in "${devices[@]}"; do
                host=$(sed -n 's/^ *host *= *"\([^"]*\)".*/\1/p' "$d/device.hcl" | head -1)
                target=$(inline_value "$net" "$host" address)
                name=$(first_name "$net" "$host")
                if [ -z "$target" ] || [ -z "$name" ]; then
                  echo "::error::$d: host $host has no address or name in $net"
                  exit 1
                fi
                ca="$RUNNER_TEMP/ca-$(basename "$d").crt"
                sed -n '/ca_bundle *= *<<-*EOT/,/^ *EOT/{/<<-*EOT/d;/^ *EOT/d;s/^ *//;p;}' "$d/device.hcl" >"$ca"
                echo "$target $name" | sudo tee -a /etc/hosts >/dev/null
                allowed+=("$target/32") urls+=("https://$name:$port/") cas+=("$ca")
              done
              server=$(cd "$server_unit" && terragrunt output -raw public_key)

              vault_subscription=$(block_value account.hcl key_vault subscription_id)
              vault_name=$(block_value account.hcl key_vault name)
              secret() {
                az keyvault secret show --subscription "$vault_subscription" --vault-name "$vault_name" \
                  --name "$1" --query value --output tsv | tr -d '\n'
              }
              # Read first: a failing substitution inside the heredoc would not stop the script.
              private_key=$(secret wg-key-ci)
              psk=$(secret wg-psk-ci)
              if [ -z "$private_key" ] || [ -z "$psk" ]; then
                echo "::error::WireGuard secrets missing"
                exit 1
              fi

              sudo install -m 600 /dev/null "$conf"
              sudo tee "$conf" >/dev/null <<EOF
          [Interface]
          PrivateKey = $private_key
          Address = $address/32

          [Peer]
          PublicKey = $server
          PresharedKey = $psk
          Endpoint = $endpoint
          AllowedIPs = $(IFS=,; echo "${allowed[*]}")
          PersistentKeepalive = 25
          EOF
              sudo wg-quick up wg-home
              # Every REST API has to answer before anything is planned.
              for i in "${!urls[@]}"; do
                ok=false
                for _ in 1 2 3 4 5 6; do
                  if curl -sf -o /dev/null --max-time 5 --cacert "${cas[$i]}" "${urls[$i]}"; then
                    ok=true
                    break
                  fi
                  sleep 5
                done
                if [ "$ok" != true ]; then
                  echo "::error::${urls[$i]} not reachable through WireGuard"
                  exit 1
                fi
                echo "${urls[$i]} reachable through WireGuard"
              done
              ;;

            down)
              sudo wg-quick down wg-home 2>/dev/null || true
              sudo rm -f "$conf"
              ;;

            *)
              echo "usage: home-vpn.sh up|down" >&2
              exit 1
              ;;
          esac
          __CI_EOF__
          chmod +x "$d/home-vpn.sh"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      # Without a shared cache each of the fifty units downloads its own copies
      # of the providers and the runner runs out of both disk and time.
      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('account.hcl', '_common/templates/versions*.tf.tmpl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt and trivy
        run: install-tools.sh terragrunt trivy

      # A self-hosted runner (the NAS, docs/runners.md) starts every job from the
      # bare image ghcr.io/actions/actions-runner: bash, curl, jq, git, unzip,
      # openssh-client, python3 and sudo, no Azure CLI. The job installs it here
      # from Microsoft's apt repository, whose key is checked against its
      # fingerprint and whose package is pinned. A GitHub-hosted runner has it in
      # its image and skips the step. A bump of AZURE_CLI_VERSION is a pull request
      # here, by hand: deps.yml does not read it.
      - name: Tools of the self-hosted runner
        if: runner.environment == 'self-hosted'
        env:
          AZURE_CLI_VERSION: 2.92.0
          MICROSOFT_KEY_FINGERPRINT: BC528686B50D79E339D3721CEB3E94ADBE1229CF  # gitleaks:allow (public key fingerprint)
        run: |
          set -euo pipefail
          # The NAS gives a job 1 GB: at most two units plan or apply at once
          # (terragrunt's default is no limit).
          echo "TG_PARALLELISM=2" >>"$GITHUB_ENV"
          if command -v az >/dev/null; then
            az version --output tsv --query '"azure-cli"'
            exit 0
          fi
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          key="$RUNNER_TEMP/microsoft.asc"
          curl -sSfL https://packages.microsoft.com/keys/microsoft.asc -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" {print $10; exit}')
          if [ "$fingerprint" != "$MICROSOFT_KEY_FINGERPRINT" ]; then
            echo "::error::the key of packages.microsoft.com has the fingerprint $fingerprint, expected $MICROSOFT_KEY_FINGERPRINT"
            exit 1
          fi
          sudo install -d -m 755 /etc/apt/keyrings
          gpg --dearmor <"$key" | sudo tee /etc/apt/keyrings/microsoft.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $codename main" |
            sudo tee /etc/apt/sources.list.d/azure-cli.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "azure-cli=$AZURE_CLI_VERSION-1~$codename" >/dev/null
          az version --output tsv --query '"azure-cli"'

      # A job killed while terraform holds a state lock leaves the lock behind
      # for good. Locks a runner took more than 70 minutes ago are released
      # here: no job runs that long (apply has the longest timeout, 60), so
      # the job that took them is gone. Workstation locks stay. The first
      # share does it for all of them.
      - name: Release stale state locks
        if: matrix.shard.index == 0
        continue-on-error: true
        run: |
          set -euo pipefail
          value() { sed -n "s/^ *$1 *= *\"\(.*\)\"/\1/p" account.hcl; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          release-stale-locks.py \
            "$(value storage_account_name)" "$(value container_name)" 70

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      # A repository whose resources sit behind a VPN (iac-home: the router,
      # through WireGuard) joins that network with vpn-script up: a script of ci
      # by its name (home-vpn.sh), otherwise a path in the repository. It signs in
      # to Azure as ARM_CLIENT_ID, reads its keys from the vault and brings the
      # tunnel up. The network has one peer for the runners, so the caller's
      # concurrency group never lets two runs overlap.
      - name: Join the network
        if: inputs.vpn-script != ''
        env:
          VPN: ${{ inputs.vpn-script }}
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          if [ -x "$RUNNER_TEMP/ci/$VPN" ]; then "$RUNNER_TEMP/ci/$VPN" up; else "./$VPN" up; fi

      # Without a VPN - the job runs on the network itself (network-runner, the NAS
      # for iac-home) - nothing above has signed in to Azure, while the
      # configuration reads its secrets from the vault as it is parsed
      # (validate-sign-in).
      - name: Sign in to Azure
        if: inputs.vpn-script == '' && inputs.validate-sign-in
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      # The units of this share that exist are planned from HEAD, in
      # dependency order among themselves. A deleted unit exists only in the
      # base commit, so it is planned as a destroy from a worktree of that
      # commit. Both land in the same plan.txt, under their unit paths, and as
      # JSON in $PLAN_JSON for the comment and for trivy. The JSON holds
      # sensitive values in clear text: it stays in the runner's temp and is
      # never uploaded.
      - name: Plan
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
          SELECTION: ${{ needs.select.outputs.selection }}
          SHARD: ${{ toJSON(matrix.shard) }}
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          set -euo pipefail
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          : >plan.txt
          mapfile -t units < <(jq -r '.units[]' <<<"$SHARD")
          mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SHARD")
          rc=0
          if [ "${#units[@]}" -gt 0 ]; then
            args=()
            for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
            set +e
            terragrunt run --all plan "${args[@]}" --json-out-dir "$PLAN_JSON" \
              --non-interactive --no-color 2>&1 | tee -a plan.txt
            rc=${PIPESTATUS[0]}
            set -e
          fi
          if [ "${#deleted[@]}" -gt 0 ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
            args=()
            for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
            set +e
            (cd "$RUNNER_TEMP/base" &&
              terragrunt run --all "${args[@]}" --json-out-dir "$PLAN_JSON" \
                --non-interactive --no-color -- plan -destroy) 2>&1 |
              tee -a plan.txt
            destroy_rc=${PIPESTATUS[0]}
            set -e
            [ "$destroy_rc" -eq 0 ] || rc=$destroy_rc
          fi
          exit "$rc"

      # A unit that moved with its state plans no create and no destroy;
      # one would mean the state did not come along.
      - name: Moved units keep their state
        if: always()
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          set -euo pipefail
          printf '%s' "$SELECTION" >"$RUNNER_TEMP/selection.json"
          check-moves.py "$RUNNER_TEMP/selection.json" "$PLAN_JSON"

      - name: Leave the network
        if: always() && inputs.vpn-script != ''
        env:
          VPN: ${{ inputs.vpn-script }}
        run: |
          if [ -x "$RUNNER_TEMP/ci/$VPN" ]; then "$RUNNER_TEMP/ci/$VPN" down; else "./$VPN" down; fi

      # trivy over the plans, which carry the value of every setting; over the
      # bare modules it cannot tell what a variable will be. The verdict waits
      # until the findings are passed on for the comment.
      - name: Security findings in the plan
        id: trivy
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          rc=0
          trivy-plans.sh "$PLAN_JSON" trivy || rc=$?
          case "$rc" in
            0) echo "found=false" >>"$GITHUB_OUTPUT" ;;
            3) echo "found=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # What the comment shows of this share - the tables from the JSON plans
      # and the trivy findings - and the plan output, for the plan job.
      - name: Hand over the plan
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
          INDEX: ${{ matrix.shard.index }}
        run: |
          set -euo pipefail
          mkdir -p part
          touch plan.txt
          plan-summary.py plan.txt --json-dir="$PLAN_JSON" --trivy=trivy \
            --export="part/shard-$INDEX.json" >/dev/null
          cp plan.txt "part/plan-$INDEX.txt"

      - name: Upload the share
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-part-${{ github.run_id }}-${{ matrix.shard.index }}
          path: part/
          retention-days: 1

      - name: No unaccepted security finding
        if: always() && steps.trivy.outputs.found == 'true'
        run: |
          echo "::error::trivy found a HIGH or CRITICAL setting in the plan (Security findings in the summary). Fix it, or accept it in .github/trivyignore.yaml with the reason."
          exit 1

  # The shares read back into one plan: one summary, one comment, and the
  # verdict apply and destroy go by. It fails when a share did. It waits for
  # validate too, whose result the comment shows.
  plan:
    needs: [select, validate, plan-shard]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    outputs:
      has_changes: ${{ steps.summary.outputs.has_changes }}
      has_destroys: ${{ steps.summary.outputs.has_destroys }}
      renewal_due: ${{ steps.renewal.outputs.due }}
      drift: ${{ steps.renewal.outputs.drift }}
      planned_at: ${{ steps.planned.outputs.at }}
      selection: ${{ needs.select.outputs.selection }}
    steps:
      # Only the scripts this job runs; the rest stay with the plan jobs. A
      # step per large script: actionlint deadlocks on a run script of more
      # than about 64 KB.
      - name: Summary scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/plan-summary.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns the output of a terragrunt plan into the plan comment of a pull request.

          Usage: plan-summary.py <plan.txt> [options]

          The comment, top to bottom:

            ## 📋 Plan complete            (## ❌ Plan failed on an error, a unit without
                                            a result or a failed check)
            repo · commit · units · ➕ created · ✏️ updated · 🗑️ destroyed · ♻️ replaced
            ### ⚠️ Destroys and replaces   icon | Resource | Name | Unit | Why
            ### Changes                    icon | Resource | Name | What changes | From | To
            imports that change nothing, as one count line
            ### ❌ Errors, ### 🛡️ Security findings   when there are any
            **Status:** security findings, formatting and validation
            **Needed:** what has to happen next (an approval of a destroy, a fix, a merge)
            <details> per unit: what terraform printed, as a diff </details>

          The tables come from the plans in JSON (--json-dir, plan_details.py): one row
          per change that matters, in standard wording. A unit without a JSON plan gets
          one row per resource from the text. The raw plan stays in the run artifact.

          A comment on GitHub holds at most 65 536 characters. When the comment does not
          fit into MAX, the details are shortened (the largest unit first), then left
          out; the tables are never cut while anything else can be. What was cut is said
          at the end.

          The output of run --all is interleaved across units, every line prefixed with
          "[<unit>] terraform:"; the lines are grouped back by unit and the prefix is
          dropped.

          Options:
            --fail-on-change   exit non-zero when the plan proposes anything at all or a
                               unit ended in an error (the gate of the weekly drift job;
                               terragrunt itself returns zero even when there are changes)
            --github-output    write has_changes, has_errors, has_destroys and
                               changed_units (a JSON list) to $GITHUB_OUTPUT; a plan that
                               destroys or replaces is not applied by a push, it waits
                               for an approval or a manual run
            --json-dir=<dir>   the plans in JSON, <dir>/<unit>/tfplan.json
            --export=<file>    a share of a split plan: write the rows of its JSON plans,
                               its outputs and trivy findings, for the merge
            --import=<dir>     the merge: read every such file of the directory, next to
                               the concatenated plan.txt of all shares
            --trivy=<dir>      trivy's JSON reports over those plans, one per unit
            --checks=<list>    results of the checks of the same job, as
                               name=outcome,name=outcome (formatting=success,...)
            --changes-out=<f>  write the entries of the tables as JSON, for the apply
                               comment (apply-summary.py); text only, nothing sensitive
            --artifact=<name>  the artifact the raw plan is in (default plan-$GITHUB_RUN_ID)
            --repo=, --commit= what the heading line names (default $GITHUB_REPOSITORY,
                               $GITHUB_SHA)
            --drift            the weekly drift check: "Drift check" in the heading and
                               no "Needed" line
            --nothing-selected the change selects no unit; plan.txt may be missing
            --no-plan          no plan was produced; plan.txt may be missing

          An import, a move, a forget (a removed block with destroy = false) and a change
          of outputs alone count as a change too: each reaches the state only through
          apply, and dependent units read outputs from there. A unit terragrunt queued
          that printed neither a plan nor an error counts as an error: the run was
          cancelled, or terragrunt failed before terraform started.
          """
          import json
          import os
          import pathlib
          import re
          import sys

          import plan_details
          from plan_details import NONE, code

          RE_UNIT = re.compile(r"\[([^\]]+)\] terraform:")
          RE_PLAN = re.compile(
              r"Plan: (?:(\d+) to import, )?(\d+) to add, (\d+) to change, (\d+) to destroy")
          # The second form is what a destroy plan prints when the state is empty.
          RE_NOOP = re.compile(
              r"No changes\. (?:Your infrastructure matches the configuration"
              r"|No objects need to be destroyed)")
          RE_ERROR = re.compile(r"^\s*Error: (.+)$")
          RE_WARNING = re.compile(r"^\s*Warning: ")
          # The queue terragrunt prints before it starts, one unit per branch of a tree.
          RE_QUEUE = re.compile(r"The following units will be run")
          RE_BRANCH = re.compile(r"^[\s│]*[├╰└]── (\S+)\s*$")
          # The heading terraform puts above each resource in the plan. Headings sit at
          # the left edge; the comments inside a resource are indented deeper.
          RE_RESOURCE = re.compile(
              r"^ {0,2}# (.+?) (will be created|will be updated in-place|will be destroyed"
              r"|(?:is tainted, so )?must be replaced|will be replaced, as requested"
              r"|will be read during apply|will be imported"
              r"|will no longer be managed by Terraform.*|has moved to .+)$"
          )
          RE_IMPORTED = re.compile(r"^ {0,2}# \(imported from ")
          # Terraform indents in steps of four and puts the action symbol two columns
          # in, so a symbol anywhere else is part of a value.
          RE_SIGN = re.compile(r"^( +)([-+~]) ")

          MAX = 60_000
          MAX_ERROR_LINES = 25
          # Units live under infrastructure/; their state key, and what the comment
          # shows, is the path without it.
          CONTENT = "infrastructure/"


          def state_key(unit: str) -> str:
              return unit[len(CONTENT):] if unit.startswith(CONTENT) else unit


          def json_plan(directory: str, unit: str) -> pathlib.Path:
              """<directory>/<unit>/tfplan.json, under the unit's full path where that exists."""
              full = pathlib.Path(directory, CONTENT + unit, "tfplan.json")
              return full if full.is_file() else pathlib.Path(directory, unit, "tfplan.json")


          def fenced(lines: list, lang: str = "") -> list:
              """A code block whose fence is longer than any run of backticks inside."""
              longest = max((len(r) for line in lines for r in re.findall(r"`+", line)), default=0)
              fence = "`" * max(3, longest + 1)
              return [fence + lang, *lines, fence]


          def highlight(line: str) -> str:
              """Moves the action symbol to the first column, where a diff block colours it.

              `~` becomes `!`, the marker of a changed line in a diff block. The rest of
              the line keeps its columns.
              """
              m = RE_SIGN.match(line)
              if not m or len(m.group(1)) % 4 != 2:
                  return line
              sign = "!" if m.group(2) == "~" else m.group(2)
              return sign + m.group(1) + line[m.end() - 1:]


          def parse(streams: dict) -> dict:
              """Splits the output of one unit into resources, outputs, errors and the plan line.

              Each stream (STDOUT, STDERR, ...) is read on its own: terraform prints the
              plan to stdout and the errors to stderr, and the two can interleave.
              """
              unit = {"resources": [], "outputs": [], "errors": [], "plan": None}
              for lines in streams.values():
                  mode = None
                  for text in lines:
                      in_block = text[:1].isspace() or text.startswith(("-/+", "+/-"))
                      if mode == "resources" and in_block:
                          if m := RE_RESOURCE.match(text):
                              unit["resources"].append({"address": m.group(1), "what": m.group(2),
                                                        "lines": [text]})
                          elif unit["resources"]:
                              unit["resources"][-1]["lines"].append(text)
                          continue
                      if mode == "outputs" and text[:1].isspace():
                          unit["outputs"].append(text)
                          continue
                      if mode == "error" and not (RE_ERROR.match(text) or RE_WARNING.match(text)):
                          unit["errors"][-1].append(text)
                          continue
                      mode = None
                      if text.startswith("Terraform will perform the following actions:"):
                          mode = "resources"
                      elif text.startswith("Changes to Outputs:"):
                          mode = "outputs"
                          unit["outputs"].append(text)
                      elif text.startswith("Plan: "):
                          unit["plan"] = text[len("Plan: "):].rstrip(".")
                      elif RE_ERROR.match(text):
                          mode = "error"
                          unit["errors"].append([text])
              return unit


          def loose_errors(lines: list, known: set) -> list:
              """Error blocks terragrunt printed outside any unit and no unit reported.

              Terragrunt repeats every failed unit's error in its closing report, so an
              error seen in a unit already is skipped. A block runs to the next empty line.
              """
              blocks = {}
              for i, line in enumerate(lines):
                  m = RE_ERROR.match(line.split("terraform:")[-1])
                  if not m or m.group(1).strip() in known or m.group(1).strip() in blocks:
                      continue
                  indent = len(line) - len(line.lstrip())
                  block = []
                  for follow in lines[i:]:
                      if not follow:
                          break
                      block.append(follow[indent:] if follow[:indent].isspace() else follow.strip())
                  blocks[m.group(1).strip()] = [b.rstrip() for b in block]
              return list(blocks.values())


          def trivy_findings(reports: str) -> list:
              """(unit, severity, id, title, resource) for every failed trivy check.

              Reads every JSON report in the directory, one per unit; the target of a
              result is the plan file as <unit>/tfplan.json.
              """
              if not reports or not os.path.isdir(reports):
                  return []
              found = set()
              for report_path in sorted(pathlib.Path(reports).glob("*.json")):
                  report = json.loads(report_path.read_text(encoding="utf-8") or "{}")
                  for result in report.get("Results") or []:
                      unit = state_key(report.get("Unit") or os.path.dirname(result.get("Target", "")) or "?")
                      for m in result.get("Misconfigurations") or []:
                          if m.get("Status") != "FAIL":
                              continue
                          found.add((unit, m.get("Severity", ""), m.get("AVDID") or m.get("ID", ""),
                                     m.get("Title", ""), (m.get("CauseMetadata") or {}).get("Resource", "")))
              return sorted(found)


          def shared_parts(directory: str) -> tuple:
              """What the shares of a split plan exported (--export), merged.

              The JSON plans hold sensitive values in clear text and never leave the job
              that made them; a share passes on only the rows the comment shows.
              """
              entries, outputs, findings = {}, {}, set()
              if directory and os.path.isdir(directory):
                  for part in sorted(pathlib.Path(directory).glob("*.json")):
                      data = json.loads(part.read_text(encoding="utf-8") or "{}")
                      for unit, items in (data.get("entries") or {}).items():
                          entries[unit] = [{**e, "rows": [tuple(r) for r in e["rows"]]} for e in items]
                      outputs.update(data.get("outputs") or {})
                      findings.update(tuple(f) for f in data.get("findings") or [])
              return entries, outputs, sorted(findings)


          def read_output(path: str):
              """units {unit: (add, chg, dst, imp)}, parsed per unit, loose lines, queue, errors."""
              units, errors, streams, loose, queued = {}, [], {}, [], {}
              unit, in_queue = "?", False
              if not path or not os.path.isfile(path):
                  return units, {}, loose, queued, errors
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if in_queue and (m := RE_BRANCH.match(line)):
                      queued[state_key(m.group(1))] = None
                  elif line.strip() != ".":
                      in_queue = bool(RE_QUEUE.search(line))
                  m = RE_UNIT.search(line)
                  if m:
                      unit = state_key(m.group(1))
                      label = line[:m.start()].split()
                      stream = label[-1] if label and re.fullmatch(r"[A-Z]+", label[-1]) else ""
                      text = line[m.end():]
                      streams.setdefault(unit, {}).setdefault(stream, []).append(
                          text[1:] if text.startswith(" ") else text)
                  else:
                      loose.append(line)
                  if m := RE_PLAN.search(line):
                      imp, add, chg, dst = (int(g or 0) for g in m.groups())
                      units[unit] = (add, chg, dst, imp)
                  elif RE_NOOP.search(line):
                      units.setdefault(unit, (0, 0, 0, 0))
                  if m := RE_ERROR.match(line.split("terraform:")[-1]):
                      errors.append(m.group(1).strip())
              parsed = {u: parse(s) for u, s in streams.items()}
              # Terraform prints no "Plan:" line when only outputs change.
              for u, p in parsed.items():
                  if p["outputs"]:
                      units.setdefault(u, (0, 0, 0, 0))
              return units, parsed, loose, queued, errors


          def plural(n: int, word: str) -> str:
              return f"{n} {word}{'s' * (n != 1)}"


          def cell(text: str) -> str:
              """Text for a table cell; code spans have their pipes escaped already."""
              text = str(text).replace("\n", " ")
              return text if "`" in text else text.replace("|", "\\|")


          def checks_of(spec: str) -> list:
              """[(name, outcome)] from name=outcome,name=outcome."""
              out = []
              for part in (spec or "").split(","):
                  if "=" in part:
                      name, outcome = part.split("=", 1)
                      out.append((name.strip(), outcome.strip() or "skipped"))
              return out


          def main(path: str, opts: dict) -> int:
              drift = "drift" in opts
              units, parsed, loose, queued, errors = read_output(path)

              # Every resource the plan touches, from JSON where there is one.
              shared, shared_outputs, shared_findings = shared_parts(opts.get("import"))
              entries, from_json, outputs = [], {}, {}
              for u, p in sorted(parsed.items()):
                  plan_json = json_plan(opts.get("json-dir") or "", u)
                  got = None
                  if u in shared:
                      got = shared[u]
                      if shared_outputs.get(u):
                          outputs[u] = shared_outputs[u]
                  elif opts.get("json-dir") and plan_json.is_file():
                      try:
                          plan = plan_details.load(plan_json)
                          got = plan_details.entries(plan, u)
                          outs = [k for k, v in (plan.get("output_changes") or {}).items()
                                  if (v or {}).get("actions") not in (["no-op"], None)]
                          if outs:
                              outputs[u] = outs
                          from_json[u] = got
                      except (ValueError, KeyError, TypeError, AttributeError) as e:
                          print(f"::warning::{u}: the JSON plan could not be read ({e})", file=sys.stderr)
                  if got is None:
                      got = []
                      for r in p["resources"]:
                          imported = any(RE_IMPORTED.match(x) for x in r["lines"])
                          if e := plan_details.text_entry(r["address"], r["what"], u, imported):
                              got.append(e)
                      if p["outputs"]:
                          outputs[u] = ["(see the details)"]
                  entries += got
              entries.sort(key=lambda e: (plan_details.ORDER.get(e["action"], 9), e["unit"],
                                          plan_details.natural(e["address"])))

              count = {a: sum(e["action"] == a for e in entries) for a in plan_details.ICONS}
              count["import"] = sum(e["action"] == "import" or e["imported"] for e in entries)
              destructive = [e for e in entries if e["action"] in ("destroy", "replace")]
              listed = [e for e in entries if e["action"] not in ("destroy", "replace") and not e["noop_import"]]
              noop_imports = {}
              for e in entries:
                  if e["noop_import"]:
                      noop_imports[e["unit"]] = noop_imports.get(e["unit"], 0) + 1

              # Text totals still decide: they count what the JSON might not have.
              whats = [r["what"] for p in parsed.values() for r in p["resources"]]
              text_changes = any(any(t) for t in units.values()) or any(
                  w.startswith(("has moved to ", "will no longer be managed")) for w in whats)
              changes = bool(text_changes or entries or outputs)

              # The same failure (an expired login, say) tends to hit many units at once.
              failed = {}
              for u, p in parsed.items():
                  for block in p["errors"]:
                      failed.setdefault(tuple(block), {})[u] = None
              known = {RE_ERROR.match(b[0]).group(1).strip() for b in failed}
              for block in loose_errors(loose, known):
                  failed.setdefault(tuple(block), {})[None] = None
              missing = [u for u in queued if u not in units and not parsed.get(u, {}).get("errors")]
              checks = checks_of(opts.get("checks", ""))
              bad_checks = [n for n, o in checks if o not in ("success", "skipped")]
              no_plan = "no-plan" in opts or (not parsed and not units and "nothing-selected" not in opts
                                              and not (path and os.path.isfile(path) and os.path.getsize(path)))
              is_failed = bool(failed or missing or bad_checks or no_plan)

              all_units = sorted(set(units) | set(parsed) | set(missing))
              changed_units = sorted({e["unit"] for e in entries} | set(outputs)
                                     | {u for u, t in units.items() if any(t)})
              unchanged = [u for u in all_units if u not in changed_units and u in units]
              many = len({e["unit"] for e in listed}) > 1
              findings = sorted(set(shared_findings) | set(trivy_findings(opts.get("trivy"))))
              if export := opts.get("export"):
                  pathlib.Path(export).write_text(json.dumps({
                      "entries": from_json, "outputs": {u: outputs[u] for u in from_json if u in outputs},
                      "findings": findings}, ensure_ascii=False), encoding="utf-8")

              diffs = {}
              for u in changed_units:
                  p = parsed.get(u)
                  if not p:
                      continue
                  blocks = [r["lines"] for r in p["resources"]]
                  if p["outputs"]:
                      blocks.append(p["outputs"])
                  diffs[u] = [line for i, b in enumerate(blocks)
                              for line in ([""] if i else []) + [highlight(x) for x in b]]

              artifact = opts.get("artifact")
              if artifact is None and os.environ.get("GITHUB_RUN_ID"):
                  artifact = f"plan-{os.environ['GITHUB_RUN_ID']}"
              where = f"artifact {code(artifact)} (plan.txt)" if artifact else "plan.txt"
              repo = opts.get("repo") or os.environ.get("GITHUB_REPOSITORY", "")
              commit = opts.get("commit") or os.environ.get("GITHUB_SHA", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")

              title = "Drift check" if drift else "Plan"
              heading = f"## ❌ {title} failed" if is_failed else f"## 📋 {title} complete"
              line = []
              if repo:
                  line.append(code(repo))
              if commit:
                  line.append(f"[{code(commit[:7])}]({server}/{repo}/commit/{commit})" if repo else code(commit[:7]))
              line.append(plural(len(all_units), "unit"))
              line += [f"➕ {count['create']}", f"✏️ {count['update']}", f"🗑️ {count['destroy']}",
                       f"♻️ {count['replace']}"]
              line += [f"{plan_details.ICONS[a]} {count[a]} {w}" for a, w in
                       (("import", "imported"), ("move", "moved"), ("forget", "forgotten")) if count[a]]

              status = []
              if opts.get("trivy") is not None:
                  status.append(f"🛡️ {plural(len(findings), 'security finding')} (below)" if findings
                                else "🛡️ no security findings")
              if checks:
                  ok = [n for n, o in checks if o == "success"]
                  if ok:
                      status.append("✅ " + " and ".join(ok) + " passed")
                  status += [f"❌ {n} failed" for n in bad_checks]
              if failed or missing:
                  status.append("❌ " + plural(len({u for s in failed.values() for u in s if u} | set(missing))
                                               or 1, "unit") + " without a plan")

              needed = []
              if failed or missing or no_plan:
                  needed.append("fix the errors above; the plan runs again on the next push")
              if bad_checks:
                  needed.append("fix " + " and ".join(bad_checks))
              if findings:
                  needed.append("fix the security findings or accept them in "
                                "`.github/trivyignore.yaml` with the reason")
              if destructive:
                  needed.append("approval of the destroy: an approving review of this pull request "
                                "after this plan (`destroy / approved`), then the merge applies it")
              if not needed:
                  needed.append("review and merge; the apply on `main` runs by itself" if changes
                                else "nothing; merging applies nothing")

              def render(shown: dict, details: bool = True, compact: bool = False, cap=None,
                         error_lines=None) -> str:
                  out = [heading, "", " · ".join(line), ""]

                  if destructive:
                      out += ["### ⚠️ Destroys and replaces", "",
                              "| | Resource | Name | Unit | Why |", "|---|---|---|---|---|"]
                      out += [f"| {e['icon']} | {e['kind']} | {code(e['name'])} | {code(e['unit'])} "
                              f"| {cell(e['why']) or NONE} |" for e in destructive]
                      out.append("")

                  rows = []
                  for e in listed:
                      name = code(e["name"]) + (f"<br><sub>{code(e['unit'])}</sub>" if many else "")
                      those = e["rows"]
                      if compact and len(those) > 1:
                          those = [(f"{plural(len(those), 'change')}, see the details", NONE, NONE)]
                      # The rows after the first of a resource leave its kind and name
                      # out, so that one resource reads as one block.
                      for i, (what, frm, to) in enumerate(those):
                          kind, label = (e["kind"], name) if i == 0 else ("", "")
                          rows.append(f"| {e['icon']} | {kind} | {label} | {cell(what)} | {frm} | {to} |")
                  if rows or not destructive:
                      out += ["### Changes", ""]
                  if rows:
                      out += ["| | Resource | Name | What changes | From | To |",
                              "|---|---|---|---|---|---|"]
                      out += rows[:cap] if cap is not None else rows
                      if cap is not None and cap < len(rows):
                          out.append(f"| | | | _{len(rows) - cap} more rows, see {where}_ | | |")
                      out.append("")
                  elif not destructive and not noop_imports:
                      if outputs:
                          out += ["Only output values change, in " + ", ".join(code(u) for u in outputs)
                                  + ".", ""]
                      elif "nothing-selected" in opts:
                          out += ["Nothing to plan: the change selects no unit.", ""]
                      elif not is_failed:
                          out += ["None: the plan matches what is deployed.", ""]
                      else:
                          out += ["No plan to show.", ""]
                  if noop_imports:
                      n = sum(noop_imports.values())
                      out += [f"📥 **Imported without a change:** {n} — "
                              + ", ".join(f"{code(u)} ({c})" for u, c in sorted(noop_imports.items())) + ".", ""]

                  if is_failed and (failed or missing or no_plan):
                      out += ["### ❌ Errors", ""]
                      if no_plan and not failed and not missing:
                          out += [f"No plan was produced, see the run log and {where}.", ""]
                      if missing:
                          out += ["**Without a result:** " + ", ".join(code(u) for u in missing), "",
                                  "Queued, but neither a plan nor an error came out: the run was "
                                  "cancelled, or terragrunt failed before terraform started.", ""]
                      for block, sources in failed.items():
                          names = [code(u) for u in sources if u is not None]
                          if None in sources:
                              names.append("outside a unit")
                          body = list(block)
                          if error_lines is not None and len(body) > error_lines:
                              body = body[:error_lines] + [f"... {len(block) - error_lines} more lines"]
                          out += [f"**{', '.join(names)}**", ""] + fenced(body) + [""]

                  if findings:
                      out += ["### 🛡️ Security findings", "",
                              "trivy over the plan, HIGH and CRITICAL. A finding that is accepted "
                              "goes into `.github/trivyignore.yaml` with the reason.", "",
                              "| Unit | Severity | Check | Resource |", "|---|---|---|---|"]
                      out += [f"| {code(u)} | {sev} | {cell(cid)}: {cell(title_)} | {code(res) if res else ''} |"
                              for u, sev, cid, title_, res in findings]
                      out.append("")

                  if status:
                      out += ["**Status:** " + " · ".join(status), ""]
                  if not drift and len(needed) == 1:
                      out += [f"**Needed:** {needed[0]}.", ""]
                  elif not drift:
                      out += ["**Needed:**", ""] + [f"- {n}" for n in needed] + [""]

                  cut_notes = []
                  body = []
                  for u in changed_units:
                      lines = diffs.get(u) or []
                      if not lines:
                          continue
                      p = parsed[u]
                      n = shown.get(u, len(lines))
                      body.append(f"#### {code(u)}" + (f" ({p['plan']})" if p["plan"] else ""))
                      body.append("")
                      if n == 0:
                          body += ["_Left out, the comment would be too long._", ""]
                          cut_notes.append(code(u))
                          continue
                      text = lines[:n]
                      while text and not text[-1]:
                          text.pop()
                      body += fenced(text, "diff")
                      if n < len(lines):
                          body += ["", f"_{len(lines) - n} of {len(lines)} lines left out._"]
                          cut_notes.append(code(u))
                      body.append("")
                  if unchanged:
                      body.append(f"**{plural(len(unchanged), 'unit')} without a change:** "
                                  + ", ".join(code(u) for u in unchanged))
                      body.append("")
                  if body and details:
                      out += ["<details><summary>Details per unit</summary>", ""] + body + ["</details>", ""]

                  notes = []
                  if not details and body:
                      notes.append("the details per unit are left out")
                  elif cut_notes:
                      notes.append("the details of " + ", ".join(cut_notes) + " are shortened")
                  if compact:
                      notes.append("resources with several changes are one row each")
                  if error_lines is not None and any(len(b) > error_lines for b in failed):
                      notes.append("long error messages are shortened")
                  if notes:
                      out.append(f"_Cut to fit a comment: {'; '.join(notes)}. The full plan is in {where}._")
                  else:
                      out.append(f"_The raw plan is in {where}._")
                  return "\n".join(out)

              # The details go first, from the largest unit down: as much of the
              # largest as the overflow needs, then the next one if that was not enough.
              shown = {}
              text = render(shown)
              for u in sorted(diffs, key=lambda u: -sum(len(x) + 1 for x in diffs[u])):
                  n = len(diffs[u])
                  while n and len(text) > MAX:
                      over = len(text) - MAX
                      while n and over > 0:
                          n -= 1
                          over -= len(diffs[u][n]) + 1
                      shown[u] = n
                      text = render(shown)
              if diffs and all(shown.get(u, len(d)) == 0 for u, d in diffs.items()):
                  text = render(shown, details=False)
              attempts = [dict(details=False), dict(details=False, error_lines=MAX_ERROR_LINES),
                          dict(details=False, error_lines=MAX_ERROR_LINES, compact=True)]
              for kwargs in attempts:
                  if len(text) <= MAX:
                      break
                  text = render(shown, **kwargs)
              if len(text) > MAX:
                  # Last of all the rows of the changes table; the destroys stay whole.
                  lo, hi = 0, len(listed) * 50
                  while lo < hi:
                      mid = (lo + hi + 1) // 2
                      if len(render(shown, details=False, error_lines=MAX_ERROR_LINES, compact=True,
                                    cap=mid)) <= MAX:
                          lo = mid
                      else:
                          hi = mid - 1
                  text = render(shown, details=False, error_lines=MAX_ERROR_LINES, compact=True, cap=lo)
              if len(text) > MAX:
                  text = cut(text, MAX, where)
              print(text)

              if out_path := opts.get("changes-out"):
                  pathlib.Path(out_path).write_text(json.dumps({
                      "repo": repo, "commit": commit, "units": all_units, "entries": entries,
                      "noop_imports": noop_imports, "failed": is_failed,
                  }, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")

              if "github-output" in opts and (path_out := os.environ.get("GITHUB_OUTPUT")):
                  with open(path_out, "a", encoding="utf-8") as fh:
                      fh.write(f"has_changes={str(changes).lower()}\n")
                      fh.write(f"has_errors={str(bool(errors or missing)).lower()}\n")
                      has_destroys = bool(destructive) or any(
                          r["what"] == "will be destroyed" or "replaced" in r["what"]
                          for p in parsed.values() for r in p["resources"])
                      fh.write(f"has_destroys={str(has_destroys).lower()}\n")
                      fh.write(f"changed_units={json.dumps(changed_units)}\n")

              if "fail-on-change" in opts and (changes or errors or missing):
                  totals = ", ".join(f"{count[a]} {w}" for a, w in (
                      ("create", "to create"), ("update", "to update"), ("destroy", "to destroy"),
                      ("replace", "to replace"), ("import", "to import"), ("move", "to move"),
                      ("forget", "to forget")) if count[a] or a in ("create", "update", "destroy"))
                  if outputs:
                      totals += f", outputs change in {plural(len(outputs), 'unit')}"
                  print(f"\nDRIFT: {totals}, {plural(len(errors), 'error')}"
                        + (f", {plural(len(missing), 'unit')} without a result" if missing else "") + ".",
                        file=sys.stderr)
                  return 1
              return 0


          def cut(text: str, limit: int, where: str) -> str:
              """Last resort when even the shortest form is too long.

              Cuts whole lines from the end and closes a code block left open.
              """
              note = f"\n\n_Cut off to fit a comment; the full plan is in {where}._"
              kept, size, fence = [], 0, None
              for line in text.split("\n"):
                  after = fence
                  if m := re.match(r"^(`{3,})", line):
                      if fence is None:
                          after = m.group(1)
                      elif line.strip() == fence:
                          after = None
                  if size + len(line) + 1 + (len(after) + 1 if after else 0) + len(note) > limit:
                      break
                  kept.append(line)
                  size += len(line) + 1
                  fence = after
              if fence:
                  kept.append(fence)
              return "\n".join(kept) + note


          if __name__ == "__main__":
              args = sys.argv[1:]
              paths = [a for a in args if not a.startswith("--")]
              opts = {}
              for a in args:
                  if a.startswith("--"):
                      key, _, value = a[2:].partition("=")
                      opts[key] = value
              sys.exit(main(paths[0] if paths else "", opts))
