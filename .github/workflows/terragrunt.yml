          cat >"$d/base-commit.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """The commit a run on main compares against: the head of the last run whose apply went through.

          Usage: base-commit.py <repository> <workflow file>

          Prints the head commit of the newest run on main (a push or a manual run)
          that either

          - succeeded as a whole: its apply went through, or there was nothing to
            apply, or nothing relevant changed; or
          - failed after its apply succeeded: the job `apply` passed and only the
            verification (or the report) behind it failed. What it applied is in the
            state; comparing with the commit before it would select its units again
            and refuse a move of state that has already happened.

          A run whose apply failed, was held back (destroys without approval) or never
          started does not count, so the units it left out stay selected. Prints
          nothing when no such run is found: the whole tree runs then.

          Reads the runs and their jobs through `gh api` (GH_TOKEN, actions: read).
          """
          import json
          import subprocess
          import sys

          RUNS = 50
          JOB_LOOKUPS = 20


          def gh(path: str):
              out = subprocess.run(["gh", "api", path], capture_output=True, text=True, check=True).stdout
              return json.loads(out or "{}")


          def applied(jobs: list) -> bool:
              """The job apply of the run (named `<caller job> / apply` in a reusable workflow) passed."""
              return any((j.get("name") == "apply" or str(j.get("name", "")).endswith(" / apply"))
                         and j.get("conclusion") == "success" for j in jobs)


          def pick(runs: list, jobs_of) -> str:
              lookups = 0
              for run in runs:
                  if run.get("event") not in ("push", "workflow_dispatch") or run.get("status") != "completed":
                      continue
                  if run.get("conclusion") == "success":
                      return run["head_sha"]
                  if run.get("conclusion") != "failure" or lookups >= JOB_LOOKUPS:
                      continue
                  lookups += 1
                  if applied(jobs_of(run["id"])):
                      return run["head_sha"]
              return ""


          def main(repo: str, workflow: str) -> int:
              runs = gh(f"repos/{repo}/actions/workflows/{workflow}/runs?branch=main&status=completed&per_page={RUNS}")
              runs = runs.get("workflow_runs") or []

              def jobs_of(run_id):
                  return gh(f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100").get("jobs") or []

              print(pick(runs, jobs_of))
              return 0


          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  sys.exit(__doc__)
              sys.exit(main(*sys.argv[1:]))
          __CI_EOF__
          cat >"$d/check-principal-refs.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Fails when a principal this change creates is referenced by display name.

          `dependencies` only orders the run. A plan creates nothing, so a lookup by
          display name goes to Entra and finds nothing for a group or service principal
          that the same change is still only planning. The reference has to go through
          a dependency output as "id:${dependency...}" instead.
          """
          import pathlib
          import re
          import subprocess
          import sys

          BASE = sys.argv[1] if len(sys.argv) > 1 else "origin/main"

          EMAIL = re.compile(r'"([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)"')

          # Guests are users too; a new one referenced by address fails the same way.
          SOURCES = [
              ("group", "tenant/groups/terragrunt.hcl", re.compile(r'"(sg-[A-Za-z0-9._-]+)"\s*=')),
              ("sp", "tenant/applications/terragrunt.hcl", re.compile(r'"(sp-[A-Za-z0-9._-]+)"\s*=')),
              ("user", "tenant/users/terragrunt.hcl", EMAIL),
              ("user", "tenant/external-users/terragrunt.hcl", EMAIL),
          ]
          REFERENCE = re.compile(r'"(group|sp|user):([^"$]+)"')


          def added(path, pattern):
              """Names present now and absent at the merge base.

              The comparison is between two whole files rather than over the diff: a
              changed description touches the line a name sits on, which would otherwise
              read as a new name.
              """
              merge_base = subprocess.run(
                  ["git", "merge-base", BASE, "HEAD"],
                  capture_output=True, text=True, check=False,
              ).stdout.strip() or BASE
              before = subprocess.run(
                  ["git", "show", f"{merge_base}:{path}"],
                  capture_output=True, text=True, check=False,
              ).stdout
              now = pathlib.Path(path).read_text(encoding="utf-8")
              return set(pattern.findall(now)) - set(pattern.findall(before))


          references = {}
          for unit in pathlib.Path(".").rglob("terragrunt.hcl"):
              if ".terragrunt-cache" in unit.parts:
                  continue
              for kind, name in REFERENCE.findall(unit.read_text(encoding="utf-8")):
                  references.setdefault((kind, name), set()).add(str(unit))

          problems = []
          for kind, path, pattern in SOURCES:
              for name in added(path, pattern):
                  where = references.get((kind, name))
                  if where:
                      problems.append((f"{kind}:{name}", sorted(where)))

          if problems:
              print("Principals created by this change and referenced by name:\n", file=sys.stderr)
              for reference, units in problems:
                  print(f"  {reference}", file=sys.stderr)
                  for unit in units:
                      print(f"      {unit}", file=sys.stderr)
              print(
                  '\nA plan creates nothing, so the lookup fails before they exist.\n'
                  'Include the dependency and use "group-id:${dependency...}" for a group\n'
                  'or "id:${dependency...}" for a service principal - a bare GUID carries\n'
                  'no type, so the prefix has to.',
                  file=sys.stderr,
              )
              sys.exit(1)

          print("principal references OK")
          __CI_EOF__
          cat >"$d/stale-temp-files.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Warns about imports.hcl and moves.hcl that outlived the pull request that needed them.

          Usage: stale-temp-files.py [<base>]

          imports.hcl and moves.hcl next to a unit exist only in the pull request that
          takes objects over or renames them; the next pull request after the apply
          deletes them, so that the code looks freshly created. A file is stale when
          the commit that added it is <base> or one of its ancestors: on a push to
          main <base> is the commit the last applied run went through with, so the
          file of the very pull request being applied is not; in the weekly drift run
          <base> is HEAD (default), so every file still there is. Needs the history
          (fetch-depth 0). A warning only: the apply of the pull request that added the
          file may still be waiting, and nothing here changes a plan.
          """
          import os
          import subprocess
          import sys

          TEMPORARY = ("imports.hcl", "moves.hcl")


          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=check)


          def tracked() -> list:
              out = git("ls-files", "-z").stdout
              return sorted(f for f in out.split("\0") if f and os.path.basename(f) in TEMPORARY)


          def added_in(path: str):
              """The commit that first added the file, or None when the history does not say."""
              out = git("log", "--diff-filter=A", "--format=%H", "--", path, check=False).stdout.split()
              return out[-1] if out else None


          def stale(base: str) -> list:
              """[(path, adding commit)] of the temporary files added at or before base."""
              if git("cat-file", "-e", f"{base}^{{commit}}", check=False).returncode != 0:
                  return []
              found = []
              for path in tracked():
                  commit = added_in(path)
                  if commit and git("merge-base", "--is-ancestor", commit, base, check=False).returncode == 0:
                      found.append((path, commit))
              return found


          def main(argv: list) -> int:
              base = argv[0] if argv and argv[0] else "HEAD"
              for path, commit in stale(base):
                  name = os.path.basename(path)
                  print(f"::warning file={path},line=1,title=Temporary file::{name} was added in {commit[:7]}, "
                        f"an earlier pull request than this one. Delete it after its apply: {os.path.dirname(path)}/{name}")
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          __CI_EOF__
          chmod +x "$d"/*

      - name: Tool versions
        if: steps.diff.outputs.relevant != 'false'
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.diff.outputs.relevant != 'false'
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        if: steps.diff.outputs.relevant != 'false'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Install terragrunt
        if: steps.diff.outputs.relevant != 'false'
        run: install-tools.sh terragrunt

      # A pull request is compared with its base branch. On main the base is
      # the head of the last run whose apply went through or had nothing to do
      # (a failed verification after a good apply counts: its changes are in
      # the state), so a change a failed or held-back apply left out is still
      # selected now. Runs on main never overlap (see concurrency).
      - name: Base commit
        if: steps.diff.outputs.relevant != 'false'
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            # The caller's workflow file, e.g. ci.yml.
            wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
            base=$(base-commit.py "$GITHUB_REPOSITORY" "$wf") || base=""
            # Without it the units of an earlier failed apply could be left
            # out, so the whole tree runs instead.
            if [ -z "$base" ]; then
              echo "::warning::No run on main with a successful apply found; the whole tree runs."
            fi
          fi
          echo "sha=$base" >>"$GITHUB_OUTPUT"
          echo "Compared with \`$base\`." >>"$GITHUB_STEP_SUMMARY"

      # imports.hcl and moves.hcl are deleted in the pull request after their
      # apply; one older than this run's base is a warning, never a failure.
      - name: Temporary files
        if: steps.diff.outputs.relevant != 'false' && github.event_name != 'pull_request'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: stale-temp-files.py "$BASE"

      # A principal the same change creates cannot be referenced by display
      # name: `dependencies` orders the run but a plan creates nothing, so the
      # lookup goes to Entra and finds nothing. Caught here rather than by a
      # failed plan half an hour into the queue.
      - name: Principal references
        if: inputs.principal-refs && steps.diff.outputs.relevant != 'false'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          check-principal-refs.py "$BASE"

      # A scheduled run (certificate renewal, iac-home) looks at the whole tree.
      - name: Select the units
        if: steps.diff.outputs.relevant != 'false'
        id: units
        env:
          SCOPE: ${{ github.event_name == 'schedule' && 'all' || inputs.scope }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          # The moves of state the owner made for this change (format in
          # docs/terragrunt.md#moving-a-unit).
          moves=()
          if [ -f .github/state-moves.yaml ]; then
            yq -o=json '.' .github/state-moves.yaml >"$RUNNER_TEMP/state-moves.json"
            moves=(--moves="$RUNNER_TEMP/state-moves.json")
          fi
          # The push of a merge does not plan the whole tree for a change of
          # the workflows alone: its pull request did.
          push=()
          if [ "$EVENT" = "push" ]; then push=(--push); fi
          selection=$(select-units.py "$BASE" "${push[@]}" "${moves[@]}")
          if [ "$SCOPE" = "all" ]; then
            selection=$(jq -c '.all = true | .units = []' <<<"$selection")
          fi
          echo "selection=$selection" >>"$GITHUB_OUTPUT"
          # Paths shown as their state keys, without infrastructure/.
          jq -r '
            def key: sub("^infrastructure/"; "");
            (if .all then "Selected: the whole tree."
             elif (.units | length) > 0 then "Selected: " + (.units | map(key) | join(", ")) + "."
             else "Selected: no unit to plan." end),
            (if (.deleted | length) > 0
             then "Deleted, planned as a destroy: " + (.deleted | map(key) | join(", ")) + "."
             else empty end),
            (if (.moved | length) > 0
             then "Moved with their state: " + (.moved | map("\(.[0] | key) → \(.[1] | key)") | join(", ")) + "."
             else empty end),
            (.moved | map(select((.[0] | key) != (.[1] | key)) | .[0] | key) | unique
             | if length > 0
               then "Not destroyed; their old state blobs stay until the owner deletes them after the apply: "
                    + join(", ") + "."
               else empty end)
          ' <<<"$selection" >>"$GITHUB_STEP_SUMMARY"
          # The state key is the unit's path: a moved directory would be a new
          # unit that creates everything again, next to the old resources.
          if [ "$(jq '.renamed | length' <<<"$selection")" -gt 0 ]; then
            jq -r '.renamed[] | "::error::\(.[0]) moved to \(.[1]). Moving a unit changes its state key. Move its state first and list the move in .github/state-moves.yaml, or delete the unit in one pull request (it gets destroyed) and add it under the new path in the next."' <<<"$selection"
            exit 1
          fi

      # The selection split for the plan jobs: up to 20 units in one, at most
      # plan-shards of them, the units dealt out in turn. The whole tree is
      # listed unit by unit for that, the same directories select-units.py
      # counts as units. The deleted units go to the first share. Behind a
      # VPN there is one share: the network has one peer for the runners.
      - name: Shares of the plan
        if: steps.diff.outputs.relevant != 'false'
        id: shards
        env:
          SELECTION: ${{ steps.units.outputs.selection }}
          MAX_SHARDS: ${{ inputs.vpn-script != '' && 1 || inputs.plan-shards }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .all <<<"$SELECTION")" = "true" ]; then
            units=$(git ls-files -- '*/terragrunt.hcl' | sed 's|/terragrunt\.hcl$||' |
              grep -vE '(^|/)\.' | jq -R . | jq -sc .)
          else
            units=$(jq -c .units <<<"$SELECTION")
          fi
          shards=$(jq -c --argjson units "$units" --argjson max "$MAX_SHARDS" '
            .deleted as $deleted | ($units | length) as $n
            | (if $n + ($deleted | length) == 0 then 0
               else [1, ([$max, (($n + 19) / 20 | floor)] | min)] | max end) as $k
            | [range($k) as $i | {
                name: "\($i + 1) of \($k)",
                index: $i,
                units: [$units | to_entries[] | select(.key % $k == $i) | .value],
                deleted: (if $i == 0 then $deleted else [] end)}]' <<<"$SELECTION")
          echo "shards=$shards" >>"$GITHUB_OUTPUT"
          jq -r '"Plan jobs: \(length)."' <<<"$shards" >>"$GITHUB_STEP_SUMMARY"

  # Everything else that needs no state: formatting, the HCL, terraform
  # validate of the selected units and the committed lock files. It runs next
  # to the plan jobs (terraform validate takes minutes on the two cores), and
  # the gate, the plan comment and apply all wait for it: nothing merges or
  # applies without it. It signs in to Azure (the plan identity) only where
  # the configuration reads a secret while it is parsed (validate-sign-in).
  validate:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Terragrunt cannot authenticate its own git against a private repository,
      # so the modules go on disk and TG_SOURCE_MAP points there. The map drops
      # the ?ref= of a source, so the checkout itself takes modules_ref.
      - name: Modules ref
        id: modules-ref
        run: |
          ref=$(sed -nE 's/^[[:space:]]*modules_ref[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' account.hcl | head -n1)
          if ! printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error file=account.hcl::no valid modules_ref in account.hcl"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MODULES_REPO }}
          path: modules-repo
          ref: ${{ steps.modules-ref.outputs.ref }}
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint terraform-docs
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          install_terraform_docs() {
            [ -x "$BIN/terraform-docs" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
                  "$TERRAFORM_DOCS_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" terraform-docs && mv "$t/terraform-docs" "$BIN/"
          }

          for tool in "$@"; do
            "install_${tool//-/_}"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('account.hcl', '_common/templates/versions*.tf.tmpl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt
        run: install-tools.sh terragrunt

      - name: Sign in to Azure
        if: inputs.validate-sign-in
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      - name: HCL formatting
        run: |
          terragrunt hcl fmt --check --diff || {
            echo "::error title=HCL formatting::An .hcl file is not formatted (diff above). Run 'terragrunt hcl fmt' and commit the result."
            exit 1
          }

      - name: HCL validation
        run: |
          terragrunt hcl validate || {
            echo "::error title=HCL validation::An .hcl file does not parse or refers to something that does not exist (errors above)."
            exit 1
          }

      # terraform validate needs the providers and the modules, so each unit
      # is initialised without its backend (TF_CLI_ARGS_init, in the init
      # terragrunt runs before validate): nothing signs in to Azure. A
      # dependency's outputs would come from its state; here every dependency
      # answers with the mock outputs it allows for validate.
      # The providers come through terragrunt's provider cache, as in the plan:
      # it downloads each one once, under a lock, and links it into the units.
      # A plain TF_PLUGIN_CACHE_DIR let one unit run a provider binary that
      # another unit was still writing ("text file busy", #34).
      - name: Terraform validate
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
          TG_EXPERIMENT: optional-dependency-outputs
          TF_CLI_ARGS_init: -backend=false
          SELECTION: ${{ needs.select.outputs.selection }}
        run: |
          set -euo pipefail
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
            echo "No unit to validate."
            exit 0
          fi
          args=(--queue-ignore-dag-order --no-dependency-outputs --non-interactive --no-color)
          for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
          # One annotation per unit and error, so the reason is on the run page.
          annotate() {
            sed -n "s/.*\[\([^]]*\)\] terraform: Error: \(.*\)/::error title=terraform validate::\1: \2/p" "$1" | sort -u
          }
          rc=0
          terragrunt run --all "${args[@]}" -- validate >validate.txt 2>&1 || rc=$?
          cat validate.txt
          if [ "$rc" -ne 0 ]; then
            annotate validate.txt
            echo "::error title=terraform validate::A unit does not initialise or validate (log above): its configuration, a module source, a provider version, or a dependency without mock outputs for validate."
            exit "$rc"
          fi

      # Every validated unit has its .terraform.lock.hcl committed (toolchain
      # standard), and init did not have to change it. A change means the lock
      # lacks a provider, holds a version the constraints no longer allow, or
      # lacks the linux checksums. A missing lock fails, or only warns with
      # require-lock-files false (a repository that has not committed them yet).
      - name: Lock files
        env:
          SELECTION: ${{ needs.select.outputs.selection }}
          REQUIRE: ${{ inputs.require-lock-files }}
        run: |
          set -euo pipefail
          if [ "$(jq -r .all <<<"$SELECTION")" = "true" ]; then
            mapfile -t units < <(git ls-files -- '*/terragrunt.hcl' | sed 's|/terragrunt\.hcl$||' | grep -vE '(^|/)\.')
          else
            mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          fi
          level=error
          [ "$REQUIRE" = "true" ] || level=warning
          rc=0
          missing=0
          # A unit its exclude block keeps out (a device not under Terraform
          # yet) is never initialised and has no lock to hold.
          mapfile -t excluded < <(jq -r '.excluded[]?' <<<"$SELECTION")
          for u in "${units[@]}"; do
            if printf '%s\n' "${excluded[@]}" | grep -qxF -- "$u"; then continue; fi
            if ! git ls-files --error-unmatch -- "$u/.terraform.lock.hcl" >/dev/null 2>&1; then
              echo "::$level file=$u/terragrunt.hcl,title=Lock file::$u has no committed .terraform.lock.hcl. Run 'terragrunt run -- providers lock -platform=linux_amd64 -platform=darwin_arm64' in $u and commit the file."
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ] && [ "$level" = error ]; then rc=1; fi
          changed=$(git diff --name-only -- '*.terraform.lock.hcl')
          if [ -n "$changed" ]; then
            git diff -- '*.terraform.lock.hcl'
            while IFS= read -r f; do
              echo "::error file=$f,title=Lock file::$f does not match the providers terraform init chose (diff above). Run 'terragrunt run -- providers lock -platform=linux_amd64 -platform=darwin_arm64' in $(dirname "$f") and commit the file."
            done <<<"$changed"
            rc=1
          fi
          echo "Lock files: ${#units[@]} unit(s), $missing without a committed lock, $(grep -c . <<<"$changed" || true) changed by init." >>"$GITHUB_STEP_SUMMARY"
          exit "$rc"

  # One share of the selection (select's shards), as many side by side as
  # there are shares. Each leaves its plan.txt and what the comment shows of
  # its JSON plans for the plan job.
  plan-shard:
    name: plan (${{ matrix.shard.name }})
    needs: select
    # Next to validate, not after it; skipped where nothing is relevant.
    if: >-
      ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.relevant != 'false'
      && needs.select.outputs.shards != '[]' }}
    # The jobs that reach the managed resources (plan shares, apply) run where
    # those are reachable: a GitHub runner, or the NAS runner on the home
    # network for iac-home (network-runner, docs/runners.md). The other jobs
    # stay on GitHub.
    runs-on: ${{ fromJSON(inputs.network-runner) }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    permissions:
      contents: read
      id-token: write
    # Every plan, on a pull request and on main, runs as the read-only plan
    # identity (ARM_CLIENT_ID and GITHUB_APP_VAULT of the workflow): a plan may
    # be queued from any branch, and the identity that writes is federated on
    # the environment of the apply job alone.
    env:
      TG_READONLY_PLAN: "true"
      # A plan on a pull request is only a preview, so it does not lock the
      # state. Every new push cancels the run before it, and a cancelled
      # terraform leaves its lock behind: the lease on the state blob never
      # expires and blocks the unit until someone runs force-unlock. The plan
      # on main, the one the apply is decided from, still locks.
      TF_CLI_ARGS_plan: ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Terragrunt cannot authenticate its own git against a private repository,
      # so the modules go on disk and TG_SOURCE_MAP points there. The map drops
      # the ?ref= of a source, so the checkout itself takes modules_ref.
      - name: Modules ref
        id: modules-ref
        run: |
          ref=$(sed -nE 's/^[[:space:]]*modules_ref[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' account.hcl | head -n1)
          if ! printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error file=account.hcl::no valid modules_ref in account.hcl"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MODULES_REPO }}
          path: modules-repo
          ref: ${{ steps.modules-ref.outputs.ref }}
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint terraform-docs
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          install_terraform_docs() {
            [ -x "$BIN/terraform-docs" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
                  "$TERRAFORM_DOCS_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" terraform-docs && mv "$t/terraform-docs" "$BIN/"
          }

          for tool in "$@"; do
            "install_${tool//-/_}"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      # The scripts of the plan of a share (plan-shard in terragrunt-jobs.yml, and
      # terragrunt-drift.yml); scripts-select.yml says why each job carries its own.
      - name: Plan scripts
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/release-stale-locks.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Releases state locks that a killed GitHub job left behind.

          Terraform locks a state by taking a lease on its blob, and that lease never
          expires. A job that is cancelled or runs out of time while terraform holds it
          leaves the lock behind, and every later plan and apply of that unit fails on
          "Error acquiring the state lock" until someone runs force-unlock.

          A lock is released only when a GitHub runner took it ("Who" is runner@...) and
          it is older than any job is allowed to run, so the job that took it is gone. A
          lock taken on a workstation, or by a job still running, stays.

          A lock whose ID is given on the command line is released whatever its age: for
          a lock known to be dead, such as one left by a run cancelled a moment ago.

          Usage: release-stale-locks.py <storage-account> <container> <minutes> [<lock-id>...]
          """
          import base64
          import datetime
          import json
          import subprocess
          import sys


          def az(*args: str) -> str:
              return subprocess.run(
                  ["az", *args, "--auth-mode", "login", "--only-show-errors"],
                  capture_output=True, text=True, check=True,
              ).stdout


          def main(account: str, container: str, minutes: int, dead: tuple = ()) -> int:
              where = ["--account-name", account, "--container-name", container]
              leased = json.loads(az(
                  "storage", "blob", "list", *where, "--num-results", "*",
                  "--query", "[?properties.lease.state=='leased'].name", "--output", "json",
              ))
              now = datetime.datetime.now(datetime.timezone.utc)
              for name in leased:
                  metadata = json.loads(az(
                      "storage", "blob", "metadata", "show", *where, "--name", name, "--output", "json",
                  )) or {}
                  raw = next((v for k, v in metadata.items() if k.lower() == "terraformlockid"), None)
                  try:
                      info = json.loads(base64.b64decode(raw))
                      # Go writes nanoseconds, which strptime does not take.
                      created = datetime.datetime.strptime(
                          info["Created"][:19], "%Y-%m-%dT%H:%M:%S",
                      ).replace(tzinfo=datetime.timezone.utc)
                  except (TypeError, ValueError, KeyError):
                      print(f"{name}: leased without terraform lock info "
                            f"(metadata keys: {', '.join(metadata) or 'none'}), left alone")
                      continue
                  age = int((now - created).total_seconds() // 60)
                  who = info.get("Who", "")
                  named = info.get("ID") in dead
                  if not named and (not who.startswith("runner@") or age < minutes):
                      print(f"{name}: locked by {who} {age} min ago, left alone")
                      continue
                  az("storage", "blob", "lease", "break", *where, "--blob-name", name)
                  print(f"{name}: released lock {info.get('ID')} ({info.get('Operation')}) "
                        f"taken by {who} {age} min ago" + (", named as dead" if named else ""))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1], sys.argv[2], int(sys.argv[3]), tuple(sys.argv[4:])))
          __CI_EOF__
          cat >"$d/check-moves.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Fails when a moved unit plans as if its state had not come with it.

          Usage: check-moves.py <selection.json> <plan-json-dir>

          <selection.json> is the output of select-units.py; for every [old, new] in
          its `moved`, the plan of the new path (<plan-json-dir>/<new>/tfplan.json)
          may not create, destroy or replace a managed resource while its state is
          empty. Imports, moves, updates and forgets are fine. A create on an empty
          state means the state was not copied or moved before the merge, and the
          apply would build everything a second time next to the old resources. A
          unit whose state already holds managed resources came with its state: its
          creates and destroys are ordinary changes (destroys still need their
          approval). A unit without a JSON plan here is planned by another job and
          skipped.
          """
          import json
          import os
          import sys


          def offending(plan: dict) -> list:
              """(address, actions) of the managed resources the plan creates or deletes."""
              out = []
              for rc in plan.get("resource_changes") or []:
                  if rc.get("mode") != "managed":
                      continue
                  actions = (rc.get("change") or {}).get("actions") or []
                  if "create" in actions or "delete" in actions:
                      out.append((rc.get("address", "?"), "/".join(actions)))
              return out


          def has_state(plan: dict) -> bool:
              """Whether the state the plan started from holds a managed resource."""
              stack = [((plan.get("prior_state") or {}).get("values") or {}).get("root_module") or {}]
              while stack:
                  module = stack.pop()
                  if any(r.get("mode") == "managed" for r in module.get("resources") or []):
                      return True
                  stack.extend(module.get("child_modules") or [])
              return False


          def check(selection: dict, json_dir: str) -> list:
              """Error messages, one per offending resource."""
              errors = []
              for old, new in selection.get("moved") or []:
                  # Moved into infrastructure/ with the same key: the state never moved,
                  # so a create there is an ordinary change, not a missing state.
                  if old.removeprefix("infrastructure/") == new.removeprefix("infrastructure/"):
                      continue
                  path = os.path.join(json_dir, new, "tfplan.json")
                  if not os.path.isfile(path):
                      continue
                  with open(path, encoding="utf-8") as fh:
                      plan = json.load(fh)
                  # The state came with the unit; later changes to it are ordinary.
                  if has_state(plan):
                      continue
                  for address, actions in offending(plan):
                      errors.append(f"{new} (moved from {old}): {address} would {actions}. "
                                    "Move its state before the merge (.github/state-moves.yaml).")
              return errors


          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  sys.exit(__doc__)
              with open(sys.argv[1], encoding="utf-8") as fh:
                  found = check(json.load(fh), sys.argv[2])
              for message in found:
                  print(f"::error title=Moved unit::{message}")
              sys.exit(1 if found else 0)
          __CI_EOF__
          cat >"$d/trivy-plans.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # trivy over the plans in JSON, one report per unit.
          #
          # Usage: trivy-plans.sh <plan-json-dir> <report-dir>
          #
          # <plan-json-dir> holds <unit>/tfplan.json (terragrunt's --json-out-dir). Each
          # report lands in <report-dir> as <unit with / as _>.json, with the unit in
          # its "Unit" field. Exit code 3 when there is a HIGH or CRITICAL finding that
          # .github/trivyignore.yaml does not accept, 0 when there is none, anything else when
          # trivy itself failed.
          #
          # trivy turns a plan into a main.tf of its own, so every finding has that file
          # as its target and the `paths` of an ignore entry cannot tell the units
          # apart. In .github/trivyignore.yaml `paths` therefore lists units (<unit>/tfplan.json)
          # and is applied here: each unit gets the entries that name it or name no unit
          # at all.
          #
          # The checks are the ones built into the pinned trivy (--skip-check-update),
          # so a run is repeatable; new checks arrive with a version bump.
          set -euo pipefail

          PLANS=${1:?missing plan directory}
          REPORTS=${2:?missing report directory}
          IGNORE="$PWD/.github/trivyignore.yaml"
          [ -f "$IGNORE" ] || IGNORE="$PWD/.trivyignore.yaml"
          # A repository without accepted findings has no ignore file: scan with none.
          if [ ! -f "$IGNORE" ]; then
            IGNORE=$(mktemp --suffix=.yaml)
            echo '{}' >"$IGNORE"
          fi

          mkdir -p "$REPORTS"
          REPORTS=$(cd "$REPORTS" && pwd)
          if [ ! -d "$PLANS" ]; then
            echo "No plan in JSON."
            exit 0
          fi

          # One trivy per unit, as many at once as the runner has cores; each writes its
          # own report and exit code, collected below.
          scan() {
            local plan=$1 report rc=0 ignore
            report="$REPORTS/$(tr / _ <<<"${plan%/tfplan.json}").json"
            ignore=$(mktemp --suffix=.yaml)
            yq -o=json '.' "$IGNORE" |
              jq --arg plan "$plan" '{misconfigurations: [(.misconfigurations // [])[]
                | select((.paths // []) | length == 0 or any(.[]; . == $plan)) | del(.paths)]}' |
              yq -P '.' >"$ignore"
            (cd "$PLANS" && trivy config --quiet --skip-check-update \
              --severity HIGH,CRITICAL --exit-code 3 --ignorefile "$ignore" \
              --format json --output "$report" "$plan") || rc=$?
            rm -f "$ignore"
            echo "$rc" >"$report.rc"
            [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ] || { echo "trivy failed on $plan" >&2; return 0; }
            local unit="${plan%/tfplan.json}"
            jq --arg unit "$unit" '.Unit = $unit' "$report" >"$report.tmp" && mv "$report.tmp" "$report"
            jq -r --arg unit "$unit" '.Results[]? | .Target as $t | .Misconfigurations[]?
              | select(.Status == "FAIL")
              | "\($unit): \(.Severity) \(.AVDID // .ID) \(.Title) [target \($t)]"' "$report"
          }
          export -f scan
          export PLANS REPORTS IGNORE

          plans=$(cd "$PLANS" && find . -name tfplan.json | sed 's|^\./||' | sort)
          # shellcheck disable=SC2016 # $1 expands in the child bash, not here.
          [ -z "$plans" ] || xargs -r -P "$(nproc)" -I{} bash -c 'scan "$1"' _ {} <<<"$plans"

          found=0
          for rc in "$REPORTS"/*.rc; do
            [ -e "$rc" ] || continue
            case "$(cat "$rc")" in
              0) ;;
              3) found=1 ;;
              *) exit 1 ;;
            esac
            rm -f "$rc"
          done

          [ "$found" -eq 0 ] || exit 3
          __CI_EOF__
          chmod +x "$d"/*

      # The plan comment's two scripts, a step each: actionlint deadlocks on a run
      # script of more than about 64 KB (it feeds shellcheck through a pipe).
      - name: Plan summary script
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/plan-summary.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns the output of a terragrunt plan into the plan comment of a pull request.

          Usage: plan-summary.py <plan.txt> [options]

          The comment, top to bottom:

            ## 📋 Plan complete            (## ❌ Plan failed on an error, a unit without
                                            a result or a failed check)
            repo · commit · units · ➕ created · ✏️ updated · 🗑️ destroyed · ♻️ replaced
            ### ⚠️ Destroys and replaces   icon | Resource | Name | Unit | Why
            ### Changes                    icon | Resource | Name | What changes | From | To
            imports that change nothing, as one count line
            ### ❌ Errors, ### 🛡️ Security findings   when there are any
            **Status:** security findings, formatting and validation
            **Needed:** what has to happen next (an approval of a destroy, a fix, a merge)
            <details> per unit: what terraform printed, as a diff </details>

          The tables come from the plans in JSON (--json-dir, plan_details.py): one row
          per change that matters, in standard wording. A unit without a JSON plan gets
          one row per resource from the text. The raw plan stays in the run artifact.

          A comment on GitHub holds at most 65 536 characters. When the comment does not
          fit into MAX, the details are shortened (the largest unit first), then left
          out; the tables are never cut while anything else can be. What was cut is said
          at the end.

          The output of run --all is interleaved across units, every line prefixed with
          "[<unit>] terraform:"; the lines are grouped back by unit and the prefix is
          dropped.

          Options:
            --fail-on-change   exit non-zero when the plan proposes anything at all or a
                               unit ended in an error (the gate of the weekly drift job;
                               terragrunt itself returns zero even when there are changes)
            --github-output    write has_changes, has_errors, has_destroys and
                               changed_units (a JSON list) to $GITHUB_OUTPUT; a plan that
                               destroys or replaces is not applied by a push, it waits
                               for an approval or a manual run
            --json-dir=<dir>   the plans in JSON, <dir>/<unit>/tfplan.json
            --export=<file>    a share of a split plan: write the rows of its JSON plans,
                               its outputs and trivy findings, for the merge
            --import=<dir>     the merge: read every such file of the directory, next to
                               the concatenated plan.txt of all shares
            --trivy=<dir>      trivy's JSON reports over those plans, one per unit
            --checks=<list>    results of the checks of the same job, as
                               name=outcome,name=outcome (formatting=success,...)
            --changes-out=<f>  write the entries of the tables as JSON, for the apply
                               comment (apply-summary.py); text only, nothing sensitive
            --artifact=<name>  the artifact the raw plan is in (default plan-$GITHUB_RUN_ID)
            --repo=, --commit= what the heading line names (default $GITHUB_REPOSITORY,
                               $GITHUB_SHA)
            --drift            the weekly drift check: "Drift check" in the heading and
                               no "Needed" line
            --nothing-selected the change selects no unit; plan.txt may be missing
            --no-plan          no plan was produced; plan.txt may be missing

          An import, a move, a forget (a removed block with destroy = false) and a change
          of outputs alone count as a change too: each reaches the state only through
          apply, and dependent units read outputs from there. A unit terragrunt queued
          that printed neither a plan nor an error counts as an error: the run was
          cancelled, or terragrunt failed before terraform started.
          """
          import json
          import os
          import pathlib
          import re
          import sys

          import plan_details
          from plan_details import NONE, code

          RE_UNIT = re.compile(r"\[([^\]]+)\] terraform:")
          RE_PLAN = re.compile(
              r"Plan: (?:(\d+) to import, )?(\d+) to add, (\d+) to change, (\d+) to destroy")
          # The second form is what a destroy plan prints when the state is empty.
          RE_NOOP = re.compile(
              r"No changes\. (?:Your infrastructure matches the configuration"
              r"|No objects need to be destroyed)")
          RE_ERROR = re.compile(r"^\s*Error: (.+)$")
          RE_WARNING = re.compile(r"^\s*Warning: ")
          # The queue terragrunt prints before it starts, one unit per branch of a tree.
          RE_QUEUE = re.compile(r"The following units will be run")
          RE_BRANCH = re.compile(r"^[\s│]*[├╰└]── (\S+)\s*$")
          # The heading terraform puts above each resource in the plan. Headings sit at
          # the left edge; the comments inside a resource are indented deeper.
          RE_RESOURCE = re.compile(
              r"^ {0,2}# (.+?) (will be created|will be updated in-place|will be destroyed"
              r"|(?:is tainted, so )?must be replaced|will be replaced, as requested"
              r"|will be read during apply|will be imported"
              r"|will no longer be managed by Terraform.*|has moved to .+)$"
          )
          RE_IMPORTED = re.compile(r"^ {0,2}# \(imported from ")
          # Terraform indents in steps of four and puts the action symbol two columns
          # in, so a symbol anywhere else is part of a value.
          RE_SIGN = re.compile(r"^( +)([-+~]) ")

          MAX = 60_000
          MAX_ERROR_LINES = 25
          # Units live under infrastructure/; their state key, and what the comment
          # shows, is the path without it.
          CONTENT = "infrastructure/"


          def state_key(unit: str) -> str:
              return unit[len(CONTENT):] if unit.startswith(CONTENT) else unit


          def json_plan(directory: str, unit: str) -> pathlib.Path:
              """<directory>/<unit>/tfplan.json, under the unit's full path where that exists."""
              full = pathlib.Path(directory, CONTENT + unit, "tfplan.json")
              return full if full.is_file() else pathlib.Path(directory, unit, "tfplan.json")


          def fenced(lines: list, lang: str = "") -> list:
              """A code block whose fence is longer than any run of backticks inside."""
              longest = max((len(r) for line in lines for r in re.findall(r"`+", line)), default=0)
              fence = "`" * max(3, longest + 1)
              return [fence + lang, *lines, fence]


          def highlight(line: str) -> str:
              """Moves the action symbol to the first column, where a diff block colours it.

              `~` becomes `!`, the marker of a changed line in a diff block. The rest of
              the line keeps its columns.
              """
              m = RE_SIGN.match(line)
              if not m or len(m.group(1)) % 4 != 2:
                  return line
              sign = "!" if m.group(2) == "~" else m.group(2)
              return sign + m.group(1) + line[m.end() - 1:]


          def parse(streams: dict) -> dict:
              """Splits the output of one unit into resources, outputs, errors and the plan line.

              Each stream (STDOUT, STDERR, ...) is read on its own: terraform prints the
              plan to stdout and the errors to stderr, and the two can interleave.
              """
              unit = {"resources": [], "outputs": [], "errors": [], "plan": None}
              for lines in streams.values():
                  mode = None
                  for text in lines:
                      in_block = text[:1].isspace() or text.startswith(("-/+", "+/-"))
                      if mode == "resources" and in_block:
                          if m := RE_RESOURCE.match(text):
                              unit["resources"].append({"address": m.group(1), "what": m.group(2),
                                                        "lines": [text]})
                          elif unit["resources"]:
                              unit["resources"][-1]["lines"].append(text)
                          continue
                      if mode == "outputs" and text[:1].isspace():
                          unit["outputs"].append(text)
                          continue
                      if mode == "error" and not (RE_ERROR.match(text) or RE_WARNING.match(text)):
                          unit["errors"][-1].append(text)
                          continue
                      mode = None
                      if text.startswith("Terraform will perform the following actions:"):
                          mode = "resources"
                      elif text.startswith("Changes to Outputs:"):
                          mode = "outputs"
                          unit["outputs"].append(text)
                      elif text.startswith("Plan: "):
                          unit["plan"] = text[len("Plan: "):].rstrip(".")
                      elif RE_ERROR.match(text):
                          mode = "error"
                          unit["errors"].append([text])
              return unit


          def loose_errors(lines: list, known: set) -> list:
              """Error blocks terragrunt printed outside any unit and no unit reported.

              Terragrunt repeats every failed unit's error in its closing report, so an
              error seen in a unit already is skipped. A block runs to the next empty line.
              """
              blocks = {}
              for i, line in enumerate(lines):
                  m = RE_ERROR.match(line.split("terraform:")[-1])
                  if not m or m.group(1).strip() in known or m.group(1).strip() in blocks:
                      continue
                  indent = len(line) - len(line.lstrip())
                  block = []
                  for follow in lines[i:]:
                      if not follow:
                          break
                      block.append(follow[indent:] if follow[:indent].isspace() else follow.strip())
                  blocks[m.group(1).strip()] = [b.rstrip() for b in block]
              return list(blocks.values())


          def trivy_findings(reports: str) -> list:
              """(unit, severity, id, title, resource) for every failed trivy check.

              Reads every JSON report in the directory, one per unit; the target of a
              result is the plan file as <unit>/tfplan.json.
              """
              if not reports or not os.path.isdir(reports):
                  return []
              found = set()
              for report_path in sorted(pathlib.Path(reports).glob("*.json")):
                  report = json.loads(report_path.read_text(encoding="utf-8") or "{}")
                  for result in report.get("Results") or []:
                      unit = state_key(report.get("Unit") or os.path.dirname(result.get("Target", "")) or "?")
                      for m in result.get("Misconfigurations") or []:
                          if m.get("Status") != "FAIL":
                              continue
                          found.add((unit, m.get("Severity", ""), m.get("AVDID") or m.get("ID", ""),
                                     m.get("Title", ""), (m.get("CauseMetadata") or {}).get("Resource", "")))
              return sorted(found)


          def shared_parts(directory: str) -> tuple:
              """What the shares of a split plan exported (--export), merged.

              The JSON plans hold sensitive values in clear text and never leave the job
              that made them; a share passes on only the rows the comment shows.
              """
              entries, outputs, findings = {}, {}, set()
              if directory and os.path.isdir(directory):
                  for part in sorted(pathlib.Path(directory).glob("*.json")):
                      data = json.loads(part.read_text(encoding="utf-8") or "{}")
                      for unit, items in (data.get("entries") or {}).items():
                          entries[unit] = [{**e, "rows": [tuple(r) for r in e["rows"]]} for e in items]
                      outputs.update(data.get("outputs") or {})
                      findings.update(tuple(f) for f in data.get("findings") or [])
              return entries, outputs, sorted(findings)


          def read_output(path: str):
              """units {unit: (add, chg, dst, imp)}, parsed per unit, loose lines, queue, errors."""
              units, errors, streams, loose, queued = {}, [], {}, [], {}
              unit, in_queue = "?", False
              if not path or not os.path.isfile(path):
                  return units, {}, loose, queued, errors
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if in_queue and (m := RE_BRANCH.match(line)):
                      queued[state_key(m.group(1))] = None
                  elif line.strip() != ".":
                      in_queue = bool(RE_QUEUE.search(line))
                  m = RE_UNIT.search(line)
                  if m:
                      unit = state_key(m.group(1))
                      label = line[:m.start()].split()
                      stream = label[-1] if label and re.fullmatch(r"[A-Z]+", label[-1]) else ""
                      text = line[m.end():]
                      streams.setdefault(unit, {}).setdefault(stream, []).append(
                          text[1:] if text.startswith(" ") else text)
                  else:
                      loose.append(line)
                  if m := RE_PLAN.search(line):
                      imp, add, chg, dst = (int(g or 0) for g in m.groups())
                      units[unit] = (add, chg, dst, imp)
                  elif RE_NOOP.search(line):
                      units.setdefault(unit, (0, 0, 0, 0))
                  if m := RE_ERROR.match(line.split("terraform:")[-1]):
                      errors.append(m.group(1).strip())
              parsed = {u: parse(s) for u, s in streams.items()}
              # Terraform prints no "Plan:" line when only outputs change.
              for u, p in parsed.items():
                  if p["outputs"]:
                      units.setdefault(u, (0, 0, 0, 0))
              return units, parsed, loose, queued, errors


          def plural(n: int, word: str) -> str:
              return f"{n} {word}{'s' * (n != 1)}"


          def cell(text: str) -> str:
              """Text for a table cell; code spans have their pipes escaped already."""
              text = str(text).replace("\n", " ")
              return text if "`" in text else text.replace("|", "\\|")


          def checks_of(spec: str) -> list:
              """[(name, outcome)] from name=outcome,name=outcome."""
              out = []
              for part in (spec or "").split(","):
                  if "=" in part:
                      name, outcome = part.split("=", 1)
                      out.append((name.strip(), outcome.strip() or "skipped"))
              return out


          def main(path: str, opts: dict) -> int:
              drift = "drift" in opts
              units, parsed, loose, queued, errors = read_output(path)

              # Every resource the plan touches, from JSON where there is one.
              shared, shared_outputs, shared_findings = shared_parts(opts.get("import"))
              entries, from_json, outputs = [], {}, {}
              for u, p in sorted(parsed.items()):
                  plan_json = json_plan(opts.get("json-dir") or "", u)
                  got = None
                  if u in shared:
                      got = shared[u]
                      if shared_outputs.get(u):
                          outputs[u] = shared_outputs[u]
                  elif opts.get("json-dir") and plan_json.is_file():
                      try:
                          plan = plan_details.load(plan_json)
                          got = plan_details.entries(plan, u)
                          outs = [k for k, v in (plan.get("output_changes") or {}).items()
                                  if (v or {}).get("actions") not in (["no-op"], None)]
                          if outs:
                              outputs[u] = outs
                          from_json[u] = got
                      except (ValueError, KeyError, TypeError, AttributeError) as e:
                          print(f"::warning::{u}: the JSON plan could not be read ({e})", file=sys.stderr)
                  if got is None:
                      got = []
                      for r in p["resources"]:
                          imported = any(RE_IMPORTED.match(x) for x in r["lines"])
                          if e := plan_details.text_entry(r["address"], r["what"], u, imported):
                              got.append(e)
                      if p["outputs"]:
                          outputs[u] = ["(see the details)"]
                  entries += got
              entries.sort(key=lambda e: (plan_details.ORDER.get(e["action"], 9), e["unit"],
                                          plan_details.natural(e["address"])))

              count = {a: sum(e["action"] == a for e in entries) for a in plan_details.ICONS}
              count["import"] = sum(e["action"] == "import" or e["imported"] for e in entries)
              destructive = [e for e in entries if e["action"] in ("destroy", "replace")]
              listed = [e for e in entries if e["action"] not in ("destroy", "replace") and not e["noop_import"]]
              noop_imports = {}
              for e in entries:
                  if e["noop_import"]:
                      noop_imports[e["unit"]] = noop_imports.get(e["unit"], 0) + 1

              # Text totals still decide: they count what the JSON might not have.
              whats = [r["what"] for p in parsed.values() for r in p["resources"]]
              text_changes = any(any(t) for t in units.values()) or any(
                  w.startswith(("has moved to ", "will no longer be managed")) for w in whats)
              changes = bool(text_changes or entries or outputs)

              # The same failure (an expired login, say) tends to hit many units at once.
              failed = {}
              for u, p in parsed.items():
                  for block in p["errors"]:
                      failed.setdefault(tuple(block), {})[u] = None
              known = {RE_ERROR.match(b[0]).group(1).strip() for b in failed}
              for block in loose_errors(loose, known):
                  failed.setdefault(tuple(block), {})[None] = None
              missing = [u for u in queued if u not in units and not parsed.get(u, {}).get("errors")]
              checks = checks_of(opts.get("checks", ""))
              bad_checks = [n for n, o in checks if o not in ("success", "skipped")]
              no_plan = "no-plan" in opts or (not parsed and not units and "nothing-selected" not in opts
                                              and not (path and os.path.isfile(path) and os.path.getsize(path)))
              is_failed = bool(failed or missing or bad_checks or no_plan)

              all_units = sorted(set(units) | set(parsed) | set(missing))
              changed_units = sorted({e["unit"] for e in entries} | set(outputs)
                                     | {u for u, t in units.items() if any(t)})
              unchanged = [u for u in all_units if u not in changed_units and u in units]
              many = len({e["unit"] for e in listed}) > 1
              findings = sorted(set(shared_findings) | set(trivy_findings(opts.get("trivy"))))
              if export := opts.get("export"):
                  pathlib.Path(export).write_text(json.dumps({
                      "entries": from_json, "outputs": {u: outputs[u] for u in from_json if u in outputs},
                      "findings": findings}, ensure_ascii=False), encoding="utf-8")

              diffs = {}
              for u in changed_units:
                  p = parsed.get(u)
                  if not p:
                      continue
                  blocks = [r["lines"] for r in p["resources"]]
                  if p["outputs"]:
                      blocks.append(p["outputs"])
                  diffs[u] = [line for i, b in enumerate(blocks)
                              for line in ([""] if i else []) + [highlight(x) for x in b]]

              artifact = opts.get("artifact")
              if artifact is None and os.environ.get("GITHUB_RUN_ID"):
                  artifact = f"plan-{os.environ['GITHUB_RUN_ID']}"
              where = f"artifact {code(artifact)} (plan.txt)" if artifact else "plan.txt"
              repo = opts.get("repo") or os.environ.get("GITHUB_REPOSITORY", "")
              commit = opts.get("commit") or os.environ.get("GITHUB_SHA", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")

              title = "Drift check" if drift else "Plan"
              heading = f"## ❌ {title} failed" if is_failed else f"## 📋 {title} complete"
              line = []
              if repo:
                  line.append(code(repo))
              if commit:
                  line.append(f"[{code(commit[:7])}]({server}/{repo}/commit/{commit})" if repo else code(commit[:7]))
              line.append(plural(len(all_units), "unit"))
              line += [f"➕ {count['create']}", f"✏️ {count['update']}", f"🗑️ {count['destroy']}",
                       f"♻️ {count['replace']}"]
              line += [f"{plan_details.ICONS[a]} {count[a]} {w}" for a, w in
                       (("import", "imported"), ("move", "moved"), ("forget", "forgotten")) if count[a]]

              status = []
              if opts.get("trivy") is not None:
                  status.append(f"🛡️ {plural(len(findings), 'security finding')} (below)" if findings
                                else "🛡️ no security findings")
              if checks:
                  ok = [n for n, o in checks if o == "success"]
                  if ok:
                      status.append("✅ " + " and ".join(ok) + " passed")
                  status += [f"❌ {n} failed" for n in bad_checks]
              if failed or missing:
                  status.append("❌ " + plural(len({u for s in failed.values() for u in s if u} | set(missing))
                                               or 1, "unit") + " without a plan")

              needed = []
              if failed or missing or no_plan:
                  needed.append("fix the errors above; the plan runs again on the next push")
              if bad_checks:
                  needed.append("fix " + " and ".join(bad_checks))
              if findings:
                  needed.append("fix the security findings or accept them in "
                                "`.github/trivyignore.yaml` with the reason")
              if destructive:
                  needed.append("approval of the destroy: an approving review of this pull request "
                                "after this plan (`destroy / approved`), then the merge applies it")
              if not needed:
                  needed.append("review and merge; the apply on `main` runs by itself" if changes
                                else "nothing; merging applies nothing")

              def render(shown: dict, details: bool = True, compact: bool = False, cap=None,
                         error_lines=None) -> str:
                  out = [heading, "", " · ".join(line), ""]

                  if destructive:
                      out += ["### ⚠️ Destroys and replaces", "",
                              "| | Resource | Name | Unit | Why |", "|---|---|---|---|---|"]
                      out += [f"| {e['icon']} | {e['kind']} | {code(e['name'])} | {code(e['unit'])} "
                              f"| {cell(e['why']) or NONE} |" for e in destructive]
                      out.append("")

                  rows = []
                  for e in listed:
                      name = code(e["name"]) + (f"<br><sub>{code(e['unit'])}</sub>" if many else "")
                      those = e["rows"]
                      if compact and len(those) > 1:
                          those = [(f"{plural(len(those), 'change')}, see the details", NONE, NONE)]
                      # The rows after the first of a resource leave its kind and name
                      # out, so that one resource reads as one block.
                      for i, (what, frm, to) in enumerate(those):
                          kind, label = (e["kind"], name) if i == 0 else ("", "")
                          rows.append(f"| {e['icon']} | {kind} | {label} | {cell(what)} | {frm} | {to} |")
                  if rows or not destructive:
                      out += ["### Changes", ""]
                  if rows:
                      out += ["| | Resource | Name | What changes | From | To |",
                              "|---|---|---|---|---|---|"]
                      out += rows[:cap] if cap is not None else rows
                      if cap is not None and cap < len(rows):
                          out.append(f"| | | | _{len(rows) - cap} more rows, see {where}_ | | |")
                      out.append("")
                  elif not destructive and not noop_imports:
                      if outputs:
                          out += ["Only output values change, in " + ", ".join(code(u) for u in outputs)
                                  + ".", ""]
                      elif "nothing-selected" in opts:
                          out += ["Nothing to plan: the change selects no unit.", ""]
                      elif not is_failed:
                          out += ["None: the plan matches what is deployed.", ""]
                      else:
                          out += ["No plan to show.", ""]
                  if noop_imports:
                      n = sum(noop_imports.values())
                      out += [f"📥 **Imported without a change:** {n} — "
                              + ", ".join(f"{code(u)} ({c})" for u, c in sorted(noop_imports.items())) + ".", ""]

                  if is_failed and (failed or missing or no_plan):
                      out += ["### ❌ Errors", ""]
                      if no_plan and not failed and not missing:
                          out += [f"No plan was produced, see the run log and {where}.", ""]
                      if missing:
                          out += ["**Without a result:** " + ", ".join(code(u) for u in missing), "",
                                  "Queued, but neither a plan nor an error came out: the run was "
                                  "cancelled, or terragrunt failed before terraform started.", ""]
                      for block, sources in failed.items():
                          names = [code(u) for u in sources if u is not None]
                          if None in sources:
                              names.append("outside a unit")
                          body = list(block)
                          if error_lines is not None and len(body) > error_lines:
                              body = body[:error_lines] + [f"... {len(block) - error_lines} more lines"]
                          out += [f"**{', '.join(names)}**", ""] + fenced(body) + [""]

                  if findings:
                      out += ["### 🛡️ Security findings", "",
                              "trivy over the plan, HIGH and CRITICAL. A finding that is accepted "
                              "goes into `.github/trivyignore.yaml` with the reason.", "",
                              "| Unit | Severity | Check | Resource |", "|---|---|---|---|"]
                      out += [f"| {code(u)} | {sev} | {cell(cid)}: {cell(title_)} | {code(res) if res else ''} |"
                              for u, sev, cid, title_, res in findings]
                      out.append("")

                  if status:
                      out += ["**Status:** " + " · ".join(status), ""]
                  if not drift and len(needed) == 1:
                      out += [f"**Needed:** {needed[0]}.", ""]
                  elif not drift:
                      out += ["**Needed:**", ""] + [f"- {n}" for n in needed] + [""]

                  cut_notes = []
                  body = []
                  for u in changed_units:
                      lines = diffs.get(u) or []
                      if not lines:
                          continue
                      p = parsed[u]
                      n = shown.get(u, len(lines))
                      body.append(f"#### {code(u)}" + (f" ({p['plan']})" if p["plan"] else ""))
                      body.append("")
                      if n == 0:
                          body += ["_Left out, the comment would be too long._", ""]
                          cut_notes.append(code(u))
                          continue
                      text = lines[:n]
                      while text and not text[-1]:
                          text.pop()
                      body += fenced(text, "diff")
                      if n < len(lines):
                          body += ["", f"_{len(lines) - n} of {len(lines)} lines left out._"]
                          cut_notes.append(code(u))
                      body.append("")
                  if unchanged:
                      body.append(f"**{plural(len(unchanged), 'unit')} without a change:** "
                                  + ", ".join(code(u) for u in unchanged))
                      body.append("")
                  if body and details:
                      out += ["<details><summary>Details per unit</summary>", ""] + body + ["</details>", ""]

                  notes = []
                  if not details and body:
                      notes.append("the details per unit are left out")
                  elif cut_notes:
                      notes.append("the details of " + ", ".join(cut_notes) + " are shortened")
                  if compact:
                      notes.append("resources with several changes are one row each")
                  if error_lines is not None and any(len(b) > error_lines for b in failed):
                      notes.append("long error messages are shortened")
                  if notes:
                      out.append(f"_Cut to fit a comment: {'; '.join(notes)}. The full plan is in {where}._")
                  else:
                      out.append(f"_The raw plan is in {where}._")
                  return "\n".join(out)

              # The details go first, from the largest unit down: as much of the
              # largest as the overflow needs, then the next one if that was not enough.
              shown = {}
              text = render(shown)
              for u in sorted(diffs, key=lambda u: -sum(len(x) + 1 for x in diffs[u])):
                  n = len(diffs[u])
                  while n and len(text) > MAX:
                      over = len(text) - MAX
                      while n and over > 0:
                          n -= 1
                          over -= len(diffs[u][n]) + 1
                      shown[u] = n
                      text = render(shown)
              if diffs and all(shown.get(u, len(d)) == 0 for u, d in diffs.items()):
                  text = render(shown, details=False)
              attempts = [dict(details=False), dict(details=False, error_lines=MAX_ERROR_LINES),
                          dict(details=False, error_lines=MAX_ERROR_LINES, compact=True)]
              for kwargs in attempts:
                  if len(text) <= MAX:
                      break
                  text = render(shown, **kwargs)
              if len(text) > MAX:
                  # Last of all the rows of the changes table; the destroys stay whole.
                  lo, hi = 0, len(listed) * 50
                  while lo < hi:
                      mid = (lo + hi + 1) // 2
                      if len(render(shown, details=False, error_lines=MAX_ERROR_LINES, compact=True,
                                    cap=mid)) <= MAX:
                          lo = mid
                      else:
                          hi = mid - 1
                  text = render(shown, details=False, error_lines=MAX_ERROR_LINES, compact=True, cap=lo)
              if len(text) > MAX:
                  text = cut(text, MAX, where)
              print(text)

              if out_path := opts.get("changes-out"):
                  pathlib.Path(out_path).write_text(json.dumps({
                      "repo": repo, "commit": commit, "units": all_units, "entries": entries,
                      "noop_imports": noop_imports, "failed": is_failed,
                  }, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")

              if "github-output" in opts and (path_out := os.environ.get("GITHUB_OUTPUT")):
                  with open(path_out, "a", encoding="utf-8") as fh:
                      fh.write(f"has_changes={str(changes).lower()}\n")
                      fh.write(f"has_errors={str(bool(errors or missing)).lower()}\n")
                      has_destroys = bool(destructive) or any(
                          r["what"] == "will be destroyed" or "replaced" in r["what"]
                          for p in parsed.values() for r in p["resources"])
                      fh.write(f"has_destroys={str(has_destroys).lower()}\n")
                      fh.write(f"changed_units={json.dumps(changed_units)}\n")

              if "fail-on-change" in opts and (changes or errors or missing):
                  totals = ", ".join(f"{count[a]} {w}" for a, w in (
                      ("create", "to create"), ("update", "to update"), ("destroy", "to destroy"),
                      ("replace", "to replace"), ("import", "to import"), ("move", "to move"),
                      ("forget", "to forget")) if count[a] or a in ("create", "update", "destroy"))
                  if outputs:
                      totals += f", outputs change in {plural(len(outputs), 'unit')}"
                  print(f"\nDRIFT: {totals}, {plural(len(errors), 'error')}"
                        + (f", {plural(len(missing), 'unit')} without a result" if missing else "") + ".",
                        file=sys.stderr)
                  return 1
              return 0


          def cut(text: str, limit: int, where: str) -> str:
              """Last resort when even the shortest form is too long.

              Cuts whole lines from the end and closes a code block left open.
              """
              note = f"\n\n_Cut off to fit a comment; the full plan is in {where}._"
              kept, size, fence = [], 0, None
              for line in text.split("\n"):
                  after = fence
                  if m := re.match(r"^(`{3,})", line):
                      if fence is None:
                          after = m.group(1)
                      elif line.strip() == fence:
                          after = None
                  if size + len(line) + 1 + (len(after) + 1 if after else 0) + len(note) > limit:
                      break
                  kept.append(line)
                  size += len(line) + 1
                  fence = after
              if fence:
                  kept.append(fence)
              return "\n".join(kept) + note


          if __name__ == "__main__":
              args = sys.argv[1:]
              paths = [a for a in args if not a.startswith("--")]
              opts = {}
              for a in args:
                  if a.startswith("--"):
                      key, _, value = a[2:].partition("=")
                      opts[key] = value
              sys.exit(main(paths[0] if paths else "", opts))
          __CI_EOF__
          chmod +x "$d/plan-summary.py"

      - name: Plan details script
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/plan_details.py" <<'__CI_EOF__'
          """Reads a terraform plan in JSON and says in plain words what it changes.

          One entry per resource the plan touches: an icon for the action, what kind of
          thing it is (a dictionary of the resource types the organisation uses; any
          other type is spelled out from its name), the name a person knows it by, and
          one row per change that matters - "tag `owner`" from `a` to `b`, "setting
          `public_network_access_enabled`", "setting `topics`: added `x`". The noise of a
          plan is left out: values only known after apply, computed IDs, etags, URLs and
          timestamps, outputs, data sources, and imports that change nothing (counted
          instead).

          The JSON holds sensitive values in clear text. Nothing marked sensitive by
          terraform is ever printed, and the JSON itself never leaves the runner; the
          entries (changes.json) hold only the text the comment shows.
          """
          import json
          import re

          ICONS = {"create": "➕", "update": "✏️", "destroy": "🗑️", "replace": "♻️",
                   "import": "📥", "move": "🚚", "forget": "⏏️"}
          # The order of the tables: what cannot be undone first.
          ORDER = {"destroy": 0, "replace": 1, "update": 2, "create": 3, "import": 4, "move": 5,
                   "forget": 6}

          KINDS = {
              # Azure
              "azurerm_resource_group": "Resource group",
              "azurerm_role_assignment": "Role assignment",
              "azurerm_pim_eligible_role_assignment": "Eligible role assignment",
              "azurerm_role_definition": "Role definition",
              "azurerm_key_vault": "Key Vault",
              "azurerm_key_vault_certificate": "Key Vault certificate",
              "azurerm_key_vault_secret": "Key Vault secret",
              "azurerm_log_analytics_workspace": "Log Analytics workspace",
              "azurerm_monitor_diagnostic_setting": "Diagnostic settings",
              "azurerm_monitor_aad_diagnostic_setting": "Entra diagnostic settings",
              "azurerm_monitor_action_group": "Action group",
              "azurerm_monitor_metric_alert": "Metric alert",
              "azurerm_monitor_scheduled_query_rules_alert_v2": "Log alert",
              "azurerm_monitor_data_collection_rule": "Data collection rule",
              "azurerm_monitor_data_collection_endpoint": "Data collection endpoint",
              "azurerm_management_lock": "Lock",
              "azurerm_management_group": "Management group",
              "azurerm_management_group_subscription_association": "Subscription placement",
              "azurerm_management_group_policy_assignment": "Policy assignment",
              "azurerm_resource_policy_exemption": "Policy exemption",
              "azurerm_resource_provider_registration": "Resource provider",
              "azurerm_security_center_subscription_pricing": "Defender plan",
              "azurerm_security_center_contact": "Defender contact",
              "azurerm_consumption_budget_subscription": "Budget",
              "azurerm_storage_account": "Storage account",
