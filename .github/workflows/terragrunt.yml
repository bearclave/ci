                  yield path
              elif isinstance(tree, dict):
                  for k, v in tree.items():
                      yield from leaves(v, path + (k,))
              elif isinstance(tree, list):
                  for i, v in enumerate(tree):
                      yield from leaves(v, path + (i,))


          def anything_flagged(tree, path) -> bool:
              """True when the path, anything above it or anything below it is marked.

              A sensitive map can mark single elements of a list or keys of an object,
              so a value is shown only when nothing inside it is sensitive either.
              """
              if flagged(tree, path):
                  return True
              return any(True for _ in leaves(at(tree, path) or {}))


          def scalars(values) -> bool:
              return isinstance(values, list) and all(not isinstance(v, (dict, list)) for v in values)


          def as_json(value):
              """A string that holds a JSON object or list, parsed; anything else as it is."""
              if isinstance(value, str) and value[:1] in "{[":
                  try:
                      return json.loads(value)
                  except ValueError:
                      pass
              return value


          def diff(before, after, path=()):
              """Paths whose value differs, down to the leaves.

              A missing object counts as an empty one, so a tag that is added is a path
              of its own; lists of scalars and lists that change length stay whole.
              """
              before, after = as_json(before), as_json(after)
              if isinstance(before, dict) or isinstance(after, dict):
                  if isinstance(before, (dict, type(None))) and isinstance(after, (dict, type(None))):
                      b, a = before or {}, after or {}
                      for key in sorted(set(b) | set(a), key=str):
                          yield from diff(b.get(key), a.get(key), path + (key,))
                      return
              if (isinstance(before, list) and isinstance(after, list) and not scalars(before)
                      and not scalars(after) and len(before) == len(after)):
                  for i, (b, a) in enumerate(zip(before, after)):
                      yield from diff(b, a, path + (i,))
              elif before != after and not (before in (None, [], "") and after in (None, [], "")):
                  yield path


          def label(path, rtype: str = "") -> str:
              """How a person says which setting it is: tag `owner`, setting `a.b`."""
              steps = list(path)
              while steps and steps[0] in WRAPPERS and rtype.startswith(("azapi_", "msgraph_")):
                  steps.pop(0)
              if len(steps) == 2 and steps[0] == "tags":
                  return f"tag {code(steps[1])}"
              text = ""
              for step in steps:
                  if isinstance(step, int):
                      text += f"[{step}]" if step else ""
                  else:
                      text += ("." if text else "") + str(step)
              return f"setting {code(text or '(whole resource)')}"


          def summary(value) -> str:
              """A block of a list (a log category, a rule) told by its first scalars."""
              if isinstance(value, dict):
                  parts = [f"{k}={v}" for k, v in value.items()
                           if isinstance(v, (str, int, float, bool)) and v not in ("", None)]
                  return ", ".join(parts[:3]) or json.dumps(value, ensure_ascii=False)
              return str(value)


          def attribute_rows(change: dict, rtype: str = "") -> list:
              """(what, from, to) for every change of an update that matters."""
              before, after = change.get("before") or {}, change.get("after") or {}
              bs, as_ = change.get("before_sensitive") or {}, change.get("after_sensitive") or {}
              unknown = change.get("after_unknown") or {}
              out = []
              for path in diff(before, after):
                  if any(isinstance(s, str) and NOISE.match(s) for s in path):
                      continue
                  if flagged(unknown, path):
                      continue
                  what = label(path, rtype)
                  if anything_flagged(bs, path) or anything_flagged(as_, path):
                      out.append((what, "(sensitive)", "(sensitive)"))
                      continue
                  b, a = as_json(at(before, path)), as_json(at(after, path))
                  if isinstance(b, list) or isinstance(a, list):
                      b, a = b or [], a or []
                      added = [x for x in a if x not in b]
                      removed = [x for x in b if x not in a]
                      if not added and not removed:
                          out.append((f"{what}: order", NONE, NONE))
                          continue
                      for verb, items in (("added", added), ("removed", removed)):
                          shown = items[:MAX_LIST]
                          for x in shown:
                              text = x if not isinstance(x, (dict, list)) else summary(x)
                              out.append((f"{what}: {verb} {fmt(text)}", NONE, NONE))
                          if len(items) > MAX_LIST:
                              out.append((f"{what}: {len(items) - MAX_LIST} more {verb}", NONE, NONE))
                      continue
                  if isinstance(b, str) and isinstance(a, str):
                      b, a = crop(b, a)
                  out.append((what, fmt(b), fmt(a)))
              return out


          def diagnostic(values) -> str:
              """Logs and metrics of a diagnostic setting, and where they go."""
              if not isinstance(values, dict):
                  return ""
              body = values.get("body") if isinstance(values.get("body"), dict) else {}
              values = {**values, **(body.get("properties") or {})}
              logs, metrics = [], []
              for key in ("enabled_log", "log", "logs"):
                  for item in values.get(key) or []:
                      if isinstance(item, dict) and item.get("enabled", True):
                          name = item.get("category") or item.get("categoryGroup") or item.get("category_group")
                          if name:
                              logs.append(name)
              for key in ("enabled_metric", "metric", "metrics"):
                  for item in values.get(key) or []:
                      if isinstance(item, dict) and item.get("enabled", True) and item.get("category"):
                          metrics.append(item["category"])
              target = (values.get("log_analytics_workspace_id") or values.get("workspaceId")
                        or values.get("storage_account_id") or values.get("storageAccountId")
                        or values.get("eventhub_name"))
              parts = []
              if logs:
                  parts.append("logs " + ", ".join(code(x) for x in logs[:MAX_LIST])
                               + (f" and {len(logs) - MAX_LIST} more" if len(logs) > MAX_LIST else ""))
              if metrics:
                  parts.append("metrics " + ", ".join(code(x) for x in metrics[:MAX_LIST]))
              text = "; ".join(parts) or "nothing"
              if target:
                  where = "workspace" if "workspace" in str(target).lower() or values.get(
                      "log_analytics_workspace_id") else "destination"
                  text += f" → {where} {code(short_id(target))}"
              return text


          def verb_of(rc: dict):
              change = rc.get("change") or {}
              actions = tuple(change.get("actions") or [])
              if actions == ("forget",):
                  return "forget"
              verb = {("create",): "create", ("update",): "update", ("delete",): "destroy",
                      ("delete", "create"): "replace", ("create", "delete"): "replace",
                      ("read",): "read"}.get(actions)
              if verb is None:
                  if change.get("importing"):
                      return "import"
                  if rc.get("previous_address") and rc["previous_address"] != rc["address"]:
                      return "move"
              return verb


          def entry(rc: dict, unit: str):
              """What the comment says about one resource change, or None to leave it out."""
              if rc.get("mode") == "data":
                  return None
              verb = verb_of(rc)
              if verb in (None, "read"):
                  return None
              change = rc.get("change") or {}
              rtype = rc.get("type", "")
              values = change.get("after") or change.get("before")
              imported = bool(change.get("importing"))
              moved = rc.get("previous_address") and rc["previous_address"] != rc["address"]
              item = {"unit": unit, "address": rc["address"], "action": verb, "icon": ICONS[verb],
                      "kind": kind(rtype, values), "name": name_of(rc) or address_parts(rc["address"])[1],
                      "rows": [], "why": "", "imported": imported}
              is_diag = item["kind"].endswith("Diagnostic settings")
              if verb == "create":
                  text = "created"
                  if is_diag:
                      text = "diagnostic settings added: " + diagnostic(change.get("after"))
                  item["rows"] = [(text, NONE, NONE)]
              elif verb in ("update", "import", "move"):
                  rows = attribute_rows(change, rtype)
                  if is_diag and rows and verb == "update":
                      rows = [(f"diagnostic settings: {r[0]}", r[1], r[2]) for r in rows]
                  if verb == "import":
                      rows = [("imported", NONE, NONE)] + rows
                  if verb == "move":
                      rows = [(f"moved from {code(rc['previous_address'])}", NONE, NONE)] + rows
                  if verb == "update" and not rows:
                      rows = [("updated; the new values are known only after apply", NONE, NONE)]
                  item["rows"] = rows
              elif verb == "forget":
                  item["rows"] = [("removed from Terraform, left in place", NONE, NONE)]
              elif verb == "destroy":
                  item["why"] = REASONS.get(rc.get("action_reason", ""), "")
                  item["rows"] = [("destroyed", NONE, NONE)]
              elif verb == "replace":
                  paths = [tuple(p) for p in change.get("replace_paths") or []]
                  forced = [r for r in attribute_rows({**change, "after_unknown": {}}, rtype)
                            if any(r[0].startswith(label(p, rtype)) for p in paths)]
                  if forced:
                      item["why"] = "; ".join(
                          f"{r[0]} forces it" + (f": {r[1]} → {r[2]}" if r[1] != NONE or r[2] != NONE else "")
                          for r in forced)
                  elif paths:
                      item["why"] = ", ".join(label(p, rtype) for p in paths) + " forces it"
                  else:
                      item["why"] = REASONS.get(rc.get("action_reason", ""), "")
                  item["rows"] = [("replaced", NONE, NONE)]
              if moved and verb != "move":
                  item["rows"].append((f"moved from {code(rc['previous_address'])}", NONE, NONE))
              if imported and verb not in ("import",):
                  item["rows"].append(("imported", NONE, NONE))
              # An import that changes nothing is counted, not listed.
              item["noop_import"] = verb == "import" and len(item["rows"]) == 1
              return item


          def natural(text: str) -> list:
              """A sort key that puts x[2] before x[10]."""
              return [(0, int(p), "") if p.isdigit() else (1, 0, p) for p in re.split(r"(\d+)", text)]


          def entries(plan: dict, unit: str) -> list:
              out = [e for rc in plan.get("resource_changes") or [] if (e := entry(rc, unit))]
              out.sort(key=lambda e: (ORDER.get(e["action"], 9), natural(e["address"])))
              return out


          TEXT_VERBS = {
              "will be created": "create",
              "will be updated in-place": "update",
              "will be destroyed": "destroy",
              "must be replaced": "replace",
              "is tainted, so must be replaced": "replace",
              "will be replaced, as requested": "replace",
              "will be imported": "import",
          }


          def text_entry(address: str, what: str, unit: str, imported: bool = False):
              """The same entry from the text of the plan alone, for a unit without JSON."""
              if what.startswith("has moved to "):
                  verb, prev, address = "move", address, what[len("has moved to "):]
              elif what.startswith("will no longer be managed"):
                  verb, prev = "forget", None
              else:
                  verb, prev = TEXT_VERBS.get(what), None
              if verb is None:
                  return None
              rtype, name, index = address_parts(address)
              rows = {"create": "created", "update": "updated, see the details", "destroy": "destroyed",
                      "replace": "replaced", "import": "imported",
                      "forget": "removed from Terraform, left in place"}
              text = f"moved from {code(prev)}" if verb == "move" else rows[verb]
              item = {"unit": unit, "address": address, "action": verb, "icon": ICONS[verb],
                      "kind": kind(rtype) if rtype else "Resource", "name": index or name,
                      "rows": [(text, NONE, NONE)], "imported": imported,
                      "why": "tainted" if "tainted" in what else "", "noop_import": verb == "import"}
              if imported and verb != "import":
                  item["rows"].append(("imported", NONE, NONE))
              return item


          def load(path) -> dict:
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)
          __CI_EOF__
          cat >"$d/portal-rules.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Analytic rules in the workspace that the code does not manage.

          Usage: portal-rules.py <plan-json-dir> <unit>

          Reads the plan of the analytic rules unit (<plan-json-dir>/<unit>/tfplan.json)
          for the rules the code manages and the workspace they live in, lists the
          rules the workspace really has (az rest, with the session the job already
          signed in with) and reports every one the code does not know: a rule created
          in the portal, or one left behind. Each becomes a warning and a row in the
          job summary; the exit code stays 0, this is a report.

          Terraform's drift plan cannot see these: it only looks at what it manages.
          """
          import json
          import os
          import subprocess
          import sys

          API = "2024-09-01"


          def managed(plan: dict):
              """(workspace id, names of the alertRules) from the planned values."""
              names, workspace = set(), None
              stack = [(plan.get("planned_values") or {}).get("root_module") or {}]
              while stack:
                  module = stack.pop()
                  stack += module.get("child_modules") or []
                  for r in module.get("resources") or []:
                      values = r.get("values") or {}
                      if r.get("type") == "azapi_resource" and \
                              str(values.get("type", "")).startswith("Microsoft.SecurityInsights/alertRules@"):
                          names.add(values.get("name"))
                          workspace = workspace or values.get("parent_id")
              return workspace, names


          # Rules Sentinel creates and keeps by itself; they do not belong in the code.
          BUILT_IN_KINDS = {"Fusion"}


          def unmanaged(rules: list, names: set) -> list:
              """(name, kind, display name, enabled) of the rules not in names."""
              out = []
              for r in rules:
                  if r.get("name") in names or r.get("kind") in BUILT_IN_KINDS:
                      continue
                  p = r.get("properties") or {}
                  out.append((r.get("name"), r.get("kind", ""), p.get("displayName", ""), p.get("enabled")))
              return sorted(out, key=lambda x: (x[2] or "", x[0]))


          def workspace_rules(workspace: str) -> list:
              url = f"https://management.azure.com{workspace}/providers/Microsoft.SecurityInsights/alertRules?api-version={API}"
              rules = []
              while url:
                  page = json.loads(subprocess.run(["az", "rest", "--method", "get", "--url", url],
                                                   capture_output=True, text=True, check=True).stdout)
                  rules += page.get("value") or []
                  url = page.get("nextLink")
              return rules


          def main(plan_dir: str, unit: str) -> int:
              path = os.path.join(plan_dir, unit, "tfplan.json")
              if not os.path.isfile(path):
                  print(f"::warning::no plan of {unit}, portal rules not checked")
                  return 0
              with open(path, encoding="utf-8") as fh:
                  workspace, names = managed(json.load(fh))
              if not workspace:
                  print(f"::warning::{unit} manages no analytic rule, portal rules not checked")
                  return 0
              found = unmanaged(workspace_rules(workspace), names)
              lines = ["## Analytic rules outside the code", ""]
              if not found:
                  lines.append(f"None: the workspace has exactly the {len(names)} rules the code manages.")
              else:
                  lines += [f"{len(found)} rules in the workspace that the code does not manage. "
                            "Put each into the code, or delete it in the portal.", "",
                            "| Display name | Kind | Enabled | Name |", "|---|---|---|---|"]
                  for name, kind, display, enabled in found:
                      lines.append(f"| {display} | {kind} | {enabled} | `{name}` |")
                      print(f"::warning title=portal rule::{display or name} ({kind}) is not in the code")
              text = "\n".join(lines) + "\n"
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
          __CI_EOF__
          cat >"$d/trivy-plans.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # trivy over the plans in JSON, one report per unit.
          #
          # Usage: trivy-plans.sh <plan-json-dir> <report-dir>
          #
          # <plan-json-dir> holds <unit>/tfplan.json (terragrunt's --json-out-dir). Each
          # report lands in <report-dir> as <unit with / as _>.json, with the unit in
          # its "Unit" field. Exit code 3 when there is a HIGH or CRITICAL finding that
          # .github/trivyignore.yaml does not accept, 0 when there is none, anything else when
          # trivy itself failed.
          #
          # trivy turns a plan into a main.tf of its own, so every finding has that file
          # as its target and the `paths` of an ignore entry cannot tell the units
          # apart. In .github/trivyignore.yaml `paths` therefore lists units (<unit>/tfplan.json)
          # and is applied here: each unit gets the entries that name it or name no unit
          # at all.
          #
          # The checks are the ones built into the pinned trivy (--skip-check-update),
          # so a run is repeatable; new checks arrive with a version bump.
          set -euo pipefail

          PLANS=${1:?missing plan directory}
          REPORTS=${2:?missing report directory}
          IGNORE="$PWD/.github/trivyignore.yaml"
          [ -f "$IGNORE" ] || IGNORE="$PWD/.trivyignore.yaml"
          UNIT_IGNORE=$(mktemp --suffix=.yaml)

          mkdir -p "$REPORTS"
          REPORTS=$(cd "$REPORTS" && pwd)
          if [ ! -d "$PLANS" ]; then
            echo "No plan in JSON."
            exit 0
          fi

          found=0
          while IFS= read -r plan; do
            report="$REPORTS/$(tr / _ <<<"${plan%/tfplan.json}").json"
            yq -o=json '.' "$IGNORE" |
              jq --arg plan "$plan" '{misconfigurations: [(.misconfigurations // [])[]
                | select((.paths // []) | length == 0 or any(.[]; . == $plan)) | del(.paths)]}' |
              yq -P '.' >"$UNIT_IGNORE"
            rc=0
            (cd "$PLANS" && trivy config --quiet --skip-check-update \
              --severity HIGH,CRITICAL --exit-code 3 --ignorefile "$UNIT_IGNORE" \
              --format json --output "$report" "$plan") || rc=$?
            case "$rc" in
              0) ;;
              3) found=1 ;;
              *) echo "trivy failed on $plan" >&2; exit "$rc" ;;
            esac
            # The unit goes into the report itself, so that the summary does not have
            # to guess it from trivy's target; the log shows what failed where.
            unit="${plan%/tfplan.json}"
            jq --arg unit "$unit" '.Unit = $unit' "$report" >"$report.tmp" && mv "$report.tmp" "$report"
            jq -r --arg unit "$unit" '.Results[]? | .Target as $t | .Misconfigurations[]?
              | select(.Status == "FAIL")
              | "\($unit): \(.Severity) \(.AVDID // .ID) \(.Title) [target \($t)]"' "$report"
          done < <(cd "$PLANS" && find . -name tfplan.json | sed 's|^\./||' | sort)

          [ "$found" -eq 0 ] || exit 3
          __CI_EOF__
          chmod +x "$d"/*

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      # Without a shared cache each of the fifty units downloads its own copies
      # of the providers and the runner runs out of both disk and time.
      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('root.hcl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt and trivy
        run: install-tools.sh terragrunt trivy

      # HCL formatting and validation take about ten seconds, so they share the
      # job with the plan rather than paying for a checkout of their own.
      - name: HCL formatting
        id: fmt
        run: terragrunt hcl fmt --check --diff

      - name: HCL validation
        id: validate
        run: terragrunt hcl validate

      # A pull request is compared with its base branch. On main the base is
      # the head of the last successful run - its apply went through or had
      # nothing to do - so a change a failed or held-back apply left out is
      # still selected now. Runs on main never overlap (see concurrency).
      - name: Base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            # The caller's workflow file, e.g. ci.yml.
            wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty') || base=""
            # Without it the units of an earlier failed apply could be left
            # out, so the whole tree runs instead.
            if [ -z "$base" ]; then
              echo "::warning::No successful run on main found; the whole tree runs."
            fi
          fi
          echo "sha=$base" >>"$GITHUB_OUTPUT"
          echo "Compared with \`$base\`." >>"$GITHUB_STEP_SUMMARY"

      # A principal the same change creates cannot be referenced by display
      # name: `dependencies` orders the run but a plan creates nothing, so the
      # lookup goes to Entra and finds nothing. Caught here rather than by a
      # failed plan half an hour into the queue.
      - name: Principal references
        if: inputs.principal-refs
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          check-principal-refs.py "$BASE"

      - name: Select the units
        id: units
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          selection=$(select-units.py "$BASE")
          if [ "$SCOPE" = "all" ]; then
            selection=$(jq -c '.all = true | .units = []' <<<"$selection")
          fi
          echo "selection=$selection" >>"$GITHUB_OUTPUT"
          jq -r '
            (if .all then "Selected: the whole tree."
             elif (.units | length) > 0 then "Selected: " + (.units | join(", ")) + "."
             else "Selected: no unit to plan." end),
            (if (.deleted | length) > 0
             then "Deleted, planned as a destroy: " + (.deleted | join(", ")) + "."
             else empty end)
          ' <<<"$selection" >>"$GITHUB_STEP_SUMMARY"
          # The state key is the unit's path: a moved directory would be a new
          # unit that creates everything again, next to the old resources.
          if [ "$(jq '.renamed | length' <<<"$selection")" -gt 0 ]; then
            jq -r '.renamed[] | "::error::\(.[0]) moved to \(.[1]). Moving a unit changes its state key. Delete the unit in one pull request (it gets destroyed) and add it under the new path in the next, or move its state by hand first."' <<<"$selection"
            exit 1
          fi

      # A job killed while terraform holds a state lock leaves the lock behind
      # for good. Locks a runner took more than 70 minutes ago are released
      # here: no job runs that long (apply has the longest timeout, 60), so
      # the job that took them is gone. Workstation locks stay.
      - name: Release stale state locks
        continue-on-error: true
        run: |
          set -euo pipefail
          value() { sed -n "s/^ *$1 *= *\"\(.*\)\"/\1/p" account.hcl; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          release-stale-locks.py \
            "$(value storage_account_name)" "$(value container_name)" 70

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      # The units that exist are planned from HEAD. A deleted unit exists only
      # in the base commit, so it is planned as a destroy from a worktree of
      # that commit. Both land in the same plan.txt, under their unit paths,
      # and as JSON in $PLAN_JSON for the comment and for trivy. The JSON holds
      # sensitive values in clear text: it stays in the runner's temp and is
      # never uploaded.
      - name: Plan
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ env.MODULES_DIR }}
          SELECTION: ${{ steps.units.outputs.selection }}
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          set -euo pipefail
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          : >plan.txt
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SELECTION")
          rc=0
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ] \
            && [ "${#deleted[@]}" -eq 0 ]; then
            echo "Nothing to plan." >nothing-selected
          fi
          if [ "$(jq -r .all <<<"$SELECTION")" = "true" ] || [ "${#units[@]}" -gt 0 ]; then
            args=()
            for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
            set +e
            terragrunt run --all plan "${args[@]}" --json-out-dir "$PLAN_JSON" \
              --non-interactive --no-color 2>&1 | tee -a plan.txt
            rc=${PIPESTATUS[0]}
            set -e
          fi
          if [ "${#deleted[@]}" -gt 0 ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
            args=()
            for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
            set +e
            (cd "$RUNNER_TEMP/base" &&
              terragrunt run --all "${args[@]}" --json-out-dir "$PLAN_JSON" \
                --non-interactive --no-color -- plan -destroy) 2>&1 |
              tee -a plan.txt
            destroy_rc=${PIPESTATUS[0]}
            set -e
            [ "$destroy_rc" -eq 0 ] || rc=$destroy_rc
          fi
          exit "$rc"

      # trivy over the plans, which carry the value of every setting; over the
      # bare modules it cannot tell what a variable will be. The verdict waits
      # until the findings are in the comment.
      - name: Security findings in the plan
        id: trivy
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          rc=0
          trivy-plans.sh "$PLAN_JSON" trivy || rc=$?
          case "$rc" in
            0) echo "found=false" >>"$GITHUB_OUTPUT" ;;
            3) echo "found=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # The plan comment (plan-summary.py). Without a plan it is still
      # rewritten, or the pull request keeps showing the plan of an earlier
      # commit. changes.json, the rows of its tables and nothing sensitive,
      # goes with the plan artifact for the apply comment.
      - name: Summary
        id: summary
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKS: formatting=${{ steps.fmt.outcome }},validation=${{ steps.validate.outcome }}
        run: |
          set -euo pipefail
          args=()
          if [ -e nothing-selected ]; then
            args+=(--nothing-selected)
          elif [ ! -s plan.txt ]; then
            args+=(--no-plan)
          fi
          plan-summary.py plan.txt --github-output --json-dir="$PLAN_JSON" --trivy=trivy \
            --checks="$CHECKS" --commit="$COMMIT" --changes-out=changes.json "${args[@]}" \
            | tee plan.md
          cat plan.md >>"$GITHUB_STEP_SUMMARY"

      - name: Plan fixtures (temporary)
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          cat >"$RUNNER_TEMP/sanitise-plan.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns terraform plans in JSON into test fixtures that hold nothing secret.

          Usage: tools/sanitise-plan.py <plan-json-dir> <out-dir>

          <plan-json-dir> holds <unit>/tfplan.json (terragrunt's --json-out-dir). Each
          plan is written to <out-dir>/<unit>/tfplan.json with only what the comments
          read: resource_changes and the actions of output_changes. On the way:

          - every value terraform marks sensitive becomes "(redacted)";
          - every GUID becomes 00000000-0000-0000-0000-<n>, the same GUID the same n;
          - every e-mail address becomes user<n>@example.com;
          - a resource without a change keeps its address and actions but no values;
          - prior_state, configuration, variables and planned_values are left out.
          """
          import json
          import pathlib
          import re
          import sys

          RE_GUID = re.compile(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", re.I)
          RE_MAIL = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          KEEP = ("address", "previous_address", "module_address", "mode", "type", "name", "index",
                  "provider_name", "action_reason")


          class Masks:
              def __init__(self):
                  self.guids, self.mails = {}, {}

              def text(self, value: str) -> str:
                  value = RE_GUID.sub(lambda m: self.guid(m.group(0)), value)
                  return RE_MAIL.sub(lambda m: self.mail(m.group(0)), value)

              def guid(self, g: str) -> str:
                  n = self.guids.setdefault(g.lower(), len(self.guids) + 1)
                  return f"00000000-0000-0000-0000-{n:012d}"

              def mail(self, m: str) -> str:
                  n = self.mails.setdefault(m.lower(), len(self.mails) + 1)
                  return f"user{n}@example.com"

              def value(self, value, sensitive=None):
                  if sensitive is True:
                      return "(redacted)"
                  if isinstance(value, dict):
                      s = sensitive if isinstance(sensitive, dict) else {}
                      return {self.text(k): self.value(v, s.get(k)) for k, v in value.items()}
                  if isinstance(value, list):
                      s = sensitive if isinstance(sensitive, list) else []
                      return [self.value(v, s[i] if i < len(s) else None) for i, v in enumerate(value)]
                  if isinstance(value, str):
                      return self.text(value)
                  return value


          def sanitise(plan: dict, masks: Masks) -> dict:
              out = {"format_version": plan.get("format_version"),
                     "terraform_version": plan.get("terraform_version"),
                     "resource_changes": [], "output_changes": {}}
              for rc in plan.get("resource_changes") or []:
                  change = rc.get("change") or {}
                  actions = change.get("actions") or []
                  item = {k: masks.value(rc[k]) for k in KEEP if k in rc}
                  new = {"actions": actions}
                  noop = actions == ["no-op"] and not change.get("importing") \
                      and rc.get("previous_address") in (None, rc.get("address"))
                  if not noop:
                      new["before"] = masks.value(change.get("before"), change.get("before_sensitive"))
                      new["after"] = masks.value(change.get("after"), change.get("after_sensitive"))
                      for key in ("after_unknown", "before_sensitive", "after_sensitive", "replace_paths"):
                          if key in change:
                              new[key] = masks.value(change[key])
                  if change.get("importing"):
                      new["importing"] = {"id": masks.text(str(change["importing"].get("id", "")))}
                  item["change"] = new
                  out["resource_changes"].append(item)
              for name, oc in (plan.get("output_changes") or {}).items():
                  out["output_changes"][name] = {"actions": oc.get("actions")}
              return out


          def main(src: str, dst: str) -> int:
              masks = Masks()
              for path in sorted(pathlib.Path(src).rglob("tfplan.json")):
                  unit = path.parent.relative_to(src)
                  target = pathlib.Path(dst, unit, "tfplan.json")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  plan = json.loads(path.read_text(encoding="utf-8"))
                  target.write_text(json.dumps(sanitise(plan, masks), indent=1, ensure_ascii=False) + "\n",
                                    encoding="utf-8")
                  print(target)
              return 0


          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  sys.exit(__doc__)
              sys.exit(main(sys.argv[1], sys.argv[2]))
          __CI_EOF__
          python3 "$RUNNER_TEMP/sanitise-plan.py" "$PLAN_JSON" "$RUNNER_TEMP/fixtures" | tail -3

      - name: Upload the fixtures (temporary)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures-${{ github.run_id }}
          path: ${{ runner.temp }}/fixtures
          retention-days: 1

      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ github.run_id }}
          path: |
            plan.txt
            plan.md
            changes.json
          retention-days: 30

      - name: Comment into the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s plan.md ] || exit 0
          pr-comment.sh "$PR_NUMBER" plan.md terragrunt-plan

      - name: No unaccepted security finding
        if: always() && steps.trivy.outputs.found == 'true'
        run: |
          echo "::error::trivy found a HIGH or CRITICAL setting in the plan (Security findings in the summary). Fix it, or accept it in .github/trivyignore.yaml with the reason."
          exit 1

  # Apply runs from main only. The environment allows deployments from main
  # and nothing else, and it is also what makes the OIDC token carry the
  # environment subject the apply identity is federated on.
  #
  # A plan that destroys or replaces anything is not applied by a push: GitHub
  # Team has no approval on an environment of a private repository, so the
  # manual run with allow-destroy is that approval. The selection it plans
  # still holds those units, since this run does not end as a success.
  apply:
    needs: plan
    if: >-
      github.event_name != 'pull_request'
      && needs.plan.outputs.has_changes == 'true'
      && (needs.plan.outputs.has_destroys != 'true' || inputs.allow-destroy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ inputs.client-id-apply }}
      GITHUB_APP_VAULT: ${{ inputs.github-app-vault-apply }}
    outputs:
      started: ${{ steps.started.outputs.at }}
      ended: ${{ steps.ended.outputs.at }}
    steps:
      - name: Start
        id: started
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bearclave/iac-modules
          path: iac-modules
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          for tool in "$@"; do
            "install_$tool"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('root.hcl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt
        run: install-tools.sh terragrunt

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      # The selection is the one the plan job made, not worked out again.
      # Deleted units go first: what replaces them under a new path may need
      # their names.
      - name: Destroy deleted units
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ env.MODULES_DIR }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          set -euo pipefail
          mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SELECTION")
          if [ "${#deleted[@]}" -eq 0 ]; then
            echo "No deleted unit."
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
          args=()
          for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
          cd "$RUNNER_TEMP/base"
          terragrunt run --all destroy "${args[@]}" --non-interactive --no-color 2>&1 |
            tee -a "$GITHUB_WORKSPACE/apply.txt"

      - name: Apply
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ env.MODULES_DIR }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          set -euo pipefail
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
            echo "No unit to apply."
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          args=()
          for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
          terragrunt run --all apply "${args[@]}" --non-interactive --no-color 2>&1 |
            tee -a apply.txt

      # The output, for the apply comment (report). Terraform masks what is
      # sensitive, as in plan.txt.
      - name: End
        id: ended
        if: always()
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"

      - name: Upload the apply output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apply-${{ github.run_id }}
          path: apply.txt
          if-no-files-found: ignore
          retention-days: 30

  # The apply comment (apply-summary.py) on the pull request the applied
  # commit came from: what the plan of this run meant to change, in the past
  # tense, and per resource whether it went through. A job of its own, so that
  # the apply identity needs no access to pull requests. Its Verification
  # section holds what the post-apply checks wrote into an artifact
  # verification-<run id>[-<name>] (README, Apply comment); a check job that
  # writes one goes into `needs` here.
  report:
    needs: [plan, apply]
    if: >-
      always() && github.event_name != 'pull_request'
      && contains(fromJSON('["success", "failure", "cancelled"]'), needs.apply.result)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
