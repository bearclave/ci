      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          for tool in "$@"; do
            "install_$tool"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Terragrunt scripts
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/select-units.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Works out from git which units a change touches.

          Usage: select-units.py <base> [--no-expand]

          Compares <base> with HEAD and prints one JSON object:

            all      true when the whole tree has to run
            units    the units to run when not the whole tree, with everything they
                     depend on (see expand-dependencies.py); --no-expand leaves that out
            deleted  units whose directory is gone: they only exist in <base> and are
                     planned, and applied, as a destroy from there
            renamed  [old, new] pairs of a unit directory that moved. The state key is
                     the unit's path, so a move is a new unit plus a deleted one; the
                     workflow refuses it
            base     the commit compared against, or null when there was none to use

          What decides the selection:

          - A change to root.hcl, account.hcl or anything under _common/ touches every
            unit: the whole tree runs.
          - A context file (mg.hcl, subscription.hcl, region.hcl, rg.hcl) applies to
            the unit in its own directory and every unit below it.
          - Any other file belongs to the nearest unit above it. A file of a deleted
            unit belongs to nobody - that unit runs as a destroy.
          - A file outside every unit (the workflows, the scripts) changes how the tree
            is planned, so when nothing else is touched the whole tree runs.
          - No usable <base> (unknown, not an ancestor of HEAD) or no difference at all
            means the whole tree.

          What stays out are the units that DEPEND on a changed one: if the groups unit
          changes and memberships stands on its outputs, this selection will not run
          memberships. That is what the weekly drift job over the whole tree is for.
          """
          import json
          import os
          import pathlib
          import subprocess
          import sys

          CONTEXT = {"mg.hcl", "subscription.hcl", "region.hcl", "rg.hcl"}
          UNIT = "terragrunt.hcl"


          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=check)


          def unit_dirs(ref: str) -> set:
              """Every directory that holds a terragrunt.hcl at the given commit."""
              files = git("ls-tree", "-r", "--name-only", ref).stdout.splitlines()
              return {f[: -len(UNIT) - 1] for f in files if f.endswith("/" + UNIT)}


          def is_global(path: str) -> bool:
              return path in ("root.hcl", "account.hcl") or path.startswith("_common/")


          def owner(path: str, units: set) -> str:
              """The nearest unit directory above the path, or None."""
              d = os.path.dirname(path)
              while d:
                  if d in units:
                      return d
                  d = os.path.dirname(d)
              return None


          def expand(units: list) -> list:
              """The units plus everything they depend on, via expand-dependencies.py."""
              script = pathlib.Path(__file__).with_name("expand-dependencies.py")
              out = subprocess.run([sys.executable, str(script)], input="\n".join(units),
                                   capture_output=True, text=True, check=True).stdout
              return sorted({line.strip() for line in out.splitlines() if line.strip()})


          def select(base: str, do_expand: bool = True) -> dict:
              result = {"all": False, "units": [], "deleted": [], "renamed": [], "base": None}

              usable = (base and git("cat-file", "-e", f"{base}^{{commit}}", check=False).returncode == 0
                        and git("merge-base", "--is-ancestor", base, "HEAD", check=False).returncode == 0)
              if not usable:
                  result["all"] = True
                  return result
              result["base"] = git("rev-parse", f"{base}^{{commit}}").stdout.strip()

              head_units = unit_dirs("HEAD")
              base_units = unit_dirs(base)
              gone = base_units - head_units

              changes = []
              for line in git("diff", "--name-status", "-M", base, "HEAD").stdout.splitlines():
                  status, *paths = line.split("\t")
                  changes.append((status[0], paths))
              if not changes:
                  result["all"] = True
                  return result

              selected, outside = set(), False
              for status, paths in changes:
                  if status == "R":
                      old, new = paths
                      if old.endswith("/" + UNIT) and new.endswith("/" + UNIT):
                          old_dir, new_dir = os.path.dirname(old), os.path.dirname(new)
                          if old_dir in gone and new_dir not in base_units:
                              result["renamed"].append([old_dir, new_dir])
                              continue
                  for path in paths:
                      if is_global(path):
                          result["all"] = True
                      if os.path.basename(path) in CONTEXT:
                          here = os.path.dirname(path)
                          selected |= {u for u in head_units if u == here or u.startswith(here + "/")}
                          continue
                      if path.endswith("/" + UNIT) and os.path.dirname(path) in gone:
                          continue
                      unit = owner(path, head_units | gone)
                      if unit in head_units:
                          selected.add(unit)
                      elif unit is None:
                          outside = True

              renamed_old = {old for old, _ in result["renamed"]}
              result["deleted"] = sorted(gone - renamed_old)
              if result["all"]:
                  return result
              if not selected:
                  # Only the workflows, the scripts or the docs changed, or only units
                  # were deleted. The first changes how everything is planned.
                  result["all"] = outside
                  return result
              result["units"] = expand(sorted(selected)) if do_expand else sorted(selected)
              return result


          if __name__ == "__main__":
              args = [a for a in sys.argv[1:] if not a.startswith("--")]
              print(json.dumps(select(args[0] if args else "", "--no-expand" not in sys.argv)))
          __CI_EOF__
          cat >"$d/expand-dependencies.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Expands a set of units with everything they depend on, transitively.

          `--queue-include-dir` runs exactly the directories it is handed; terragrunt
          does not pull a unit's dependencies into the queue by itself. A change that
          touches only a child therefore runs against a parent that may not exist yet,
          which is how a key vault came to be created before its resource group.

          Reads unit paths on stdin, writes the closure on stdout.
          """
          import json
          import subprocess
          import sys

          selected = {line.strip() for line in sys.stdin if line.strip()}
          if not selected:
              sys.exit(0)

          found = json.loads(subprocess.run(
              ["terragrunt", "find", "--dependencies", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout)
          units = found if isinstance(found, list) else found.get("units", [])
          dependencies = {
              u["path"]: u.get("dependencies") or []
              for u in units if u.get("type") == "unit"
          }

          closure, queue = set(), list(selected)
          while queue:
              unit = queue.pop()
              if unit in closure:
                  continue
              closure.add(unit)
              queue.extend(dependencies.get(unit, []))

          for unit in sorted(closure):
              print(unit)
          __CI_EOF__
          cat >"$d/check-principal-refs.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Fails when a principal this change creates is referenced by display name.

          `dependencies` only orders the run. A plan creates nothing, so a lookup by
          display name goes to Entra and finds nothing for a group or service principal
          that the same change is still only planning. The reference has to go through
          a dependency output as "id:${dependency...}" instead.
          """
          import pathlib
          import re
          import subprocess
          import sys

          BASE = sys.argv[1] if len(sys.argv) > 1 else "origin/main"

          EMAIL = re.compile(r'"([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)"')

          # Guests are users too; a new one referenced by address fails the same way.
          SOURCES = [
              ("group", "tenant/groups/terragrunt.hcl", re.compile(r'"(sg-[A-Za-z0-9._-]+)"\s*=')),
              ("sp", "tenant/applications/terragrunt.hcl", re.compile(r'"(sp-[A-Za-z0-9._-]+)"\s*=')),
              ("user", "tenant/users/terragrunt.hcl", EMAIL),
              ("user", "tenant/external-users/terragrunt.hcl", EMAIL),
          ]
          REFERENCE = re.compile(r'"(group|sp|user):([^"$]+)"')


          def added(path, pattern):
              """Names present now and absent at the merge base.

              The comparison is between two whole files rather than over the diff: a
              changed description touches the line a name sits on, which would otherwise
              read as a new name.
              """
              merge_base = subprocess.run(
                  ["git", "merge-base", BASE, "HEAD"],
                  capture_output=True, text=True, check=False,
              ).stdout.strip() or BASE
              before = subprocess.run(
                  ["git", "show", f"{merge_base}:{path}"],
                  capture_output=True, text=True, check=False,
              ).stdout
              now = pathlib.Path(path).read_text(encoding="utf-8")
              return set(pattern.findall(now)) - set(pattern.findall(before))


          references = {}
          for unit in pathlib.Path(".").rglob("terragrunt.hcl"):
              if ".terragrunt-cache" in unit.parts:
                  continue
              for kind, name in REFERENCE.findall(unit.read_text(encoding="utf-8")):
                  references.setdefault((kind, name), set()).add(str(unit))

          problems = []
          for kind, path, pattern in SOURCES:
              for name in added(path, pattern):
                  where = references.get((kind, name))
                  if where:
                      problems.append((f"{kind}:{name}", sorted(where)))

          if problems:
              print("Principals created by this change and referenced by name:\n", file=sys.stderr)
              for reference, units in problems:
                  print(f"  {reference}", file=sys.stderr)
                  for unit in units:
                      print(f"      {unit}", file=sys.stderr)
              print(
                  '\nA plan creates nothing, so the lookup fails before they exist.\n'
                  'Include the dependency and use "group-id:${dependency...}" for a group\n'
                  'or "id:${dependency...}" for a service principal - a bare GUID carries\n'
                  'no type, so the prefix has to.',
                  file=sys.stderr,
              )
              sys.exit(1)

          print("principal references OK")
          __CI_EOF__
          cat >"$d/release-stale-locks.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Releases state locks that a killed GitHub job left behind.

          Terraform locks a state by taking a lease on its blob, and that lease never
          expires. A job that is cancelled or runs out of time while terraform holds it
          leaves the lock behind, and every later plan and apply of that unit fails on
          "Error acquiring the state lock" until someone runs force-unlock.

          A lock is released only when a GitHub runner took it ("Who" is runner@...) and
          it is older than any job is allowed to run, so the job that took it is gone. A
          lock taken on a workstation, or by a job still running, stays.

          A lock whose ID is given on the command line is released whatever its age: for
          a lock known to be dead, such as one left by a run cancelled a moment ago.

          Usage: release-stale-locks.py <storage-account> <container> <minutes> [<lock-id>...]
          """
          import base64
          import datetime
          import json
          import subprocess
          import sys


          def az(*args: str) -> str:
              return subprocess.run(
                  ["az", *args, "--auth-mode", "login", "--only-show-errors"],
                  capture_output=True, text=True, check=True,
              ).stdout


          def main(account: str, container: str, minutes: int, dead: tuple = ()) -> int:
              where = ["--account-name", account, "--container-name", container]
              leased = json.loads(az(
                  "storage", "blob", "list", *where, "--num-results", "*",
                  "--query", "[?properties.lease.state=='leased'].name", "--output", "json",
              ))
              now = datetime.datetime.now(datetime.timezone.utc)
              for name in leased:
                  metadata = json.loads(az(
                      "storage", "blob", "metadata", "show", *where, "--name", name, "--output", "json",
                  )) or {}
                  raw = next((v for k, v in metadata.items() if k.lower() == "terraformlockid"), None)
                  try:
                      info = json.loads(base64.b64decode(raw))
                      # Go writes nanoseconds, which strptime does not take.
                      created = datetime.datetime.strptime(
                          info["Created"][:19], "%Y-%m-%dT%H:%M:%S",
                      ).replace(tzinfo=datetime.timezone.utc)
                  except (TypeError, ValueError, KeyError):
                      print(f"{name}: leased without terraform lock info "
                            f"(metadata keys: {', '.join(metadata) or 'none'}), left alone")
                      continue
                  age = int((now - created).total_seconds() // 60)
                  who = info.get("Who", "")
                  named = info.get("ID") in dead
                  if not named and (not who.startswith("runner@") or age < minutes):
                      print(f"{name}: locked by {who} {age} min ago, left alone")
                      continue
                  az("storage", "blob", "lease", "break", *where, "--blob-name", name)
                  print(f"{name}: released lock {info.get('ID')} ({info.get('Operation')}) "
                        f"taken by {who} {age} min ago" + (", named as dead" if named else ""))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1], sys.argv[2], int(sys.argv[3]), tuple(sys.argv[4:])))
          __CI_EOF__
          cat >"$d/plan-summary.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns raw terragrunt output into a markdown plan summary.

          The output of run --all is interleaved across units, every line prefixed with
          "[<unit>] terraform:". The lines are grouped back by unit and the prefix is
          dropped, so a pull request shows per unit what terraform itself printed: each
          resource with its action and, folded away, its attribute diff.

          A comment on GitHub holds at most 65 536 characters. When the plan does not fit
          into MAX, the attribute diffs are shortened, the largest unit first. The
          totals, the errors and the list of resources always stay whole; the full
          output is in the plan artifact.

          With --fail-on-change it returns a non-zero code when the plan proposes
          anything at all or when any unit ended in an error. That makes it usable as the
          gate of the weekly drift job, since terragrunt itself returns zero even when
          there are changes.

          With --github-output the same verdict is written to $GITHUB_OUTPUT as
          has_changes and has_errors, which is what decides whether apply runs at all,
          and has_destroys, true when anything is destroyed or replaced: such an apply
          does not run by itself after a merge, it waits for a manual run.

          An import, a move, a forget (a removed block with destroy = false) and a change
          of outputs alone count as a change too. None of them touches Azure and
          terraform leaves them out of its "Plan:" line or prints none at all, yet each
          reaches the state only through apply; dependent units read outputs from there.

          A unit terragrunt queued that printed neither a plan nor an error counts as an
          error: the run was cancelled, or terragrunt failed before terraform started.
          Without that, a cut-off run would read as a clean one.

          --artifact=<name> names the artifact the full output is uploaded to; it
          defaults to plan-$GITHUB_RUN_ID.

          --json-dir=<dir> points to the plans in JSON, one <dir>/<unit>/tfplan.json per
          unit (terragrunt's --json-out-dir). A unit that has one is listed as a table
          from plan_details.py - what each resource is, its name, what changes from what
          to what - instead of the bare resource addresses.

          --trivy=<dir> adds the findings of trivy over those plans (a directory of its
          JSON reports, one per unit) as a section of their own.
          """
          import json
          import os
          import pathlib
          import re
          import sys

          import plan_details

          RE_UNIT = re.compile(r"\[([^\]]+)\] terraform:")
          RE_PLAN = re.compile(
              r"Plan: (?:(\d+) to import, )?(\d+) to add, (\d+) to change, (\d+) to destroy")
          # The second form is what a destroy plan prints when the state is empty.
          RE_NOOP = re.compile(
              r"No changes\. (?:Your infrastructure matches the configuration"
              r"|No objects need to be destroyed)")
          RE_ERROR = re.compile(r"^\s*Error: (.+)$")
          RE_WARNING = re.compile(r"^\s*Warning: ")
          # The queue terragrunt prints before it starts, one unit per branch of a tree.
          RE_QUEUE = re.compile(r"The following units will be run")
          RE_BRANCH = re.compile(r"^[\s│]*[├╰└]── (\S+)\s*$")
          # The heading terraform puts above each resource in the plan. Headings sit at
          # the left edge; the comments inside a resource are indented deeper.
          RE_RESOURCE = re.compile(
              r"^ {0,2}# (.+?) (will be created|will be updated in-place|will be destroyed"
              r"|(?:is tainted, so )?must be replaced|will be replaced, as requested"
              r"|will be read during apply|will be imported"
              r"|will no longer be managed by Terraform.*|has moved to .+)$"
          )
          RE_IMPORTED = re.compile(r"^ {0,2}# \(imported from ")
          # Terraform indents in steps of four and puts the action symbol two columns
          # in, so a symbol anywhere else is part of a value.
          RE_SIGN = re.compile(r"^( +)([-+~]) ")

          ACTIONS = {
              "will be created": "create",
              "will be updated in-place": "update in-place",
              "will be destroyed": "destroy",
              "must be replaced": "replace",
              "is tainted, so must be replaced": "replace (tainted)",
              "will be replaced, as requested": "replace (as requested)",
              "will be read during apply": "read",
              "will be imported": "import",
          }

          MAX = 60_000


          def code(text: str) -> str:
              """An inline code span that survives backticks in the text."""
              tick = "``" if "`" in text else "`"
              pad = " " if tick == "``" else ""
              return f"{tick}{pad}{text}{pad}{tick}"


          def fenced(lines: list, lang: str = "") -> list:
              """A code block whose fence is longer than any run of backticks inside."""
              longest = max((len(r) for line in lines for r in re.findall(r"`+", line)), default=0)
              fence = "`" * max(3, longest + 1)
              return [fence + lang, *lines, fence]


          def action(what: str) -> str:
              if what.startswith("has moved to "):
                  return "move to " + code(what[len("has moved to "):])
              if what.startswith("will no longer be managed"):
                  return "forget"
              return ACTIONS[what]


          def highlight(line: str) -> str:
              """Moves the action symbol to the first column, where a diff block colours it.

              `~` becomes `!`, the marker of a changed line in a diff block. The rest of
              the line keeps its columns.
              """
              m = RE_SIGN.match(line)
              if not m or len(m.group(1)) % 4 != 2:
                  return line
              sign = "!" if m.group(2) == "~" else m.group(2)
              return sign + m.group(1) + line[m.end() - 1:]


          def parse(streams: dict) -> dict:
              """Splits the output of one unit into resources, outputs, errors and the plan line.

              Each stream (STDOUT, STDERR, ...) is read on its own: terraform prints the
              plan to stdout and the errors to stderr, and the two can interleave.
              """
              unit = {"resources": [], "outputs": [], "errors": [], "plan": None}
              for lines in streams.values():
                  mode = None
                  for text in lines:
                      in_block = text[:1].isspace() or text.startswith(("-/+", "+/-"))
                      if mode == "resources" and in_block:
                          if m := RE_RESOURCE.match(text):
                              unit["resources"].append({"address": m.group(1), "what": m.group(2),
                                                        "lines": [text]})
                          elif unit["resources"]:
                              unit["resources"][-1]["lines"].append(text)
                          continue
                      if mode == "outputs" and text[:1].isspace():
                          unit["outputs"].append(text)
                          continue
                      if mode == "error" and not (RE_ERROR.match(text) or RE_WARNING.match(text)):
                          unit["errors"][-1].append(text)
                          continue
                      mode = None
                      if text.startswith("Terraform will perform the following actions:"):
                          mode = "resources"
                      elif text.startswith("Changes to Outputs:"):
                          mode = "outputs"
                          unit["outputs"].append(text)
                      elif text.startswith("Plan: "):
                          unit["plan"] = text[len("Plan: "):].rstrip(".")
                      elif RE_ERROR.match(text):
                          mode = "error"
                          unit["errors"].append([text])
              return unit


          def loose_errors(lines: list, known: set) -> list:
              """Error blocks terragrunt printed outside any unit and no unit reported.

              Terragrunt repeats every failed unit's error in its closing report, so an
              error seen in a unit already is skipped. A block runs to the next empty line.
              """
              blocks = {}
              for i, line in enumerate(lines):
                  m = RE_ERROR.match(line.split("terraform:")[-1])
                  if not m or m.group(1).strip() in known or m.group(1).strip() in blocks:
                      continue
                  indent = len(line) - len(line.lstrip())
                  block = []
                  for follow in lines[i:]:
                      if not follow:
                          break
                      block.append(follow[indent:] if follow[:indent].isspace() else follow.strip())
                  blocks[m.group(1).strip()] = [b.rstrip() for b in block]
              return list(blocks.values())


          def trivy_findings(reports: str) -> list:
              """(unit, severity, id, title, resource) for every failed trivy check.

              Reads every JSON report in the directory, one per unit; the target of a
              result is the plan file as <unit>/tfplan.json.
              """
              if not reports or not os.path.isdir(reports):
                  return []
              found = set()
              for report_path in sorted(pathlib.Path(reports).glob("*.json")):
                  report = json.loads(report_path.read_text(encoding="utf-8") or "{}")
                  for result in report.get("Results") or []:
                      unit = report.get("Unit") or os.path.dirname(result.get("Target", "")) or "?"
                      for m in result.get("Misconfigurations") or []:
                          if m.get("Status") != "FAIL":
                              continue
                          found.add((unit, m.get("Severity", ""), m.get("AVDID") or m.get("ID", ""),
                                     m.get("Title", ""), (m.get("CauseMetadata") or {}).get("Resource", "")))
              return sorted(found)


          def main(path: str, fail_on_change: bool = False, github_output: bool = False,
                   artifact: str = None, json_dir: str = None, trivy: str = None) -> int:
              units, errors = {}, []
              streams, loose, queued = {}, [], {}
              unit, in_queue = "?", False
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if in_queue and (m := RE_BRANCH.match(line)):
                      queued[m.group(1)] = None
                  elif line.strip() != ".":
                      in_queue = bool(RE_QUEUE.search(line))
                  m = RE_UNIT.search(line)
                  if m:
                      unit = m.group(1)
                      label = line[:m.start()].split()
                      stream = label[-1] if label and re.fullmatch(r"[A-Z]+", label[-1]) else ""
                      text = line[m.end():]
                      streams.setdefault(unit, {}).setdefault(stream, []).append(
                          text[1:] if text.startswith(" ") else text)
                  else:
                      loose.append(line)
                  if m := RE_PLAN.search(line):
                      imp, add, chg, dst = (int(g or 0) for g in m.groups())
                      units[unit] = (add, chg, dst, imp)
                  elif RE_NOOP.search(line):
                      units.setdefault(unit, (0, 0, 0, 0))
                  if m := RE_ERROR.match(line.split("terraform:")[-1]):
                      errors.append(m.group(1).strip())

              parsed = {u: parse(s) for u, s in streams.items()}
              # Terraform prints no "Plan:" line when only outputs change.
              for u, p in parsed.items():
                  if p["outputs"]:
                      units.setdefault(u, (0, 0, 0, 0))

              add = sum(u[0] for u in units.values())
              chg = sum(u[1] for u in units.values())
              dst = sum(u[2] for u in units.values())
              imp = sum(u[3] for u in units.values())
              whats = [r["what"] for p in parsed.values() for r in p["resources"]]
              mov = sum(w.startswith("has moved to ") for w in whats)
              fgt = sum(w.startswith("will no longer be managed") for w in whats)
              outs = sum(bool(p["outputs"]) for p in parsed.values())
              changes = any((add, chg, dst, imp, mov, fgt, outs))
              totals = ((f"{imp} to import, " if imp else "")
                        + f"{add} to add, {chg} to change, {dst} to destroy"
                        + (f", {mov} to move" if mov else "")
                        + (f", {fgt} to forget" if fgt else "")
                        + (f", outputs change in {outs} unit{'s' * (outs != 1)}" if outs else ""))
              changed = sorted(
                  (u for u, p in parsed.items()
                   if p["resources"] or p["outputs"] or any(units.get(u, (0, 0, 0, 0)))),
                  key=lambda u: (-sum(units.get(u, (0, 0, 0, 0))), u),
              )
              unchanged = sorted(u for u in units if u not in changed and u in parsed)

              # The same failure (an expired login, say) tends to hit many units at once.
              failed = {}
              for u, p in parsed.items():
                  for block in p["errors"]:
                      failed.setdefault(tuple(block), {})[u] = None
              known = {RE_ERROR.match(b[0]).group(1).strip() for b in failed}
              for block in loose_errors(loose, known):
                  failed.setdefault(tuple(block), {})[None] = None
              missing = [u for u in queued
                         if u not in units and not parsed.get(u, {}).get("errors")]

              diffs = {}
              for u in changed:
                  blocks = [r["lines"] for r in parsed[u]["resources"]]
                  if parsed[u]["outputs"]:
                      blocks.append(parsed[u]["outputs"])
                  diffs[u] = [line for i, b in enumerate(blocks)
                              for line in ([""] if i else []) + [highlight(x) for x in b]]

              destructive = [f"{u}: {r['address']} {r['what']}"
                             for u in changed for r in parsed[u]["resources"]
                             if r["what"] == "will be destroyed" or "replaced" in r["what"]]

              tables = {}
              for u in changed:
                  plan_json = pathlib.Path(json_dir or "", u, "tfplan.json")
                  if json_dir and plan_json.is_file():
                      try:
                          tables[u] = plan_details.table(plan_details.load(plan_json))
                      except (ValueError, KeyError, TypeError, AttributeError) as e:
                          print(f"::warning::{u}: the JSON plan could not be read ({e})", file=sys.stderr)
              findings = trivy_findings(trivy)

              if artifact is None and os.environ.get("GITHUB_RUN_ID"):
                  artifact = f"plan-{os.environ['GITHUB_RUN_ID']}"
              where = f"artifact {code(artifact)} (plan.txt)" if artifact else "plan.txt"

              def render(shown: dict) -> str:
                  out = ["## Terragrunt plan\n",
                         f"**{totals}** across {len(units)} unit{'s' * (len(units) != 1)}.\n"]

                  if failed or missing:
                      out.append("### Errors\n")
                  if missing:
                      out.append("#### Without a result\n")
                      out.append(", ".join(code(u) for u in missing) + "\n")
                      out.append("Queued, but neither a plan nor an error came out: the run was "
                                 "cancelled, or terragrunt failed before terraform started. "
                                 f"The rest is in {where}.\n")
                  if failed:
                      for block, sources in failed.items():
                          names = [code(u) for u in sources if u is not None]
                          if None in sources:
                              names.append("outside a unit")
                          out.append(f"#### {', '.join(names)}\n")
                          out += fenced(list(block))
                          out.append("")

                  if findings:
                      out.append("### Security findings\n")
                      out.append("trivy over the plan, HIGH and CRITICAL. A finding that is accepted "
                                 "goes into `.github/trivyignore.yaml` with the reason.\n")
                      out += ["| Unit | Severity | Check | Resource |", "|---|---|---|---|"]
                      out += [f"| {code(u)} | {sev} | {cid}: {title} | {code(res) if res else ''} |"
                              for u, sev, cid, title, res in findings]
                      out.append("")

                  if destructive:
                      out.append("### Destroys or replaces\n")
                      out.append("After a merge the apply does not run these by itself: it waits "
                                 "for a manual run of the workflow with `allow_destroy`.\n")
                      out += [f"- {code(d)}" for d in destructive]
                      out.append("")

                  if changed:
                      out.append("### Units with a change\n")
                  for u in changed:
                      p = parsed[u]
                      out.append(f"#### {code(u)}" + (f" ({p['plan']})" if p["plan"] else "") + "\n")
                      if u in tables:
                          out += tables[u]
                      else:
                          for r in p["resources"]:
                              label = action(r["what"])
                              if any(RE_IMPORTED.match(x) for x in r["lines"]):
                                  label += " (imported)"
                              out.append(f"- {code(r['address'])}: {label}")
                          if p["outputs"]:
                              out.append("- output values change")
                      out.append("")

                      lines = diffs[u]
                      n = shown.get(u, len(lines))
                      if not lines:
                          continue
                      if n == 0:
                          out.append("_Attribute diff left out, the comment would be too long._\n")
                          continue
                      title = "Attribute diff" + (", shortened" if n < len(lines) else "")
                      out += [f"<details><summary>{title}</summary>", ""]
                      body = lines[:n]
                      while body and not body[-1]:
                          body.pop()
                      out += fenced(body, "diff")
                      if n < len(lines):
                          out += ["", f"_{len(lines) - n} of {len(lines)} lines left out._"]
                      out += ["", "</details>", ""]

                  if unchanged:
                      noun = "unit" if len(unchanged) == 1 else "units"
                      out.append(f"**{len(unchanged)} {noun} without a change:** "
                                 + ", ".join(code(u) for u in unchanged))

                  if shown:
                      out += ["", f"_Shortened to fit a comment; the full output is in {where}._"]
                  return "\n".join(out)

              # Diffs are shortened from the largest unit down: first as much of the
              # largest as the overflow needs, then the next one if that was not enough.
              shown = {}
              text = render(shown)
              for u in sorted(diffs, key=lambda u: -sum(len(x) + 1 for x in diffs[u])):
                  n = len(diffs[u])
                  while n and len(text) > MAX:
                      over = len(text) - MAX
                      while n and over > 0:
                          n -= 1
                          over -= len(diffs[u][n]) + 1
                      shown[u] = n
                      text = render(shown)
              if len(text) > MAX:
                  text = cut(text, MAX, where)
              print(text)

              if github_output and (path_out := os.environ.get("GITHUB_OUTPUT")):
                  with open(path_out, "a", encoding="utf-8") as fh:
                      fh.write(f"has_changes={str(changes).lower()}\n")
                      fh.write(f"has_errors={str(bool(errors or missing)).lower()}\n")
                      fh.write(f"has_destroys={str(bool(destructive)).lower()}\n")

              if fail_on_change and (changes or errors or missing):
                  print(f"\nDRIFT: {totals}, {len(errors)} errors"
                        + (f", {len(missing)} unit{'s' * (len(missing) != 1)} without a result"
                           if missing else "") + ".",
                        file=sys.stderr)
                  return 1
              return 0


          def cut(text: str, limit: int, where: str) -> str:
              """Last resort when even without the diffs the summary is too long.

              Cuts whole lines from the end and closes a code block left open.
              """
              note = f"\n\n_Cut off to fit a comment; the full output is in {where}._"
              kept, size, fence = [], 0, None
              for line in text.split("\n"):
                  after = fence
                  if m := re.match(r"^(`{3,})", line):
                      if fence is None:
                          after = m.group(1)
                      elif line.strip() == fence:
                          after = None
                  if size + len(line) + 1 + (len(after) + 1 if after else 0) + len(note) > limit:
                      break
                  kept.append(line)
                  size += len(line) + 1
                  fence = after
              if fence:
                  kept.append(fence)
              return "\n".join(kept) + note


          if __name__ == "__main__":
              args = sys.argv[1:]
              paths = [a for a in args if not a.startswith("--")]
              named = dict(a[2:].split("=", 1) for a in args if a.startswith("--") and "=" in a)
              sys.exit(main(paths[0], "--fail-on-change" in args, "--github-output" in args,
                            named.get("artifact"), named.get("json-dir"), named.get("trivy")))
          __CI_EOF__
          cat >"$d/plan_details.py" <<'__CI_EOF__'
          """Reads a terraform plan in JSON and says in plain words what it changes.

          plan-summary.py lists the resources of a unit from terraform's text output.
          With the plan of the unit in JSON (`terragrunt run --all plan --json-out-dir`)
          it uses this instead: one row per resource with what kind of thing it is, its
          name, and for an update the attributes that change, from what to what.

          The JSON holds sensitive values in clear text. Nothing marked sensitive by
          terraform is ever printed, and the JSON itself never leaves the runner.
          """
          import json
          import re

          # Shown instead of the resource type where the type alone says little.
          KINDS = {
              "azurerm_resource_group": "resource group",
              "azurerm_role_assignment": "role assignment",
              "azurerm_pim_eligible_role_assignment": "eligible role assignment",
              "azurerm_role_definition": "role definition",
              "azurerm_key_vault": "Key Vault",
              "azurerm_key_vault_certificate": "Key Vault certificate",
              "azurerm_key_vault_secret": "Key Vault secret",
              "azurerm_log_analytics_workspace": "Log Analytics workspace",
              "azurerm_monitor_diagnostic_setting": "diagnostic setting",
              "azurerm_monitor_action_group": "action group",
              "azurerm_monitor_metric_alert": "metric alert",
              "azurerm_monitor_scheduled_query_rules_alert_v2": "log alert",
              "azurerm_management_lock": "lock",
              "azurerm_management_group": "management group",
              "azurerm_management_group_policy_assignment": "policy assignment",
              "azurerm_storage_account": "storage account",
              "azurerm_static_web_app": "Static Web App",
              "azurerm_user_assigned_identity": "managed identity",
              "azurerm_federated_identity_credential": "federated credential",
              "azurerm_logic_app_workflow": "Logic App",
              "azurerm_application_insights": "Application Insights",
              "azurerm_sentinel_alert_rule_scheduled": "analytic rule",
              "azurerm_sentinel_alert_rule_nrt": "analytic rule (NRT)",
              "azurerm_sentinel_automation_rule": "automation rule",
              "azurerm_sentinel_watchlist": "watchlist",
              "azurerm_sentinel_watchlist_item": "watchlist item",
              "azurerm_application_insights_workbook": "workbook",
              "azuread_group": "Entra group",
              "azuread_group_member": "group membership",
              "azuread_application": "application",
              "azuread_service_principal": "service principal",
              "azuread_application_federated_identity_credential": "federated credential",
              "azuread_application_certificate": "application certificate",
              "azuread_app_role_assignment": "API permission grant",
              "azuread_directory_role_assignment": "Entra role assignment",
              "azuread_user": "user",
              "azuread_invitation": "guest invitation",
              "azuread_administrative_unit": "administrative unit",
          }
          NAME_KEYS = ("display_name", "name", "user_principal_name", "role_definition_name")
          # azapi_resource says what it is in its `type`; shown like the azurerm kinds.
          AZAPI_KINDS = {
              "Microsoft.SecurityInsights/alertRules": "analytic rule",
              "Microsoft.SecurityInsights/automationRules": "automation rule",
              "Microsoft.SecurityInsights/watchlists": "watchlist",
              "Microsoft.SecurityInsights/dataConnectors": "data connector",
              "Microsoft.SecurityInsights/onboardingStates": "Sentinel onboarding",
              "Microsoft.SecurityInsights/settings": "Sentinel setting",
              "Microsoft.Insights/workbooks": "workbook",
              "Microsoft.Insights/diagnosticSettings": "diagnostic setting",
              "Microsoft.OperationalInsights/workspaces/tables": "Log Analytics table",
          }
          # Attributes azapi fills from the response; their change says nothing.
          COMPUTED = {"azapi_resource": {"output"}}
          VERBS = {
              ("create",): "create",
              ("update",): "update",
              ("delete",): "destroy",
              ("delete", "create"): "replace",
              ("create", "delete"): "replace",
              ("read",): "read",
              ("no-op",): None,
          }
          REASONS = {
              "delete_because_no_resource_config": "no longer in the code",
              "delete_because_no_module": "its module is no longer in the code",
              "delete_because_each_key": "its key is no longer in the for_each",
              "delete_because_count_index": "its index is beyond the count",
              "delete_because_wrong_repetition": "count and for_each swapped",
              "replace_because_tainted": "tainted",
              "replace_by_request": "replace requested",
              "replace_by_triggers": "a replace_triggered_by changed",
          }
          MAX_VALUE = 60
          MAX_ATTRIBUTES = 8
          RE_RESOURCE_ID = re.compile(r"/subscriptions/[^/\s]+(?:/resourceGroups/[^/\s]+)?/providers/\S+", re.I)


          def code(text: str) -> str:
              tick = "``" if "`" in text else "`"
              pad = " " if tick == "``" else ""
              return f"{tick}{pad}{text}{pad}{tick}"


          def kind(rtype: str, values=None) -> str:
              if rtype == "azapi_resource" and isinstance(values, dict) and values.get("type"):
                  api = str(values["type"]).split("@")[0]
                  if api in AZAPI_KINDS:
                      return AZAPI_KINDS[api]
                  last = api.rsplit("/", 1)[-1]
                  return re.sub(r"(?<!^)([A-Z])", r" \1", last).lower().rstrip("s")
              if rtype in KINDS:
                  return KINDS[rtype]
              return re.sub(r"^(azurerm|azuread|azapi|random|time|terraform)_", "", rtype).replace("_", " ")


          def short_id(value: str) -> str:
              """The last name in an Azure resource ID; the ID itself otherwise."""
              if isinstance(value, str) and value.startswith("/") and "/" in value[1:]:
                  return value.rstrip("/").rsplit("/", 1)[-1]
              return value


          def name_of(rc: dict) -> str:
              """A name a person would recognise, taken from the values of the resource."""
              values = rc["change"].get("after") or rc["change"].get("before") or {}
              sensitive = rc["change"].get("after_sensitive") or rc["change"].get("before_sensitive") or {}
              index = rc.get("index")
              if rc["type"] in ("azurerm_role_assignment", "azurerm_pim_eligible_role_assignment") \
                      and isinstance(index, str) and "/" in index:
                  role, principal = index.split("/", 1)
                  scope = short_id(values.get("scope", "")) if isinstance(values, dict) else ""
                  return f"{code(role)} for {code(principal)}" + (f" on {code(scope)}" if scope else "")
              if rc["type"] == "azapi_resource" and isinstance(values, dict):
                  props = ((values.get("body") or {}).get("properties") or {}) \
                      if isinstance(values.get("body"), dict) else {}
                  display = props.get("displayName") or props.get("display_name")
                  if isinstance(display, str) and display:
                      return code(display)
              if isinstance(values, dict):
                  for key in NAME_KEYS:
                      v = values.get(key)
                      if isinstance(v, str) and v and not (isinstance(sensitive, dict) and sensitive.get(key)):
                          return code(v)
              if isinstance(index, str):
                  return code(index)
              return ""


          def crop(before: str, after: str):
              """Two long strings cut to where they start to differ."""
              if len(before) <= MAX_VALUE and len(after) <= MAX_VALUE:
                  return before, after
              same = 0
              while same < min(len(before), len(after)) and before[same] == after[same]:
                  same += 1
              start = max(0, same - 20)
              if start == 0:
                  return before, after
              return "…" + before[start:], "…" + after[start:]


          def fmt(value, sensitive=False, unknown=False) -> str:
              if sensitive:
                  return "(sensitive)"
              if unknown:
                  return "(known after apply)"
              if value is None:
                  return "null"
              if isinstance(value, str):
                  text = short_id(value) if RE_RESOURCE_ID.fullmatch(value) else value
              else:
                  text = json.dumps(value, ensure_ascii=False, separators=(",", ":"))
              text = text.replace("\n", "⏎")
              if len(text) > MAX_VALUE:
                  text = text[: MAX_VALUE - 1] + "…"
              return code(text)


          def at(tree, path):
              """The value at a path in before/after or in a sensitive/unknown map."""
              for step in path:
                  if isinstance(tree, dict):
                      tree = tree.get(step)
                  elif isinstance(tree, list) and isinstance(step, int) and step < len(tree):
                      tree = tree[step]
                  else:
                      return None
              return tree


          def flagged(tree, path) -> bool:
              """True when the path or anything above it is marked in a sensitive/unknown map."""
              if tree is True:
                  return True
              for step in path:
                  if isinstance(tree, dict):
                      tree = tree.get(step)
                  elif isinstance(tree, list) and isinstance(step, int) and step < len(tree):
                      tree = tree[step]
                  else:
                      return False
                  if tree is True:
                      return True
              return False


          def anything_flagged(tree, path) -> bool:
              """True when the path, anything above it or anything below it is marked.

              A sensitive map can mark single elements of a list or keys of an object,
              so a value is shown only when nothing inside it is sensitive either.
              """
              if flagged(tree, path):
                  return True
              return any(True for _ in leaves(at(tree, path) or {}))


          def scalars(values) -> bool:
              return isinstance(values, list) and all(not isinstance(v, (dict, list)) for v in values)


          def diff(before, after, path=()):
              """Paths whose value differs, down to the leaves; lists of scalars stay whole."""
              if isinstance(before, dict) and isinstance(after, dict):
                  for key in sorted(set(before) | set(after)):
                      yield from diff(before.get(key), after.get(key), path + (key,))
              elif (isinstance(before, list) and isinstance(after, list) and not scalars(before)
                    and not scalars(after) and len(before) == len(after)):
                  for i, (b, a) in enumerate(zip(before, after)):
                      yield from diff(b, a, path + (i,))
              elif before != after:
                  yield path


          def label(path) -> str:
              if len(path) == 2 and path[0] == "tags":
                  return f"tag {code(path[1])}"
              text = ""
              for step in path:
                  text += f"[{step}]" if isinstance(step, int) else (("." if text else "") + step)
              return code(text)


          def attribute_changes(change: dict, skip=()) -> list:
              """`attribute: from → to` for every attribute an update changes."""
              before, after = change.get("before") or {}, change.get("after") or {}
              bs, as_ = change.get("before_sensitive") or {}, change.get("after_sensitive") or {}
              unknown = change.get("after_unknown") or {}
              out = []
              paths = list(diff(before, after))
              # An attribute only known after apply has no value yet in `after`.
              paths += [p for p in leaves(unknown) if p not in paths and at(before, p) is not None]
              paths = [p for p in paths if not p or p[0] not in skip]
              for path in sorted(paths, key=lambda p: [str(x) for x in p]):
                  b, a = at(before, path), at(after, path)
                  sens = anything_flagged(bs, path) or anything_flagged(as_, path)
                  unk = flagged(unknown, path)
                  if sens:
                      out.append(f"{label(path)} changes (sensitive)")
                  elif scalars(b) and scalars(a) and not unk:
                      added = [x for x in a if x not in b]
                      removed = [x for x in b if x not in a]
                      parts = [f"+{fmt(x)}" for x in added] + [f"−{fmt(x)}" for x in removed]
                      out.append(f"{label(path)}: " + (", ".join(parts) if parts else "order changes"))
                  elif b is None and not unk:
                      out.append(f"{label(path)}: set to {fmt(a)}")
                  elif a is None and not unk:
                      out.append(f"{label(path)}: {fmt(b)} removed")
                  elif isinstance(b, str) and isinstance(a, str):
                      b, a = crop(b, a)
                      out.append(f"{label(path)}: {fmt(b)} → {fmt(a)}")
                  else:
                      out.append(f"{label(path)}: {fmt(b)} → {fmt(a, unknown=unk)}")
              if len(out) > MAX_ATTRIBUTES:
                  rest = len(out) - MAX_ATTRIBUTES
                  out = out[:MAX_ATTRIBUTES] + [f"and {rest} more, see the attribute diff"]
              return out


          def leaves(tree, path=()):
              if tree is True:
                  yield path
              elif isinstance(tree, dict):
                  for k, v in tree.items():
                      yield from leaves(v, path + (k,))
              elif isinstance(tree, list):
                  for i, v in enumerate(tree):
                      yield from leaves(v, path + (i,))


          def rows(plan: dict) -> list:
              """(verb, what, how) for every resource the plan touches, destroys first."""
              order = {"destroy": 0, "replace": 1, "update": 2, "create": 3, "import": 4,
                       "move": 5, "forget": 6, "read": 7}
              out = []
              for rc in plan.get("resource_changes", []):
                  change = rc["change"]
                  actions = tuple(change.get("actions", []))
                  verb = VERBS.get(actions, "/".join(actions))
                  if actions == ("forget",):
                      verb = "forget"
                  moved = rc.get("previous_address") and rc["previous_address"] != rc["address"]
                  imported = bool(change.get("importing"))
                  if verb is None:
                      if imported:
                          verb = "import"
                      elif moved:
                          verb = "move"
                      else:
                          continue
                  if rc.get("mode") == "data" and verb == "read":
                      continue
                  name = name_of(rc)
                  values = change.get("after") or change.get("before")
                  what = kind(rc["type"], values) + (f" {name}" if name else "")
                  skip = COMPUTED.get(rc["type"], set())
                  notes = []
                  if verb == "update" or (verb in ("import", "move") and change.get("before") != change.get("after")):
                      notes += attribute_changes(change, skip)
                  if verb == "replace":
                      paths = [tuple(p) for p in change.get("replace_paths") or []]
                      if paths:
                          notes.append("because " + ", ".join(label(p) for p in paths) + " changes")
                      notes += [n for n in attribute_changes(change, skip)
                                if any(n.startswith(label(p)) for p in paths)]
                  reason = REASONS.get(rc.get("action_reason", ""))
                  if reason and verb in ("destroy", "replace"):
                      notes.append(reason)
                  if moved:
                      notes.append(f"moved from {code(rc['previous_address'])}")
                  if imported and verb != "import":
                      notes.append("imported")
                  out.append((verb, what, rc["address"], notes))
              out.sort(key=lambda r: (order.get(r[0], 9), r[2]))
              return out


          def outputs(plan: dict) -> list:
              return sorted(k for k, v in (plan.get("output_changes") or {}).items()
                            if v.get("actions") not in (["no-op"], None))


          def table(plan: dict) -> list:
              """Markdown lines for one unit: a row per resource, then the outputs."""
              lines = ["| | Resource | What changes |", "|---|---|---|"]
              for verb, what, address, notes in rows(plan):
                  cell = "<br>".join(n.replace("|", "\\|") for n in notes)
                  lines.append(f"| {verb} | {what.replace('|', chr(92) + '|')}<br><sub>{code(address)}</sub> | {cell} |")
              if len(lines) == 2:
                  lines = []
              if outs := outputs(plan):
                  lines += ["", "Outputs that change: " + ", ".join(code(o) for o in outs)]
              return lines


          def load(path) -> dict:
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)
          __CI_EOF__
          cat >"$d/portal-rules.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Analytic rules in the workspace that the code does not manage.

          Usage: portal-rules.py <plan-json-dir> <unit>

          Reads the plan of the analytic rules unit (<plan-json-dir>/<unit>/tfplan.json)
          for the rules the code manages and the workspace they live in, lists the
          rules the workspace really has (az rest, with the session the job already
          signed in with) and reports every one the code does not know: a rule created
          in the portal, or one left behind. Each becomes a warning and a row in the
          job summary; the exit code stays 0, this is a report.

          Terraform's drift plan cannot see these: it only looks at what it manages.
          """
          import json
          import os
          import subprocess
          import sys

          API = "2024-09-01"


          def managed(plan: dict):
              """(workspace id, names of the alertRules) from the planned values."""
              names, workspace = set(), None
              stack = [(plan.get("planned_values") or {}).get("root_module") or {}]
              while stack:
                  module = stack.pop()
                  stack += module.get("child_modules") or []
                  for r in module.get("resources") or []:
                      values = r.get("values") or {}
                      if r.get("type") == "azapi_resource" and \
                              str(values.get("type", "")).startswith("Microsoft.SecurityInsights/alertRules@"):
                          names.add(values.get("name"))
                          workspace = workspace or values.get("parent_id")
              return workspace, names


          # Rules Sentinel creates and keeps by itself; they do not belong in the code.
          BUILT_IN_KINDS = {"Fusion"}


          def unmanaged(rules: list, names: set) -> list:
              """(name, kind, display name, enabled) of the rules not in names."""
              out = []
              for r in rules:
                  if r.get("name") in names or r.get("kind") in BUILT_IN_KINDS:
                      continue
                  p = r.get("properties") or {}
                  out.append((r.get("name"), r.get("kind", ""), p.get("displayName", ""), p.get("enabled")))
              return sorted(out, key=lambda x: (x[2] or "", x[0]))


          def workspace_rules(workspace: str) -> list:
              url = f"https://management.azure.com{workspace}/providers/Microsoft.SecurityInsights/alertRules?api-version={API}"
              rules = []
              while url:
                  page = json.loads(subprocess.run(["az", "rest", "--method", "get", "--url", url],
                                                   capture_output=True, text=True, check=True).stdout)
                  rules += page.get("value") or []
                  url = page.get("nextLink")
              return rules


          def main(plan_dir: str, unit: str) -> int:
              path = os.path.join(plan_dir, unit, "tfplan.json")
              if not os.path.isfile(path):
                  print(f"::warning::no plan of {unit}, portal rules not checked")
                  return 0
              with open(path, encoding="utf-8") as fh:
                  workspace, names = managed(json.load(fh))
              if not workspace:
                  print(f"::warning::{unit} manages no analytic rule, portal rules not checked")
                  return 0
              found = unmanaged(workspace_rules(workspace), names)
              lines = ["## Analytic rules outside the code", ""]
              if not found:
                  lines.append(f"None: the workspace has exactly the {len(names)} rules the code manages.")
              else:
                  lines += [f"{len(found)} rules in the workspace that the code does not manage. "
                            "Put each into the code, or delete it in the portal.", "",
                            "| Display name | Kind | Enabled | Name |", "|---|---|---|---|"]
                  for name, kind, display, enabled in found:
                      lines.append(f"| {display} | {kind} | {enabled} | `{name}` |")
                      print(f"::warning title=portal rule::{display or name} ({kind}) is not in the code")
              text = "\n".join(lines) + "\n"
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
          __CI_EOF__
          cat >"$d/trivy-plans.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # trivy over the plans in JSON, one report per unit.
          #
          # Usage: trivy-plans.sh <plan-json-dir> <report-dir>
          #
          # <plan-json-dir> holds <unit>/tfplan.json (terragrunt's --json-out-dir). Each
          # report lands in <report-dir> as <unit with / as _>.json, with the unit in
          # its "Unit" field. Exit code 3 when there is a HIGH or CRITICAL finding that
          # .github/trivyignore.yaml does not accept, 0 when there is none, anything else when
          # trivy itself failed.
          #
          # trivy turns a plan into a main.tf of its own, so every finding has that file
          # as its target and the `paths` of an ignore entry cannot tell the units
          # apart. In .github/trivyignore.yaml `paths` therefore lists units (<unit>/tfplan.json)
          # and is applied here: each unit gets the entries that name it or name no unit
          # at all.
          #
          # The checks are the ones built into the pinned trivy (--skip-check-update),
          # so a run is repeatable; new checks arrive with a version bump.
          set -euo pipefail

          PLANS=${1:?missing plan directory}
          REPORTS=${2:?missing report directory}
          IGNORE="$PWD/.github/trivyignore.yaml"
          [ -f "$IGNORE" ] || IGNORE="$PWD/.trivyignore.yaml"
          UNIT_IGNORE=$(mktemp --suffix=.yaml)

          mkdir -p "$REPORTS"
          REPORTS=$(cd "$REPORTS" && pwd)
          if [ ! -d "$PLANS" ]; then
            echo "No plan in JSON."
            exit 0
          fi

          found=0
          while IFS= read -r plan; do
            report="$REPORTS/$(tr / _ <<<"${plan%/tfplan.json}").json"
            yq -o=json '.' "$IGNORE" |
              jq --arg plan "$plan" '{misconfigurations: [(.misconfigurations // [])[]
                | select((.paths // []) | length == 0 or any(.[]; . == $plan)) | del(.paths)]}' |
              yq -P '.' >"$UNIT_IGNORE"
            rc=0
            (cd "$PLANS" && trivy config --quiet --skip-check-update \
              --severity HIGH,CRITICAL --exit-code 3 --ignorefile "$UNIT_IGNORE" \
              --format json --output "$report" "$plan") || rc=$?
            case "$rc" in
              0) ;;
              3) found=1 ;;
              *) echo "trivy failed on $plan" >&2; exit "$rc" ;;
            esac
            # The unit goes into the report itself, so that the summary does not have
            # to guess it from trivy's target; the log shows what failed where.
            unit="${plan%/tfplan.json}"
            jq --arg unit "$unit" '.Unit = $unit' "$report" >"$report.tmp" && mv "$report.tmp" "$report"
            jq -r --arg unit "$unit" '.Results[]? | .Target as $t | .Misconfigurations[]?
              | select(.Status == "FAIL")
              | "\($unit): \(.Severity) \(.AVDID // .ID) \(.Title) [target \($t)]"' "$report"
          done < <(cd "$PLANS" && find . -name tfplan.json | sed 's|^\./||' | sort)

          [ "$found" -eq 0 ] || exit 3
          __CI_EOF__
          chmod +x "$d"/*

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      # Without a shared cache each of the fifty units downloads its own copies
      # of the providers and the runner runs out of both disk and time.
      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('root.hcl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt and trivy
        run: install-tools.sh terragrunt trivy

      # HCL formatting and validation take about ten seconds, so they share the
      # job with the plan rather than paying for a checkout of their own.
      - name: HCL formatting
        run: terragrunt hcl fmt --check --diff

      - name: HCL validation
        run: terragrunt hcl validate

      # A pull request is compared with its base branch. On main the base is
      # the head of the last successful run - its apply went through or had
      # nothing to do - so a change a failed or held-back apply left out is
      # still selected now. Runs on main never overlap (see concurrency).
      - name: Base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            # The caller's workflow file, e.g. ci.yml.
            wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty') || base=""
            # Without it the units of an earlier failed apply could be left
            # out, so the whole tree runs instead.
            if [ -z "$base" ]; then
              echo "::warning::No successful run on main found; the whole tree runs."
            fi
          fi
          echo "sha=$base" >>"$GITHUB_OUTPUT"
          echo "Compared with \`$base\`." >>"$GITHUB_STEP_SUMMARY"

      # A principal the same change creates cannot be referenced by display
      # name: `dependencies` orders the run but a plan creates nothing, so the
      # lookup goes to Entra and finds nothing. Caught here rather than by a
      # failed plan half an hour into the queue.
      - name: Principal references
        if: inputs.principal-refs
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
          check-principal-refs.py "$BASE"

      - name: Select the units
        id: units
        env:
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          selection=$(select-units.py "$BASE")
          if [ "$SCOPE" = "all" ]; then
            selection=$(jq -c '.all = true | .units = []' <<<"$selection")
          fi
          echo "selection=$selection" >>"$GITHUB_OUTPUT"
          jq -r '
            (if .all then "Selected: the whole tree."
             elif (.units | length) > 0 then "Selected: " + (.units | join(", ")) + "."
             else "Selected: no unit to plan." end),
            (if (.deleted | length) > 0
             then "Deleted, planned as a destroy: " + (.deleted | join(", ")) + "."
             else empty end)
          ' <<<"$selection" >>"$GITHUB_STEP_SUMMARY"
          # The state key is the unit's path: a moved directory would be a new
          # unit that creates everything again, next to the old resources.
          if [ "$(jq '.renamed | length' <<<"$selection")" -gt 0 ]; then
            jq -r '.renamed[] | "::error::\(.[0]) moved to \(.[1]). Moving a unit changes its state key. Delete the unit in one pull request (it gets destroyed) and add it under the new path in the next, or move its state by hand first."' <<<"$selection"
            exit 1
          fi

      # A job killed while terraform holds a state lock leaves the lock behind
      # for good. Locks a runner took more than 70 minutes ago are released
      # here: no job runs that long (apply has the longest timeout, 60), so
      # the job that took them is gone. Workstation locks stay.
      - name: Release stale state locks
        continue-on-error: true
        run: |
          set -euo pipefail
          value() { sed -n "s/^ *$1 *= *\"\(.*\)\"/\1/p" account.hcl; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          release-stale-locks.py \
            "$(value storage_account_name)" "$(value container_name)" 70

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      # The units that exist are planned from HEAD. A deleted unit exists only
      # in the base commit, so it is planned as a destroy from a worktree of
      # that commit. Both land in the same plan.txt, under their unit paths,
      # and as JSON in $PLAN_JSON for the comment and for trivy. The JSON holds
      # sensitive values in clear text: it stays in the runner's temp and is
      # never uploaded.
      - name: Plan
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ env.MODULES_DIR }}
          SELECTION: ${{ steps.units.outputs.selection }}
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          set -euo pipefail
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          : >plan.txt
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SELECTION")
          rc=0
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ] \
            && [ "${#deleted[@]}" -eq 0 ]; then
            echo "Nothing to plan." >nothing-selected
          fi
          if [ "$(jq -r .all <<<"$SELECTION")" = "true" ] || [ "${#units[@]}" -gt 0 ]; then
            args=()
            for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
            set +e
            terragrunt run --all plan "${args[@]}" --json-out-dir "$PLAN_JSON" \
              --non-interactive --no-color 2>&1 | tee -a plan.txt
            rc=${PIPESTATUS[0]}
            set -e
          fi
          if [ "${#deleted[@]}" -gt 0 ]; then
            git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
            args=()
            for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
            set +e
            (cd "$RUNNER_TEMP/base" &&
              terragrunt run --all "${args[@]}" --json-out-dir "$PLAN_JSON" \
                --non-interactive --no-color -- plan -destroy) 2>&1 |
              tee -a plan.txt
            destroy_rc=${PIPESTATUS[0]}
            set -e
            [ "$destroy_rc" -eq 0 ] || rc=$destroy_rc
          fi
          exit "$rc"

      # trivy over the plans, which carry the value of every setting; over the
      # bare modules it cannot tell what a variable will be. The verdict waits
      # until the findings are in the comment.
      - name: Security findings in the plan
        id: trivy
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          rc=0
          trivy-plans.sh "$PLAN_JSON" trivy || rc=$?
          case "$rc" in
            0) echo "found=false" >>"$GITHUB_OUTPUT" ;;
            3) echo "found=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      - name: Summary
        id: summary
        if: always()
        env:
          PLAN_JSON: ${{ runner.temp }}/plan-json
        run: |
          set -euo pipefail
          # Without a plan the comment still has to be rewritten, or the pull
          # request keeps showing the plan of an earlier commit.
          if [ -e nothing-selected ]; then
            printf '## Terragrunt plan\n\nNothing to plan: the change selects no unit.\n' \
              | tee plan.md >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -s plan.txt ]; then
            printf '## Terragrunt plan\n\nNo plan was produced, see the run log.\n' \
              | tee plan.md >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          plan-summary.py plan.txt --github-output \
            --json-dir="$PLAN_JSON" --trivy=trivy | tee plan.md
          cat plan.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ github.run_id }}
          path: |
            plan.txt
            plan.md
          retention-days: 30

      - name: Comment into the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s plan.md ] || exit 0
          pr-comment.sh "$PR_NUMBER" plan.md terragrunt-plan

      # The moment the plan could be read in the pull request: an approval of
      # its destroys counts only after it.
      - name: Plan time
        id: planned
        if: always()
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: No unaccepted security finding
        if: always() && steps.trivy.outputs.found == 'true'
        run: |
          echo "::error::trivy found a HIGH or CRITICAL setting in the plan (Security findings in the summary). Fix it, or accept it in .github/trivyignore.yaml with the reason."
          exit 1

  # GitHub Team has no approval on an environment of a private repository,
  # so the approval of destroys and replaces is the owner's review of the pull
  # request, given after its plan. On a pull request this check passes when
  # the plan has none, or when such a review exists; a review submitted later
  # re-runs it (destroy-review.yml). On main it finds the merged pull request
  # and tells the apply whether that check passed on an approval; it never
  # fails there, the gate says what is missing.
  destroy:
    name: destroy / approved
    needs: plan
    if: >-
      !cancelled()
      && (github.event_name == 'pull_request'
          || (needs.plan.outputs.has_destroys == 'true' && !inputs.allow-destroy))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      approved: ${{ steps.merged.outputs.approved }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Approval script
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/destroy-approval.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Decides whether the destroys and replaces of a plan are approved.

          A plan that destroys or replaces resources is applied only when the owner
          approved the pull request after he could read that plan. The plan is the
          pull request comment, so "after" means after the plan job ended.

            destroy-approval.py pr <number> <planned-at>
                On a pull request: passes (exit 0) when the pull request has an
                approving review, by a person other than its author, submitted after
                <planned-at> (ISO 8601, UTC) on the head commit, and not superseded by a
                later review of the same person that requests changes or was dismissed.
                Fails (exit 1) otherwise.

            destroy-approval.py main <sha> <workflow>
                On main: writes approved=true|false to $GITHUB_OUTPUT. True when <sha>
                is the merge commit of a pull request whose last run of <workflow>
                (e.g. ci.yml) passed its destroy check BECAUSE the destroys were
                approved (the step STEP below succeeded), not because it had none.

            destroy-approval.py review <head-sha> <workflow>
                On a submitted review: re-runs the failed destroy check of the last
                completed pull request run of <workflow> for <head-sha>, so that it
                reads the new review. GitHub also re-runs the jobs that need it (the
                gate).

          Reads the API with gh (GH_TOKEN) in GITHUB_REPOSITORY.
          """
          import json
          import os
          import subprocess
          import sys

          STEP = "Destroys approved after the plan"
          JOB_SUFFIX = "destroy / approved"


          def api(path: str, method: str = "GET"):
              args = ["gh", "api", "-X", method, path]
              if method == "GET":
                  args += ["--paginate", "--slurp"]
              r = subprocess.run(args, capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit(f"::error::gh api {method} {path}: {r.stderr.strip()}")
              out = r.stdout
              if method != "GET":
                  return None
              pages = json.loads(out or "[]")
              # --slurp gives a list of pages; a page is a list or an object holding one.
              items = []
              for page in pages:
                  if isinstance(page, list):
                      items += page
                  else:
                      items.append(page)
              return items


          def approval(reviews: list, author: str, head_sha: str, planned_at: str):
              """The approving review that counts, or None.

              Only the latest review of each person that is not a plain comment
              counts: an approval followed by a request for changes, or dismissed (a
              push dismisses stale approvals), is no approval.
              """
              latest = {}
              for r in sorted(reviews, key=lambda r: r.get("submitted_at") or ""):
                  user = r.get("user") or {}
                  if r.get("state") == "COMMENTED" or not r.get("submitted_at"):
                      continue
                  latest[user.get("login")] = r
              for login, r in latest.items():
                  user = r.get("user") or {}
                  if (r["state"] == "APPROVED" and login != author and user.get("type") == "User"
                          and r.get("commit_id") == head_sha and r["submitted_at"] > planned_at):
                      return r
              return None


          def last_run(runs: list):
              """The most recent pull request run of the workflow."""
              runs = [r for r in runs if r.get("event") == "pull_request"]
              return max(runs, key=lambda r: r["id"]) if runs else None


          def destroy_job(jobs: list):
              for job in jobs:
                  if job.get("name", "").endswith(JOB_SUFFIX):
                      return job
              return None


          def approved_by_step(job) -> bool:
              if not job or job.get("conclusion") != "success":
                  return False
              return any(s.get("name") == STEP and s.get("conclusion") == "success" for s in job.get("steps", []))


          def merged_pull(pulls: list, sha: str):
              for p in pulls:
                  if p.get("merged_at") and p.get("merge_commit_sha") == sha:
                      return p
              return None


          def runs_of(repo: str, workflow: str, sha: str) -> list:
              pages = api(f"repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=pull_request&per_page=100")
              return [r for page in pages for r in page.get("workflow_runs", [])]


          def jobs_of(repo: str, run_id: int) -> list:
              pages = api(f"repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100")
              return [j for page in pages for j in page.get("jobs", [])]


          def cmd_pr(repo: str, number: str, planned_at: str) -> int:
              pr = api(f"repos/{repo}/pulls/{number}")[0]
              reviews = api(f"repos/{repo}/pulls/{number}/reviews?per_page=100")
              r = approval(reviews, pr["user"]["login"], pr["head"]["sha"], planned_at)
              if r:
                  print(f"Approved by {r['user']['login']} at {r['submitted_at']}, after the plan of {planned_at}.")
                  return 0
              print(f"::error::The plan destroys or replaces resources. Read the plan in the pull request "
                    f"and approve it: an approval counts only when it comes after the plan ({planned_at}).")
              return 1


          def cmd_main(repo: str, sha: str, workflow: str) -> int:
              approved = False
              pr = merged_pull(api(f"repos/{repo}/commits/{sha}/pulls"), sha)
              if not pr:
                  print(f"{sha} is not the merge commit of a pull request.")
              else:
                  run = last_run(runs_of(repo, workflow, pr["head"]["sha"]))
                  job = destroy_job(jobs_of(repo, run["id"])) if run else None
                  approved = approved_by_step(job)
                  print(f"Pull request #{pr['number']}: the destroys were "
                        f"{'approved after its plan' if approved else 'not approved after its plan'}.")
              if out := os.environ.get("GITHUB_OUTPUT"):
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"approved={str(approved).lower()}\n")
              return 0


          def cmd_review(repo: str, head_sha: str, workflow: str) -> int:
              run = last_run(runs_of(repo, workflow, head_sha))
              if not run:
                  print("No pull request run for the head commit yet.")
                  return 0
              if run.get("status") != "completed":
                  print(f"Run {run['id']} is still {run.get('status')}; its destroy check reads the reviews when it gets there.")
                  return 0
              job = destroy_job(jobs_of(repo, run["id"]))
              if not job or job.get("conclusion") != "failure":
                  print(f"Nothing to re-run: the destroy check of run {run['id']} is "
                        f"{job.get('conclusion') if job else 'missing'}.")
                  return 0
              api(f"repos/{repo}/actions/jobs/{job['id']}/rerun", method="POST")
              print(f"Re-running '{job['name']}' of run {run['id']}.")
              return 0


          def main(argv: list) -> int:
              repo = os.environ["GITHUB_REPOSITORY"]
              if len(argv) == 3 and argv[0] == "pr":
                  return cmd_pr(repo, argv[1], argv[2])
              if len(argv) == 3 and argv[0] == "main":
                  return cmd_main(repo, argv[1], argv[2])
              if len(argv) == 3 and argv[0] == "review":
                  return cmd_review(repo, argv[1], argv[2])
              sys.exit(__doc__)


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          __CI_EOF__
          chmod +x "$d/destroy-approval.py"
          echo "$d" >>"$GITHUB_PATH"

      - name: No destroys in the plan
        if: github.event_name == 'pull_request' && needs.plan.outputs.has_destroys != 'true'
        run: echo "The plan destroys and replaces nothing." >>"$GITHUB_STEP_SUMMARY"

      # The name is read on main (destroy-approval.py STEP): only this step's
      # success means the destroys were approved.
      - name: Destroys approved after the plan
        if: github.event_name == 'pull_request' && needs.plan.outputs.has_destroys == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLANNED_AT: ${{ needs.plan.outputs.planned_at }}
        run: destroy-approval.py pr "$PR_NUMBER" "$PLANNED_AT"

      - name: The merged pull request approved the destroys
        id: merged
        if: github.event_name != 'pull_request'
        run: |
          # The caller's workflow file, e.g. ci.yml.
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          destroy-approval.py main "$GITHUB_SHA" "$wf"

  # Apply runs from main only. The environment allows deployments from main
  # and nothing else, and it is also what makes the OIDC token carry the
  # environment subject the apply identity is federated on.
  #
  # A plan that destroys or replaces anything is applied by a push only when
  # the merged pull request approved it after its plan (destroy job), or by
  # the manual run with allow-destroy. Otherwise the selection keeps those
  # units, since this run does not end as a success.
  apply:
    needs: [plan, destroy]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.plan.result == 'success'
      && needs.plan.outputs.has_changes == 'true'
      && (needs.plan.outputs.has_destroys != 'true' || inputs.allow-destroy
          || needs.destroy.outputs.approved == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ inputs.client-id-apply }}
      GITHUB_APP_VAULT: ${{ inputs.github-app-vault-apply }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bearclave/iac-modules
          path: iac-modules
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          for tool in "$@"; do
            "install_$tool"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('root.hcl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt
        run: install-tools.sh terragrunt

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      # The selection is the one the plan job made, not worked out again.
      # Deleted units go first: what replaces them under a new path may need
      # their names.
      - name: Destroy deleted units
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ env.MODULES_DIR }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          set -euo pipefail
          mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SELECTION")
          if [ "${#deleted[@]}" -eq 0 ]; then
            echo "No deleted unit."
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
          args=()
          for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
          cd "$RUNNER_TEMP/base"
          terragrunt run --all destroy "${args[@]}" --non-interactive --no-color

      - name: Apply
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ env.MODULES_DIR }}
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          set -euo pipefail
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
            echo "No unit to apply."
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          args=()
          for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
          terragrunt run --all apply "${args[@]}" --non-interactive --no-color

  # The required check. On a pull request: every check passed (or was
  # skipped). On main: in Azure DevOps a skipped apply stage left the run
  # green, so eight applies in a row never happened and nothing said so. An
  # apply that was due and did not succeed has to be red.
  gate:
    needs: [conventions, sentinel, changes, plan, destroy, apply]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checks passed
        if: github.event_name == 'pull_request'
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"

      - name: The apply had to run
        if: github.event_name != 'pull_request'
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
          PLAN_HAS_DESTROYS: ${{ needs.plan.outputs.has_destroys }}
          ALLOW_DESTROY: ${{ inputs.allow-destroy }}
          DESTROY_APPROVED: ${{ needs.destroy.outputs.approved }}
          APPLY_RESULT: ${{ needs.apply.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan ended as '$PLAN_RESULT'"
            exit 1
          fi
          if [ "$PLAN_HAS_CHANGES" != "true" ]; then
            echo "Plan proposed nothing, apply was skipped." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Red on purpose: the change is merged but not applied, and the next
          # run on main keeps it selected until someone applies it.
          if [ "$PLAN_HAS_DESTROYS" = "true" ] && [ "$ALLOW_DESTROY" != "true" ] \
            && [ "$DESTROY_APPROVED" != "true" ]; then
            msg="The plan destroys or replaces resources and the merged pull request did not approve them after its plan, so the apply did not run by itself."
            msg="$msg Check the plan of this run, then run the workflow on main by hand with allow_destroy."
            echo "::error::$msg"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$APPLY_RESULT" != "success" ]; then
            echo "::error::the plan proposed a change but apply ended as '$APPLY_RESULT'"
            exit 1
          fi
          echo "Apply went through." >>"$GITHUB_STEP_SUMMARY"
