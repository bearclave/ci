# GENERATED by tools/build.py from templates/terragrunt.yml - edit the template or src/, not this file.
# The pipeline of a Terragrunt repository with Azure state (iac-azure,
# iac-github):
#
# Pull request into main -> plan over the affected units, under the read-only
#                           identity, summarised into the pull request; one
#                           that touches none of the relevant paths skips the
#                           plan; conventions and Sentinel lint
# Push to main            -> plan again under the full identity, then apply,
#                           but only if the plan proposes something and
#                           destroys or replaces nothing
# Manual run on main      -> the same; with allow-destroy it also applies what
#                           destroys or replaces, which a push leaves waiting
#
# Which units run is worked out from the diff against the last commit a run on
# main went through with, so the units of a failed or held-back apply stay
# selected until they are applied. A deleted unit only exists in that commit
# and is planned and applied as a destroy from there. The selection does not
# pull in units that DEPEND on a changed one - that is what the weekly drift
# (terragrunt-drift.yml) over the whole tree is for.
#
# The caller owns the triggers and the concurrency group (a pull request in a
# group of its own; push, manual run and drift share one group per state):
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/terragrunt.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#         pull-requests: write
#         actions: read
#       with:
#         client-id-plan: ${{ vars.AZURE_CLIENT_ID_PLAN }}
#         client-id-apply: ${{ vars.AZURE_CLIENT_ID_PLATFORM }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#         scope: ${{ inputs.scope || 'changed' }}
#         allow-destroy: ${{ inputs.allow_destroy == true }}
#       secrets:
#         modules-deploy-key: ${{ secrets.MODULES_DEPLOY_KEY }}
#
# Versions: TERRAFORM_VERSION, TERRAGRUNT_*, TRIVY_* in the caller's
# .github/tool-versions.env. The required check is "pipeline / gate".
name: terragrunt

on:
  workflow_call:
    inputs:
      relevant-paths:
        description: Regular expression of the paths whose change needs a plan (grep -E over the changed files)
        type: string
        default: '^(mg-corp/|tenant/|_common/|\.github/)|^(root|account)\.hcl$'
      environment:
        description: Environment of the apply job; its branch policy allows main only
        type: string
        default: azure-prod
      client-id-plan:
        description: Client ID of the read-only identity a pull request plans as
        type: string
        required: true
      client-id-apply:
        description: Client ID of the identity that plans and applies on main
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        description: Default subscription of the azurerm provider; empty where the repository has none
        type: string
        default: ""
      conventions:
        description: Run the conventions check (conventions.yaml) on pull requests
        type: boolean
        default: true
      conventions-config:
        description: Path of the conventions file (default .github/conventions.yaml, or conventions.yaml where it is still in the root)
        type: string
        default: ""
      sentinel-lint:
        description: Run the Sentinel lint (sentinel-lint.yaml) on pull requests
        type: boolean
        default: false
      sentinel-config:
        description: Path of the Sentinel lint config (default .github/sentinel-lint.yaml, or sentinel-lint.yaml where it is still in the root)
        type: string
        default: ""
      principal-refs:
        description: Check that a principal a change creates is not referenced by display name (Entra)
        type: boolean
        default: false
      github-app-vault-plan:
        description: Key Vault with the read-only GitHub App a pull request signs in to GitHub with (iac-github)
        type: string
        default: ""
      github-app-vault-apply:
        description: Key Vault with the GitHub App main signs in with (iac-github)
        type: string
        default: ""
      scope:
        description: "changed = affected units only, all = the whole tree (manual runs)"
        type: string
        default: changed
      allow-destroy:
        description: Apply also what destroys or replaces resources (manual runs)
        type: boolean
        default: false
    secrets:
      modules-deploy-key:
        description: Read-only deploy key of bearclave/iac-modules
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  MODULES_DIR: ${{ github.workspace }}/iac-modules
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ inputs.tenant-id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}

jobs:
  # The rules in conventions.yaml; on a pull request only, main holds nothing
  # a pull request has not checked.
  conventions:
    if: github.event_name == 'pull_request' && inputs.conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conventions
        env:
          CONFIG: ${{ inputs.conventions-config }}
        run: |
          script="$RUNNER_TEMP/conventions.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks a repository against the conventions its conventions.yaml names.

          Usage: conventions.py <config.json> [<repository root>]

          The workflow converts conventions.yaml to JSON first (yq), so that this script
          needs nothing beyond the Python standard library. The config:

            rules:       <rule>: {level: error | warn | off, ...parameters}
            units:       globs of the unit files (terragrunt.hcl) for the terragrunt rules
            exceptions:  [{rule, path (a glob), match (optional text on the line),
                           reason}] - an exception without a reason is itself an error

          Every violation becomes a GitHub annotation on its file and line, and a row
          in the job summary. The exit code is 1 when an error-level violation is not
          covered by an exception, or when the config itself is wrong.

          The rules read HCL through the small parser below: blocks, attributes,
          strings, heredocs and comments, enough to know what is a `default` inside a
          `variable` block and what is a comment above an attribute. Expressions are
          kept as tokens, not evaluated.
          """
          import json
          import os
          import re
          import subprocess
          import sys

          # --------------------------------------------------------------------------
          # HCL tokens and structure

          GUID = r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
          RE_IDENT = re.compile(r"[A-Za-z_][A-Za-z0-9_-]*")
          RE_HEREDOC = re.compile(r"<<-?([A-Za-z_][A-Za-z0-9_]*)[ \t]*\n")


          class Token:
              __slots__ = ("kind", "value", "line")

              def __init__(self, kind, value, line):
                  self.kind, self.value, self.line = kind, value, line

              def __repr__(self):
                  return f"{self.kind}:{self.value!r}@{self.line}"


          def tokenize(text: str):
              """Tokens plus the set of lines that carry a comment."""
              tokens, comments = [], set()
              i, line, n = 0, 1, len(text)
              while i < n:
                  c = text[i]
                  if c == "\n":
                      tokens.append(Token("nl", "\n", line))
                      line += 1
                      i += 1
                  elif c in " \t\r":
                      i += 1
                  elif c == "#" or text.startswith("//", i):
                      comments.add(line)
                      while i < n and text[i] != "\n":
                          i += 1
                  elif text.startswith("/*", i):
                      end = text.find("*/", i + 2)
                      end = n if end < 0 else end + 2
                      for k in range(text.count("\n", i, end) + 1):
                          comments.add(line + k)
                      line += text.count("\n", i, end)
                      i = end
                  elif c == '"':
                      start_line = line
                      i, value = read_string(text, i + 1)
                      line += value.count("\n")
                      tokens.append(Token("str", value, start_line))
                  elif (m := RE_HEREDOC.match(text, i)):
                      marker, start_line = m.group(1), line
                      body_start = m.end()
                      j, body = body_start, []
                      line += 1
                      while j < n:
                          end = text.find("\n", j)
                          end = n if end < 0 else end
                          current = text[j:end]
                          if current.strip() == marker:
                              j = end
                              break
                          body.append(current)
                          line += 1
                          j = end + 1
                      tokens.append(Token("str", "\n".join(body), start_line))
                      i = j
                  elif (m := RE_IDENT.match(text, i)):
                      tokens.append(Token("ident", m.group(0), line))
                      i = m.end()
                  else:
                      tokens.append(Token("punct", c, line))
                      i += 1
              tokens.append(Token("nl", "\n", line))
              return tokens, comments


          def read_string(text: str, i: int):
              """The raw content of a quoted string from i to its closing quote."""
              out, n, depth = [], len(text), 0
              while i < n:
                  c = text[i]
                  if c == "\\" and i + 1 < n:
                      out.append(text[i:i + 2])
                      i += 2
                      continue
                  if depth == 0 and c == '"':
                      return i + 1, "".join(out)
                  if text.startswith(("${", "%{"), i):
                      depth += 1
                      out.append(text[i:i + 2])
                      i += 2
                      continue
                  if depth and c == "{":
                      depth += 1
                  elif depth and c == "}":
                      depth -= 1
                  elif depth and c == '"':
                      j, inner = read_string(text, i + 1)
                      out.append('"' + inner + '"')
                      i = j
                      continue
                  out.append(c)
                  i += 1
              return n, "".join(out)


          class Block:
              def __init__(self, kind, labels, line):
                  self.kind, self.labels, self.line = kind, labels, line
                  self.attrs, self.blocks = {}, []

              def find(self, kind):
                  return [b for b in self.blocks if b.kind == kind]


          class Attr:
              def __init__(self, name, line, value):
                  self.name, self.line, self.value = name, line, value

              def string(self):
                  """The value when it is one plain string, else None."""
                  if len(self.value) == 1 and self.value[0].kind == "str":
                      return self.value[0].value
                  return None

              def text(self):
                  return "".join(t.value if t.kind != "str" else f'"{t.value}"' for t in self.value)


          OPEN, CLOSE = "([{", ")]}"


          def parse(tokens):
              root = Block("<file>", [], 1)
              body(tokens, 0, root)
              return root


          def body(tokens, i, block):
              """Fills block from tokens[i] up to its closing brace; returns the index after."""
              n = len(tokens)
              while i < n:
                  t = tokens[i]
                  if t.kind == "nl":
                      i += 1
                      continue
                  if t.kind == "punct" and t.value == "}":
                      return i + 1
                  if t.kind == "ident":
                      j = i + 1
                      if j < n and tokens[j].kind == "punct" and tokens[j].value in "=:":
                          start, depth, k = j + 1, 0, j + 1
                          while k < n:
                              tk = tokens[k]
                              if tk.kind == "punct" and tk.value in OPEN:
                                  depth += 1
                              elif tk.kind == "punct" and tk.value in CLOSE:
                                  if depth == 0:
                                      break
                                  depth -= 1
                              elif tk.kind == "nl" and depth == 0:
                                  break
                              k += 1
                          value = [x for x in tokens[start:k] if x.kind != "nl"]
                          block.attrs[t.value] = Attr(t.value, t.line, value)
                          i = k
                          continue
                      labels = []
                      while j < n and tokens[j].kind in ("str", "ident"):
                          labels.append(tokens[j].value)
                          j += 1
                      if j < n and tokens[j].kind == "punct" and tokens[j].value == "{":
                          child = Block(t.value, labels, t.line)
                          block.blocks.append(child)
                          i = body(tokens, j + 1, child)
                          continue
                  i += 1
              return i


          def literal(tokens):
              """A literal value (string, number, bool, list, object) from tokens, or None."""
              try:
                  value, rest = _literal(tokens, 0)
              except (IndexError, ValueError):
                  return None
              return value if rest == len(tokens) else None


          def _literal(tokens, i):
              t = tokens[i]
              if t.kind == "str":
                  return t.value, i + 1
              if t.kind == "ident" and t.value in ("true", "false", "null"):
                  return {"true": True, "false": False, "null": None}[t.value], i + 1
              if t.kind == "punct" and t.value == "[":
                  out, i = [], i + 1
                  while not (tokens[i].kind == "punct" and tokens[i].value == "]"):
                      v, i = _literal(tokens, i)
                      out.append(v)
                      if tokens[i].kind == "punct" and tokens[i].value == ",":
                          i += 1
                  return out, i + 1
              if t.kind == "punct" and t.value == "{":
                  out, i = {}, i + 1
                  while not (tokens[i].kind == "punct" and tokens[i].value == "}"):
                      key = tokens[i].value
                      if tokens[i + 1].kind != "punct" or tokens[i + 1].value not in "=:":
                          raise ValueError("not an object")
                      v, i = _literal(tokens, i + 2)
                      out[key] = v
                      if tokens[i].kind == "punct" and tokens[i].value == ",":
                          i += 1
                  return out, i + 1
              raise ValueError("not a literal")


          def load(path):
              with open(path, encoding="utf-8") as fh:
                  tokens, comments = tokenize(fh.read())
              return parse(tokens), tokens, comments


          # --------------------------------------------------------------------------
          # The repository

          def glob_re(pattern: str):
              """A glob where * stays within a directory and **/ spans any number of them."""
              out, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif pattern[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  elif pattern[i] == "?":
                      out, i = out + "[^/]", i + 1
                  else:
                      out, i = out + re.escape(pattern[i]), i + 1
              return re.compile(out + r"\Z")


          def matches(path: str, *patterns) -> bool:
              return any(glob_re(p).match(path) for p in patterns)


          class Repo:
              def __init__(self, root):
                  self.root = root
                  out = subprocess.run(["git", "ls-files"], cwd=root, capture_output=True,
                                       text=True, check=True).stdout
                  self.files = sorted(f for f in out.splitlines() if os.path.isfile(os.path.join(root, f)))
                  self._cache = {}

              def glob(self, *patterns):
                  return [f for f in self.files if matches(f, *patterns)]

              def hcl(self, path):
                  if path not in self._cache:
                      self._cache[path] = load(os.path.join(self.root, path))
                  return self._cache[path]

              def exists(self, path):
                  return path in self.files


          class Report:
              def __init__(self):
                  self.items = []

              def add(self, rule, path, line, message):
                  self.items.append({"rule": rule, "path": path, "line": line, "message": message})


          # --------------------------------------------------------------------------
          # Rules. Each takes (repo, params, units, report) and adds what it finds.

          def rule_variable_no_default(repo, params, units, report):
              """Module variables have no default; `optional(type, default)` counts too."""
              for path in repo.glob(*params.get("files", ["**/*.tf"])):
                  root, _, _ = repo.hcl(path)
                  for var in root.find("variable"):
                      name = var.labels[0] if var.labels else "?"
                      if "default" in var.attrs:
                          report.add("variable-no-default", path, var.attrs["default"].line,
                                     f'variable "{name}" has a default')
                      if "type" in var.attrs:
                          for line in optional_defaults(var.attrs["type"].value):
                              report.add("variable-no-default", path, line,
                                         f'variable "{name}": optional() with a default')


          def optional_defaults(tokens):
              """Lines of optional(...) calls that pass a second argument."""
              out = []
              for k, t in enumerate(tokens):
                  if t.kind == "ident" and t.value == "optional" and k + 1 < len(tokens) \
                          and tokens[k + 1].value == "(":
                      depth, j = 0, k + 1
                      while j < len(tokens):
                          v = tokens[j]
                          if v.kind == "punct" and v.value in OPEN:
                              depth += 1
                          elif v.kind == "punct" and v.value in CLOSE:
                              depth -= 1
                              if depth == 0:
                                  break
                          elif v.kind == "punct" and v.value == "," and depth == 1:
                              out.append(t.line)
                              break
                          j += 1
              return out


          def rule_variable_documented(repo, params, units, report):
              """Every module variable says what it is (description) and what it takes (type)."""
              for path in repo.glob(*params.get("files", ["**/*.tf"])):
                  root, _, _ = repo.hcl(path)
                  for var in root.find("variable"):
                      missing = [a for a in ("description", "type") if a not in var.attrs]
                      if missing:
                          report.add("variable-documented", path, var.line,
                                     f'variable "{var.labels[0] if var.labels else "?"}" has no '
                                     + " and no ".join(missing))


          def rule_module_source(repo, params, units, report):
              """A unit takes its module from git, through the modules and modules_ref of root.hcl."""
              pattern = re.compile(params.get(
                  "pattern", r"^\$\{include\.root\.locals\.modules\}//[^?]+\?ref=\$\{include\.root\.locals\.modules_ref\}$"))
              for path in units:
                  root, _, _ = repo.hcl(path)
                  sources = [b.attrs["source"] for b in root.find("terraform") if "source" in b.attrs]
                  if not sources:
                      report.add("module-source", path, 1, "the unit names no terraform source")
                  for attr in sources:
                      value = attr.string()
                      if value is None or not pattern.match(value):
                          report.add("module-source", path, attr.line,
                                     f"source {attr.text()} is not the module from git with modules_ref")


          def rule_dependencies_in_common(repo, params, units, report):
              """A dependency is declared once, in the shared directory, with its mocks."""
              where = params.get("dir", "_common/deps")
              for path in units:
                  root, _, _ = repo.hcl(path)
                  for dep in root.find("dependency"):
                      report.add("dependencies-in-common", path, dep.line,
                                 f'dependency "{dep.labels[0] if dep.labels else "?"}" belongs in {where}/')


          def rule_mock_outputs(repo, params, units, report):
              """Every dependency has mocks, and the mocks never reach an apply or a destroy."""
              where = params.get("dir", "_common/deps").rstrip("/")
              forbidden = set(params.get("forbidden_commands", ["apply", "destroy"]))
              mocks = {}
              if params.get("mocks_file") and repo.exists(params["mocks_file"]):
                  mroot, _, _ = repo.hcl(params["mocks_file"])
                  for loc in mroot.find("locals"):
                      for name, attr in loc.attrs.items():
                          mocks[name] = literal(attr.value)
              for path in repo.glob(f"{where}/*.hcl"):
                  root, _, _ = repo.hcl(path)
                  for dep in root.find("dependency"):
                      label = dep.labels[0] if dep.labels else "?"
                      for needed in ("mock_outputs", "mock_outputs_allowed_terraform_commands"):
                          if needed not in dep.attrs:
                              report.add("mock-outputs", path, dep.line, f'dependency "{label}" has no {needed}')
                      attr = dep.attrs.get("mock_outputs_allowed_terraform_commands")
                      if not attr:
                          continue
                      commands = literal(attr.value)
                      ref = attr.text()
                      if commands is None and (m := re.fullmatch(r"local\.mocks\.(\w+)", ref)):
                          commands = mocks.get(m.group(1))
                      if not isinstance(commands, list):
                          report.add("mock-outputs", path, attr.line,
                                     f"cannot tell which commands {ref} allows")
                      elif bad := sorted(forbidden & set(commands)):
                          report.add("mock-outputs", path, attr.line,
                                     f'dependency "{label}" allows its mocks in {", ".join(bad)}')


          def rule_tags_required(repo, params, units, report):
              """Context files carry the tags their level owns, with an allowed value."""
              allowed = {}
              if params.get("allowed_values") and repo.exists(params["allowed_values"]):
                  aroot, _, _ = repo.hcl(params["allowed_values"])
                  for loc in aroot.find("locals"):
                      if "allowed" in loc.attrs:
                          allowed = literal(loc.attrs["allowed"].value) or {}
              for name, keys in (params.get("files") or {}).items():
                  for path in repo.glob(f"**/{name}"):
                      root, _, _ = repo.hcl(path)
                      attrs = {}
                      for loc in root.find("locals"):
                          attrs.update(loc.attrs)
                      for key in keys:
                          if key not in attrs:
                              report.add("tags-required", path, 1, f"{name} sets no {key}")
                              continue
                          value = attrs[key].string()
                          if key in allowed and value not in allowed[key]:
                              report.add("tags-required", path, attrs[key].line,
                                         f"{key} = {attrs[key].text()} is not one of {', '.join(allowed[key])}")


          def rule_no_hardcoded_ids(repo, params, units, report):
              """Units take subscription and tenant IDs from the context, never written out."""
              known = set()
              for path in repo.glob(*params.get("id_files", ["account.hcl", "**/subscription.hcl"])):
                  _, tokens, _ = repo.hcl(path)
                  known |= {t.value.lower() for t in tokens if t.kind == "str" and re.fullmatch(GUID, t.value)}
              sub = re.compile(r"/subscriptions/" + GUID, re.I)
              for path in units:
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind != "str":
                          continue
                      if sub.search(t.value):
                          report.add("no-hardcoded-ids", path, t.line, "a resource ID with a subscription written out")
                      elif any(g.lower() in known for g in re.findall(GUID, t.value)):
                          report.add("no-hardcoded-ids", path, t.line,
                                     "a subscription or tenant ID written out instead of taken from the context")


          def rule_no_hardcoded_location(repo, params, units, report):
              """The region comes from region.hcl."""
              regions = {r.lower() for r in params.get("locations", [])}
              for path in units:
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind == "str" and t.value.lower() in regions:
                          report.add("no-hardcoded-location", path, t.line,
                                     f'region "{t.value}" written out instead of taken from region.hcl')


          def rule_no_envcommon(repo, params, units, report):
              """No _envcommon: every unit carries its own inputs."""
              for path in repo.files:
                  if "_envcommon/" in f"/{path}" or path.startswith("_envcommon/"):
                      report.add("no-envcommon", path, 1, "_envcommon is not used here")


          def rule_lock_none_needs_reason(repo, params, units, report):
              """An unlocked resource in a resource group of high criticality says why."""
              levels = set(params.get("criticality", ["high"]))
              for path in units:
                  root, _, comments = repo.hcl(path)
                  attr = None
                  for item in [root] + root.blocks:
                      if "inputs" in item.attrs:
                          obj = item.attrs["inputs"]
                          for k, t in enumerate(obj.value):
                              if t.kind == "ident" and t.value == "lock" and k + 2 < len(obj.value) \
                                      and obj.value[k + 1].value in "=:" and obj.value[k + 2].kind == "str":
                                  attr = (t.line, obj.value[k + 2].value)
                  if not attr or attr[1] != "none":
                      continue
                  rg = nearest(repo, os.path.dirname(path), "rg.hcl")
                  if not rg:
                      continue
                  rroot, _, _ = repo.hcl(rg)
                  crit = None
                  for loc in rroot.find("locals"):
                      if "criticality" in loc.attrs:
                          crit = loc.attrs["criticality"].string()
                  line = attr[0]
                  if crit in levels and line not in comments and (line - 1) not in comments:
                      report.add("lock-none-needs-reason", path, line,
                                 f'lock = "none" in a resource group of criticality {crit}, with no comment saying why')


          def nearest(repo, directory, name):
              while True:
                  candidate = os.path.join(directory, name) if directory else name
                  if repo.exists(candidate):
                      return candidate
                  if not directory:
                      return None
                  directory = os.path.dirname(directory)


          RULES = {
              "variable-no-default": rule_variable_no_default,
              "variable-documented": rule_variable_documented,
              "module-source": rule_module_source,
              "dependencies-in-common": rule_dependencies_in_common,
              "mock-outputs": rule_mock_outputs,
              "tags-required": rule_tags_required,
              "no-hardcoded-ids": rule_no_hardcoded_ids,
              "no-hardcoded-location": rule_no_hardcoded_location,
              "no-envcommon": rule_no_envcommon,
              "lock-none-needs-reason": rule_lock_none_needs_reason,
          }
          LEVELS = ("error", "warn", "off")


          # --------------------------------------------------------------------------

          def check(config: dict, root: str):
              """(violations with their level and exception, config errors)."""
              errors = []
              rules = config.get("rules") or {}
              for name, params in rules.items():
                  if name not in RULES:
                      errors.append(f"unknown rule {name!r}; known: {', '.join(sorted(RULES))}")
                  elif (params or {}).get("level", "error") not in LEVELS:
                      errors.append(f"rule {name}: level must be one of {', '.join(LEVELS)}")
              exceptions = config.get("exceptions") or []
              for k, e in enumerate(exceptions):
                  if not str(e.get("reason", "")).strip():
                      errors.append(f"exception {k + 1} ({e.get('rule')}, {e.get('path')}) has no reason")
                  if e.get("rule") not in RULES:
                      errors.append(f"exception {k + 1} names an unknown rule {e.get('rule')!r}")
              if errors:
                  return [], errors

              repo = Repo(root)
              units = repo.glob(*(config.get("units") or []))
              report = Report()
              for name, params in rules.items():
                  params = params or {}
                  if params.get("level", "error") == "off":
                      continue
                  try:
                      RULES[name](repo, params, units, report)
                  except (OSError, ValueError) as e:
                      errors.append(f"rule {name} could not run: {e}")
              lines = {}
              for v in report.items:
                  v["level"] = (rules[v["rule"]] or {}).get("level", "error")
                  v["exception"] = None
                  for e in exceptions:
                      if e["rule"] != v["rule"] or not matches(v["path"], e.get("path", "**")):
                          continue
                      if e.get("match"):
                          if v["path"] not in lines:
                              with open(os.path.join(root, v["path"]), encoding="utf-8") as fh:
                                  lines[v["path"]] = fh.read().splitlines()
                          text = lines[v["path"]][v["line"] - 1] if 0 < v["line"] <= len(lines[v["path"]]) else ""
                          if e["match"] not in text and e["match"] not in v["message"]:
                              continue
                      v["exception"] = e["reason"]
                      break
              return report.items, errors


          def escape(text: str) -> str:
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(config_path: str, root: str = ".") -> int:
              with open(config_path, encoding="utf-8") as fh:
                  config = json.load(fh) or {}
              violations, errors = check(config, root)
              for e in errors:
                  print(f"::error title=conventions::{escape(e)}")
              failing = 0
              for v in violations:
                  if v["exception"]:
                      continue
                  kind = "error" if v["level"] == "error" else "warning"
                  failing += kind == "error"
                  print(f"::{kind} file={v['path']},line={v['line']},title={v['rule']}::{escape(v['message'])}")

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              out = ["## Conventions", ""]
              active = [v for v in violations if not v["exception"]]
              accepted = [v for v in violations if v["exception"]]
              if not violations and not errors:
                  out.append("Every rule holds.")
              for title, rows, extra in (("Violations", active, "level"), ("Accepted", accepted, "exception")):
                  if not rows:
                      continue
                  out += ["", f"### {title}", "", f"| Rule | Where | What | {extra.capitalize()} |", "|---|---|---|---|"]
                  out += [f"| {v['rule']} | `{v['path']}:{v['line']}` | {v['message'].replace('|', '/')} "
                          f"| {str(v[extra]).replace('|', '/')} |" for v in rows]
              if errors:
                  out += ["", "### Config errors", ""] + [f"- {e}" for e in errors]
              text = "\n".join(out) + "\n"
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 1 if failing or errors else 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
          __CI_EOF__
          if [ -z "$CONFIG" ]; then
            CONFIG=.github/conventions.yaml
            [ -f "$CONFIG" ] || CONFIG=conventions.yaml
          fi
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found"
            exit 1
          fi
          yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/conventions.json"
          python3 "$script" "$RUNNER_TEMP/conventions.json" .

  # The analytic rules, against what Sentinel takes (sentinel-lint.yaml).
  sentinel:
    if: github.event_name == 'pull_request' && inputs.sentinel-lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analytic rules
        env:
          CONFIG: ${{ inputs.sentinel-config }}
        run: |
          script="$RUNNER_TEMP/sentinel_lint.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks Microsoft Sentinel analytic rules before they are deployed.

          Usage: sentinel_lint.py <config.json> [<repository root>]

          The workflow converts sentinel-lint.yaml to JSON first (yq). The config:

            rules:       [{path, format, substitutions_from}]
                         format "pair": <name>.json with kind and properties, the query
                         in <name>.kql beside it, ${name} placeholders filled from the
                         `substitutions` of the terragrunt.hcl in substitutions_from.
                         format "arm": ARM templates whose resources include
                         .../alertRules, the query inside.
            watchlists:  files that define watchlists; an alias is `alias = "X"` (HCL)
                         or "watchlistAlias": "X" (ARM)
            checks:      {<check>: error | warn | off}, error when not listed
            exceptions:  [{check, rule (a glob of the file), reason}]

          What a deploy would only reject after the merge, or would accept and then
          quietly do the wrong thing with, is caught here: a broken {{column}} in the
          alert name, a tactic Sentinel does not know, more entities than Sentinel takes,
          a frequency longer than the period it looks at (events in between are never
          seen), grouping by an entity the rule does not map, a watchlist that does not
          exist. The limits and the enumerations follow the alertRules REST API.
          """
          import json
          import os
          import re
          import subprocess
          import sys

          TACTICS = {
              "Reconnaissance", "ResourceDevelopment", "InitialAccess", "Execution", "Persistence",
              "PrivilegeEscalation", "DefenseEvasion", "CredentialAccess", "Discovery", "LateralMovement",
              "Collection", "Exfiltration", "CommandAndControl", "Impact", "PreAttack",
              "ImpairProcessControl", "InhibitResponseFunction",
          }
          ENTITY_TYPES = {
              "Account", "Host", "IP", "Malware", "File", "Process", "CloudApplication", "DNS",
              "AzureResource", "FileHash", "RegistryKey", "RegistryValue", "SecurityGroup", "URL",
              "Mailbox", "MailCluster", "MailMessage", "SubmissionMail",
          }
          KINDS = {"Scheduled", "NRT", "Fusion", "MicrosoftSecurityIncidentCreation",
                   "MLBehaviorAnalytics", "ThreatIntelligence"}
          SEVERITIES = {"High", "Medium", "Low", "Informational"}
          OPERATORS = {"GreaterThan", "LessThan", "Equal", "NotEqual"}
          ALERT_DETAILS = {"DisplayName", "Severity"}
          MAX_ENTITIES, MAX_FIELDS, MAX_CUSTOM, MAX_PARAMS = 10, 3, 20, 3
          MIN_SCHEDULE, MAX_SCHEDULE = 5 * 60, 14 * 86400

          CHECKS = ("json-valid", "kql-present", "kind", "severity", "schedule", "trigger", "tactics",
                    "techniques", "alert-details", "entities", "custom-details", "grouping",
                    "unique-name", "substitutions", "watchlist-exists")
          LEVELS = ("error", "warn", "off")

          RE_DURATION = re.compile(r"^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$")
          RE_PLACEHOLDER = re.compile(r"\$\{(\w+)\}")
          RE_COLUMN = re.compile(r"\{\{([^{}]*)\}\}")
          RE_WATCHLIST = re.compile(r"_GetWatchlist\(\s*['\"]([^'\"]+)['\"]")
          RE_ALIAS = re.compile(r"""(?:\balias\s*=\s*"([^"]+)"|"watchlistAlias"\s*:\s*"([^"]+)")""")


          def seconds(duration):
              m = RE_DURATION.match(duration or "")
              if not m or duration in ("P", "PT"):
                  return None
              d, h, mi, s = (int(x or 0) for x in m.groups())
              return ((d * 24 + h) * 60 + mi) * 60 + s


          def glob_re(pattern: str):
              out, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif pattern[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  else:
                      out, i = out + re.escape(pattern[i]), i + 1
              return re.compile(out + r"\Z")


          class Rule:
              """One analytic rule, whichever format it came from."""

              def __init__(self, path, kind, props, query, text, placeholders=()):
                  self.path, self.kind, self.props, self.query = path, kind, props, query
                  self.text, self.placeholders = text, set(placeholders)

              def line(self, key):
                  """The line where the key first appears in the file, or 1."""
                  pos = self.text.find(f'"{key}"')
                  return self.text.count("\n", 0, pos) + 1 if pos >= 0 else 1

              @property
              def name(self):
                  return self.props.get("displayName") or os.path.basename(self.path)


          def tracked(root):
              out = subprocess.run(["git", "ls-files"], cwd=root, capture_output=True, text=True,
                                   check=True).stdout
              return sorted(out.splitlines())


          def substitution_keys(path):
              """The keys of `substitutions = { ... }` in a terragrunt.hcl."""
              text = open(path, encoding="utf-8").read()
              m = re.search(r"\bsubstitutions\s*=\s*\{", text)
              if not m:
                  return set()
              depth, i, keys = 1, m.end(), set()
              line_start = True
              while i < len(text) and depth:
                  c = text[i]
                  if c == "{" or c == "(" or c == "[":
                      depth += 1
                  elif c in "})]":
                      depth -= 1
                  elif c == "\n":
                      line_start = True
                      i += 1
                      continue
                  if line_start and depth == 1:
                      km = re.match(r"\s*([A-Za-z_]\w*)\s*=", text[i:])
                      if km:
                          keys.add(km.group(1))
                  line_start = False
                  i += 1
              return keys


          def load_rules(config, root, files, report):
              rules = []
              for source in config.get("rules") or []:
                  base = source["path"].rstrip("/") + "/"
                  fmt = source.get("format", "pair")
                  subs = None
                  if fmt == "pair" and source.get("substitutions_from"):
                      subs = substitution_keys(os.path.join(root, source["substitutions_from"]))
                  for path in files:
                      if not path.startswith(base) or not path.endswith(".json"):
                          continue
                      full = os.path.join(root, path)
                      text = open(full, encoding="utf-8-sig").read()
                      if fmt == "pair":
                          try:
                              data = json.loads(RE_PLACEHOLDER.sub("0", text), strict=False)
                          except ValueError as e:
                              report.add("json-valid", path, 1, os.path.basename(path), f"not valid JSON: {e}")
                              continue
                          kql_path = full[:-5] + ".kql"
                          query = open(kql_path, encoding="utf-8").read() if os.path.exists(kql_path) else None
                          found = set(RE_PLACEHOLDER.findall(text)) | set(RE_PLACEHOLDER.findall(query or ""))
                          rule = Rule(path, data.get("kind"), data.get("properties") or {}, query, text, found)
                          rule.substitutions = subs
                          rule.query_path = kql_path[len(root) + 1:] if query is not None else None
                          rules.append(rule)
                      else:
                          try:
                              data = json.loads(text, strict=False)
                          except ValueError as e:
                              report.add("json-valid", path, 1, os.path.basename(path), f"not valid JSON: {e}")
                              continue
                          for res in data.get("resources") or []:
                              if not str(res.get("type", "")).endswith("alertRules"):
                                  continue
                              props = res.get("properties") or {}
                              rule = Rule(path, res.get("kind"), props, props.get("query"), text)
                              rule.substitutions = None
                              rule.query_path = None
                              rules.append(rule)
              return rules


          class Report:
              def __init__(self):
                  self.items = []

              def add(self, check, path, line, rule, message):
                  self.items.append({"check": check, "path": path, "line": line, "rule": rule,
                                     "message": message})


          def lint(rule, report, aliases):
              p, add = rule.props, (lambda check, key, msg: report.add(check, rule.path, rule.line(key), rule.name, msg))
              scheduled = rule.kind in ("Scheduled", "NRT")

              if rule.kind not in KINDS:
                  add("kind", "kind", f"kind {rule.kind!r} is not one Sentinel knows")
              if scheduled and not (rule.query or "").strip():
                  add("kql-present", "displayName", "no query" + (" (the .kql beside it is missing)"
                                                                  if rule.query is None else ""))
              if "severity" in p and p["severity"] not in SEVERITIES:
                  add("severity", "severity", f"severity {p['severity']!r} is not one of {', '.join(sorted(SEVERITIES))}")

              if rule.kind == "Scheduled":
                  freq, period = seconds(p.get("queryFrequency")), seconds(p.get("queryPeriod"))
                  for key, value in (("queryFrequency", freq), ("queryPeriod", period)):
                      if value is None:
                          add("schedule", key, f"{key} {p.get(key)!r} is not an ISO 8601 duration")
                      elif not MIN_SCHEDULE <= value <= MAX_SCHEDULE:
                          add("schedule", key, f"{key} {p.get(key)} is outside 5 minutes to 14 days")
                  if freq and period and freq > period:
                      add("schedule", "queryFrequency",
                          f"runs every {p['queryFrequency']} but looks back only {p['queryPeriod']}: "
                          "events in between are never seen")
                  if p.get("suppressionEnabled") and seconds(p.get("suppressionDuration")) is None:
                      add("schedule", "suppressionDuration",
                          f"suppressionDuration {p.get('suppressionDuration')!r} is not an ISO 8601 duration")
                  if p.get("triggerOperator") not in OPERATORS:
                      add("trigger", "triggerOperator", f"triggerOperator {p.get('triggerOperator')!r} is not one of "
                          + ", ".join(sorted(OPERATORS)))
                  threshold = p.get("triggerThreshold")
                  if not isinstance(threshold, int) or isinstance(threshold, bool) or threshold < 0:
                      add("trigger", "triggerThreshold", f"triggerThreshold {threshold!r} is not a whole number from 0")

              for tactic in p.get("tactics") or []:
                  if tactic not in TACTICS:
                      add("tactics", "tactics", f"tactic {tactic!r} is not one Sentinel knows")
              techniques = p.get("techniques") or []
              for technique in techniques:
                  if not re.fullmatch(r"T\d{4}", str(technique)):
                      add("techniques", "techniques", f"technique {technique!r} is not T plus four digits "
                          "(a sub-technique belongs in subTechniques)")
              for sub in p.get("subTechniques") or []:
                  if not re.fullmatch(r"T\d{4}\.\d{3}", str(sub)):
                      add("techniques", "subTechniques", f"sub-technique {sub!r} is not Tdddd.ddd")
                  elif sub.split(".")[0] not in techniques:
                      add("techniques", "subTechniques", f"sub-technique {sub} without its technique {sub.split('.')[0]}")

              override = p.get("alertDetailsOverride") or {}
              for key in ("alertDisplayNameFormat", "alertDescriptionFormat"):
                  text = override.get(key)
                  if not text:
                      continue
                  stripped = RE_COLUMN.sub("", text)
                  if "{{" in text and ("{" in stripped or "}" in stripped):
                      add("alert-details", key, f"{key} has a broken {{{{column}}}}: {text.strip()[:80]!r}")
                  columns = set(RE_COLUMN.findall(text))
                  if len(columns) > MAX_PARAMS:
                      add("alert-details", key, f"{key} uses {len(columns)} columns; Sentinel takes at most {MAX_PARAMS}")

              mappings = p.get("entityMappings") or []
              if len(mappings) > MAX_ENTITIES:
                  add("entities", "entityMappings", f"{len(mappings)} entity mappings; Sentinel takes at most {MAX_ENTITIES}")
              for m in mappings:
                  etype, fields = m.get("entityType"), m.get("fieldMappings") or []
                  if etype not in ENTITY_TYPES:
                      add("entities", "entityMappings", f"entity type {etype!r} is not one Sentinel knows")
                  if not 1 <= len(fields) <= MAX_FIELDS:
                      add("entities", "entityMappings", f"{etype} maps {len(fields)} identifiers; "
                          f"Sentinel takes 1 to {MAX_FIELDS}")

              custom = p.get("customDetails") or {}
              if len(custom) > MAX_CUSTOM:
                  add("custom-details", "customDetails", f"{len(custom)} custom details; Sentinel takes at most {MAX_CUSTOM}")

              grouping = ((p.get("incidentConfiguration") or {}).get("groupingConfiguration") or {})
              if grouping.get("enabled"):
                  by_entities = grouping.get("groupByEntities") or []
                  by_details = grouping.get("groupByAlertDetails") or []
                  by_custom = grouping.get("groupByCustomDetails") or []
                  if grouping.get("matchingMethod") == "Selected" and not (by_entities or by_details or by_custom):
                      add("grouping", "matchingMethod", "matchingMethod Selected with nothing to group by")
                  mapped = {m.get("entityType") for m in mappings}
                  for e in by_entities:
                      if e not in mapped:
                          add("grouping", "groupByEntities", f"groups by {e}, which the rule does not map")
                  for d in by_details:
                      if d not in ALERT_DETAILS:
                          add("grouping", "groupByAlertDetails", f"groups by alert detail {d!r}; only DisplayName and Severity")
                  for c in by_custom:
                      if c not in custom:
                          add("grouping", "groupByCustomDetails", f"groups by custom detail {c}, which the rule does not define")

              if rule.substitutions is not None:
                  for name in sorted(rule.placeholders - rule.substitutions):
                      # Spelled out: the two characters together would start an
                      # expression in the workflow this script is carried in.
                      add("substitutions", "displayName", "$" + "{" + name + "} is not in the substitutions of the unit")

              if aliases is not None:
                  for alias in sorted(set(RE_WATCHLIST.findall(rule.query or ""))):
                      if alias not in aliases:
                          report.add("watchlist-exists", rule.query_path or rule.path, 1, rule.name,
                                     f"_GetWatchlist('{alias}'): no such watchlist in the code")


          def check(config, root):
              errors = []
              levels = config.get("checks") or {}
              for name, level in levels.items():
                  if name not in CHECKS:
                      errors.append(f"unknown check {name!r}; known: {', '.join(CHECKS)}")
                  elif level not in LEVELS:
                      errors.append(f"check {name}: level must be one of {', '.join(LEVELS)}")
              exceptions = config.get("exceptions") or []
              for k, e in enumerate(exceptions):
                  if not str(e.get("reason", "")).strip():
                      errors.append(f"exception {k + 1} ({e.get('check')}, {e.get('rule')}) has no reason")
                  if e.get("check") not in CHECKS:
                      errors.append(f"exception {k + 1} names an unknown check {e.get('check')!r}")
              if not config.get("rules"):
                  errors.append("rules: no path to analytic rules given")
              if errors:
                  return [], errors, 0

              files = tracked(root)
              report = Report()
              rules = load_rules(config, root, files, report)
              aliases = None
              if config.get("watchlists"):
                  aliases = set()
                  for path in files:
                      if any(glob_re(g).match(path) for g in config["watchlists"]):
                          text = open(os.path.join(root, path), encoding="utf-8-sig").read()
                          aliases |= {a or b for a, b in RE_ALIAS.findall(text)}
              names = {}
              for rule in rules:
                  lint(rule, report, aliases)
                  names.setdefault(rule.name, []).append(rule)
              for name, same in names.items():
                  if len(same) > 1:
                      for rule in same:
                          report.add("unique-name", rule.path, rule.line("displayName"), name,
                                     f"{len(same)} rules are called {name!r}")

              out = []
              for v in report.items:
                  v["level"] = levels.get(v["check"], "error")
                  if v["level"] == "off":
                      continue
                  v["exception"] = next((e["reason"] for e in exceptions
                                         if e["check"] == v["check"] and glob_re(e.get("rule", "**")).match(v["path"])),
                                        None)
                  out.append(v)
              return out, errors, len(rules)


          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(config_path, root="."):
              with open(config_path, encoding="utf-8") as fh:
                  config = json.load(fh) or {}
              violations, errors, count = check(config, root)
              for e in errors:
                  print(f"::error title=sentinel-lint::{escape(e)}")
              failing = 0
              for v in violations:
                  if v["exception"]:
                      continue
                  kind = "error" if v["level"] == "error" else "warning"
                  failing += kind == "error"
                  print(f"::{kind} file={v['path']},line={v['line']},title={v['check']}::{escape(v['message'])}")
              active = [v for v in violations if not v["exception"]]
              accepted = [v for v in violations if v["exception"]]
              out = ["## Sentinel content", "", f"{count} analytic rules checked."]
              for title, rows, extra in (("Findings", active, "level"), ("Accepted", accepted, "exception")):
                  if rows:
                      out += ["", f"### {title}", "", f"| Check | Rule | What | {extra.capitalize()} |", "|---|---|---|---|"]
                      out += [f"| {v['check']} | `{v['path']}:{v['line']}` | {v['message'].replace('|', '/')} "
                              f"| {str(v[extra]).replace('|', '/')} |" for v in rows]
              if errors:
                  out += ["", "### Config errors", ""] + [f"- {e}" for e in errors]
              text = "\n".join(out) + "\n"
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 1 if failing or errors else 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
          __CI_EOF__
          if [ -z "$CONFIG" ]; then
            CONFIG=.github/sentinel-lint.yaml
            [ -f "$CONFIG" ] || CONFIG=sentinel-lint.yaml
          fi
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found"
            exit 1
          fi
          yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/sentinel-lint.json"
          python3 "$script" "$RUNNER_TEMP/sentinel-lint.json" .

  # A skipped job reports as passed, so a pull request outside the relevant
  # paths is green without a plan. Outside a pull request the caller's push
  # paths have already decided.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Paths the change touches
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RELEVANT: ${{ inputs.relevant-paths }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A file list that cannot be read plans rather than skips.
          if ! files=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only); then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE "$RELEVANT" <<<"$files"; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
          else
            echo "relevant=false" >>"$GITHUB_OUTPUT"
            echo "Nothing to plan: the change touches no unit, context file or workflow." >>"$GITHUB_STEP_SUMMARY"
          fi

  plan:
    needs: changes
    # !cancelled() so that a failed changes job still plans instead of skipping.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      # The base commit is the head of the last successful run on main.
      actions: read
    outputs:
      has_changes: ${{ steps.summary.outputs.has_changes }}
      has_destroys: ${{ steps.summary.outputs.has_destroys }}
      selection: ${{ steps.units.outputs.selection }}
