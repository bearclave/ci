# GENERATED by tools/build.py from templates/terragrunt.yml - edit the template or src/, not this file.
# The pipeline of a Terragrunt repository with Azure state (iac-azure,
# iac-github):
#
# Pull request into main -> select the affected units, then validate (fmt,
#                           HCL, terraform validate, lock files) and plan
#                           them side by side, the plan under the read-only
#                           identity, summarised into the pull request; one
#                           that touches none of the relevant paths skips
#                           all of it; conventions and Sentinel lint
# Push to main            -> select, validate and plan again (read-only
#                           identity), then apply under the identity that
#                           writes, in the environment, but only if
#                           validate passed and the plan proposes
#                           something and destroys or replaces nothing, or the
#                           destroys were approved in the merged pull request;
#                           then verify the apply (second plan, Activity Log,
#                           check blocks) - a failure is red and opens an
#                           issue, nothing rolls back;
#                           the apply comment goes on the merged pull
#                           request (README, Plan and apply comments)
# Manual run on main      -> the same; with allow-destroy it also applies what
#                           destroys or replaces (the fallback)
# Schedule                -> the whole tree; applies only the renewal-unit
#                           when it is due, anything else is drift and fails
#                           (iac-home; terragrunt-drift.yml is the weekly
#                           drift of the others)
#
# Identities: every plan - pull request, main, schedule - runs as the
# read-only client-id-plan (federated on pull_request and on main); only the
# apply job runs as client-id-apply, federated on its environment alone.
#
# The apply plans the units again instead of applying the saved plan of the
# plan job (the apply job's comment says why); the verification after it is
# what catches a result that differs from the code.
#
# Destroys and replaces need the owner's approval given after the plan that
# shows them: on a pull request whose plan has any, the check "destroy /
# approved" (part of the gate) passes only with an approving review submitted
# after the plan job ended. A submitted review re-runs that check
# (destroy-review.yml, from the caller's pull_request_review trigger), and the
# push of the merge applies the destroys when that check passed on approval.
#
# Which units run is worked out from the diff against the last commit a run on
# main went through with, so the units of a failed or held-back apply stay
# selected until they are applied. A deleted unit only exists in that commit
# and is planned and applied as a destroy from there. The selection does not
# pull in units that DEPEND on a changed one - that is what the weekly drift
# (terragrunt-drift.yml) over the whole tree is for.
#
# The caller owns the triggers and the concurrency group (a pull request in a
# group of its own; push, manual run and drift share one group per state):
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/terragrunt.yml@v2
#       if: github.event_name != 'pull_request_review'
#       permissions:
#         contents: read
#         id-token: write
#         pull-requests: write
#         issues: write          # verify: the issue
#         actions: read
#       with:
#         client-id-plan: ${{ vars.AZURE_CLIENT_ID_PLAN }}
#         client-id-apply: ${{ vars.AZURE_CLIENT_ID_APPLY }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#         scope: ${{ inputs.scope || 'changed' }}
#         allow-destroy: ${{ inputs.allow_destroy == true }}
#         github-app-vault-plan: kv-githubro-sec-weu-001   # iac-github only
#         github-app-vault-apply: kv-github-sec-weu-001
#       secrets:
#         modules-deploy-key: ${{ secrets.MODULES_DEPLOY_KEY }}
#
# A plan is bound by the CPU of its runner: each unit starts terraform and
# its providers several times, and a hosted runner has two cores. A large
# selection is therefore split across up to plan-shards jobs, each planning
# its share of the units (a dependency in another share is read from its
# state, as with any selection); one more job reads their output back into a
# single summary and comment. The apply stays one job in dependency order.
#
# Versions: TERRAFORM_VERSION, TERRAGRUNT_*, TRIVY_* in the caller's
# .github/tool-versions.env; every unit commits its .terraform.lock.hcl.
# The required check is "pipeline / gate".
#
# terragrunt-home.yml runs the same jobs (templates/_fragments/
# terragrunt-jobs.yml) with the defaults of the home network.
name: terragrunt

on:
  workflow_call:
    inputs:
      relevant-paths:
        description: Regular expression of the paths whose change needs a plan (grep -E over the changed files)
        type: string
        default: '^(infrastructure/|tenant/|_common/|\.github/)|^(root|account)\.hcl$'
      environment:
        description: Environment of the apply job; its branch policy allows main only
        type: string
        default: azure-prod
      client-id-plan:
        description: Client ID of the read-only identity every plan runs as (pull request, main, schedule)
        type: string
        required: true
      client-id-apply:
        description: Client ID of the identity the apply job runs as; federated on the environment only
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        description: Default subscription of the azurerm provider; empty where the repository has none
        type: string
        default: ""
      conventions:
        description: Run the conventions check (conventions.yaml) on pull requests
        type: boolean
        default: true
      conventions-config:
        description: Path of the conventions file (default .github/conventions.yaml, or conventions.yaml where it is still in the root)
        type: string
        default: ""
      sentinel-lint:
        description: Run the Sentinel lint (sentinel-lint.yaml) on pull requests
        type: boolean
        default: false
      sentinel-config:
        description: Path of the Sentinel lint config (default .github/sentinel-lint.yaml, or sentinel-lint.yaml where it is still in the root)
        type: string
        default: ""
      principal-refs:
        description: Check that a principal a change creates is not referenced by display name (Entra)
        type: boolean
        default: false
      github-app-vault-plan:
        description: Key Vault with the read-only GitHub App every plan signs in to GitHub with (iac-github)
        type: string
        default: ""
      github-app-vault-apply:
        description: Key Vault with the GitHub App the apply signs in with (iac-github)
        type: string
        default: ""
      scope:
        description: "changed = affected units only, all = the whole tree (manual runs)"
        type: string
        default: changed
      allow-destroy:
        description: Apply also what destroys or replaces resources (manual runs)
        type: boolean
        default: false
      plan-shards:
        description: At most this many jobs plan side by side, each a share of the selected units (one job up to 20 units)
        type: number
        default: 3
      require-lock-files:
        description: A unit without a committed .terraform.lock.hcl fails validate (false only warns)
        type: boolean
        default: true
      validate-sign-in:
        description: Sign in to Azure as the plan identity in validate, for a configuration that reads a secret while it is parsed
        type: boolean
        default: false
      vpn-script:
        description: Script of the repository that joins (up) and leaves (down) the network the resources are in; empty for none
        type: string
        default: ""
      network-runner:
        description: runs-on of the jobs that reach the managed resources (plan shares, apply), as JSON
        type: string
        default: '"ubuntu-24.04"'
      renewal-unit:
        description: Unit a scheduled run applies when its plan proposes something (a certificate renewal); empty for none
        type: string
        default: ""
      modules-repository:
        description: The repository of the Terraform modules the units take their source from (a rename of it is this default)
        type: string
        default: bearclave/terraform-modules
    secrets:
      modules-deploy-key:
        description: Read-only deploy key of the modules repository
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  MODULES_REPO: ${{ inputs.modules-repository }}
  MODULES_DIR: ${{ github.workspace }}/modules-repo
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ inputs.tenant-id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
  # The plan identity everywhere; the apply job sets its own.
  ARM_CLIENT_ID: ${{ inputs.client-id-plan }}
  GITHUB_APP_VAULT: ${{ inputs.github-app-vault-plan }}

jobs:
  # What the run works on, in seconds and without signing in anywhere: which
  # paths the change touches, the conventions and the Sentinel lint (pull
  # request only), the base commit, the principal references, the unit
  # selection and its split into the plan jobs. validate and the plan jobs
  # both start from it, side by side. One job instead of five, because every
  # job bills a whole minute however short it is; nothing in it signs in or
  # writes. A pull request outside the relevant paths is green without a plan
  # (the later jobs skip on `relevant`, and a skipped job reports as passed).
  # The conventions and the lint do not stop the plan: their steps carry on
  # after a failure and the gate reads `lint`. Outside a pull request the
  # caller's push paths have already decided.
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      # The base commit is the head of the last successful run on main.
      actions: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
      lint: ${{ (steps.conventions.outcome == 'failure' || steps.sentinel.outcome == 'failure') && 'failed' || 'passed' }}
      selection: ${{ steps.units.outputs.selection }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      # A file list that cannot be read plans rather than skips.
      - name: Paths the change touches
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          RELEVANT: ${{ inputs.relevant-paths }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          cat >"$RUNNER_TEMP/changes.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Decides whether a pull request's changed files can change a plan.

          Usage: changes.py <relevant-regex> <changed-files> [<unit-files>]

          <changed-files> lists the paths of the pull request, one per line.
          <unit-files> lists the terragrunt.hcl files of its head commit; it is read
          only when a Markdown file changed, and a missing or empty one makes every
          Markdown file count.

          Prints `relevant=true` or `relevant=false`. A path counts when it matches
          <relevant-regex> (grep -E syntax that Python reads the same way, e.g.
          '^(tenant/|_common/|\\.github/)|^(root|account)\\.hcl$') and is not one of
          the paths that never reach a plan:

          - anything under .github/ but the workflows, tool-versions.env and
            trivyignore.yaml (what decides how a plan runs and passes): dependabot,
            release notes, the conventions and Sentinel configs, issue and pull request
            templates, CODEOWNERS are read by GitHub or by other jobs, not by a plan;
          - anything under .claude/: the agents' rules;
          - a Markdown file outside every unit (no terragrunt.hcl in its directory or
            above): a unit may read a file of its own, nothing reads a README of
            _common/ or .github/.
          """
          import os
          import re
          import sys

          # What under .github/ changes a plan: the workflows run it, the tool
          # versions and the trivy exceptions decide its result.
          PLAN_INPUTS = (".github/workflows/", ".github/tool-versions.env", ".github/trivyignore.yaml")
          UNIT = "terragrunt.hcl"


          def unit_dirs(unit_files: list) -> set:
              return {os.path.dirname(f) for f in unit_files if os.path.basename(f) == UNIT}


          def in_unit(path: str, units: set) -> bool:
              d = os.path.dirname(path)
              while d:
                  if d in units:
                      return True
                  d = os.path.dirname(d)
              return False


          def ignored(path: str, units) -> bool:
              """True for a path that cannot change a plan. units None: not known."""
              if path.startswith(".claude/"):
                  return True
              if path.startswith(".github/") and not path.startswith(PLAN_INPUTS):
                  return True
              if path.lower().endswith(".md"):
                  return units is not None and not in_unit(path, units)
              return False


          def relevant(regex: str, files: list, unit_files=None) -> bool:
              units = unit_dirs(unit_files) if unit_files else None
              pattern = re.compile(regex)
              return any(pattern.search(f) and not ignored(f, units) for f in files if f)


          def read(path: str) -> list:
              try:
                  with open(path, encoding="utf-8") as f:
                      return [line.strip() for line in f if line.strip()]
              except OSError:
                  return []


          if __name__ == "__main__":
              if len(sys.argv) not in (3, 4):
                  sys.exit(__doc__)
              unit_files = read(sys.argv[3]) if len(sys.argv) == 4 else None
              print(f"relevant={'true' if relevant(sys.argv[1], read(sys.argv[2]), unit_files) else 'false'}")
          __CI_EOF__
          if ! gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only >"$RUNNER_TEMP/files"; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # Markdown inside a unit still counts: the units of the head commit.
          # A tree that cannot be read or is truncated leaves the list empty,
          # and then every Markdown file counts.
          : >"$RUNNER_TEMP/units"
          if grep -qi '\.md$' "$RUNNER_TEMP/files"; then
            gh api "repos/$REPO/git/trees/$HEAD_SHA?recursive=1" \
              --jq 'select(.truncated | not) | .tree[] | select(.type == "blob") | .path | select(endswith("terragrunt.hcl"))' \
              >"$RUNNER_TEMP/units" || : >"$RUNNER_TEMP/units"
          fi
          python3 "$RUNNER_TEMP/changes.py" "$RELEVANT" "$RUNNER_TEMP/files" "$RUNNER_TEMP/units" >>"$GITHUB_OUTPUT"
          if grep -q '^relevant=false$' "$GITHUB_OUTPUT"; then
            echo "Nothing to plan: the change touches no unit, context file or workflow (Dependabot and release configs, .claude/ and Markdown outside the units do not count)." >>"$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The rules in conventions.yaml; on a pull request only, main holds
      # nothing a pull request has not checked. The same step as
      # _fragments/conventions-steps.yml, which carries on after a failure here.
      # A file of its own: actionlint cannot take a step script of about 64 KB.
      - name: Conventions, the rules of what is left behind
        if: github.event_name == 'pull_request' && inputs.conventions
        run: |
          cat >"$RUNNER_TEMP/conventions_left.py" <<'__CI_EOF__'
          """The rules of what a unit and a repository leave behind (code/terragrunt.md of governance).

          collection-unit, imports-left, moves-left and state-moves-stale. They live in
          a file of their own because conventions.py travels inside a workflow step and
          actionlint cannot take a script of about 64 KB; the workflow writes this file
          next to it and conventions.py imports it when one of these rules runs. Each
          rule takes the conventions module as its first argument, for its parser and
          helpers.
          """
          import os
          import re
          import subprocess
          import time


          def is_empty_inputs(attr):
              return [t.value for t in attr.value] == ["{", "}"]


          def rule_collection_unit(c, repo, params, units, report):
              """A collection unit is the two includes and `inputs = {}`, nothing else; no other unit has an empty inputs.

              A collection unit is a unit whose included _common/units file reads definitions/ (fileset, or file for a settings.yaml), with or without objects yet. The comment above
              the empty inputs is unit-block-order's.
              """
              for path in c.shape_units(repo, units):
                  root, _, _ = repo.hcl(path)
                  # A collection unit is one whose _common/units file reads definitions/.
                  collection = any("definitions/" in (c.text_of(repo, f) or "")
                                   for f in c.unit_includes(repo, path) if repo.exists(f))
                  inputs = root.attrs.get("inputs")
                  if not collection:
                      if inputs is not None and is_empty_inputs(inputs):
                          report.add("collection-unit", path, inputs.line,
                                     "inputs = {} in a unit whose _common/units file does not read definitions/: only a collection unit has an empty "
                                     "inputs; list the instance settings")
                      continue
                  includes = [b.labels[0] if b.labels else "" for b in root.find("include")]
                  if sorted(includes) != ["root", "unit"]:
                      report.add("collection-unit", path, (root.find("include") or [root])[0].line,
                                 f"a collection unit has include \"root\" and include \"unit\", it has: "
                                 f"{', '.join(includes) or 'none'}")
                  for b in root.blocks:
                      if b.kind != "include":
                          report.add("collection-unit", path, b.line,
                                     f"a {b.kind} block in a collection unit: it is the two includes and inputs = {{}}; "
                                     "what every object shares goes into _common/units/<module>.hcl")
                  for name, a in root.attrs.items():
                      if name != "inputs":
                          report.add("collection-unit", path, a.line,
                                     f"{name} in a collection unit: it is the two includes and inputs = {{}}")
                  if inputs is None:
                      report.add("collection-unit", path, 1, "a collection unit has `inputs = {}` (with its Content comment)")
                  elif not is_empty_inputs(inputs):
                      report.add("collection-unit", path, inputs.line,
                                 "a collection unit has inputs = {}: the objects are the YAML files in definitions/, "
                                 "a value they share goes into _common/units/<module>.hcl")


          # --------------------------------------------------------------------------
          # What is left behind: imports.hcl, moves.hcl, removed.hcl and state moves

          RE_INSTANCE_KEY = re.compile(r'\[\\?"(.+?)\\?"\]')


          def added_at(repo, path):
              """Unix time of the commit that first added the path, None when the history does not say."""
              out = subprocess.run(["git", "log", "--diff-filter=A", "--format=%ct", "--", path], cwd=repo.root,
                                   capture_output=True, text=True).stdout.split()
              return int(out[-1]) if out else None


          def older_than(repo, path, days):
              """True when the path was added `days` or more days ago (never, when the history is cut)."""
              at = added_at(repo, path)
              return at is not None and time.time() - at >= days * 86400


          def left_behind(c, repo, params, report, rule, names):
              days = int(params.get("days", 7))
              for path in repo.files:
                  name = os.path.basename(path)
                  if name not in names:
                      continue
                  if older_than(repo, path, days):
                      report.add(rule, path, 1,
                                 f"{name} was added more than {days} days ago: delete it (and its generate block and "
                                 "template when it is the last one) in the first pull request after the apply")
                  if name == "imports.hcl":
                      import_without_configuration(c, repo, path, rule, report)


          def import_without_configuration(c, repo, path, rule, report):
              """An import of a collection object whose definitions/<key>.yaml is gone fails the plan."""
              unit = os.path.dirname(path)
              keys = {os.path.basename(f)[:-len(".yaml")] for f in repo.files
                      if f.startswith(unit + "/definitions/") and f.endswith(".yaml")}
              if not keys:
                  return
              root, _, _ = repo.hcl(path)
              attr = root.attrs.get("imports")
              imports = c.literal(attr.value) if attr else None
              if not isinstance(imports, dict):
                  return
              for address in imports:
                  m = RE_INSTANCE_KEY.search(address)
                  if m and m.group(1) not in keys:
                      report.add(rule, path, attr.line,
                                 f"{address} imports {m.group(1)!r}, which has no definitions/{m.group(1)}.yaml: "
                                 "remove the line with the object (Configuration for import target does not exist)",
                                 level="error")


          def rule_imports_left(c, repo, params, units, report):
              """imports.hcl older than 7 days warns; an import of an object without its YAML file fails."""
              left_behind(c, repo, params, report, "imports-left", ("imports.hcl",))


          def rule_moves_left(c, repo, params, units, report):
              """moves.hcl and removed.hcl older than 7 days warn."""
              left_behind(c, repo, params, report, "moves-left", ("moves.hcl", "removed.hcl"))


          def state_moves(c, repo, path):
              """[(line, from, to)] of .github/state-moves.yaml (a list of from/to pairs)."""
              entries, current = [], None
              for n, raw in enumerate(c.text_lines(repo, path) or [], 1):
                  line = raw.split("#", 1)[0].rstrip()
                  m = re.match(r"^\s*(-\s+)?(from|to)\s*:\s*[\"']?([^\"']+?)[\"']?\s*$", line)
                  if not m:
                      continue
                  if m.group(1) or current is None:
                      current = {"line": n}
                      entries.append(current)
                  current[m.group(2)] = m.group(3)
              return [(e["line"], e.get("from"), e.get("to")) for e in entries if e.get("from") and e.get("to")]


          def rule_state_moves_stale(c, repo, params, units, report):
              """An entry of .github/state-moves.yaml whose `to` is a unit, whose `from` is gone and that was added a week ago.

              Whether the apply happened is not in the code: a move whose new unit is
              there, the old one gone and the entry older than `days` (default 7) is
              applied, and the first pull request after it removes the entry.
              """
              path = params.get("file", ".github/state-moves.yaml")
              if not repo.exists(path):
                  return
              base = params.get("root", "infrastructure")
              days = int(params.get("days", 7))
              for line, src, dst in state_moves(c, repo, path):
                  exists = repo.exists(f"{base}/{dst.strip('/')}/terragrunt.hcl")
                  gone = not any(f.startswith(f"{base}/{src.strip('/')}/") for f in repo.files)
                  if not (exists and gone):
                      continue
                  out = subprocess.run(["git", "log", "-S" + src, "--reverse", "--format=%ct", "--", path],
                                       cwd=repo.root, capture_output=True, text=True).stdout.split()
                  if out and time.time() - int(out[0]) >= days * 86400:
                      report.add("state-moves-stale", path, line,
                                 f"{src} -> {dst}: the unit is at its new path, the old one is gone and the entry is "
                                 f"older than {days} days; remove it (and the old state blob) in this pull request")
          __CI_EOF__

      - name: Conventions
        id: conventions
        if: github.event_name == 'pull_request' && inputs.conventions
        continue-on-error: true
        env:
          CONFIG: ${{ inputs.conventions-config }}
        run: |
          script="$RUNNER_TEMP/conventions.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks a repository against the conventions its conventions.yaml names.

          Usage: conventions.py <config.json> [<repository root>] [--only r1,r2] [--skip r1,r2]

          --only runs just the named rules, --skip leaves them out: the pr check runs
          the rules every repository has (--only todo-issue,markdown-links,
          collection-schema), the conventions job of a pipeline the rest.

          The workflow converts conventions.yaml to JSON first (yq), so that this script
          needs nothing beyond the Python standard library; collection-schema reads
          the YAML objects through the same yq and validates them with schema_check.py,
          which the workflow writes next to this script. The config:

            rules:       <rule>: {level: error | warn | off, ...parameters}; the
                         rules in DEFAULT_ON run unless they are set to off, those in
                         DEFAULT_WARN run as warnings until a level is set, the others
                         only when they are named
            units:       globs of the unit files (terragrunt.hcl) for the terragrunt rules
            exceptions:  [{rule, path (a glob), match (optional text on the line),
                           reason, review (YYYY-MM-DD)}] - an exception without a reason
                           is itself an error; the review date is checked by
                           exception_review.py, which warns once it has passed

          Every violation becomes a GitHub annotation on its file and line, and a row
          in the job summary. The exit code is 1 when an error-level violation is not
          covered by an exception, or when the config itself is wrong.

          The rules read HCL through the small parser below: blocks, attributes,
          strings, heredocs and comments, enough to know what is a `default` inside a
          `variable` block and what is a comment above an attribute. Expressions are
          kept as tokens, not evaluated.
          """
          import json
          import os
          import re
          import subprocess
          import sys
          import urllib.parse

          # --------------------------------------------------------------------------
          # HCL tokens and structure

          GUID = r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
          RE_IDENT = re.compile(r"[A-Za-z_][A-Za-z0-9_-]*")
          RE_HEREDOC = re.compile(r"<<-?([A-Za-z_][A-Za-z0-9_]*)[ \t]*\n")


          class Token:
              __slots__ = ("kind", "value", "line", "heredoc")

              def __init__(self, kind, value, line, heredoc=False):
                  self.kind, self.value, self.line, self.heredoc = kind, value, line, heredoc

              def __repr__(self):
                  return f"{self.kind}:{self.value!r}@{self.line}"


          def tokenize(text: str):
              """Tokens plus the set of lines that carry a comment."""
              tokens, comments = [], set()
              i, line, n = 0, 1, len(text)
              while i < n:
                  c = text[i]
                  if c == "\n":
                      tokens.append(Token("nl", "\n", line))
                      line += 1
                      i += 1
                  elif c in " \t\r":
                      i += 1
                  elif c == "#" or text.startswith("//", i):
                      comments.add(line)
                      while i < n and text[i] != "\n":
                          i += 1
                  elif text.startswith("/*", i):
                      end = text.find("*/", i + 2)
                      end = n if end < 0 else end + 2
                      for k in range(text.count("\n", i, end) + 1):
                          comments.add(line + k)
                      line += text.count("\n", i, end)
                      i = end
                  elif c == '"':
                      start_line = line
                      i, value = read_string(text, i + 1)
                      line += value.count("\n")
                      tokens.append(Token("str", value, start_line))
                  elif (m := RE_HEREDOC.match(text, i)):
                      marker, start_line = m.group(1), line
                      body_start = m.end()
                      j, body = body_start, []
                      line += 1
                      while j < n:
                          end = text.find("\n", j)
                          end = n if end < 0 else end
                          current = text[j:end]
                          if current.strip() == marker:
                              j = end
                              break
                          body.append(current)
                          line += 1
                          j = end + 1
                      tokens.append(Token("str", "\n".join(body), start_line, heredoc=True))
                      i = j
                  elif (m := RE_IDENT.match(text, i)):
                      tokens.append(Token("ident", m.group(0), line))
                      i = m.end()
                  else:
                      tokens.append(Token("punct", c, line))
                      i += 1
              tokens.append(Token("nl", "\n", line))
              return tokens, comments


          def read_string(text: str, i: int):
              """The raw content of a quoted string from i to its closing quote."""
              out, n, depth = [], len(text), 0
              while i < n:
                  c = text[i]
                  if c == "\\" and i + 1 < n:
                      out.append(text[i:i + 2])
                      i += 2
                      continue
                  if depth == 0 and c == '"':
                      return i + 1, "".join(out)
                  if text.startswith(("${", "%{"), i):
                      depth += 1
                      out.append(text[i:i + 2])
                      i += 2
                      continue
                  if depth and c == "{":
                      depth += 1
                  elif depth and c == "}":
                      depth -= 1
                  elif depth and c == '"':
                      j, inner = read_string(text, i + 1)
                      out.append('"' + inner + '"')
                      i = j
                      continue
                  out.append(c)
                  i += 1
              return n, "".join(out)


          class Block:
              def __init__(self, kind, labels, line):
                  self.kind, self.labels, self.line = kind, labels, line
                  self.attrs, self.blocks = {}, []

              def find(self, kind):
                  return [b for b in self.blocks if b.kind == kind]


          class Attr:
              def __init__(self, name, line, value):
                  self.name, self.line, self.value = name, line, value

              def string(self):
                  """The value when it is one plain string, else None."""
                  if len(self.value) == 1 and self.value[0].kind == "str":
                      return self.value[0].value
                  return None

              def text(self):
                  return "".join(t.value if t.kind != "str" else f'"{t.value}"' for t in self.value)


          OPEN, CLOSE = "([{", ")]}"


          def parse(tokens):
              root = Block("<file>", [], 1)
              body(tokens, 0, root)
              return root


          def body(tokens, i, block):
              """Fills block from tokens[i] up to its closing brace; returns the index after."""
              n = len(tokens)
              while i < n:
                  t = tokens[i]
                  if t.kind == "nl":
                      i += 1
                      continue
                  if t.kind == "punct" and t.value == "}":
                      return i + 1
                  if t.kind == "ident":
                      j = i + 1
                      if j < n and tokens[j].kind == "punct" and tokens[j].value in "=:":
                          start, depth, k = j + 1, 0, j + 1
                          while k < n:
                              tk = tokens[k]
                              if tk.kind == "punct" and tk.value in OPEN:
                                  depth += 1
                              elif tk.kind == "punct" and tk.value in CLOSE:
                                  if depth == 0:
                                      break
                                  depth -= 1
                              elif tk.kind == "nl" and depth == 0:
                                  break
                              k += 1
                          value = [x for x in tokens[start:k] if x.kind != "nl"]
                          block.attrs[t.value] = Attr(t.value, t.line, value)
                          i = k
                          continue
                      labels = []
                      while j < n and tokens[j].kind in ("str", "ident"):
                          labels.append(tokens[j].value)
                          j += 1
                      if j < n and tokens[j].kind == "punct" and tokens[j].value == "{":
                          child = Block(t.value, labels, t.line)
                          block.blocks.append(child)
                          i = body(tokens, j + 1, child)
                          continue
                  i += 1
              return i


          def literal(tokens):
              """A literal value (string, number, bool, list, object) from tokens, or None."""
              try:
                  value, rest = _literal(tokens, 0)
              except (IndexError, ValueError):
                  return None
              return value if rest == len(tokens) else None


          def _literal(tokens, i):
              t = tokens[i]
              if t.kind == "str":
                  return t.value, i + 1
              if t.kind == "ident" and t.value in ("true", "false", "null"):
                  return {"true": True, "false": False, "null": None}[t.value], i + 1
              if t.kind == "punct" and t.value == "[":
                  out, i = [], i + 1
                  while not (tokens[i].kind == "punct" and tokens[i].value == "]"):
                      v, i = _literal(tokens, i)
                      out.append(v)
                      if tokens[i].kind == "punct" and tokens[i].value == ",":
                          i += 1
                  return out, i + 1
              if t.kind == "punct" and t.value == "{":
                  out, i = {}, i + 1
                  while not (tokens[i].kind == "punct" and tokens[i].value == "}"):
                      key = tokens[i].value
                      if tokens[i + 1].kind != "punct" or tokens[i + 1].value not in "=:":
                          raise ValueError("not an object")
                      v, i = _literal(tokens, i + 2)
                      out[key] = v
                      if tokens[i].kind == "punct" and tokens[i].value == ",":
                          i += 1
                  return out, i + 1
              raise ValueError("not a literal")


          def load(path):
              with open(path, encoding="utf-8") as fh:
                  tokens, comments = tokenize(fh.read())
              return parse(tokens), tokens, comments


          # --------------------------------------------------------------------------
          # The repository

          def glob_re(pattern: str):
              """A glob where * stays within a directory and **/ spans any number of them."""
              out, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif pattern[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  elif pattern[i] == "?":
                      out, i = out + "[^/]", i + 1
                  else:
                      out, i = out + re.escape(pattern[i]), i + 1
              return re.compile(out + r"\Z")


          def matches(path: str, *patterns) -> bool:
              return any(glob_re(p).match(path) for p in patterns)


          class Repo:
              def __init__(self, root):
                  self.root = root
                  # -z: a path with a non-ASCII letter is otherwise quoted and then lost.
                  out = subprocess.run(["git", "ls-files", "-z"], cwd=root, capture_output=True,
                                       check=True).stdout.decode("utf-8", errors="replace")
                  self.files = sorted(f for f in out.split("\0") if f and os.path.isfile(os.path.join(root, f)))
                  self._cache = {}

              def glob(self, *patterns):
                  return [f for f in self.files if matches(f, *patterns)]

              def hcl(self, path):
                  if path not in self._cache:
                      self._cache[path] = load(os.path.join(self.root, path))
                  return self._cache[path]

              def exists(self, path):
                  return path in self.files


          class Report:
              def __init__(self):
                  self.items = []

              def add(self, rule, path, line, message, level=None):
                  """level: set when the standard says this finding fails whatever the rule's level."""
                  item = {"rule": rule, "path": path, "line": line, "message": message}
                  if level:
                      item["forced_level"] = level
                  self.items.append(item)


          # --------------------------------------------------------------------------
          # Rules. Each takes (repo, params, units, report) and adds what it finds.

          def rule_variable_no_default(repo, params, units, report):
              """Module variables have no default; `optional(type, default)` counts too."""
              for path in repo.glob(*params.get("files", ["**/*.tf"])):
                  root, _, _ = repo.hcl(path)
                  for var in root.find("variable"):
                      name = var.labels[0] if var.labels else "?"
                      if "default" in var.attrs:
                          report.add("variable-no-default", path, var.attrs["default"].line,
                                     f'variable "{name}" has a default')
                      if "type" in var.attrs:
                          for line in optional_defaults(var.attrs["type"].value):
                              report.add("variable-no-default", path, line,
                                         f'variable "{name}": optional() with a default')


          def optional_defaults(tokens):
              """Lines of optional(...) calls that pass a second argument."""
              out = []
              for k, t in enumerate(tokens):
                  if t.kind == "ident" and t.value == "optional" and k + 1 < len(tokens) \
                          and tokens[k + 1].value == "(":
                      depth, j = 0, k + 1
                      while j < len(tokens):
                          v = tokens[j]
                          if v.kind == "punct" and v.value in OPEN:
                              depth += 1
                          elif v.kind == "punct" and v.value in CLOSE:
                              depth -= 1
                              if depth == 0:
                                  break
                          elif v.kind == "punct" and v.value == "," and depth == 1:
                              out.append(t.line)
                              break
                          j += 1
              return out


          def rule_variable_documented(repo, params, units, report):
              """Every module variable says what it is (description) and what it takes (type)."""
              for path in repo.glob(*params.get("files", ["**/*.tf"])):
                  root, _, _ = repo.hcl(path)
                  for var in root.find("variable"):
                      missing = [a for a in ("description", "type") if a not in var.attrs]
                      if missing:
                          report.add("variable-documented", path, var.line,
                                     f'variable "{var.labels[0] if var.labels else "?"}" has no '
                                     + " and no ".join(missing))


          RE_MODULE = re.compile(r"//([^?]+)\?")


          def unit_includes(repo, path):
              """The repository paths of the _common/units/ files a unit includes."""
              root, _, _ = repo.hcl(path)
              out = []
              for inc in root.find("include"):
                  if "path" not in inc.attrs:
                      continue
                  m = re.search(r"_common/units/[\w.-]+\.hcl", inc.attrs["path"].text())
                  if m:
                      out.append(m.group(0))
              return out


          def module_of(repo, path):
              """(module path, line, file) of the module a unit runs, its own or its _common/units/ file's."""
              for f in [path] + unit_includes(repo, path):
                  if not repo.exists(f):
                      continue
                  root, _, _ = repo.hcl(f)
                  for b in root.find("terraform"):
                      if "source" in b.attrs and (m := RE_MODULE.search(b.attrs["source"].text())):
                          return m.group(1).strip("/"), b.attrs["source"].line, f
              return None, None, None


          def rule_module_source(repo, params, units, report):
              """A unit takes its module from git, through modules and modules_ref.

              The source is in the unit, or in the _common/units/<module>.hcl it includes.
              """
              # The context comes from root.hcl (include.root.locals) or, in the newer
              # layout, from _common/context.hcl (local.ctx, include.root.locals.ctx).
              ctx = r"(?:include\.root\.locals(?:\.ctx)?|local\.ctx)"
              pattern = re.compile(params.get(
                  "pattern", rf"^\$\{{{ctx}\.modules\}}//[^?]+\?ref=\$\{{{ctx}\.modules_ref\}}$"))
              common = re.compile(params.get(
                  "common_pattern", r"^\$\{[A-Za-z_.]+\.modules\}//[^?]+\?ref=\$\{[A-Za-z_.]+\.modules_ref\}$"))
              for path in units:
                  root, _, _ = repo.hcl(path)
                  sources = [b.attrs["source"] for b in root.find("terraform") if "source" in b.attrs]
                  included = [f for f in unit_includes(repo, path) if repo.exists(f)]
                  if not sources and not any("source" in b.attrs for f in included
                                             for b in repo.hcl(f)[0].find("terraform")):
                      report.add("module-source", path, 1,
                                 "the unit names no terraform source, itself or in a _common/units/ file")
                  for attr in sources:
                      value = attr.string()
                      if value is None or not pattern.match(value):
                          report.add("module-source", path, attr.line,
                                     f"source {attr.text()} is not the module from git with modules_ref")
              for path in repo.glob("_common/units/*.hcl"):
                  root, _, _ = repo.hcl(path)
                  for b in root.find("terraform"):
                      attr = b.attrs.get("source")
                      if attr and (attr.string() is None or not common.match(attr.string())):
                          report.add("module-source", path, attr.line,
                                     f"source {attr.text()} is not the module from git with modules_ref")


          def shared_dirs(params):
              """Where dependency blocks may live: dir (or dirs) and _common/units."""
              dirs = params.get("dirs") or [params.get("dir", "_common/deps")]
              return list(dict.fromkeys([d.rstrip("/") for d in dirs] + ["_common/units"]))


          def rule_dependencies_in_common(repo, params, units, report):
              """A dependency is declared once, in a shared file, with its mocks."""
              where = " or ".join(f"{d}/" for d in shared_dirs(params))
              for path in units:
                  root, _, _ = repo.hcl(path)
                  for dep in root.find("dependency"):
                      report.add("dependencies-in-common", path, dep.line,
                                 f'dependency "{dep.labels[0] if dep.labels else "?"}" belongs in {where}')


          def rule_mock_outputs(repo, params, units, report):
              """Every dependency has mocks, and the mocks never reach an apply or a destroy."""
              forbidden = set(params.get("forbidden_commands", ["apply", "destroy"]))
              mocks = {}
              if params.get("mocks_file") and repo.exists(params["mocks_file"]):
                  mroot, _, _ = repo.hcl(params["mocks_file"])
                  for loc in mroot.find("locals"):
                      for name, attr in loc.attrs.items():
                          mocks[name] = literal(attr.value)
              for path in repo.glob(*(f"{d}/*.hcl" for d in shared_dirs(params))):
                  root, _, _ = repo.hcl(path)
                  for dep in root.find("dependency"):
                      label = dep.labels[0] if dep.labels else "?"
                      for needed in ("mock_outputs", "mock_outputs_allowed_terraform_commands"):
                          if needed not in dep.attrs:
                              report.add("mock-outputs", path, dep.line, f'dependency "{label}" has no {needed}')
                      attr = dep.attrs.get("mock_outputs_allowed_terraform_commands")
                      if not attr:
                          continue
                      commands = literal(attr.value)
                      ref = attr.text()
                      if commands is None and (m := re.fullmatch(r"local\.mocks\.(\w+)", ref)):
                          commands = mocks.get(m.group(1))
                      if not isinstance(commands, list):
                          report.add("mock-outputs", path, attr.line,
                                     f"cannot tell which commands {ref} allows")
                      elif bad := sorted(forbidden & set(commands)):
                          report.add("mock-outputs", path, attr.line,
                                     f'dependency "{label}" allows its mocks in {", ".join(bad)}')


          def rule_tags_required(repo, params, units, report):
              """Context files carry the tags their level owns, with an allowed value."""
              allowed = {}
              if params.get("allowed_values") and repo.exists(params["allowed_values"]):
                  aroot, _, _ = repo.hcl(params["allowed_values"])
                  for loc in aroot.find("locals"):
                      if "allowed" in loc.attrs:
                          allowed = literal(loc.attrs["allowed"].value) or {}
              for name, keys in (params.get("files") or {}).items():
                  # _common/units/subscription.hcl is the shared unit of a module, not a context file.
                  for path in [f for f in repo.glob(f"**/{name}") if not f.startswith("_common/")]:
                      root, _, _ = repo.hcl(path)
                      attrs = {}
                      for loc in root.find("locals"):
                          attrs.update(loc.attrs)
                      for key in keys:
                          if key not in attrs:
                              report.add("tags-required", path, 1, f"{name} sets no {key}")
                              continue
                          value = attrs[key].string()
                          if key in allowed and value not in allowed[key]:
                              report.add("tags-required", path, attrs[key].line,
                                         f"{key} = {attrs[key].text()} is not one of {', '.join(allowed[key])}")


          def rule_no_hardcoded_ids(repo, params, units, report):
              """Units take subscription and tenant IDs from the context, never written out."""
              known = set()
              for path in repo.glob(*params.get("id_files", ["account.hcl", "**/subscription.hcl"])):
                  _, tokens, _ = repo.hcl(path)
                  known |= {t.value.lower() for t in tokens if t.kind == "str" and re.fullmatch(GUID, t.value)}
              sub = re.compile(r"/subscriptions/" + GUID, re.I)
              for path in units:
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind != "str":
                          continue
                      if sub.search(t.value):
                          report.add("no-hardcoded-ids", path, t.line, "a resource ID with a subscription written out")
                      elif any(g.lower() in known for g in re.findall(GUID, t.value)):
                          report.add("no-hardcoded-ids", path, t.line,
                                     "a subscription or tenant ID written out instead of taken from the context")


          def rule_no_hardcoded_location(repo, params, units, report):
              """The region comes from region.hcl."""
              regions = {r.lower() for r in params.get("locations", [])}
              for path in units:
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind == "str" and t.value.lower() in regions:
                          report.add("no-hardcoded-location", path, t.line,
                                     f'region "{t.value}" written out instead of taken from region.hcl')


          def rule_no_envcommon(repo, params, units, report):
              """No _envcommon: every unit carries its own inputs."""
              for path in repo.files:
                  if "_envcommon/" in f"/{path}" or path.startswith("_envcommon/"):
                      report.add("no-envcommon", path, 1, "_envcommon is not used here")


          def rule_lock_none_needs_reason(repo, params, units, report):
              """An unlocked resource in a resource group of high criticality says why."""
              levels = set(params.get("criticality", ["high"]))
              for path in units:
                  root, _, comments = repo.hcl(path)
                  attr = None
                  for item in [root] + root.blocks:
                      if "inputs" in item.attrs:
                          obj = item.attrs["inputs"]
                          for k, t in enumerate(obj.value):
                              if t.kind == "ident" and t.value == "lock" and k + 2 < len(obj.value) \
                                      and obj.value[k + 1].value in "=:" and obj.value[k + 2].kind == "str":
                                  attr = (t.line, obj.value[k + 2].value)
                  if not attr or attr[1] != "none":
                      continue
                  rg = nearest(repo, os.path.dirname(path), "rg.hcl")
                  if not rg:
                      continue
                  rroot, _, _ = repo.hcl(rg)
                  crit = None
                  for loc in rroot.find("locals"):
                      if "criticality" in loc.attrs:
                          crit = loc.attrs["criticality"].string()
                  line = attr[0]
                  if crit in levels and line not in comments and (line - 1) not in comments:
                      report.add("lock-none-needs-reason", path, line,
                                 f'lock = "none" in a resource group of criticality {crit}, with no comment saying why')


          # --------------------------------------------------------------------------
          # The shape of a live repository (code/terragrunt.md of governance)

          def unit_dirs(repo):
              return {os.path.dirname(f) for f in repo.files if os.path.basename(f) == "terragrunt.hcl"}


          def owning_unit(path, dirs):
              d = os.path.dirname(path)
              while d:
                  if d in dirs:
                      return d
                  d = os.path.dirname(d)
              return None


          # What a unit may hold besides HCL, as globs relative to the unit directory
          # (code/terragrunt.md of governance): the objects of a collection, the
          # definition of a Logic App (Consumption) and the workflows of a Logic App
          # (Standard).
          UNIT_ASSETS = ["**/*.yaml", "definition.json", "workflows/*/workflow.json"]
          RE_FILESET = re.compile(r'fileset\(\s*[^,()]+(?:\([^()]*\))?[^,()]*,\s*"([^"]+)"\s*\)')


          def unit_readers(repo, unit):
              """The text of a unit's terragrunt.hcl and of the _common/units/ files it includes."""
              path = f"{unit}/terragrunt.hcl"
              files = [path] + [f for f in unit_includes(repo, path) if repo.exists(f)]
              return "\n".join("\n".join(text_lines(repo, f) or []) for f in files)


          def text_of(repo, path):
              return "\n".join(text_lines(repo, path) or [])


          def rule_unit_assets(repo, params, units, report):
              """A unit holds HCL; any other file only from the allowlist, and read by the unit.

              Read means named in the unit's terragrunt.hcl, or matched by a fileset()
              pattern of the unit or of the _common/units/ file it includes (a
              collection reads its objects with fileset(get_terragrunt_dir(), "**/*.yaml")).
              """
              allowed = list(params.get("allowed", UNIT_ASSETS))
              roots = params.get("paths", ["infrastructure/**"])
              dirs = unit_dirs(repo)
              readers = {}
              for path in repo.files:
                  if path.endswith(".hcl") or os.path.basename(path) == ".terraform.lock.hcl":
                      continue
                  unit = owning_unit(path, dirs)
                  if unit is None and not matches(path, *roots):
                      continue
                  name = os.path.basename(path)
                  rel = path[len(unit) + 1:] if unit else path
                  if unit is None or not matches(rel, *allowed):
                      hint = " (a collection object is <key>.yaml)" if name.endswith(".yml") else ""
                      report.add("unit-assets", path, 1,
                                 f"{rel} is not HCL: a unit holds only {', '.join(allowed) or 'HCL'}{hint}; "
                                 "write the rest in HCL or in the YAML of a collection")
                      continue
                  if unit not in readers:
                      readers[unit] = unit_readers(repo, unit)
                  text = readers[unit]
                  if name not in text and not any(matches(rel, p) for p in RE_FILESET.findall(text)):
                      report.add("unit-assets", path, 1,
                                 f"{rel} is not read by {unit}: name it in its terragrunt.hcl, or read the "
                                 "collection with fileset() in its _common/units/ file")


          # --------------------------------------------------------------------------
          # The shape of the HCL (decisions of the standardisation, code/terragrunt.md
          # of governance): no raw Terraform in Terragrunt, a unit that only describes
          # the infrastructure, no ID written into a unit or a collection file, the
          # collections where they belong. These rules run in every repository that
          # names its units, as warnings until the repository sets a level.

          UNIT_SHAPE_ORDER = ("include", "dependency", "dependencies", "locals", "inputs")
          INCLUDE_ORDER = ("root", "unit")
          CONTENT_COMMENT = "# Content: the YAML files in definitions/."
          RE_FOR = re.compile(r"\bfor\s+\w+(?:\s*,\s*\w+)?\s+in\b")
          RE_INLINE_BLOCK = re.compile(r"^\s*(import|moved|removed)\s*\{", re.M)
          RE_YAML_NAME = re.compile(r"^[a-z0-9-]+\.yaml$")
          GENERATED_FROM_FILE = ("templatefile", "file")


          def shape_units(repo, units):
              """The unit files of the shape rules: the repository's units, never _common/."""
              return [u for u in units if not u.startswith("_common/") and "/_common/" not in u]


          def all_blocks(block):
              for child in block.blocks:
                  yield child
                  yield from all_blocks(child)


          def interpolations(value):
              """The text of every ${...} and %{...} of a string, nested quotes left out."""
              out, i, n = [], 0, len(value)
              while i < n:
                  if value.startswith(("${", "%{"), i):
                      depth, j, quoted = 1, i + 2, False
                      while j < n and depth:
                          c = value[j]
                          if c == '"' and value[j - 1] != "\\":
                              quoted = not quoted
                          elif not quoted and c == "{":
                              depth += 1
                          elif not quoted and c == "}":
                              depth -= 1
                          j += 1
                      inner = value[i:j]
                      out.append(re.sub(r'"(?:[^"\\]|\\.)*"', '""', inner))
                      i = j
                  else:
                      i += 1
              return out


          def rule_no_raw_terraform(repo, params, units, report):
              """No heredoc, no generate with inline contents, no import, moved or removed block in an .hcl file.

              The only Terraform in a live repository is _common/templates/*.tf.tmpl.
              """
              if not units:
                  return
              for path in repo.glob(*params.get("paths", ["**/*.hcl"])):
                  if os.path.basename(path) == ".terraform.lock.hcl":
                      continue
                  root, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind == "str" and t.heredoc:
                          report.add("no-raw-terraform", path, t.line,
                                     "a heredoc (<<EOF) is raw text or Terraform in HCL: put it in a module or a "
                                     "_common/templates/*.tf.tmpl file")
                      if t.kind == "str":
                          for m in RE_INLINE_BLOCK.finditer(t.value):
                              line = t.line + t.value[:m.start()].count("\n") + (1 if t.heredoc else 0)
                              report.add("no-raw-terraform", path, line,
                                         f"an inline {m.group(1)} block: imports and moves are imports.hcl and moves.hcl, "
                                         "rendered from _common/templates")
                  for block in [root] + list(all_blocks(root)):
                      if block.kind in ("import", "moved", "removed") and block is not root:
                          report.add("no-raw-terraform", path, block.line,
                                     f"an inline {block.kind} block: imports and moves are imports.hcl and moves.hcl, "
                                     "rendered from _common/templates")
                      if block.kind == "generate" and "contents" in block.attrs:
                          value = block.attrs["contents"].value
                          if not (value and value[0].kind == "ident" and value[0].value in GENERATED_FROM_FILE):
                              report.add("no-raw-terraform", path, block.attrs["contents"].line,
                                         "a generate block with inline contents: render a file with templatefile() "
                                         "from _common/templates, or put it in the module")


          def rule_unit_no_logic(repo, params, units, report):
              """A unit terragrunt.hcl has no for expression and no conditional (they live in modules and _common/)."""
              for path in shape_units(repo, units):
                  _, tokens, _ = repo.hcl(path)
                  for k, t in enumerate(tokens):
                      if t.kind == "ident" and t.value == "for":
                          rest = [x for x in tokens[k + 1:k + 6] if x.kind != "nl"]
                          names = [x.value for x in rest]
                          if names[1:2] == ["in"] or (names[1:2] == [","] and names[3:4] == ["in"]):
                              report.add("unit-no-logic", path, t.line,
                                         "a for expression in a unit: a unit lists what exists; build the "
                                         "collection in _common/units or the module")
                      elif t.kind == "punct" and t.value == "?":
                          report.add("unit-no-logic", path, t.line,
                                     "a conditional (? :) in a unit: decide in the module or in account.hcl/context.hcl")
                      elif t.kind == "str" and not t.heredoc:
                          for inner in interpolations(t.value):
                              if inner.startswith("%{") and re.match(r"%\{~?\s*(if|for)\b", inner):
                                  report.add("unit-no-logic", path, t.line, "a template directive (%{ if/for }) in a unit")
                              elif inner.startswith("${") and "?" in inner:
                                  report.add("unit-no-logic", path, t.line, "a conditional (? :) in a unit")
                              elif inner.startswith("${") and RE_FOR.search(inner):
                                  report.add("unit-no-logic", path, t.line, "a for expression in a unit")


          def rule_unit_comments(repo, params, units, report):
              """A comment in a unit is one line (why, not what); longer text goes to docs/."""
              for path in shape_units(repo, units):
                  _, _, comments = repo.hcl(path)
                  lines = text_lines(repo, path) or []
                  standalone, in_block = [], False
                  for n in sorted(comments):
                      text = lines[n - 1].strip() if 0 < n <= len(lines) else ""
                      if in_block:
                          standalone.append(n)
                          in_block = "*/" not in text
                      elif text.startswith(("#", "//")):
                          standalone.append(n)
                      elif text.startswith("/*"):
                          standalone.append(n)
                          in_block = "*/" not in text[2:]
                  run = []
                  for n in standalone + [None]:
                      if run and (n is None or n != run[-1] + 1):
                          if len(run) > 1:
                              report.add("unit-comments", path, run[0],
                                         f"a comment of {len(run)} lines: one line, only when needed; "
                                         "longer text goes to docs/, a README or governance")
                          run = []
                      if n is not None:
                          run.append(n)


          def rule_unit_block_order(repo, params, units, report):
              """include (root, unit, then the rest), dependency, dependencies, locals, inputs; inputs = {} only with its comment."""
              for path in shape_units(repo, units):
                  root, _, _ = repo.hcl(path)
                  items = [(b.line, b.kind, b) for b in root.blocks]
                  items += [(a.line, a.name, a) for a in root.attrs.values()]
                  highest, seen = -1, ""
                  for line, kind, node in sorted(items, key=lambda x: x[0]):
                      if kind not in UNIT_SHAPE_ORDER:
                          continue
                      rank = UNIT_SHAPE_ORDER.index(kind)
                      if rank < highest:
                          report.add("unit-block-order", path, line,
                                     f"{kind} comes after {seen}; the order is {', '.join(UNIT_SHAPE_ORDER)}")
                      else:
                          highest, seen = rank, kind
                  includes = [b.labels[0] if b.labels else "" for b in root.find("include")]
                  ranked = [INCLUDE_ORDER.index(x) if x in INCLUDE_ORDER else len(INCLUDE_ORDER) for x in includes]
                  if ranked != sorted(ranked):
                      line = root.find("include")[0].line
                      report.add("unit-block-order", path, line,
                                 f"the includes are {', '.join(includes)}; the order is root, unit, then the dependencies")
                  if "inputs" in root.attrs:
                      attr = root.attrs["inputs"]
                      if [t.value for t in attr.value] == ["{", "}"]:
                          lines = text_lines(repo, path) or []
                          above = lines[attr.line - 2].strip() if attr.line >= 2 else ""
                          if above != CONTENT_COMMENT:
                              report.add("unit-block-order", path, attr.line,
                                         f"inputs = {{}} is allowed only for a collection, with the comment "
                                         f"'{CONTENT_COMMENT}' directly above it")


          def rule_no_guid_in_unit(repo, params, units, report):
              """No GUID in a unit terragrunt.hcl: IDs come from account.hcl/context.hcl or a lookup by name in the module."""
              for path in shape_units(repo, units):
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind == "str":
                          for g in re.findall(GUID, t.value):
                              report.add("no-guid-in-unit", path, t.line,
                                         f"the ID {g} is written into a unit: take it from account.hcl or "
                                         "context.hcl, or look it up by name in the module")


          def allowed_ids(repo, params):
              """The GUIDs of the allow-list file, lower case: every GUID the file holds."""
              path = params.get("allowlist", ".github/allowed-ids.yaml")
              if not repo.exists(path):
                  return set(), path
              return {g.lower() for line in text_lines(repo, path) or [] for g in re.findall(GUID, line)}, path


          def unit_yaml_files(repo, units):
              """[(unit, path)] of the YAML files that sit in a unit's directory."""
              dirs = {os.path.dirname(u) for u in shape_units(repo, units)}
              out = []
              for f in yaml_files(repo):
                  unit = owning_unit(f, dirs)
                  if unit:
                      out.append((unit, f))
              return out


          def rule_yaml_ids(repo, params, units, report):
              """A GUID in a collection file is allowed only when .github/allowed-ids.yaml lists it.

              The list holds the well-known first- and third-party app IDs and the role
              template IDs the API needs; the ID of anything the repository itself
              creates is looked up by name in the module.
              """
              allowed, listfile = allowed_ids(repo, params)
              for _, path in unit_yaml_files(repo, units):
                  for n, line in enumerate(text_lines(repo, path) or [], 1):
                      for g in re.findall(GUID, line):
                          if g.lower() not in allowed:
                              report.add("yaml-ids", path, n, f"the ID {g} is not in {listfile}: look it up by name "
                                         "in the module, or list a well-known app or role template ID there with its name")


          def rule_collection_layout(repo, params, units, report):
              """A collection's YAML files sit under <unit>/definitions/ and are named [a-z0-9-]+.yaml."""
              for unit, path in unit_yaml_files(repo, units):
                  rel = path[len(unit) + 1:]
                  if not rel.startswith("definitions/"):
                      report.add("collection-layout", path, 1,
                                 f"{rel} sits next to terragrunt.hcl: collection files live in {unit}/definitions/")
                  name = os.path.basename(path)
                  if not RE_YAML_NAME.match(name):
                      report.add("collection-layout", path, 1,
                                 f"the file name {name} is not ASCII lower case kebab-case English ([a-z0-9-]+.yaml); "
                                 "the key is the name, the display name may be Czech")


          # --------------------------------------------------------------------------
          # Collections: one object per <key>.yaml, checked against the JSON Schema of
          # the module that takes them (code/terragrunt.md#collections of governance).

          RE_KEY = re.compile(r"^[a-z0-9]+(?:-[a-z0-9]+)*$")


          def yaml_files(repo):
              return [f for f in repo.files if f.endswith((".yaml", ".yml"))]


          def collections_of(repo, params):
              """{collection directory: (schema name, file the collection is reported on)}."""
              found, dirs = {}, unit_dirs(repo)
              files = yaml_files(repo)
              roots = params.get("paths", ["infrastructure/**"])
              for unit in sorted(dirs):
                  own = [f[len(unit) + 1:] for f in files if owning_unit(f, dirs) == unit]
                  if not own or not matches(unit + "/x", *roots):
                      continue
                  # A collection reads its objects with fileset(); a YAML file nothing
                  # reads is unit-assets' to report.
                  patterns = RE_FILESET.findall(unit_readers(repo, unit))
                  if not any(matches(rel, p) for rel in own for p in patterns):
                      continue
                  module, _, _ = module_of(repo, f"{unit}/terragrunt.hcl")
                  found[unit] = (os.path.basename(module) if module else None, f"{unit}/terragrunt.hcl")
              # Folders that are collections without a unit: the catalogue repository.
              for entry in params.get("collections") or []:
                  folder, schema = str(entry.get("path", "")).strip("/"), entry.get("schema")
                  for f in files:
                      d = os.path.dirname(f)
                      while d:
                          if matches(d, folder):
                              found.setdefault(d, (schema, f))
                              break
                          d = os.path.dirname(d)
              return found


          def yaml_to_json(repo, path, yq):
              """(data, error) of a YAML file, read by yq the way the runner has it."""
              out = subprocess.run([yq, "-o=json", "-I=0", ".", os.path.join(repo.root, path)],
                                   capture_output=True, text=True)
              if out.returncode != 0:
                  return None, "does not parse as YAML: " + (out.stderr.strip().splitlines() or ["?"])[-1]
              docs = [line for line in out.stdout.splitlines() if line.strip()]
              if len(docs) != 1:
                  return None, "holds more than one YAML document; one object is one file"
              return json.loads(docs[0]), None


          def line_of(repo, path, error):
              """The line of the key an error names, so that the annotation lands on it."""
              m = re.match(r"(/\S*): (?:unknown key '([^']+)'|required key)", error)
              names = []
              if m and m.group(2):
                  names.append(m.group(2))
              if m:
                  names += [p for p in reversed(m.group(1).split("/")) if p and not p.isdigit()]
              lines = text_lines(repo, path) or []
              for name in names:
                  rx = re.compile(r"^\s*(?:-\s+)?[\"']?" + re.escape(name) + r"[\"']?\s*:")
                  for n, line in enumerate(lines, 1):
                      if rx.match(line):
                          return n
              return 1


          def rule_collection_schema(repo, params, units, report):
              """Every object of a collection is <key>.yaml with a unique key and matches its module's schema.

              The schema of a unit's collection is <schemas>/<module>.schema.json, the
              module named by the unit's source; a folder outside every unit is a
              collection when `collections` lists it ({path: <glob>, schema: <module>}).
              """
              import schema_check

              folder = params.get("schemas", ".github/schemas").strip("/")
              yq = params.get("yq") or os.environ.get("YQ", "yq")
              groups = collections_of(repo, params)
              dirs = unit_dirs(repo)
              loaded = {}
              for coll, (name, anchor) in sorted(groups.items()):
                  if not name:
                      report.add("collection-schema", anchor, 1, f"{coll} holds YAML but runs no module to take it")
                      continue
                  schema_path = f"{folder}/{name}.schema.json"
                  if schema_path not in loaded:
                      loaded[schema_path] = None
                      if not repo.exists(schema_path):
                          report.add("collection-schema", anchor, 1,
                                     f"{coll} is a collection of {name} without its schema {schema_path} "
                                     "(the module's schema.json, copied with the modules_ref it pins)")
                          continue
                      try:
                          with open(os.path.join(repo.root, schema_path), encoding="utf-8") as fh:
                              schema = json.load(fh)
                      except ValueError as e:
                          report.add("collection-schema", schema_path, 1, f"not JSON: {e}")
                          continue
                      problems = schema_check.schema_errors(schema) + schema_check.closed_errors(schema)
                      for p in problems:
                          report.add("collection-schema", schema_path, 1, p)
                      if not problems:
                          loaded[schema_path] = schema_check.Validator(schema)
                  validator = loaded[schema_path]
                  keys = {}
                  for path in yaml_files(repo):
                      in_unit = owning_unit(path, dirs)
                      if not (path.startswith(coll + "/") and (in_unit == coll or (coll not in dirs and in_unit is None))):
                          continue
                      stem, ext = os.path.splitext(os.path.basename(path))
                      if ext != ".yaml":
                          report.add("collection-schema", path, 1, f"{os.path.basename(path)}: an object is <key>.yaml")
                      if not RE_KEY.match(stem):
                          report.add("collection-schema", path, 1,
                                     f"key {stem!r}: lowercase ASCII words joined by '-', the file name is the key")
                      keys.setdefault(stem, []).append(path)
                      if validator is None:
                          continue
                      data, error = yaml_to_json(repo, path, yq)
                      if error:
                          report.add("collection-schema", path, 1, error)
                          continue
                      for e in validator.errors(data):
                          report.add("collection-schema", path, line_of(repo, path, e), e)
                  for stem, paths in sorted(keys.items()):
                      if len(paths) > 1:
                          for p in paths:
                              others = ", ".join(x for x in paths if x != p)
                              report.add("collection-schema", p, 1,
                                         f"key {stem!r} is also {others}: a key is unique in its collection")


          SCOPE_CONTEXT = {"mg": "mg.hcl", "sub": "subscription.hcl", "region": "region.hcl", "rg": "rg.hcl"}
          UNIT_FILES = {"terragrunt.hcl", ".terraform.lock.hcl"}


          def rule_scope_layout(repo, params, units, report):
              """Each level of the hierarchy holds its context file, its own unit and the next level only."""
              root = params.get("root", "infrastructure").strip("/")
              dirs = unit_dirs(repo)
              children, files = {}, {}
              for f in repo.files:
                  if not f.startswith(root + "/"):
                      continue
                  d = os.path.dirname(f)
                  files.setdefault(d, []).append(os.path.basename(f))
                  while d != root and d:
                      parent = os.path.dirname(d)
                      children.setdefault(parent, set()).add(os.path.basename(d))
                      d = parent

              def level(d):
                  name, parent = os.path.basename(d), os.path.basename(os.path.dirname(d))
                  if name == "global":
                      return "global"
                  for prefix in ("mg", "sub", "rg"):
                      if name.startswith(prefix + "-"):
                          return prefix
                  if parent.startswith("sub-"):
                      return "region"
                  if "device.hcl" in files.get(d, []):
                      return "device"
                  return None

              allowed = {
                  "mg": (lambda c: c == "global" or c.startswith(("mg-", "sub-")), "global/, mg-*/ and sub-*/"),
                  # Any other folder of a subscription is a region, checked as one.
                  "sub": (lambda c: True, "global/ and the regions"),
                  "region": (lambda c: c.startswith("rg-"), "rg-*/"),
                  "rg": (None, "the units of its resources"),
                  "device": (None, "the units of the device"),
                  "global": (None, "units"),
              }
              for d in sorted(set(files) | set(children)):
                  kind = level(d)
                  if kind is None:
                      continue
                  own = set(files.get(d, []))
                  context = SCOPE_CONTEXT.get(kind) or ("device.hcl" if kind == "device" else None)
                  if context and context not in own:
                      report.add("scope-layout", d + "/", 1, f"{d}/ has no {context}")
                  may_unit = kind in ("mg", "sub", "rg")
                  holds = " and ".join(x for x in (context, "its own unit" if may_unit else "") if x)
                  for f in sorted(own - {context} - (UNIT_FILES if may_unit else set())):
                      report.add("scope-layout", f"{d}/{f}", 1,
                                 f"{f} does not belong in a {kind} folder: "
                                 + (f"it holds {holds} only" if holds else "it holds folders only"))
                  test, what = allowed[kind]
                  for c in sorted(children.get(d, set())):
                      child = f"{d}/{c}"
                      ok = test(c) if test else (child in dirs and level(child) is None)
                      if not ok:
                          report.add("scope-layout", child + "/", 1, f"{child}/ in a {kind} folder: it holds {what}")
                      elif test is None and children.get(child):
                          report.add("scope-layout", child + "/", 1,
                                     f"{child}/ is a unit with folders inside: a unit is one resource and its children, "
                                     "in its own terragrunt.hcl")


          # A scope's own unit sits in the folder of the scope (code/azure.md).
          SCOPE_FOLDERS = {"management-group": ["mg-*"], "subscription": ["sub-*"], "resource-group": ["rg-*"]}


          def rule_folder_dictionary(repo, params, units, report):
              """A unit folder is named after its module: <module> or <module>-<purpose>.

              `prefixes` lets a folder leave out the platform word a module name starts
              with: with `sentinel-`, analytic-rules/ runs azure/sentinel-analytic-rules.
              """
              folders = {**SCOPE_FOLDERS, **(params.get("folders") or {})}
              prefixes = list(params.get("prefixes") or [])
              for path in units:
                  module, _, source_file = module_of(repo, path)
                  if not module:
                      continue
                  name = os.path.basename(module)
                  folder = os.path.basename(os.path.dirname(path))
                  short = next((name[len(p):] for p in prefixes if name.startswith(p) and len(name) > len(p)), None)
                  if source_file != path and os.path.basename(source_file) != f"{name}.hcl":
                      report.add("folder-dictionary", source_file, 1,
                                 f"{source_file} runs the module {module}: it is named {name}.hcl")
                  globs = folders.get(name) or folders.get(module) or []
                  # A folder named in the plural holds one unit per instance, named after it.
                  plural = name[:-1] + "ies" if name.endswith("y") else name + "s"
                  parent = os.path.basename(os.path.dirname(os.path.dirname(path)))
                  if folder == name or folder.startswith(name + "-") or parent == plural \
                          or (short and (folder == short or folder.startswith(short + "-"))) \
                          or (globs and matches(folder, *globs)):
                      continue
                  report.add("folder-dictionary", path, 1,
                             f"{folder}/ runs the module {module}: name it {name}/ or {name}-<purpose>/")


          # Every repository: a to-do comment names its issue, a relative link in Markdown leads
          # somewhere. Both read every file git tracks, apart from the managed copies
          # of the standards in .claude/ (governance checks the originals).
          NOT_OURS = [".claude/**"]
          # Written in two parts so that this file does not report itself.
          TODO_WORD = "TO" + "DO"
          RE_TODO = re.compile(r"\b" + TODO_WORD + r"\b(?!\(#\d+\))")
          SKIP_SUFFIX = (".md", ".lock", ".lock.hcl", ".png", ".jpg", ".jpeg", ".gif", ".ico", ".svg", ".pdf",
                         ".zip", ".gz", ".woff", ".woff2", ".ttf", ".otf", ".pfx", ".cer", ".crt", ".der")


          def text_lines(repo, path):
              """The lines of a text file, or None for a binary or unreadable one."""
              full = os.path.join(repo.root, path)
              try:
                  if os.path.getsize(full) > 1_000_000:
                      return None
                  with open(full, "rb") as fh:
                      data = fh.read()
              except OSError:
                  return None
              if b"\0" in data:
                  return None
              return data.decode("utf-8", errors="replace").splitlines()


          def rule_todo_issue(repo, params, units, report):
              """A to-do comment names its issue, as in (#42) after the word, so that it is found and done."""
              files = repo.glob(*params["files"]) if params.get("files") else repo.files
              skip = NOT_OURS + list(params.get("exclude") or [])
              for path in files:
                  if matches(path, *skip) or path.lower().endswith(SKIP_SUFFIX):
                      continue
                  for n, line in enumerate(text_lines(repo, path) or [], 1):
                      if RE_TODO.search(line):
                          report.add("todo-issue", path, n,
                                     f"{TODO_WORD} without its issue: write {TODO_WORD}(#<issue>): <what>, or open the issue")


          RE_FENCE = re.compile(r"^\s{0,3}(`{3,}|~{3,})")
          RE_INLINE = re.compile(r"(!?)\[((?:[^\[\]]|\[[^\]]*\])*)\]\(\s*(<[^>]*>|[^\s)]+(?:\([^\s)]*\))?)(?:\s+[\"'(][^)]*)?\s*\)")
          RE_REFDEF = re.compile(r"^\s{0,3}\[[^\]]+\]:\s*(<[^>]*>|\S+)")
          RE_SCHEME = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")
          RE_HEADING = re.compile(r"^\s{0,3}#{1,6}\s+(.*?)\s*#*\s*$")
          RE_HTML_ID = re.compile(r"<a\s+(?:[^>]*\s)?(?:id|name)=[\"']([^\"']+)[\"']", re.I)


          def markdown_code_free(lines, blank=True):
              """(line number, text) of the lines outside fenced code, inline code blanked out unless not blank."""
              fence = None
              comment = False
              for n, line in enumerate(lines, 1):
                  m = RE_FENCE.match(line)
                  if fence:
                      if m and m.group(1)[0] == fence[0] and len(m.group(1)) >= len(fence):
                          fence = None
                      continue
                  if m:
                      fence = m.group(1)
                      continue
                  if comment or "<!--" in line:
                      start = 0 if comment else line.index("<!--")
                      end = line.find("-->", start)
                      comment = end < 0
                      line = line[:start] + ("" if comment else line[end + 3:])
                  yield n, re.sub(r"(`+)(.+?)\1", lambda c: " " * len(c.group(0)), line) if blank else line


          def slug(text: str) -> str:
              """GitHub's anchor of a heading."""
              text = re.sub(r"!\[[^\]]*\]\([^)]*\)", "", text)
              text = re.sub(r"\[([^\]]*)\]\([^)]*\)", r"\1", text)
              text = re.sub(r"<[^>]+>", "", text).replace("`", "").lower().strip()
              text = re.sub(r"[^\w\- ]", "", text)
              return text.replace(" ", "-")


          def anchors(lines) -> set:
              found, seen = set(), {}
              # Inline code stays: GitHub keeps its text in the anchor (## `_common/` -> #_common).
              for _, line in markdown_code_free(lines, blank=False):
                  found.update(RE_HTML_ID.findall(line))
                  m = RE_HEADING.match(line)
                  if not m:
                      continue
                  base = slug(m.group(1))
                  k = seen.get(base, 0)
                  seen[base] = k + 1
                  found.add(base if k == 0 else f"{base}-{k}")
              return found


          def rule_markdown_links(repo, params, units, report):
              """A relative link in Markdown leads to a file of the repository (and a heading in it)."""
              skip = NOT_OURS + list(params.get("exclude") or [])
              dirs = {os.path.dirname(f) for f in repo.files}
              for d in list(dirs):
                  while d:
                      d = os.path.dirname(d)
                      dirs.add(d)
              cache = {}

              def lines_of(path):
                  if path not in cache:
                      cache[path] = text_lines(repo, path) or []
                  return cache[path]

              for path in repo.files:
                  if not path.lower().endswith(".md") or matches(path, *skip):
                      continue
                  for n, line in markdown_code_free(lines_of(path)):
                      targets = [m.group(3) for m in RE_INLINE.finditer(line)]
                      if (m := RE_REFDEF.match(line)):
                          targets.append(m.group(1))
                      for raw in targets:
                          target = raw[1:-1] if raw.startswith("<") else raw
                          if not target or RE_SCHEME.match(target) or target.startswith("//"):
                              continue
                          file_part, _, anchor = target.partition("#")
                          file_part = urllib.parse.unquote(file_part.split("?")[0])
                          if not file_part:
                              dest = path
                          elif file_part.startswith("/"):
                              dest = os.path.normpath(file_part.lstrip("/"))
                          else:
                              dest = os.path.normpath(os.path.join(os.path.dirname(path), file_part))
                          if dest.startswith(".."):
                              report.add("markdown-links", path, n, f"{target} leads out of the repository")
                              continue
                          dest = "" if dest == "." else dest
                          if dest not in repo.files and dest.rstrip("/") not in dirs:
                              report.add("markdown-links", path, n, f"{target}: {dest or '/'} does not exist")
                              continue
                          if anchor and dest.lower().endswith(".md") and dest in repo.files \
                                  and urllib.parse.unquote(anchor).lower() not in {a.lower() for a in anchors(lines_of(dest))}:
                              report.add("markdown-links", path, n, f"{target}: no heading #{anchor} in {dest}")


          def left_rule(name):
              """A rule of conventions_left.py, imported when it runs (the file travels next to this one)."""
              def run(repo, params, units, report):
                  import conventions_left
                  getattr(conventions_left, "rule_" + name)(sys.modules[__name__], repo, params, units, report)
              run.__doc__ = f"See conventions_left.rule_{name}."
              return run


          def nearest(repo, directory, name):
              while True:
                  candidate = os.path.join(directory, name) if directory else name
                  if repo.exists(candidate):
                      return candidate
                  if not directory:
                      return None
                  directory = os.path.dirname(directory)


          RULES = {
              "variable-no-default": rule_variable_no_default,
              "variable-documented": rule_variable_documented,
              "module-source": rule_module_source,
              "dependencies-in-common": rule_dependencies_in_common,
              "mock-outputs": rule_mock_outputs,
              "tags-required": rule_tags_required,
              "no-hardcoded-ids": rule_no_hardcoded_ids,
              "no-hardcoded-location": rule_no_hardcoded_location,
              "no-envcommon": rule_no_envcommon,
              "lock-none-needs-reason": rule_lock_none_needs_reason,
              "unit-assets": rule_unit_assets,
              "no-raw-terraform": rule_no_raw_terraform,
              "unit-no-logic": rule_unit_no_logic,
              "unit-comments": rule_unit_comments,
              "unit-block-order": rule_unit_block_order,
              "no-guid-in-unit": rule_no_guid_in_unit,
              "yaml-ids": rule_yaml_ids,
              "collection-layout": rule_collection_layout,
              "collection-unit": left_rule("collection_unit"),
              "imports-left": left_rule("imports_left"),
              "moves-left": left_rule("moves_left"),
              "state-moves-stale": left_rule("state_moves_stale"),
              "collection-schema": rule_collection_schema,
              "scope-layout": rule_scope_layout,
              "folder-dictionary": rule_folder_dictionary,
              "todo-issue": rule_todo_issue,
              "markdown-links": rule_markdown_links,
          }
          # Rules every repository has without naming them (pr / check runs them);
          # level off turns one off.
          DEFAULT_ON = ("todo-issue", "markdown-links", "collection-schema")
          # The shape rules run in every repository that names its units, as warnings
          # until the repository sets a level (error, or off with a reason).
          DEFAULT_WARN = ("no-raw-terraform", "unit-no-logic", "unit-comments", "unit-block-order",
                          "no-guid-in-unit", "yaml-ids", "collection-layout", "collection-unit",
                          "imports-left", "moves-left", "state-moves-stale")
          LEVELS = ("error", "warn", "off")


          # --------------------------------------------------------------------------

          def check(config: dict, root: str, only=None, skip=()):
              """(violations with their level and exception, config errors)."""
              errors = []
              rules = dict(config.get("rules") or {})
              for name in DEFAULT_ON:
                  rules.setdefault(name, {"level": "error"})
              for name in DEFAULT_WARN:
                  rules.setdefault(name, {"level": "warn"})
              for name, params in rules.items():
                  if name not in RULES:
                      errors.append(f"unknown rule {name!r}; known: {', '.join(sorted(RULES))}")
                  elif (params or {}).get("level", "error") not in LEVELS:
                      errors.append(f"rule {name}: level must be one of {', '.join(LEVELS)}")
              exceptions = config.get("exceptions") or []
              for k, e in enumerate(exceptions):
                  if not str(e.get("reason", "")).strip():
                      errors.append(f"exception {k + 1} ({e.get('rule')}, {e.get('path')}) has no reason")
                  if e.get("rule") not in RULES:
                      errors.append(f"exception {k + 1} names an unknown rule {e.get('rule')!r}")
              if errors:
                  return [], errors

              repo = Repo(root)
              units = repo.glob(*(config.get("units") or []))
              report = Report()
              for name, params in rules.items():
                  params = params or {}
                  if params.get("level", "error") == "off" or name in skip or (only and name not in only):
                      continue
                  try:
                      RULES[name](repo, params, units, report)
                  except (OSError, ValueError) as e:
                      errors.append(f"rule {name} could not run: {e}")
              lines = {}
              for v in report.items:
                  v["level"] = v.pop("forced_level", None) or (rules[v["rule"]] or {}).get("level", "error")
                  v["exception"] = None
                  for e in exceptions:
                      if e["rule"] != v["rule"] or not matches(v["path"], e.get("path", "**")):
                          continue
                      if e.get("match"):
                          if v["path"] not in lines:
                              with open(os.path.join(root, v["path"]), encoding="utf-8") as fh:
                                  lines[v["path"]] = fh.read().splitlines()
                          text = lines[v["path"]][v["line"] - 1] if 0 < v["line"] <= len(lines[v["path"]]) else ""
                          if e["match"] not in text and e["match"] not in v["message"]:
                              continue
                      v["exception"] = e["reason"]
                      break
              return report.items, errors


          def escape(text: str) -> str:
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(config_path: str, root: str = ".", only=None, skip=()) -> int:
              with open(config_path, encoding="utf-8") as fh:
                  config = json.load(fh) or {}
              violations, errors = check(config, root, only, skip)
              for e in errors:
                  print(f"::error title=conventions::{escape(e)}")
              failing = 0
              for v in violations:
                  if v["exception"]:
                      continue
                  kind = "error" if v["level"] == "error" else "warning"
                  failing += kind == "error"
                  print(f"::{kind} file={v['path']},line={v['line']},title={v['rule']}::{escape(v['message'])}")

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              out = ["## Conventions", ""]
              active = [v for v in violations if not v["exception"]]
              accepted = [v for v in violations if v["exception"]]
              if not violations and not errors:
                  out.append("Every rule holds.")
              for title, rows, extra in (("Violations", active, "level"), ("Accepted", accepted, "exception")):
                  if not rows:
                      continue
                  out += ["", f"### {title}", "", f"| Rule | Where | What | {extra.capitalize()} |", "|---|---|---|---|"]
                  out += [f"| {v['rule']} | `{v['path']}:{v['line']}` | {v['message'].replace('|', '/')} "
                          f"| {str(v[extra]).replace('|', '/')} |" for v in rows]
              if errors:
                  out += ["", "### Config errors", ""] + [f"- {e}" for e in errors]
              text = "\n".join(out) + "\n"
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 1 if failing or errors else 0


          def cli(argv: list) -> int:
              opts, args = {}, []
              it = iter(argv)
              for a in it:
                  if a in ("--only", "--skip"):
                      opts[a[2:]] = [x for x in next(it, "").split(",") if x]
                  else:
                      args.append(a)
              if not args:
                  sys.exit(__doc__)
              return main(*args[:2], only=opts.get("only"), skip=tuple(opts.get("skip") or ()))


          if __name__ == "__main__":
              sys.exit(cli(sys.argv[1:]))
          __CI_EOF__
          if [ -z "$CONFIG" ]; then
            CONFIG=.github/conventions.yaml
            [ -f "$CONFIG" ] || CONFIG=conventions.yaml
          fi
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found"
            exit 1
          fi
          yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/conventions.json"
          # The rules every repository has run in pr / check (pr.yml).
          python3 "$script" "$RUNNER_TEMP/conventions.json" . --skip todo-issue,markdown-links,collection-schema

      # The analytic rules, against what Sentinel takes (sentinel-lint.yaml).
      - name: Analytic rules
        id: sentinel
        if: github.event_name == 'pull_request' && inputs.sentinel-lint
        continue-on-error: true
        env:
          CONFIG: ${{ inputs.sentinel-config }}
        run: |
          script="$RUNNER_TEMP/sentinel_lint.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks Microsoft Sentinel analytic rules before they are deployed.

          Usage: sentinel_lint.py <config.json> [<repository root>]

          The workflow converts sentinel-lint.yaml to JSON first (yq). The config:

            rules:       [{path, format, substitutions_from}]
                         format "pair": <name>.json with kind and properties, the query
                         in <name>.kql beside it, ${name} placeholders filled from the
                         `substitutions` of the terragrunt.hcl in substitutions_from.
                         format "arm": ARM templates whose resources include
                         .../alertRules, the query inside.
            watchlists:  files that define watchlists; an alias is `alias = "X"` (HCL)
                         or "watchlistAlias": "X" (ARM)
            checks:      {<check>: error | warn | off}, error when not listed
            exceptions:  [{rule (the check), path (a glob of the rule file), reason,
                          review (YYYY-MM-DD)}]; the older {check, rule (the glob)}
                          is read as well

          What a deploy would only reject after the merge, or would accept and then
          quietly do the wrong thing with, is caught here: a broken {{column}} in the
          alert name, a tactic Sentinel does not know, more entities than Sentinel takes,
          a frequency longer than the period it looks at (events in between are never
          seen), grouping by an entity the rule does not map, a watchlist that does not
          exist. The limits and the enumerations follow the alertRules REST API.
          """
          import json
          import os
          import re
          import subprocess
          import sys

          TACTICS = {
              "Reconnaissance", "ResourceDevelopment", "InitialAccess", "Execution", "Persistence",
              "PrivilegeEscalation", "DefenseEvasion", "CredentialAccess", "Discovery", "LateralMovement",
              "Collection", "Exfiltration", "CommandAndControl", "Impact", "PreAttack",
              "ImpairProcessControl", "InhibitResponseFunction",
          }
          ENTITY_TYPES = {
              "Account", "Host", "IP", "Malware", "File", "Process", "CloudApplication", "DNS",
              "AzureResource", "FileHash", "RegistryKey", "RegistryValue", "SecurityGroup", "URL",
              "Mailbox", "MailCluster", "MailMessage", "SubmissionMail",
          }
          KINDS = {"Scheduled", "NRT", "Fusion", "MicrosoftSecurityIncidentCreation",
                   "MLBehaviorAnalytics", "ThreatIntelligence"}
          SEVERITIES = {"High", "Medium", "Low", "Informational"}
          OPERATORS = {"GreaterThan", "LessThan", "Equal", "NotEqual"}
          ALERT_DETAILS = {"DisplayName", "Severity"}
          MAX_ENTITIES, MAX_FIELDS, MAX_CUSTOM, MAX_PARAMS = 10, 3, 20, 3
          MIN_SCHEDULE, MAX_SCHEDULE = 5 * 60, 14 * 86400

          CHECKS = ("json-valid", "kql-present", "kind", "severity", "schedule", "trigger", "tactics",
                    "techniques", "alert-details", "entities", "custom-details", "grouping",
                    "unique-name", "substitutions", "watchlist-exists")
          LEVELS = ("error", "warn", "off")

          RE_DURATION = re.compile(r"^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$")
          RE_PLACEHOLDER = re.compile(r"\$\{(\w+)\}")
          RE_COLUMN = re.compile(r"\{\{([^{}]*)\}\}")
          RE_WATCHLIST = re.compile(r"_GetWatchlist\(\s*['\"]([^'\"]+)['\"]")
          RE_ALIAS = re.compile(r"""(?:\balias\s*=\s*"([^"]+)"|"watchlistAlias"\s*:\s*"([^"]+)")""")


          def seconds(duration):
              m = RE_DURATION.match(duration or "")
              if not m or duration in ("P", "PT"):
                  return None
              d, h, mi, s = (int(x or 0) for x in m.groups())
              return ((d * 24 + h) * 60 + mi) * 60 + s


          def glob_re(pattern: str):
              out, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif pattern[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  else:
                      out, i = out + re.escape(pattern[i]), i + 1
              return re.compile(out + r"\Z")


          class Rule:
              """One analytic rule, whichever format it came from."""

              def __init__(self, path, kind, props, query, text, placeholders=()):
                  self.path, self.kind, self.props, self.query = path, kind, props, query
                  self.text, self.placeholders = text, set(placeholders)

              def line(self, key):
                  """The line where the key first appears in the file, or 1."""
                  pos = self.text.find(f'"{key}"')
                  return self.text.count("\n", 0, pos) + 1 if pos >= 0 else 1

              @property
              def name(self):
                  return self.props.get("displayName") or os.path.basename(self.path)


          def tracked(root):
              out = subprocess.run(["git", "ls-files"], cwd=root, capture_output=True, text=True,
                                   check=True).stdout
              return sorted(out.splitlines())


          def substitution_keys(path):
              """The keys of `substitutions = { ... }` in a terragrunt.hcl."""
              text = open(path, encoding="utf-8").read()
              m = re.search(r"\bsubstitutions\s*=\s*\{", text)
              if not m:
                  return set()
              depth, i, keys = 1, m.end(), set()
              line_start = True
              while i < len(text) and depth:
                  c = text[i]
                  if c == "{" or c == "(" or c == "[":
                      depth += 1
                  elif c in "})]":
                      depth -= 1
                  elif c == "\n":
                      line_start = True
                      i += 1
                      continue
                  if line_start and depth == 1:
                      km = re.match(r"\s*([A-Za-z_]\w*)\s*=", text[i:])
                      if km:
                          keys.add(km.group(1))
                  line_start = False
                  i += 1
              return keys


          def load_rules(config, root, files, report):
              rules = []
              for source in config.get("rules") or []:
                  base = source["path"].rstrip("/") + "/"
                  fmt = source.get("format", "pair")
                  subs = None
                  if fmt == "pair" and source.get("substitutions_from"):
                      subs = substitution_keys(os.path.join(root, source["substitutions_from"]))
                  for path in files:
                      if not path.startswith(base) or not path.endswith(".json"):
                          continue
                      full = os.path.join(root, path)
                      text = open(full, encoding="utf-8-sig").read()
                      if fmt == "pair":
                          try:
                              data = json.loads(RE_PLACEHOLDER.sub("0", text), strict=False)
                          except ValueError as e:
                              report.add("json-valid", path, 1, os.path.basename(path), f"not valid JSON: {e}")
                              continue
                          kql_path = full[:-5] + ".kql"
                          query = open(kql_path, encoding="utf-8").read() if os.path.exists(kql_path) else None
                          found = set(RE_PLACEHOLDER.findall(text)) | set(RE_PLACEHOLDER.findall(query or ""))
                          rule = Rule(path, data.get("kind"), data.get("properties") or {}, query, text, found)
                          rule.substitutions = subs
                          rule.query_path = kql_path[len(root) + 1:] if query is not None else None
                          rules.append(rule)
                      else:
                          try:
                              data = json.loads(text, strict=False)
                          except ValueError as e:
                              report.add("json-valid", path, 1, os.path.basename(path), f"not valid JSON: {e}")
                              continue
                          for res in data.get("resources") or []:
                              if not str(res.get("type", "")).endswith("alertRules"):
                                  continue
                              props = res.get("properties") or {}
                              rule = Rule(path, res.get("kind"), props, props.get("query"), text)
                              rule.substitutions = None
                              rule.query_path = None
                              rules.append(rule)
              return rules


          class Report:
              def __init__(self):
                  self.items = []

              def add(self, check, path, line, rule, message):
                  self.items.append({"check": check, "path": path, "line": line, "rule": rule,
                                     "message": message})


          def lint(rule, report, aliases):
              p, add = rule.props, (lambda check, key, msg: report.add(check, rule.path, rule.line(key), rule.name, msg))
              scheduled = rule.kind in ("Scheduled", "NRT")

              if rule.kind not in KINDS:
                  add("kind", "kind", f"kind {rule.kind!r} is not one Sentinel knows")
              if scheduled and not (rule.query or "").strip():
                  add("kql-present", "displayName", "no query" + (" (the .kql beside it is missing)"
                                                                  if rule.query is None else ""))
              if "severity" in p and p["severity"] not in SEVERITIES:
                  add("severity", "severity", f"severity {p['severity']!r} is not one of {', '.join(sorted(SEVERITIES))}")

              if rule.kind == "Scheduled":
                  freq, period = seconds(p.get("queryFrequency")), seconds(p.get("queryPeriod"))
                  for key, value in (("queryFrequency", freq), ("queryPeriod", period)):
                      if value is None:
                          add("schedule", key, f"{key} {p.get(key)!r} is not an ISO 8601 duration")
                      elif not MIN_SCHEDULE <= value <= MAX_SCHEDULE:
                          add("schedule", key, f"{key} {p.get(key)} is outside 5 minutes to 14 days")
                  if freq and period and freq > period:
                      add("schedule", "queryFrequency",
                          f"runs every {p['queryFrequency']} but looks back only {p['queryPeriod']}: "
                          "events in between are never seen")
                  if p.get("suppressionEnabled") and seconds(p.get("suppressionDuration")) is None:
                      add("schedule", "suppressionDuration",
                          f"suppressionDuration {p.get('suppressionDuration')!r} is not an ISO 8601 duration")
                  if p.get("triggerOperator") not in OPERATORS:
                      add("trigger", "triggerOperator", f"triggerOperator {p.get('triggerOperator')!r} is not one of "
                          + ", ".join(sorted(OPERATORS)))
                  threshold = p.get("triggerThreshold")
                  if not isinstance(threshold, int) or isinstance(threshold, bool) or threshold < 0:
                      add("trigger", "triggerThreshold", f"triggerThreshold {threshold!r} is not a whole number from 0")

              for tactic in p.get("tactics") or []:
                  if tactic not in TACTICS:
                      add("tactics", "tactics", f"tactic {tactic!r} is not one Sentinel knows")
              techniques = p.get("techniques") or []
              for technique in techniques:
                  if not re.fullmatch(r"T\d{4}", str(technique)):
                      add("techniques", "techniques", f"technique {technique!r} is not T plus four digits "
                          "(a sub-technique belongs in subTechniques)")
              for sub in p.get("subTechniques") or []:
                  if not re.fullmatch(r"T\d{4}\.\d{3}", str(sub)):
                      add("techniques", "subTechniques", f"sub-technique {sub!r} is not Tdddd.ddd")
                  elif sub.split(".")[0] not in techniques:
                      add("techniques", "subTechniques", f"sub-technique {sub} without its technique {sub.split('.')[0]}")

              override = p.get("alertDetailsOverride") or {}
              for key in ("alertDisplayNameFormat", "alertDescriptionFormat"):
                  text = override.get(key)
                  if not text:
                      continue
                  stripped = RE_COLUMN.sub("", text)
                  if "{{" in text and ("{" in stripped or "}" in stripped):
                      add("alert-details", key, f"{key} has a broken {{{{column}}}}: {text.strip()[:80]!r}")
                  columns = set(RE_COLUMN.findall(text))
                  if len(columns) > MAX_PARAMS:
                      add("alert-details", key, f"{key} uses {len(columns)} columns; Sentinel takes at most {MAX_PARAMS}")

              mappings = p.get("entityMappings") or []
              if len(mappings) > MAX_ENTITIES:
                  add("entities", "entityMappings", f"{len(mappings)} entity mappings; Sentinel takes at most {MAX_ENTITIES}")
              for m in mappings:
                  etype, fields = m.get("entityType"), m.get("fieldMappings") or []
                  if etype not in ENTITY_TYPES:
                      add("entities", "entityMappings", f"entity type {etype!r} is not one Sentinel knows")
                  if not 1 <= len(fields) <= MAX_FIELDS:
                      add("entities", "entityMappings", f"{etype} maps {len(fields)} identifiers; "
                          f"Sentinel takes 1 to {MAX_FIELDS}")

              custom = p.get("customDetails") or {}
              if len(custom) > MAX_CUSTOM:
                  add("custom-details", "customDetails", f"{len(custom)} custom details; Sentinel takes at most {MAX_CUSTOM}")

              grouping = ((p.get("incidentConfiguration") or {}).get("groupingConfiguration") or {})
              if grouping.get("enabled"):
                  by_entities = grouping.get("groupByEntities") or []
                  by_details = grouping.get("groupByAlertDetails") or []
                  by_custom = grouping.get("groupByCustomDetails") or []
                  if grouping.get("matchingMethod") == "Selected" and not (by_entities or by_details or by_custom):
                      add("grouping", "matchingMethod", "matchingMethod Selected with nothing to group by")
                  mapped = {m.get("entityType") for m in mappings}
                  for e in by_entities:
                      if e not in mapped:
                          add("grouping", "groupByEntities", f"groups by {e}, which the rule does not map")
                  for d in by_details:
                      if d not in ALERT_DETAILS:
                          add("grouping", "groupByAlertDetails", f"groups by alert detail {d!r}; only DisplayName and Severity")
                  for c in by_custom:
                      if c not in custom:
                          add("grouping", "groupByCustomDetails", f"groups by custom detail {c}, which the rule does not define")

              if rule.substitutions is not None:
                  for name in sorted(rule.placeholders - rule.substitutions):
                      # Spelled out: the two characters together would start an
                      # expression in the workflow this script is carried in.
                      add("substitutions", "displayName", "$" + "{" + name + "} is not in the substitutions of the unit")

              if aliases is not None:
                  for alias in sorted(set(RE_WATCHLIST.findall(rule.query or ""))):
                      if alias not in aliases:
                          report.add("watchlist-exists", rule.query_path or rule.path, 1, rule.name,
                                     f"_GetWatchlist('{alias}'): no such watchlist in the code")


          def check(config, root):
              errors = []
              levels = config.get("checks") or {}
              for name, level in levels.items():
                  if name not in CHECKS:
                      errors.append(f"unknown check {name!r}; known: {', '.join(CHECKS)}")
                  elif level not in LEVELS:
                      errors.append(f"check {name}: level must be one of {', '.join(LEVELS)}")
              exceptions = [normalised(e) for e in config.get("exceptions") or []]
              for k, e in enumerate(exceptions):
                  if not str(e.get("reason", "")).strip():
                      errors.append(f"exception {k + 1} ({e.get('rule')}, {e.get('path')}) has no reason")
                  if e.get("rule") not in CHECKS:
                      errors.append(f"exception {k + 1} names an unknown check {e.get('rule')!r}")
              if not config.get("rules"):
                  errors.append("rules: no path to analytic rules given")
              if errors:
                  return [], errors, 0

              files = tracked(root)
              report = Report()
              rules = load_rules(config, root, files, report)
              aliases = None
              if config.get("watchlists"):
                  aliases = set()
                  for path in files:
                      if any(glob_re(g).match(path) for g in config["watchlists"]):
                          text = open(os.path.join(root, path), encoding="utf-8-sig").read()
                          aliases |= {a or b for a, b in RE_ALIAS.findall(text)}
              names = {}
              for rule in rules:
                  lint(rule, report, aliases)
                  names.setdefault(rule.name, []).append(rule)
              for name, same in names.items():
                  if len(same) > 1:
                      for rule in same:
                          report.add("unique-name", rule.path, rule.line("displayName"), name,
                                     f"{len(same)} rules are called {name!r}")

              out = []
              for v in report.items:
                  v["level"] = levels.get(v["check"], "error")
                  if v["level"] == "off":
                      continue
                  v["exception"] = next((e["reason"] for e in exceptions
                                         if e["rule"] == v["check"] and glob_re(e.get("path") or "**").match(v["path"])),
                                        None)
                  out.append(v)
              return out, errors, len(rules)


          def normalised(e: dict) -> dict:
              """An exception in the organisation's format: rule (the check), path, reason, review.

              The first format named the check `check` and the file glob `rule`."""
              if "check" in e:
                  e = {**e, "rule": e["check"], "path": e.get("rule")}
                  del e["check"]
              return e


          def escape(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(config_path, root="."):
              with open(config_path, encoding="utf-8") as fh:
                  config = json.load(fh) or {}
              violations, errors, count = check(config, root)
              for e in errors:
                  print(f"::error title=sentinel-lint::{escape(e)}")
              failing = 0
              for v in violations:
                  if v["exception"]:
                      continue
                  kind = "error" if v["level"] == "error" else "warning"
                  failing += kind == "error"
                  print(f"::{kind} file={v['path']},line={v['line']},title={v['check']}::{escape(v['message'])}")
              active = [v for v in violations if not v["exception"]]
              accepted = [v for v in violations if v["exception"]]
              out = ["## Sentinel content", "", f"{count} analytic rules checked."]
              for title, rows, extra in (("Findings", active, "level"), ("Accepted", accepted, "exception")):
                  if rows:
                      out += ["", f"### {title}", "", f"| Check | Rule | What | {extra.capitalize()} |", "|---|---|---|---|"]
                      out += [f"| {v['check']} | `{v['path']}:{v['line']}` | {v['message'].replace('|', '/')} "
                              f"| {str(v[extra]).replace('|', '/')} |" for v in rows]
              if errors:
                  out += ["", "### Config errors", ""] + [f"- {e}" for e in errors]
              text = "\n".join(out) + "\n"
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 1 if failing or errors else 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
