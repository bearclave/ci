                      return json.loads(value)
                  except ValueError:
                      pass
              return value


          def diff(before, after, path=()):
              """Paths whose value differs, down to the leaves.

              A missing object counts as an empty one, so a tag that is added is a path
              of its own; lists of scalars and lists that change length stay whole.
              """
              before, after = as_json(before), as_json(after)
              if isinstance(before, dict) or isinstance(after, dict):
                  if isinstance(before, (dict, type(None))) and isinstance(after, (dict, type(None))):
                      b, a = before or {}, after or {}
                      for key in sorted(set(b) | set(a), key=str):
                          yield from diff(b.get(key), a.get(key), path + (key,))
                      return
              if (isinstance(before, list) and isinstance(after, list) and not scalars(before)
                      and not scalars(after) and len(before) == len(after)):
                  for i, (b, a) in enumerate(zip(before, after)):
                      yield from diff(b, a, path + (i,))
              elif before != after and not (before in (None, [], "") and after in (None, [], "")):
                  yield path


          def label(path, rtype: str = "") -> str:
              """How a person says which setting it is: tag `owner`, setting `a.b`."""
              steps = list(path)
              while steps and steps[0] in WRAPPERS and rtype.startswith(("azapi_", "msgraph_")):
                  steps.pop(0)
              if len(steps) == 2 and steps[0] == "tags":
                  return f"tag {code(steps[1])}"
              text = ""
              for step in steps:
                  if isinstance(step, int):
                      text += f"[{step}]" if step else ""
                  else:
                      text += ("." if text else "") + str(step)
              return f"setting {code(text or '(whole resource)')}"


          def summary(value) -> str:
              """A block of a list (a log category, a rule) told by its first scalars."""
              if isinstance(value, dict):
                  parts = [f"{k}={v}" for k, v in value.items()
                           if isinstance(v, (str, int, float, bool)) and v not in ("", None)]
                  return ", ".join(parts[:3]) or json.dumps(value, ensure_ascii=False)
              return str(value)


          def attribute_rows(change: dict, rtype: str = "") -> list:
              """(what, from, to) for every change of an update that matters."""
              before, after = change.get("before") or {}, change.get("after") or {}
              bs, as_ = change.get("before_sensitive") or {}, change.get("after_sensitive") or {}
              unknown = change.get("after_unknown") or {}
              out = []
              for path in diff(before, after):
                  if any(isinstance(s, str) and NOISE.match(s) for s in path):
                      continue
                  if flagged(unknown, path):
                      continue
                  what = label(path, rtype)
                  if anything_flagged(bs, path) or anything_flagged(as_, path):
                      out.append((what, "(sensitive)", "(sensitive)"))
                      continue
                  b, a = as_json(at(before, path)), as_json(at(after, path))
                  if isinstance(b, list) or isinstance(a, list):
                      b, a = b or [], a or []
                      added = [x for x in a if x not in b]
                      removed = [x for x in b if x not in a]
                      if not added and not removed:
                          out.append((f"{what}: order", NONE, NONE))
                          continue
                      for verb, items in (("added", added), ("removed", removed)):
                          shown = items[:MAX_LIST]
                          for x in shown:
                              text = x if not isinstance(x, (dict, list)) else summary(x)
                              out.append((f"{what}: {verb} {fmt(text)}", NONE, NONE))
                          if len(items) > MAX_LIST:
                              out.append((f"{what}: {len(items) - MAX_LIST} more {verb}", NONE, NONE))
                      continue
                  if isinstance(b, str) and isinstance(a, str):
                      b, a = crop(b, a)
                  out.append((what, fmt(b), fmt(a)))
              return out


          def diagnostic(values) -> str:
              """Logs and metrics of a diagnostic setting, and where they go."""
              if not isinstance(values, dict):
                  return ""
              body = values.get("body") if isinstance(values.get("body"), dict) else {}
              values = {**values, **(body.get("properties") or {})}
              logs, metrics = [], []
              for key in ("enabled_log", "log", "logs"):
                  for item in values.get(key) or []:
                      if isinstance(item, dict) and item.get("enabled", True):
                          name = item.get("category") or item.get("categoryGroup") or item.get("category_group")
                          if name:
                              logs.append(name)
              for key in ("enabled_metric", "metric", "metrics"):
                  for item in values.get(key) or []:
                      if isinstance(item, dict) and item.get("enabled", True) and item.get("category"):
                          metrics.append(item["category"])
              target = (values.get("log_analytics_workspace_id") or values.get("workspaceId")
                        or values.get("storage_account_id") or values.get("storageAccountId")
                        or values.get("eventhub_name"))
              parts = []
              if logs:
                  parts.append("logs " + ", ".join(code(x) for x in logs[:MAX_LIST])
                               + (f" and {len(logs) - MAX_LIST} more" if len(logs) > MAX_LIST else ""))
              if metrics:
                  parts.append("metrics " + ", ".join(code(x) for x in metrics[:MAX_LIST]))
              text = "; ".join(parts) or "nothing"
              if target:
                  where = "workspace" if "workspace" in str(target).lower() or values.get(
                      "log_analytics_workspace_id") else "destination"
                  text += f" → {where} {code(short_id(target))}"
              return text


          def verb_of(rc: dict):
              change = rc.get("change") or {}
              actions = tuple(change.get("actions") or [])
              if actions == ("forget",):
                  return "forget"
              verb = {("create",): "create", ("update",): "update", ("delete",): "destroy",
                      ("delete", "create"): "replace", ("create", "delete"): "replace",
                      ("read",): "read"}.get(actions)
              if verb is None:
                  if change.get("importing"):
                      return "import"
                  if rc.get("previous_address") and rc["previous_address"] != rc["address"]:
                      return "move"
              return verb


          def entry(rc: dict, unit: str):
              """What the comment says about one resource change, or None to leave it out."""
              if rc.get("mode") == "data":
                  return None
              verb = verb_of(rc)
              if verb in (None, "read"):
                  return None
              change = rc.get("change") or {}
              rtype = rc.get("type", "")
              values = change.get("after") or change.get("before")
              imported = bool(change.get("importing"))
              moved = rc.get("previous_address") and rc["previous_address"] != rc["address"]
              item = {"unit": unit, "address": rc["address"], "action": verb, "icon": ICONS[verb],
                      "kind": kind(rtype, values), "name": name_of(rc) or address_parts(rc["address"])[1],
                      "rows": [], "why": "", "imported": imported}
              is_diag = item["kind"].endswith("Diagnostic settings")
              if verb == "create":
                  text = "created"
                  if is_diag:
                      text = "diagnostic settings added: " + diagnostic(change.get("after"))
                  item["rows"] = [(text, NONE, NONE)]
              elif verb in ("update", "import", "move"):
                  rows = attribute_rows(change, rtype)
                  if is_diag and rows and verb == "update":
                      rows = [(f"diagnostic settings: {r[0]}", r[1], r[2]) for r in rows]
                  if verb == "import":
                      rows = [("imported", NONE, NONE)] + rows
                  if verb == "move":
                      rows = [(f"moved from {code(rc['previous_address'])}", NONE, NONE)] + rows
                  if verb == "update" and not rows:
                      rows = [("updated; the new values are known only after apply", NONE, NONE)]
                  item["rows"] = rows
              elif verb == "forget":
                  item["rows"] = [("removed from Terraform, left in place", NONE, NONE)]
              elif verb == "destroy":
                  item["why"] = REASONS.get(rc.get("action_reason", ""), "")
                  item["rows"] = [("destroyed", NONE, NONE)]
              elif verb == "replace":
                  paths = [tuple(p) for p in change.get("replace_paths") or []]
                  forced = [r for r in attribute_rows({**change, "after_unknown": {}}, rtype)
                            if any(r[0].startswith(label(p, rtype)) for p in paths)]
                  if forced:
                      item["why"] = "; ".join(
                          f"{r[0]} forces it" + (f": {r[1]} → {r[2]}" if r[1] != NONE or r[2] != NONE else "")
                          for r in forced)
                  elif paths:
                      item["why"] = ", ".join(label(p, rtype) for p in paths) + " forces it"
                  else:
                      item["why"] = REASONS.get(rc.get("action_reason", ""), "")
                  item["rows"] = [("replaced", NONE, NONE)]
              if moved and verb != "move":
                  item["rows"].append((f"moved from {code(rc['previous_address'])}", NONE, NONE))
              if imported and verb not in ("import",):
                  item["rows"].append(("imported", NONE, NONE))
              # An import that changes nothing is counted, not listed.
              item["noop_import"] = verb == "import" and len(item["rows"]) == 1
              return item


          def natural(text: str) -> list:
              """A sort key that puts x[2] before x[10]."""
              return [(0, int(p), "") if p.isdigit() else (1, 0, p) for p in re.split(r"(\d+)", text)]


          def entries(plan: dict, unit: str) -> list:
              out = [e for rc in plan.get("resource_changes") or [] if (e := entry(rc, unit))]
              out.sort(key=lambda e: (ORDER.get(e["action"], 9), natural(e["address"])))
              return out


          TEXT_VERBS = {
              "will be created": "create",
              "will be updated in-place": "update",
              "will be destroyed": "destroy",
              "must be replaced": "replace",
              "is tainted, so must be replaced": "replace",
              "will be replaced, as requested": "replace",
              "will be imported": "import",
          }


          def text_entry(address: str, what: str, unit: str, imported: bool = False):
              """The same entry from the text of the plan alone, for a unit without JSON."""
              if what.startswith("has moved to "):
                  verb, prev, address = "move", address, what[len("has moved to "):]
              elif what.startswith("will no longer be managed"):
                  verb, prev = "forget", None
              else:
                  verb, prev = TEXT_VERBS.get(what), None
              if verb is None:
                  return None
              rtype, name, index = address_parts(address)
              rows = {"create": "created", "update": "updated, see the details", "destroy": "destroyed",
                      "replace": "replaced", "import": "imported",
                      "forget": "removed from Terraform, left in place"}
              text = f"moved from {code(prev)}" if verb == "move" else rows[verb]
              item = {"unit": unit, "address": address, "action": verb, "icon": ICONS[verb],
                      "kind": kind(rtype) if rtype else "Resource", "name": index or name,
                      "rows": [(text, NONE, NONE)], "imported": imported,
                      "why": "tainted" if "tainted" in what else "", "noop_import": verb == "import"}
              if imported and verb != "import":
                  item["rows"].append(("imported", NONE, NONE))
              return item


          def load(path) -> dict:
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)
          __CI_EOF__

      # A share that failed before its upload is missing here: the summary
      # covers the rest and the last step fails the job.
      - name: Download the shares
        if: needs.select.outputs.shards != '[]'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: plan-part-${{ github.run_id }}-*
          path: parts
          merge-multiple: true

      # The plan comment (README, Plan and apply comments). Without a plan it
      # is still rewritten, or the pull request keeps showing the plan of an
      # earlier commit. changes.json - the text of its tables, nothing
      # sensitive - goes with the plan artifact for the apply comment.
      - name: Summary
        id: summary
        if: always()
        env:
          SHARDS: ${{ needs.select.outputs.shards }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKS: formatting and validation=${{ needs.validate.result }}
        run: |
          set -euo pipefail
          # No share was downloaded when nothing is selected: find would fail
          # on the missing directory and, under pipefail, the step.
          mkdir -p parts
          find parts -name 'plan-*.txt' -print0 2>/dev/null | sort -z |
            xargs -0 -r cat >plan.txt
          args=()
          if [ "$SHARDS" = "[]" ]; then
            args+=(--nothing-selected)
          elif [ ! -s plan.txt ]; then
            args+=(--no-plan)
          fi
          plan-summary.py plan.txt --github-output --import=parts --trivy= \
            --checks="$CHECKS" --commit="$COMMIT" --changes-out=changes.json "${args[@]}" \
            | tee plan.md
          cat plan.md >>"$GITHUB_STEP_SUMMARY"

      # A scheduled run of a repository with a renewal unit (iac-home: the
      # certificate) applies that unit when its plan proposes something; a
      # change in any other unit is drift and fails the run.
      - name: Renewal and drift
        id: renewal
        if: always() && inputs.renewal-unit != '' && github.event_name == 'schedule'
        env:
          CHANGED: ${{ steps.summary.outputs.changed_units }}
          RENEWAL: ${{ inputs.renewal-unit }}
        run: |
          set -euo pipefail
          CHANGED=${CHANGED:-[]}
          due=$(jq -r --arg u "$RENEWAL" 'any(.[]; . == $u)' <<<"$CHANGED")
          drift=$(jq -r --arg u "$RENEWAL" 'map(select(. != $u)) | length > 0' <<<"$CHANGED")
          echo "due=$due" >>"$GITHUB_OUTPUT"
          echo "drift=$drift" >>"$GITHUB_OUTPUT"
          echo "Renewal of \`$RENEWAL\` due: $due. Drift elsewhere: $drift." >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ github.run_id }}
          path: |
            plan.txt
            plan.md
            changes.json
          retention-days: 30

      - name: Comment into the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s plan.md ] || exit 0
          pr-comment.sh "$PR_NUMBER" plan.md terragrunt-plan

      # The moment the plan could be read in the pull request: an approval of
      # its destroys counts only after it.
      # The label destroy-review.yml looks for: only a pull request whose plan
      # destroys or replaces something has an approval to wait for, so a review
      # of any other starts no job. Removed again when a later plan has none.
      - name: Label the pull request
        if: github.event_name == 'pull_request' && !cancelled() && steps.summary.outputs.has_destroys != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DESTROYS: ${{ steps.summary.outputs.has_destroys }}
        run: |
          set -euo pipefail
          if [ "$DESTROYS" = "true" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=destroys" >/dev/null
          else
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/destroys" >/dev/null 2>&1 || true
          fi

      - name: Plan time
        id: planned
        if: always()
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      - name: Every share planned
        if: always()
        env:
          RESULT: ${{ needs.plan-shard.result }}
        run: |
          case "$RESULT" in
            success|skipped) ;;
            *) echo "::error::a plan job ended as '$RESULT' (its log has the reason)"; exit 1 ;;
          esac

  # GitHub Team has no approval on an environment of a private repository,
  # so the approval of destroys and replaces is the owner's review of the pull
  # request, given after its plan. On a pull request the gate checks it (the
  # step "Destroys approved after the plan"): it passes when the plan has none,
  # or when such a review exists; a review submitted later re-runs the failed
  # gate (destroy-review.yml). That check is a step of the gate, not a job of
  # its own, because a job of five seconds bills a whole minute. This job runs
  # on main only, when the plan has destroys: it finds the merged pull request
  # and tells the apply whether the gate of its run passed on an approval; it
  # never fails there, the gate says what is missing.
  destroy:
    name: destroy / approved
    needs: plan
    if: >-
      !cancelled() && github.event_name != 'pull_request'
      && needs.plan.outputs.has_destroys == 'true' && !inputs.allow-destroy
      && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      approved: ${{ steps.merged.outputs.approved }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Approval script
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/destroy-approval.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Decides whether the destroys and replaces of a plan are approved.

          A plan that destroys or replaces resources is applied only when the owner
          approved the pull request after he could read that plan. The plan is the
          pull request comment, so "after" means after the plan job ended.

            destroy-approval.py pr <number> <planned-at>
                On a pull request: passes (exit 0) when the pull request has an
                approving review, by a person other than its author, submitted after
                <planned-at> (ISO 8601, UTC) on the head commit, and not superseded by a
                later review of the same person that requests changes or was dismissed.
                Fails (exit 1) otherwise.

            destroy-approval.py main <sha> <workflow>
                On main: writes approved=true|false to $GITHUB_OUTPUT. True when <sha>
                is the merge commit of a pull request whose last run of <workflow>
                (e.g. ci.yml) passed its destroy check BECAUSE the destroys were
                approved (the step STEP below succeeded), not because it had none.

            destroy-approval.py review <head-sha> <workflow>
                On a submitted review: re-runs the failed gate of the last completed
                pull request run of <workflow> for <head-sha>, so that its step STEP
                reads the new review. (Runs from before the check moved into the gate
                have a job "destroy / approved" of its own; that is re-run instead,
                and GitHub re-runs the gate that needs it.)

          Reads the API with gh (GH_TOKEN) in GITHUB_REPOSITORY.
          """
          import json
          import os
          import subprocess
          import sys

          # The step of the gate (on main: of the gate of the merged pull request's
          # run) that passes only on an approval.
          STEP = "Destroys approved after the plan"
          JOB_SUFFIX = "destroy / approved"   # the job of runs before the check moved into the gate
          GATE_SUFFIX = "/ gate"


          def api(path: str, method: str = "GET"):
              args = ["gh", "api", "-X", method, path]
              if method == "GET":
                  args += ["--paginate", "--slurp"]
              r = subprocess.run(args, capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit(f"::error::gh api {method} {path}: {r.stderr.strip()}")
              out = r.stdout
              if method != "GET":
                  return None
              pages = json.loads(out or "[]")
              # --slurp gives a list of pages; a page is a list or an object holding one.
              items = []
              for page in pages:
                  if isinstance(page, list):
                      items += page
                  else:
                      items.append(page)
              return items


          def approval(reviews: list, author: str, head_sha: str, planned_at: str):
              """The approving review that counts, or None.

              Only the latest review of each person that is not a plain comment
              counts: an approval followed by a request for changes, or dismissed (a
              push dismisses stale approvals), is no approval.
              """
              latest = {}
              for r in sorted(reviews, key=lambda r: r.get("submitted_at") or ""):
                  user = r.get("user") or {}
                  if r.get("state") == "COMMENTED" or not r.get("submitted_at"):
                      continue
                  latest[user.get("login")] = r
              for login, r in latest.items():
                  user = r.get("user") or {}
                  if (r["state"] == "APPROVED" and login != author and user.get("type") == "User"
                          and r.get("commit_id") == head_sha and r["submitted_at"] > planned_at):
                      return r
              return None


          def last_run(runs: list):
              """The most recent pull request run of the workflow."""
              runs = [r for r in runs if r.get("event") == "pull_request"]
              return max(runs, key=lambda r: r["id"]) if runs else None


          def destroy_job(jobs: list):
              """The job that holds the approval check: the gate, or the job of an older run."""
              for job in jobs:
                  if any(s.get("name") == STEP for s in job.get("steps", [])) and job.get("name", "").endswith(GATE_SUFFIX):
                      return job
              for job in jobs:
                  if job.get("name", "").endswith(JOB_SUFFIX):
                      return job
              # A gate that skipped the step (no destroys) has it listed too; one without
              # the step list at all (a test, an old API answer) is found by name.
              for job in jobs:
                  if job.get("name", "").endswith(GATE_SUFFIX):
                      return job
              return None


          def approved_by_step(job) -> bool:
              if not job or job.get("conclusion") != "success":
                  return False
              return any(s.get("name") == STEP and s.get("conclusion") == "success" for s in job.get("steps", []))


          def merged_pull(pulls: list, sha: str):
              for p in pulls:
                  if p.get("merged_at") and p.get("merge_commit_sha") == sha:
                      return p
              return None


          def runs_of(repo: str, workflow: str, sha: str) -> list:
              pages = api(f"repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=pull_request&per_page=100")
              return [r for page in pages for r in page.get("workflow_runs", [])]


          def jobs_of(repo: str, run_id: int) -> list:
              pages = api(f"repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100")
              return [j for page in pages for j in page.get("jobs", [])]


          def cmd_pr(repo: str, number: str, planned_at: str) -> int:
              pr = api(f"repos/{repo}/pulls/{number}")[0]
              reviews = api(f"repos/{repo}/pulls/{number}/reviews?per_page=100")
              r = approval(reviews, pr["user"]["login"], pr["head"]["sha"], planned_at)
              if r:
                  print(f"Approved by {r['user']['login']} at {r['submitted_at']}, after the plan of {planned_at}.")
                  return 0
              print(f"::error::The plan destroys or replaces resources. Read the plan in the pull request "
                    f"and approve it: an approval counts only when it comes after the plan ({planned_at}).")
              return 1


          def cmd_main(repo: str, sha: str, workflow: str) -> int:
              approved = False
              pr = merged_pull(api(f"repos/{repo}/commits/{sha}/pulls"), sha)
              if not pr:
                  print(f"{sha} is not the merge commit of a pull request.")
              else:
                  run = last_run(runs_of(repo, workflow, pr["head"]["sha"]))
                  job = destroy_job(jobs_of(repo, run["id"])) if run else None
                  approved = approved_by_step(job)
                  print(f"Pull request #{pr['number']}: the destroys were "
                        f"{'approved after its plan' if approved else 'not approved after its plan'}.")
              if out := os.environ.get("GITHUB_OUTPUT"):
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"approved={str(approved).lower()}\n")
              return 0


          def cmd_review(repo: str, head_sha: str, workflow: str) -> int:
              run = last_run(runs_of(repo, workflow, head_sha))
              if not run:
                  print("No pull request run for the head commit yet.")
                  return 0
              if run.get("status") != "completed":
                  print(f"Run {run['id']} is still {run.get('status')}; its destroy check reads the reviews when it gets there.")
                  return 0
              job = destroy_job(jobs_of(repo, run["id"]))
              if not job or job.get("conclusion") != "failure":
                  print(f"Nothing to re-run: the destroy check of run {run['id']} is "
                        f"{job.get('conclusion') if job else 'missing'}.")
                  return 0
              api(f"repos/{repo}/actions/jobs/{job['id']}/rerun", method="POST")
              print(f"Re-running '{job['name']}' of run {run['id']}.")
              return 0


          def main(argv: list) -> int:
              repo = os.environ["GITHUB_REPOSITORY"]
              if len(argv) == 3 and argv[0] == "pr":
                  return cmd_pr(repo, argv[1], argv[2])
              if len(argv) == 3 and argv[0] == "main":
                  return cmd_main(repo, argv[1], argv[2])
              if len(argv) == 3 and argv[0] == "review":
                  return cmd_review(repo, argv[1], argv[2])
              sys.exit(__doc__)


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          __CI_EOF__
          chmod +x "$d/destroy-approval.py"
          echo "$d" >>"$GITHUB_PATH"

      - name: The merged pull request approved the destroys
        id: merged
        run: |
          # The caller's workflow file, e.g. ci.yml.
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          destroy-approval.py main "$GITHUB_SHA" "$wf"

  # Apply runs from main only. The environment allows deployments from main
  # and nothing else, and it is also what makes the OIDC token carry the
  # environment subject the apply identity is federated on.
  #
  # A plan that destroys or replaces anything is applied by a push only when
  # the merged pull request approved it after its plan (destroy job), or by
  # the manual run with allow-destroy. Otherwise the selection keeps those
  # units, since this run does not end as a success. A scheduled run applies
  # the renewal unit and nothing else, and only when it is due.
  #
  # The apply plans again rather than applying the plan job's saved plan: a
  # unit reads the outputs of the units it depends on, which change in the same
  # apply (a saved plan would carry the old ones), the plan is split across
  # jobs, and a saved plan holds every sensitive value in clear text, which
  # would have to travel as an artifact. The plan of the same run decides
  # whether the apply runs, and the verification after it fails the run when
  # the result differs from the code.
  apply:
    needs: [validate, plan, destroy]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.validate.result == 'success'
      && needs.plan.result == 'success'
      && (
        (github.event_name == 'schedule' && needs.plan.outputs.renewal_due == 'true')
        || (github.event_name != 'schedule'
            && needs.plan.outputs.has_changes == 'true'
            && (needs.plan.outputs.has_destroys != 'true' || inputs.allow-destroy
                || needs.destroy.outputs.approved == 'true'))
      )
    runs-on: ${{ fromJSON(inputs.network-runner) }}
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      verification: ${{ steps.verify.outputs.result }}
      started: ${{ steps.window.outputs.epoch }}
      ended: ${{ steps.ended.outputs.epoch }}
    # The identity that writes, in place of the plan identity of the workflow.
    # It is federated on this job's environment only.
    env:
      ARM_CLIENT_ID: ${{ inputs.client-id-apply }}
      GITHUB_APP_VAULT: ${{ inputs.github-app-vault-apply }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Terragrunt cannot authenticate its own git against a private repository,
      # so the modules go on disk and TG_SOURCE_MAP points there. The map drops
      # the ?ref= of a source, so the checkout itself takes modules_ref.
      - name: Modules ref
        id: modules-ref
        run: |
          ref=$(sed -nE 's/^[[:space:]]*modules_ref[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' account.hcl | head -n1)
          if ! printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error file=account.hcl::no valid modules_ref in account.hcl"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MODULES_REPO }}
          path: modules-repo
          ref: ${{ steps.modules-ref.outputs.ref }}
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint terraform-docs
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          install_terraform_docs() {
            [ -x "$BIN/terraform-docs" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
                  "$TERRAFORM_DOCS_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" terraform-docs && mv "$t/terraform-docs" "$BIN/"
          }

          for tool in "$@"; do
            "install_${tool//-/_}"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      # The VPN script of the jobs that join the home network (vpn-script
      # home-vpn.sh, vpn-up.yml): plan-shard and apply.
      - name: VPN script
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/home-vpn.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # The runner joins the home network as WireGuard peer ci and reaches the REST
          # API of every managed device; run from the root of iac-home
          # (docs/terragrunt.md#home-network-terragrunt-homeyml).
          #
          #   home-vpn.sh up|down
          #
          # Needs ARM_CLIENT_ID, ARM_TENANT_ID, id-token: write and wireguard-tools.
          set -euo pipefail

          net=_common/network.hcl
          # The unit whose output public_key is the WireGuard server.
          server_unit=${HOME_VPN_SERVER_UNIT:-infrastructure/router/wireguard}
          conf=/etc/wireguard/wg-home.conf

          # block_value <file> <block> <key>: a quoted or bare value inside "<block> = {".
          block_value() {
            sed -n "/^ *$2 = {/,/^ *}/s/^ *$3 *= *\"\\{0,1\\}\\([^\"]*\\)\"\\{0,1\\}$/\\1/p" "$1" | head -1
          }

          # inline_value <file> <name> <key>: a quoted key of a one-line object "<name> = { ... }".
          inline_value() {
            sed -n "s/^ *$2 *= *{.*$3 *= *\"\\([^\"]*\\)\".*/\\1/p" "$1" | head -1
          }

          # first_name <file> <name>: the first of names = [...] of a one-line object.
          first_name() {
            sed -n "s/^ *$2 *= *{.*names *= *\\[\"\\([^\"]*\\)\".*/\\1/p" "$1" | head -1
          }

          # The device folders under infrastructure/ whose device.hcl says managed = true.
          managed_devices() {
            local f
            for f in infrastructure/*/device.hcl; do
              [ -f "$f" ] || continue
              if grep -qE '^ *managed *= *true *$' "$f"; then dirname "$f"; fi
            done
          }

          case "${1:?usage: home-vpn.sh up|down}" in
            up)
              mapfile -t devices < <(managed_devices)
              if [ "${#devices[@]}" -eq 0 ]; then
                echo "::error::no device.hcl under infrastructure/ with managed = true"
                exit 1
              fi

              token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
              az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
                --federated-token "$token" --allow-no-subscriptions --output none

              address=$(inline_value "$net" ci address)
              endpoint="$(block_value "$net" wireguard endpoint):$(block_value "$net" wireguard listen_port)"
              port=$(sed -n 's/^ *webfig_port *= *\([0-9]*\)$/\1/p' "$net")

              # Per device: its address, its name (not in public DNS) and its CA, the
              # heredoc ca_bundle of device.hcl.
              allowed=() urls=() cas=()
              for d in "${devices[@]}"; do
                host=$(sed -n 's/^ *host *= *"\([^"]*\)".*/\1/p' "$d/device.hcl" | head -1)
                target=$(inline_value "$net" "$host" address)
                name=$(first_name "$net" "$host")
                if [ -z "$target" ] || [ -z "$name" ]; then
                  echo "::error::$d: host $host has no address or name in $net"
                  exit 1
                fi
                ca="$RUNNER_TEMP/ca-$(basename "$d").crt"
                sed -n '/ca_bundle *= *<<-*EOT/,/^ *EOT/{/<<-*EOT/d;/^ *EOT/d;s/^ *//;p;}' "$d/device.hcl" >"$ca"
                echo "$target $name" | sudo tee -a /etc/hosts >/dev/null
                allowed+=("$target/32") urls+=("https://$name:$port/") cas+=("$ca")
              done
              server=$(cd "$server_unit" && terragrunt output -raw public_key)

              vault_subscription=$(block_value account.hcl key_vault subscription_id)
              vault_name=$(block_value account.hcl key_vault name)
              secret() {
                az keyvault secret show --subscription "$vault_subscription" --vault-name "$vault_name" \
                  --name "$1" --query value --output tsv | tr -d '\n'
              }
              # Read first: a failing substitution inside the heredoc would not stop the script.
              private_key=$(secret wg-key-ci)
              psk=$(secret wg-psk-ci)
              if [ -z "$private_key" ] || [ -z "$psk" ]; then
                echo "::error::WireGuard secrets missing"
                exit 1
              fi

              sudo install -m 600 /dev/null "$conf"
              sudo tee "$conf" >/dev/null <<EOF
          [Interface]
          PrivateKey = $private_key
          Address = $address/32

          [Peer]
          PublicKey = $server
          PresharedKey = $psk
          Endpoint = $endpoint
          AllowedIPs = $(IFS=,; echo "${allowed[*]}")
          PersistentKeepalive = 25
          EOF
              sudo wg-quick up wg-home
              # Every REST API has to answer before anything is planned.
              for i in "${!urls[@]}"; do
                ok=false
                for _ in 1 2 3 4 5 6; do
                  if curl -sf -o /dev/null --max-time 5 --cacert "${cas[$i]}" "${urls[$i]}"; then
                    ok=true
                    break
                  fi
                  sleep 5
                done
                if [ "$ok" != true ]; then
                  echo "::error::${urls[$i]} not reachable through WireGuard"
                  exit 1
                fi
                echo "${urls[$i]} reachable through WireGuard"
              done
              ;;

            down)
              sudo wg-quick down wg-home 2>/dev/null || true
              sudo rm -f "$conf"
              ;;

            *)
              echo "usage: home-vpn.sh up|down" >&2
              exit 1
              ;;
          esac
          __CI_EOF__
          chmod +x "$d/home-vpn.sh"

      # The verification of an apply (apply in terragrunt-jobs.yml, and the checks
      # of terragrunt-drift.yml), a step of its own for actionlint (scripts-plan.yml).
      - name: Verification script
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/verify-apply.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Verifies an apply: what the second plan, the Activity Log and the check
          blocks say about it.

          Usage:
            verify-apply.py subscriptions <json-dir>
                The subscriptions of the azurerm providers of the planned units, one
                per line (none where no unit has an azurerm provider).
            verify-apply.py checks <json-dir> [--log <file>]
                The check blocks that failed, from the plans in <json-dir> and the
                warnings in a terraform log; exit 3 when one failed.
            verify-apply.py report --replan-rc <n|skipped> --json-dir <dir>
                                   --replan-log <file> --apply-log <file>
                                   --activity <file> --out <verification.json>
                Writes verification.json and prints the Markdown of the apply comment's
                ### Verification section (without the heading).

          The second plan runs right after the apply, over the units it applied, with
          -detailed-exitcode: 0 means the code and the real state agree, 2 that a
          change is still proposed (the apply did not converge, or something changed
          it at once), anything else that the plan failed. Terraform also exits 2 for
          a plan whose only actions are data source reads, which a data source nested
          in a check block always is; when the plan of every unit the log names is
          there and none proposes more than a read, the result is no-changes.

          <activity> is what the workflow read from the Activity Log:
          {"subscriptions": [...], "start": ..., "end": ..., "events": [...],
           "errors": [...]} or {"skipped": "<reason>"}.

          verification.json (version 1):
            result        passed | failed
            replan        result (no-changes | changes | error | skipped), exit_code,
                          units_with_changes, errors, reads_only (exit 2 for reads
                          only, counted as no-changes)
            activity_log  result (passed | failed | skipped | unreadable), reason,
                          subscriptions, window {start, end}, failures [{time,
                          operation, resource, status, sub_status, message}]
            checks        result (passed | failed | none), failed [{unit, check,
                          message, source}], passed, unknown
          """
          import argparse
          import json
          import os
          import pathlib
          import re
          import sys

          RE_LINE = re.compile(r"\[(?P<unit>[^\]]+)\] (?:terraform|tofu): ?(?P<text>.*)$")
          RE_CHECK = re.compile(r'in check "(?P<name>[^"]+)"')
          NOOP = ({"no-op"}, {"read"})
          MAX_ERRORS = 20
          # A unit is reported by its state key, the path without infrastructure/.
          CONTENT = "infrastructure/"


          def state_key(unit: str) -> str:
              return unit[len(CONTENT):] if unit.startswith(CONTENT) else unit


          def plans(json_dir: str):
              """(unit, plan) for every tfplan.json below the directory."""
              root = pathlib.Path(json_dir)
              if not root.is_dir():
                  return
              for f in sorted(root.rglob("tfplan.json")):
                  try:
                      plan = json.loads(f.read_text(encoding="utf-8"))
                  except (OSError, ValueError):
                      continue
                  yield state_key(str(f.parent.relative_to(root))), plan


          def subscriptions(json_dir: str) -> list:
              found = []
              for _, plan in plans(json_dir):
                  configs = (plan.get("configuration") or {}).get("provider_config") or {}
                  for key, cfg in configs.items():
                      if cfg.get("name") != "azurerm" and not key.split(".")[0] == "azurerm":
                          continue
                      sub = ((cfg.get("expressions") or {}).get("subscription_id") or {}).get("constant_value")
                      if sub and sub not in found:
                          found.append(sub)
              return found


          def changed(plan: dict) -> bool:
              for rc in plan.get("resource_changes") or []:
                  if set((rc.get("change") or {}).get("actions") or []) not in NOOP:
                      return True
              for oc in (plan.get("output_changes") or {}).values():
                  if set(oc.get("actions") or []) not in NOOP:
                      return True
              return False


          def plan_checks(json_dir: str) -> tuple:
              """Failed checks from the plans, and the count of passed and unknown."""
              failed, passed, unknown = [], 0, 0
              for unit, plan in plans(json_dir):
                  for c in plan.get("checks") or []:
                      if (c.get("address") or {}).get("kind") != "check":
                          continue  # preconditions and postconditions show as errors
                      name = (c.get("address") or {}).get("name") or (c.get("address") or {}).get("to_display")
                      status = c.get("status")
                      if status == "pass":
                          passed += 1
                      elif status == "fail":
                          messages = [p.get("message", "") for i in c.get("instances") or []
                                      for p in i.get("problems") or []]
                          failed.append({"unit": unit, "check": name,
                                         "message": "; ".join(m for m in messages if m) or "assertion failed",
                                         "source": "plan"})
                      else:
                          unknown += 1
              return failed, passed, unknown


          def log_checks(path: str) -> list:
              """Failed check blocks from the warnings in a terraform log.

              Warning: Check block assertion failed
                on main.tf line 7, in check "same":
                 7:     condition = ...
                  |  ...
              <message>
              """
              if not path or not os.path.exists(path):
                  return []
              open_by_unit, failed = {}, []
              for raw in pathlib.Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  m = RE_LINE.search(raw)
                  if not m:
                      continue
                  unit, text = state_key(m.group("unit")), m.group("text")
                  if "Check block assertion failed" in text:
                      open_by_unit[unit] = {"unit": unit, "check": None, "message": None, "source": "apply"}
                      continue
                  cur = open_by_unit.get(unit)
                  if cur is None:
                      continue
                  name = RE_CHECK.search(text)
                  if name and cur["check"] is None:
                      cur["check"] = name.group("name")
                      continue
                  if text and not text[0].isspace():
                      cur["message"] = text.strip()
                      failed.append(cur)
                      del open_by_unit[unit]
              for cur in open_by_unit.values():
                  cur["message"] = cur["message"] or "assertion failed"
                  failed.append(cur)
              return failed


          def merged_checks(json_dir: str, log: str) -> tuple:
              from_plan, passed, unknown = plan_checks(json_dir)
              seen = {(c["unit"], c["check"]) for c in from_plan}
              failed = list(from_plan)
              for c in log_checks(log):
                  if (c["unit"], c["check"]) not in seen:
                      seen.add((c["unit"], c["check"]))
                      failed.append(c)
              return failed, passed, unknown


          def logged_units(path: str) -> set:
              """The units a terragrunt run --all log has output of, by state key."""
              if not path or not os.path.exists(path):
                  return set()
              out = set()
              for raw in pathlib.Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  m = RE_LINE.search(raw)
                  if m:
                      out.add(state_key(m.group("unit")))
              return out


          def reads_only(json_dir: str, log: str) -> bool:
              """An exit code 2 that only data source reads explain: every unit of the
              log has its plan, and no plan proposes more than a read."""
              planned = {u: p for u, p in plans(json_dir)}
              logged = logged_units(log)
              return bool(planned) and bool(logged) and logged <= planned.keys() \
                  and not any(changed(p) for p in planned.values())


          def replan_errors(path: str) -> list:
              if not path or not os.path.exists(path):
                  return []
              out = []
              for raw in pathlib.Path(path).read_text(encoding="utf-8", errors="replace").splitlines():
                  m = RE_LINE.search(raw)
                  if m and m.group("text").startswith("Error:"):
                      out.append(f"{state_key(m.group('unit'))}: {m.group('text')[len('Error:'):].strip()}")
              return out[:MAX_ERRORS]


          def activity_section(path: str) -> dict:
              try:
                  data = json.loads(pathlib.Path(path).read_text(encoding="utf-8")) if path else {}
              except (OSError, ValueError):
                  return {"result": "unreadable", "reason": "the Activity Log query left no result"}
              if "skipped" in data:
                  return {"result": "skipped", "reason": data["skipped"]}
              failures = []
              for e in data.get("events") or []:
                  props = e.get("properties") or {}
                  message = props.get("statusMessage") or ""
                  try:
                      parsed = json.loads(message)
                      err = parsed.get("error") or parsed
                      message = err.get("message") or message
                  except (ValueError, AttributeError):
                      pass
                  failures.append({
                      "time": e.get("eventTimestamp"),
                      "operation": (e.get("operationName") or {}).get("value"),
                      "resource": e.get("resourceId"),
                      "status": (e.get("status") or {}).get("value"),
                      "sub_status": (e.get("subStatus") or {}).get("value"),
                      "message": message[:500],
                  })
              section = {
                  "subscriptions": data.get("subscriptions") or [],
                  "window": {"start": data.get("start"), "end": data.get("end")},
                  "failures": failures,
              }
              if failures:
                  section["result"] = "failed"
              elif data.get("errors"):
                  # Not being able to read the log is not a failed apply.
                  section["result"] = "unreadable"
                  section["reason"] = "; ".join(data["errors"])[:500]
              else:
                  section["result"] = "passed"
              return section


          def report(args) -> dict:
              rc = args.replan_rc
              replan = {"exit_code": None, "units_with_changes": [], "errors": []}
              if rc == "skipped":
                  replan["result"] = "skipped"
              else:
                  replan["exit_code"] = int(rc)
                  replan["units_with_changes"] = [u for u, p in plans(args.json_dir) if changed(p)]
                  if replan["exit_code"] == 0:
                      replan["result"] = "no-changes"
                  elif replan["exit_code"] == 2 and reads_only(args.json_dir, args.replan_log):
                      replan["result"] = "no-changes"
                      replan["reads_only"] = True
                  elif replan["exit_code"] == 2:
                      replan["result"] = "changes"
                  else:
                      replan["result"] = "error"
                      replan["errors"] = replan_errors(args.replan_log)
                  # run --all may report the highest code of one unit and hide another.
                  if replan["result"] == "no-changes" and replan["units_with_changes"]:
                      replan["result"] = "changes"

              failed, passed, unknown = merged_checks(args.json_dir, args.apply_log)
              checks = {"result": "failed" if failed else ("passed" if passed else "none"),
                        "failed": failed, "passed": passed, "unknown": unknown}
              activity = activity_section(args.activity)

              bad = (replan["result"] in ("changes", "error")
                     or activity["result"] == "failed"
                     or checks["result"] == "failed")
              return {
                  "version": 1,
                  "result": "failed" if bad else "passed",
                  "commit": os.environ.get("GITHUB_SHA"),
                  "run_url": run_url(),
                  "replan": replan,
                  "activity_log": activity,
                  "checks": checks,
              }


          def run_url() -> str:
              server, repo, run = (os.environ.get(k) for k in ("GITHUB_SERVER_URL", "GITHUB_REPOSITORY", "GITHUB_RUN_ID"))
              return f"{server}/{repo}/actions/runs/{run}" if server and repo and run else None


          ICON = {"passed": "✅", "no-changes": "✅", "none": "✅", "skipped": "⏭️",
                  "unreadable": "⚠️", "failed": "❌", "changes": "❌", "error": "❌"}


          def markdown(v: dict) -> str:
              """The body of the apply comment's ### Verification section (the comment
              and the job summary add the heading): a | Check | Result | Detail | table."""
              mark = {"passed": "passed", "failed": "**failed**"}
              lines = [f"{ICON[v['result']]} The apply {mark[v['result']]} its verification. "
                       "Nothing is rolled back by itself.", "",
                       "| Check | Result | Detail |", "|---|---|---|"]
              r = v["replan"]
              detail = {
                  "no-changes": "the second plan proposes nothing" + (
                      " but data source reads (exit code 2)" if r.get("reads_only") else ""),
                  "changes": "still proposes a change in " + (", ".join(f"`{u}`" for u in r["units_with_changes"]) or "a unit"),
                  "error": "the second plan failed",
                  "skipped": "no unit was applied",
              }[r["result"]]
              lines.append(f"| Plan again | {ICON[r['result']]} {r['result']} | {detail} |")
              a = v["activity_log"]
              if a["result"] == "skipped":
                  detail = a["reason"]
              elif a["result"] == "unreadable":
                  detail = a.get("reason", "")
              else:
                  detail = (f"{len(a['failures'])} failed operation(s) of the apply identity in "
                            f"{', '.join(f'`{s}`' for s in a['subscriptions'])}")
              lines.append(f"| Azure Activity Log | {ICON[a['result']]} {a['result']} | {detail.replace('|', '/')} |")
              c = v["checks"]
              detail = (f"{len(c['failed'])} failed, {c['passed']} passed, {c['unknown']} unknown"
                        if c["result"] != "none" else "no check block in the applied units")
              lines.append(f"| Check blocks | {ICON[c['result']]} {c['result']} | {detail} |")

              if r["errors"]:
                  lines += ["", "Second plan errors:", ""] + [f"- {e}" for e in r["errors"]]
              if a.get("failures"):
                  lines += ["", "Failed Azure operations:", ""]
                  lines += [f"- {f['time']} `{f['operation']}` on `{f['resource']}`: {f['message'] or f['sub_status'] or f['status']}"
                            for f in a["failures"][:MAX_ERRORS]]
              if c["failed"]:
                  lines += ["", "Failed check blocks:", ""]
                  lines += [f"- `{f['unit']}` check `{f['check']}`: {f['message']}" for f in c["failed"]]
              return "\n".join(lines) + "\n"


          def main() -> int:
              ap = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
              sub = ap.add_subparsers(dest="cmd", required=True)
              s = sub.add_parser("subscriptions")
              s.add_argument("json_dir")
              c = sub.add_parser("checks")
              c.add_argument("json_dir")
              c.add_argument("--log", default="")
              r = sub.add_parser("report")
              r.add_argument("--replan-rc", required=True)
              r.add_argument("--json-dir", required=True)
              r.add_argument("--replan-log", default="")
              r.add_argument("--apply-log", default="")
              r.add_argument("--activity", default="")
              r.add_argument("--out", required=True)
              args = ap.parse_args()

              if args.cmd == "subscriptions":
                  print("\n".join(subscriptions(args.json_dir)))
                  return 0
              if args.cmd == "checks":
                  failed, passed, unknown = merged_checks(args.json_dir, args.log)
                  for f in failed:
                      print(f"::error title=check block failed::{f['unit']}: check \"{f['check']}\": {f['message']}")
                  print(f"Check blocks: {len(failed)} failed, {passed} passed, {unknown} unknown.")
                  return 3 if failed else 0
              v = report(args)
              pathlib.Path(args.out).write_text(json.dumps(v, indent=2) + "\n", encoding="utf-8")
              sys.stdout.write(markdown(v))
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          __CI_EOF__
          chmod +x "$d/verify-apply.py"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.tgproviders
          key: providers-${{ runner.os }}-${{ hashFiles('account.hcl', '_common/templates/versions*.tf.tmpl') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install terragrunt
        run: install-tools.sh terragrunt

      # A self-hosted runner (the NAS, docs/runners.md) starts every job from the
      # bare image ghcr.io/actions/actions-runner: bash, curl, jq, git, unzip,
      # openssh-client, python3 and sudo, no Azure CLI. The job installs it here
      # from Microsoft's apt repository, whose key is checked against its
      # fingerprint and whose package is pinned. A GitHub-hosted runner has it in
      # its image and skips the step. A bump of AZURE_CLI_VERSION is a pull request
      # here, by hand: deps.yml does not read it.
      - name: Tools of the self-hosted runner
        if: runner.environment == 'self-hosted'
        env:
          AZURE_CLI_VERSION: 2.92.0
          MICROSOFT_KEY_FINGERPRINT: BC528686B50D79E339D3721CEB3E94ADBE1229CF  # gitleaks:allow (public key fingerprint)
        run: |
          set -euo pipefail
          # The NAS gives a job 1 GB: at most two units plan or apply at once
          # (terragrunt's default is no limit).
          echo "TG_PARALLELISM=2" >>"$GITHUB_ENV"
          if command -v az >/dev/null; then
            az version --output tsv --query '"azure-cli"'
            exit 0
          fi
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          key="$RUNNER_TEMP/microsoft.asc"
          curl -sSfL https://packages.microsoft.com/keys/microsoft.asc -o "$key"
          fingerprint=$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" {print $10; exit}')
          if [ "$fingerprint" != "$MICROSOFT_KEY_FINGERPRINT" ]; then
            echo "::error::the key of packages.microsoft.com has the fingerprint $fingerprint, expected $MICROSOFT_KEY_FINGERPRINT"
            exit 1
          fi
          sudo install -d -m 755 /etc/apt/keyrings
          gpg --dearmor <"$key" | sudo tee /etc/apt/keyrings/microsoft.gpg >/dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $codename main" |
            sudo tee /etc/apt/sources.list.d/azure-cli.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "azure-cli=$AZURE_CLI_VERSION-1~$codename" >/dev/null
          az version --output tsv --query '"azure-cli"'

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      # What this run applies: the selection of the plan job, or on a
      # schedule the renewal unit alone.
      - name: Units to apply
        id: target
        env:
          EVENT: ${{ github.event_name }}
          SELECTION: ${{ needs.plan.outputs.selection }}
          RENEWAL: ${{ inputs.renewal-unit }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            SELECTION=$(jq -c --arg u "$RENEWAL" '.all = false | .units = [$u] | .deleted = []' <<<"$SELECTION")
          fi
          echo "selection=$SELECTION" >>"$GITHUB_OUTPUT"

      # A repository whose resources sit behind a VPN (iac-home: the router,
      # through WireGuard) joins that network with vpn-script up: a script of ci
      # by its name (home-vpn.sh), otherwise a path in the repository. It signs in
      # to Azure as ARM_CLIENT_ID, reads its keys from the vault and brings the
      # tunnel up. The network has one peer for the runners, so the caller's
      # concurrency group never lets two runs overlap.
      - name: Join the network
        if: inputs.vpn-script != ''
        env:
          VPN: ${{ inputs.vpn-script }}
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools >/dev/null
          if [ -x "$RUNNER_TEMP/ci/$VPN" ]; then "$RUNNER_TEMP/ci/$VPN" up; else "./$VPN" up; fi

      # Without a VPN - the job runs on the network itself (network-runner, the NAS
      # for iac-home) - nothing above has signed in to Azure, while the
      # configuration reads its secrets from the vault as it is parsed
      # (validate-sign-in).
      - name: Sign in to Azure
        if: inputs.vpn-script == '' && inputs.validate-sign-in
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      # A minute of slack: the Activity Log stamps an operation when Azure
      # received it, the runner's clock may differ.
      - name: Start of the apply
        id: window
        run: |
          echo "start=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      # The selection is the one the plan job made, not worked out again.
      # Deleted units go first: what replaces them under a new path may need
      # their names.
      - name: Destroy deleted units
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
          SELECTION: ${{ steps.target.outputs.selection }}
        run: |
          set -euo pipefail
          mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SELECTION")
          if [ "${#deleted[@]}" -eq 0 ]; then
            echo "No deleted unit."
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
          args=()
          for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
          cd "$RUNNER_TEMP/base"
          # destroy.txt is read by the apply comment.
          terragrunt run --all destroy "${args[@]}" --non-interactive --no-color 2>&1 |
            tee "$GITHUB_WORKSPACE/destroy.txt"

      - name: Apply
        id: apply
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
          SELECTION: ${{ steps.target.outputs.selection }}
        run: |
          set -euo pipefail
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
            echo "No unit to apply."
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          args=()
          for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
          # apply.txt is read by the verification (check blocks) and the
          # apply comment.
          terragrunt run --all apply "${args[@]}" --non-interactive --no-color 2>&1 | tee apply.txt

      - name: End of the apply
        id: ended
        if: always()
        run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

      # Terraform masks what is sensitive, as in plan.txt.
      - name: Upload the apply output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apply-${{ github.run_id }}
          path: |
            apply.txt
            destroy.txt
          if-no-files-found: ignore
          retention-days: 30

      # Verification of what the apply did. It takes a minute or two: one more
      # plan of the applied units, at once, and a read of the Activity Log. It
      # never rolls anything back: a failure turns the run red and the verify
      # job opens an issue for the owner to decide.
      #
      # 1. The second plan has to propose nothing (-detailed-exitcode 0). The
      #    apply may have not converged (a provider that sets a value of its
      #    own, a resource that something changed at once). The plan JSON
      #    also carries the results of the check blocks and the subscriptions
      #    the units deploy to.
      - name: Plan again
        id: replan
        if: ${{ !cancelled() && steps.window.outcome == 'success' }}
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
          SELECTION: ${{ steps.target.outputs.selection }}
          VERIFY_JSON: ${{ runner.temp }}/verify-json
        run: |
          set -euo pipefail
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
          if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
            echo "rc=skipped" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          args=()
          for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
          set +e
          # The state is there now, so the units need not wait for each other.
          terragrunt run --all plan "${args[@]}" --queue-ignore-dag-order --json-out-dir "$VERIFY_JSON" \
            --non-interactive --no-color -- -detailed-exitcode 2>&1 | tee replan.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >>"$GITHUB_OUTPUT"

      # 2. Failed operations of the apply identity in the subscriptions the
      #    applied units deploy to, from the start of the apply until now. A
      #    repository without an azurerm provider (iac-github) skips this. The
      #    Activity Log lags behind by a minute or more: an operation that
      #    failed in the last moments may not be there yet.
      - name: Failed Azure operations
        if: ${{ !cancelled() && steps.window.outcome == 'success' }}
        # A log that cannot be read shows as unreadable, not as a failed apply.
        continue-on-error: true
        env:
          VERIFY_JSON: ${{ runner.temp }}/verify-json
          START: ${{ steps.window.outputs.start }}
        run: |
          set -euo pipefail
          mapfile -t subs < <({ verify-apply.py subscriptions "$VERIFY_JSON"; echo "$ARM_SUBSCRIPTION_ID"; } | grep . | sort -u)
          if [ "${#subs[@]}" -eq 0 ]; then
            jq -n '{skipped: "no applied unit deploys to an Azure subscription"}' >activity.json
            exit 0
          fi
          end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          # The caller of an operation is the application ID or the object ID
          # of the service principal, depending on the provider.
          object_id=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv 2>/dev/null || true)
          events='[]'
          errors='[]'
          for s in "${subs[@]}"; do
            if out=$(az monitor activity-log list --subscription "$s" --start-time "$START" \
              --end-time "$end" --status Failed --max-events 500 -o json 2>err.txt); then
              events=$(jq -c --argjson all "$events" --arg app "$ARM_CLIENT_ID" --arg obj "$object_id" '
                $all + [.[] | select(.caller == $app or (.caller == $obj and $obj != "")
                  or (.claims.appid // "") == $app)]' <<<"$out")
            else
              errors=$(jq -c --arg e "$s: $(tail -1 err.txt)" '. + [$e]' <<<"$errors")
            fi
          done
          jq -n --argjson events "$events" --argjson errors "$errors" --arg start "$START" --arg end "$end" \
            --args '{subscriptions: $ARGS.positional, start: $start, end: $end, events: $events, errors: $errors}' \
            "${subs[@]}" >activity.json
          echo "$(jq '.events | length' activity.json) failed operation(s) in ${subs[*]}."

      # 3. The check blocks, from the second plan and from the warnings of
      #    the apply. Then verification.json and verification.md, the body of
      #    the apply comment's ### Verification section: the report job takes
      #    the artifact verification-<run id> (README, Apply comment).
      - name: Verification
        id: verify
        if: ${{ !cancelled() && steps.window.outcome == 'success' }}
        env:
          RC: ${{ steps.replan.outputs.rc || 'skipped' }}
          VERIFY_JSON: ${{ runner.temp }}/verify-json
        run: |
          set -euo pipefail
          verify-apply.py report --replan-rc "$RC" --json-dir "$VERIFY_JSON" \
            --replan-log replan.txt --apply-log apply.txt --activity activity.json \
            --out verification.json >verification.md
          printf '### Verification\n\n' >>"$GITHUB_STEP_SUMMARY"
          cat verification.md >>"$GITHUB_STEP_SUMMARY"
          result=$(jq -r .result verification.json)
          echo "result=$result" >>"$GITHUB_OUTPUT"
          [ "$result" = "passed" ] || echo "::error title=Verification::The apply did not verify (summary of this job). The verify job opens an issue."

      - name: Upload the verification
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}
          path: |
            verification.json
            verification.md
          retention-days: 30

      - name: Leave the network
        if: always() && inputs.vpn-script != ''
        env:
          VPN: ${{ inputs.vpn-script }}
        run: |
          if [ -x "$RUNNER_TEMP/ci/$VPN" ]; then "$RUNNER_TEMP/ci/$VPN" down; else "./$VPN" down; fi

  # The apply comment (apply-summary.py) on the pull request the applied
  # commit came from: what the plan of this run meant to change, in the past
  # tense, per resource whether it went through, and the verification. A job
  # of its own, so that the apply identity needs no access to pull requests.
  report:
    needs: [plan, apply]
    if: >-
      always() && github.event_name != 'pull_request'
      && contains(fromJSON('["success", "failure", "cancelled"]'), needs.apply.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Report scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/apply-summary.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns the output of a terragrunt apply into the apply comment of the merged pull request.

          Usage: apply-summary.py <apply output>... --changes=<changes.json> [options]

          The comment, top to bottom:

            ## ✅ Apply complete            (## ❌ Apply failed when the apply job did not
                                             succeed or any resource failed)
            repo · merge commit · units · duration · run
            icon | Resource | Name | What happened | Result
            imports that changed nothing, as one count line
            ### ❌ Errors                   when there are any
            ### Verification               what the post-apply checks reported

          What was meant to happen comes from changes.json, the entries the plan job of
          the same run wrote (plan-summary.py --changes-out): the apply runs the plan's
          selection, so the rows are the rows of the plan comment, in the past tense.
          What did happen comes from the apply output, per resource: a "... complete"
          line is done, an error "with <address>" is failed. A unit that finished
          ("Apply complete!") has applied everything it planned, moves and imports
          included; a unit that failed leaves the rest of its resources not applied; a
          unit that never started is not run.

          The Verification section is filled from --verification=<dir>: every *.md file
          in it, in name order, as it is. A post-apply check writes its result there as
          markdown (a table | Check | Result | Detail | is the convention, see the
          README) and uploads it as an artifact named verification-<run id>[-<name>];
          the report job downloads all of them before it renders. Without any, the
          section says that no check has reported.

          Options:
            --changes=<f>       changes.json of the plan job
            --verification=<d>  directory of the post-apply checks' markdown
            --outcome=<r>       result of the apply job (success, failure, cancelled)
            --started=<epoch>, --ended=<epoch>  when the apply job ran
            --repo=, --commit=  what the heading line names (default $GITHUB_REPOSITORY,
                                $GITHUB_SHA)
          """
          import json
          import os
          import pathlib
          import re
          import sys

          MAX = 60_000
          MAX_ERROR_LINES = 25
          NONE = "—"
          RE_UNIT = re.compile(r"\[([^\]]+)\] terraform:")
          RE_DONE = re.compile(r"^(\S.*?): (Creation|Modifications|Destruction|Import) complete")
          RE_START = re.compile(r"^(\S.*?): (Creating|Modifying|Destroying|Importing|Reading)\.\.\.")
          RE_UNIT_DONE = re.compile(r"^(?:Apply|Destroy) complete! Resources:")
          RE_ERROR = re.compile(r"^\s*Error: (.+)$")
          RE_WARNING = re.compile(r"^\s*Warning: ")
          RE_WITH = re.compile(r"^\s*with (\S+?),\s*$")
          # The comment shows a unit by its state key, the path without infrastructure/.
          CONTENT = "infrastructure/"


          def state_key(unit: str) -> str:
              return unit[len(CONTENT):] if unit.startswith(CONTENT) else unit


          def code(text) -> str:
              text = str(text).replace("|", "\\|")
              tick = "``" if "`" in text else "`"
              pad = " " if tick == "``" else ""
              return f"{tick}{pad}{text}{pad}{tick}"


          def fenced(lines: list) -> list:
              longest = max((len(r) for line in lines for r in re.findall(r"`+", line)), default=0)
              fence = "`" * max(3, longest + 1)
              return [fence, *lines, fence]


          def plural(n: int, word: str) -> str:
              return f"{n} {word}{'s' * (n != 1)}"


          def duration(start: str, end: str) -> str:
              try:
                  s = int(end) - int(start)
              except (TypeError, ValueError):
                  return ""
              if s < 0:
                  return ""
              return f"{s // 60} min {s % 60} s" if s >= 60 else f"{s} s"


          def read_apply(paths: list) -> dict:
              """Per unit: resources done, failed (address -> error), error blocks, finished.

              The output of the destroy of deleted units and of the apply; a file that
              is not there (nothing was destroyed) is skipped.
              """
              units = {}
              lines = []
              for path in paths:
                  if path and os.path.isfile(path):
                      lines += open(path, encoding="utf-8", errors="replace").readlines()
              modes = {}
              for line in lines:
                  line = line.rstrip("\n")
                  m = RE_UNIT.search(line)
                  if not m:
                      continue
                  unit = state_key(m.group(1))
                  label = line[:m.start()].split()
                  stream = label[-1] if label and re.fullmatch(r"[A-Z]+", label[-1]) else ""
                  text = line[m.end():]
                  text = text[1:] if text.startswith(" ") else text
                  u = units.setdefault(unit, {"done": set(), "started": set(), "failed": {},
                                              "errors": [], "finished": False})
                  key = (unit, stream)
                  if modes.get(key) == "error" and not (RE_ERROR.match(text) or RE_WARNING.match(text)):
                      u["errors"][-1].append(text)
                      if w := RE_WITH.match(text):
                          u["failed"][w.group(1)] = RE_ERROR.match(u["errors"][-1][0]).group(1).strip()
                      continue
                  modes[key] = None
                  if d := RE_DONE.match(text):
                      u["done"].add(d.group(1))
                  elif s := RE_START.match(text):
                      u["started"].add(s.group(1))
                  elif RE_UNIT_DONE.match(text):
                      u["finished"] = True
                  elif RE_ERROR.match(text):
                      modes[key] = "error"
                      u["errors"].append([text])
              return units


          def past(what: str, frm: str, to: str) -> str:
              """A row of the plan comment, said of what happened."""
              if what.startswith("updated"):
                  return "updated"
              if frm == "(sensitive)" or to == "(sensitive)":
                  return f"{what} changed (sensitive)"
              if frm != NONE or to != NONE:
                  return f"{what} changed: {frm} → {to}"
              return what


          def result(entry: dict, units: dict, outcome: str) -> str:
              u = units.get(entry["unit"])
              if u is None:
                  return "⏭️ not run"
              if entry["address"] in u["failed"]:
                  return "❌ failed: " + u["failed"][entry["address"]].replace("|", "\\|")
              if entry["address"] in u["done"] or u["finished"]:
                  return "✅ done"
              if u["errors"] or entry["address"] in u["started"] or outcome != "success":
                  return "⏭️ not applied"
              return "✅ done"


          def main(paths: list, opts: dict) -> int:
              changes = {}
              if opts.get("changes") and os.path.isfile(opts["changes"]):
                  changes = json.loads(pathlib.Path(opts["changes"]).read_text(encoding="utf-8"))
              entries = [e for e in changes.get("entries", []) if not e.get("noop_import")]
              noop_imports = changes.get("noop_imports") or {}
              outcome = opts.get("outcome") or "success"
              units = read_apply(paths)

              results = [(e, result(e, units, outcome)) for e in entries]
              any_failed = any(r.startswith("❌") for _, r in results) or any(
                  u["errors"] for u in units.values())
              ok = outcome == "success" and not any_failed

              repo = opts.get("repo") or changes.get("repo") or os.environ.get("GITHUB_REPOSITORY", "")
              commit = opts.get("commit") or os.environ.get("GITHUB_SHA", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              planned = [state_key(u) for u in changes.get("units") or []] or sorted(units)
              applied = sorted({e["unit"] for e in entries} | set(units))

              line = []
              if repo:
                  line.append(code(repo))
              if commit:
                  line.append(f"merge [{code(commit[:7])}]({server}/{repo}/commit/{commit})"
                              if repo else code(commit[:7]))
              line.append(plural(len(applied or planned), "unit"))
              if took := duration(opts.get("started"), opts.get("ended")):
                  line.append(f"⏱️ {took}")
              if run_id and repo:
                  line.append(f"[run]({server}/{repo}/actions/runs/{run_id})")

              many = len({e["unit"] for e in entries}) > 1
              rows = []
              for e, res in results:
                  name = code(e["name"]) + (f"<br><sub>{code(e['unit'])}</sub>" if many else "")
                  for i, (what, frm, to) in enumerate(e["rows"] or [("changed", NONE, NONE)]):
                      kind, label = (e["kind"], name) if i == 0 else ("", "")
                      rows.append(f"| {e['icon']} | {kind} | {label} | {past(what, frm, to)} | {res} |")

              failed_blocks = {}
              for unit, u in units.items():
                  for block in u["errors"]:
                      failed_blocks.setdefault(tuple(block), []).append(unit)

              verification = []
              vdir = opts.get("verification")
              if vdir and os.path.isdir(vdir):
                  for f in sorted(pathlib.Path(vdir).rglob("*.md")):
                      text = f.read_text(encoding="utf-8").strip()
                      # A check that writes its own section heading gets this one.
                      text = re.sub(r"^#{1,3} Verification[ \t]*\n+", "", text).strip()
                      if text:
                          verification.append(text)

              def render(cap=None, error_lines=None) -> str:
                  out = ["## ✅ Apply complete" if ok else "## ❌ Apply failed", "", " · ".join(line), ""]
                  if rows:
                      out += ["| | Resource | Name | What happened | Result |", "|---|---|---|---|---|"]
                      out += rows[:cap] if cap is not None else rows
                      if cap is not None and cap < len(rows):
                          out.append(f"| | | | _{len(rows) - cap} more rows, see the run log_ | |")
                      out.append("")
                  elif not noop_imports:
                      out += ["Nothing was planned to change." if outcome == "success"
                              else "No plan of this run to compare with, see the run log.", ""]
                  if noop_imports:
                      n = sum(noop_imports.values())
                      out += [f"📥 **Imported without a change:** {n} — "
                              + ", ".join(f"{code(u)} ({c})" for u, c in sorted(noop_imports.items())) + ".", ""]
                  if failed_blocks or outcome != "success":
                      out += ["### ❌ Errors", ""]
                      if not failed_blocks:
                          out += [f"The apply job ended as `{outcome}` without an error from terraform; "
                                  "see the run log.", ""]
                      for block, names in failed_blocks.items():
                          body = list(block)
                          if error_lines is not None and len(body) > error_lines:
                              body = body[:error_lines] + [f"... {len(block) - error_lines} more lines"]
                          out += [f"**{', '.join(code(u) for u in names)}**", ""] + fenced(body) + [""]
                  out += ["### Verification", ""]
                  out += ["\n\n".join(verification) if verification
                          else "_No post-apply check has reported._", ""]
                  notes = []
                  if error_lines is not None:
                      notes.append("long error messages are shortened")
                  if cap is not None and cap < len(rows):
                      notes.append(f"{len(rows) - cap} rows of the table are left out")
                  if notes:
                      out.append(f"_Cut to fit a comment: {'; '.join(notes)}. The full output is in the "
                                 "run log._")
                  return "\n".join(out).rstrip() + "\n"

              text = render()
              if len(text) > MAX:
                  text = render(error_lines=MAX_ERROR_LINES)
              if len(text) > MAX:
                  lo, hi = 0, len(rows)
                  while lo < hi:
                      mid = (lo + hi + 1) // 2
                      if len(render(cap=mid, error_lines=MAX_ERROR_LINES)) <= MAX:
                          lo = mid
                      else:
                          hi = mid - 1
                  text = render(cap=lo, error_lines=MAX_ERROR_LINES)
              sys.stdout.write(text)
              return 0


          if __name__ == "__main__":
              args = sys.argv[1:]
              paths = [a for a in args if not a.startswith("--")]
              opts = {}
              for a in args:
                  if a.startswith("--"):
                      key, _, value = a[2:].partition("=")
                      opts[key] = value
              sys.exit(main(paths, opts))
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Plan of this run
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ github.run_id }}
          path: plan

      - name: Apply output
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apply-${{ github.run_id }}
          path: apply

      # verification-<run id> from the apply job, and any other post-apply
      # check's verification-<run id>-<name> (README, Plan and apply comments).
      - name: Verification
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-${{ github.run_id }}*
          path: verification

      - name: Summary
        env:
          OUTCOME: ${{ needs.apply.result }}
          STARTED: ${{ needs.apply.outputs.started }}
          ENDED: ${{ needs.apply.outputs.ended }}
        run: |
          set -euo pipefail
          apply-summary.py apply/destroy.txt apply/apply.txt --changes=plan/changes.json \
            --verification=verification --outcome="$OUTCOME" \
            --started="$STARTED" --ended="$ENDED" | tee apply.md
          cat apply.md >>"$GITHUB_STEP_SUMMARY"

      # The pull request merged as this commit; a commit pushed to main
      # directly has none, and the summary of the run is all there is. Each
      # run comments anew: the push and a later manual run are two applies. A
      # scheduled renewal belongs to no pull request.
      - name: Comment into the pull request
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -z "$pr" ]; then
            echo "No merged pull request for $GITHUB_SHA; the summary of the run has the apply."
            exit 0
          fi
          pr-comment.sh "$pr" apply.md "terragrunt-apply-$GITHUB_RUN_ID"

  # Runs only when the verification failed (a passed one is in the apply
  # comment of the report job, and a job that only echoes bills a minute): a
  # Bug issue (prio:high, source:drift), and the run is red. It writes only the
  # issue.
  verify:
    needs: apply
    if: ${{ !cancelled() && needs.apply.outputs.verification == 'failed' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Download the verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-${{ github.run_id }}

      - name: Result
        env:
          RESULT: ${{ needs.apply.outputs.verification }}
        run: |
          { printf '### Verification\n\n'; cat verification.md; } >>"$GITHUB_STEP_SUMMARY"
          echo "Verification $RESULT."

      - name: Scripts
        if: needs.apply.outputs.verification == 'failed'
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/verify-failed.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # After an apply whose verification failed: a Bug issue with the details, so
          # the owner decides. Nothing is rolled back by itself.
          #
          # Usage: verify-failed.sh <verification.json> <verification.md>
          # Env:   GH_TOKEN, GITHUB_REPOSITORY, GITHUB_SHA, GITHUB_EVENT_NAME,
          #        GITHUB_SERVER_URL, GITHUB_RUN_ID; OWNER (the organisation variable,
          #        assigned to the issue; empty assigns nobody).
          set -euo pipefail

          JSON=${1:?missing verification.json}
          MD=${2:?missing verification.md}
          REPO=${GITHUB_REPOSITORY:?}
          SHA=${GITHUB_SHA:?}
          RUN_URL="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          SHORT=${SHA:0:7}
          OWNER=${OWNER:-}
          assign_issue=()
          if [ -n "$OWNER" ]; then
            assign_issue=(-f "assignees[]=$OWNER")
          fi

          # The pull request the commit came from, for the title and the links.
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0] // empty' 2>/dev/null || true)
          if [ -n "$pr" ]; then
            title=$(jq -r .title <<<"$pr")
            pr_ref="#$(jq -r .number <<<"$pr")"
          else
            title=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message | split("\n")[0]')
            pr_ref="commit $SHORT"
          fi

          issue_title="Apply of $SHORT failed its verification"
          issue_body=$(mktemp)
          cat >"$issue_body" <<EOF
          ### What happens

          The apply of $SHORT ($pr_ref, "$title") went through, but the verification
          after it failed.

          ### What should happen

          The second plan proposes nothing, the apply identity has no failed operation
          in the Activity Log and every check block passes.

          ### Where

          Run: $RUN_URL

          ### Impact

          The deployed state may not be what the code says. Nothing was rolled back:
          decide whether the failure is real, then fix it forward or revert $SHORT by
          hand.

          ### How to reproduce

          Run the pipeline on main by hand (scope changed) and read the plan.

          ### Evidence

          $(sed 's/^###/####/' "$MD")

          <details><summary>verification.json</summary>

          \`\`\`json
          $(cat "$JSON")
          \`\`\`

          </details>
          EOF

          existing=$(gh issue list --repo "$REPO" --state open --search "\"$issue_title\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$issue_title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$issue_body"
            echo "Issue #$existing updated."
          elif ! gh api -X POST "repos/$REPO/issues" -f title="$issue_title" -F body=@"$issue_body" \
            -f type=Bug "${assign_issue[@]}" -f 'labels[]=prio:high' -f 'labels[]=source:drift' \
            --jq '"Issue: " + .html_url'; then
            # The workflow token may not set the issue type everywhere.
            gh api -X POST "repos/$REPO/issues" -f title="$issue_title" -F body=@"$issue_body" \
              "${assign_issue[@]}" -f 'labels[]=prio:high' -f 'labels[]=source:drift' \
              --jq '"Issue (without type): " + .html_url'
          fi
          {
            echo "### After the failed verification"
            echo
            echo "- Issue: $issue_title"
          } >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Issue
        if: needs.apply.outputs.verification == 'failed'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ vars.OWNER }}
        run: verify-failed.sh verification.json verification.md

      - name: The verification has to pass
        if: needs.apply.outputs.verification == 'failed'
        run: |
          echo "::error::The apply went through but did not verify. See the summary and the issue; nothing was rolled back."
          exit 1

  # The required check. On a pull request: every check passed (or was
  # skipped). On main: in Azure DevOps a skipped apply stage left the run
  # green, so eight applies in a row never happened and nothing said so. An
  # apply that was due and did not succeed has to be red.
  gate:
    needs: [select, validate, plan-shard, plan, destroy, apply, verify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Read only: the approval check reads the reviews and the runs.
      pull-requests: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Approval script
        if: github.event_name == 'pull_request' && needs.plan.outputs.has_destroys == 'true'
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/destroy-approval.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Decides whether the destroys and replaces of a plan are approved.

          A plan that destroys or replaces resources is applied only when the owner
          approved the pull request after he could read that plan. The plan is the
          pull request comment, so "after" means after the plan job ended.

            destroy-approval.py pr <number> <planned-at>
                On a pull request: passes (exit 0) when the pull request has an
                approving review, by a person other than its author, submitted after
                <planned-at> (ISO 8601, UTC) on the head commit, and not superseded by a
                later review of the same person that requests changes or was dismissed.
                Fails (exit 1) otherwise.

            destroy-approval.py main <sha> <workflow>
                On main: writes approved=true|false to $GITHUB_OUTPUT. True when <sha>
                is the merge commit of a pull request whose last run of <workflow>
                (e.g. ci.yml) passed its destroy check BECAUSE the destroys were
                approved (the step STEP below succeeded), not because it had none.

            destroy-approval.py review <head-sha> <workflow>
                On a submitted review: re-runs the failed gate of the last completed
                pull request run of <workflow> for <head-sha>, so that its step STEP
                reads the new review. (Runs from before the check moved into the gate
                have a job "destroy / approved" of its own; that is re-run instead,
                and GitHub re-runs the gate that needs it.)

          Reads the API with gh (GH_TOKEN) in GITHUB_REPOSITORY.
          """
          import json
          import os
          import subprocess
          import sys

          # The step of the gate (on main: of the gate of the merged pull request's
          # run) that passes only on an approval.
          STEP = "Destroys approved after the plan"
          JOB_SUFFIX = "destroy / approved"   # the job of runs before the check moved into the gate
          GATE_SUFFIX = "/ gate"


          def api(path: str, method: str = "GET"):
              args = ["gh", "api", "-X", method, path]
              if method == "GET":
                  args += ["--paginate", "--slurp"]
              r = subprocess.run(args, capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit(f"::error::gh api {method} {path}: {r.stderr.strip()}")
              out = r.stdout
              if method != "GET":
                  return None
              pages = json.loads(out or "[]")
              # --slurp gives a list of pages; a page is a list or an object holding one.
              items = []
              for page in pages:
                  if isinstance(page, list):
                      items += page
                  else:
                      items.append(page)
              return items


          def approval(reviews: list, author: str, head_sha: str, planned_at: str):
              """The approving review that counts, or None.

              Only the latest review of each person that is not a plain comment
              counts: an approval followed by a request for changes, or dismissed (a
              push dismisses stale approvals), is no approval.
              """
              latest = {}
              for r in sorted(reviews, key=lambda r: r.get("submitted_at") or ""):
                  user = r.get("user") or {}
                  if r.get("state") == "COMMENTED" or not r.get("submitted_at"):
                      continue
                  latest[user.get("login")] = r
              for login, r in latest.items():
                  user = r.get("user") or {}
                  if (r["state"] == "APPROVED" and login != author and user.get("type") == "User"
                          and r.get("commit_id") == head_sha and r["submitted_at"] > planned_at):
                      return r
              return None


          def last_run(runs: list):
              """The most recent pull request run of the workflow."""
              runs = [r for r in runs if r.get("event") == "pull_request"]
              return max(runs, key=lambda r: r["id"]) if runs else None


          def destroy_job(jobs: list):
              """The job that holds the approval check: the gate, or the job of an older run."""
              for job in jobs:
                  if any(s.get("name") == STEP for s in job.get("steps", [])) and job.get("name", "").endswith(GATE_SUFFIX):
                      return job
              for job in jobs:
                  if job.get("name", "").endswith(JOB_SUFFIX):
                      return job
              # A gate that skipped the step (no destroys) has it listed too; one without
              # the step list at all (a test, an old API answer) is found by name.
              for job in jobs:
                  if job.get("name", "").endswith(GATE_SUFFIX):
                      return job
              return None


          def approved_by_step(job) -> bool:
              if not job or job.get("conclusion") != "success":
                  return False
              return any(s.get("name") == STEP and s.get("conclusion") == "success" for s in job.get("steps", []))


          def merged_pull(pulls: list, sha: str):
              for p in pulls:
                  if p.get("merged_at") and p.get("merge_commit_sha") == sha:
                      return p
              return None


          def runs_of(repo: str, workflow: str, sha: str) -> list:
              pages = api(f"repos/{repo}/actions/workflows/{workflow}/runs?head_sha={sha}&event=pull_request&per_page=100")
              return [r for page in pages for r in page.get("workflow_runs", [])]


          def jobs_of(repo: str, run_id: int) -> list:
              pages = api(f"repos/{repo}/actions/runs/{run_id}/jobs?filter=latest&per_page=100")
              return [j for page in pages for j in page.get("jobs", [])]


          def cmd_pr(repo: str, number: str, planned_at: str) -> int:
              pr = api(f"repos/{repo}/pulls/{number}")[0]
              reviews = api(f"repos/{repo}/pulls/{number}/reviews?per_page=100")
              r = approval(reviews, pr["user"]["login"], pr["head"]["sha"], planned_at)
              if r:
                  print(f"Approved by {r['user']['login']} at {r['submitted_at']}, after the plan of {planned_at}.")
                  return 0
              print(f"::error::The plan destroys or replaces resources. Read the plan in the pull request "
                    f"and approve it: an approval counts only when it comes after the plan ({planned_at}).")
              return 1


          def cmd_main(repo: str, sha: str, workflow: str) -> int:
              approved = False
              pr = merged_pull(api(f"repos/{repo}/commits/{sha}/pulls"), sha)
              if not pr:
                  print(f"{sha} is not the merge commit of a pull request.")
              else:
                  run = last_run(runs_of(repo, workflow, pr["head"]["sha"]))
                  job = destroy_job(jobs_of(repo, run["id"])) if run else None
                  approved = approved_by_step(job)
                  print(f"Pull request #{pr['number']}: the destroys were "
                        f"{'approved after its plan' if approved else 'not approved after its plan'}.")
              if out := os.environ.get("GITHUB_OUTPUT"):
                  with open(out, "a", encoding="utf-8") as fh:
                      fh.write(f"approved={str(approved).lower()}\n")
              return 0


          def cmd_review(repo: str, head_sha: str, workflow: str) -> int:
              run = last_run(runs_of(repo, workflow, head_sha))
              if not run:
                  print("No pull request run for the head commit yet.")
                  return 0
              if run.get("status") != "completed":
                  print(f"Run {run['id']} is still {run.get('status')}; its destroy check reads the reviews when it gets there.")
                  return 0
              job = destroy_job(jobs_of(repo, run["id"]))
              if not job or job.get("conclusion") != "failure":
                  print(f"Nothing to re-run: the destroy check of run {run['id']} is "
                        f"{job.get('conclusion') if job else 'missing'}.")
                  return 0
              api(f"repos/{repo}/actions/jobs/{job['id']}/rerun", method="POST")
              print(f"Re-running '{job['name']}' of run {run['id']}.")
              return 0


          def main(argv: list) -> int:
              repo = os.environ["GITHUB_REPOSITORY"]
              if len(argv) == 3 and argv[0] == "pr":
                  return cmd_pr(repo, argv[1], argv[2])
              if len(argv) == 3 and argv[0] == "main":
                  return cmd_main(repo, argv[1], argv[2])
              if len(argv) == 3 and argv[0] == "review":
                  return cmd_review(repo, argv[1], argv[2])
              sys.exit(__doc__)


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          __CI_EOF__
          chmod +x "$d/destroy-approval.py"
          echo "$d" >>"$GITHUB_PATH"

      # The name is read on main (destroy-approval.py STEP): only this step's
      # success means the destroys were approved. A plan without destroys needs
      # no approval, and a plan that did not run says so in the step below.
      - name: Destroys approved after the plan
        if: github.event_name == 'pull_request' && needs.plan.outputs.has_destroys == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLANNED_AT: ${{ needs.plan.outputs.planned_at }}
        run: destroy-approval.py pr "$PR_NUMBER" "$PLANNED_AT"

      - name: Checks passed
        if: always() && github.event_name == 'pull_request'
        env:
          RESULTS: ${{ toJSON(needs) }}
          LINT: ${{ needs.select.outputs.lint }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ "$LINT" = "failed" ]; then
            failed="$failed"$'\n'"conventions or Sentinel lint: failed (annotations of the select job)"
          fi
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"

      - name: The apply had to run
        if: github.event_name != 'pull_request'
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
          PLAN_HAS_DESTROYS: ${{ needs.plan.outputs.has_destroys }}
          ALLOW_DESTROY: ${{ inputs.allow-destroy }}
          DESTROY_APPROVED: ${{ needs.destroy.outputs.approved }}
          APPLY_RESULT: ${{ needs.apply.result }}
          SELECT_RESULT: ${{ needs.select.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VERIFICATION: ${{ needs.apply.outputs.verification }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          EVENT: ${{ github.event_name }}
          RENEWAL_UNIT: ${{ inputs.renewal-unit }}
          RENEWAL_DUE: ${{ needs.plan.outputs.renewal_due }}
          DRIFT: ${{ needs.plan.outputs.drift }}
        run: |
          if [ "$SELECT_RESULT" != "success" ]; then
            echo "::error::select ended as '$SELECT_RESULT', so nothing was planned"
            exit 1
          fi
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "::error::validate ended as '$VALIDATE_RESULT', so nothing was applied"
            exit 1
          fi
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan ended as '$PLAN_RESULT'"
            exit 1
          fi
          # A schedule applies the due renewal and nothing else; any other
          # change is drift: the resources differ from main.
          if [ "$EVENT" = "schedule" ]; then
            if [ "$RENEWAL_DUE" = "true" ]; then
              if [ "$APPLY_RESULT" != "success" ] || [ "$VERIFICATION" != "passed" ]; then
                echo "::error::the renewal of $RENEWAL_UNIT was due but did not apply and verify (apply: $APPLY_RESULT, verification: ${VERIFICATION:-missing})"
                exit 1
              fi
              echo "Renewed $RENEWAL_UNIT." >>"$GITHUB_STEP_SUMMARY"
            fi
            drift=$PLAN_HAS_CHANGES
            [ -z "$RENEWAL_UNIT" ] || drift=$DRIFT
            if [ "$drift" = "true" ]; then
              echo "::error::drift: the resources differ from main (plan in the summary of this run)"
              exit 1
            fi
            echo "No drift." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PLAN_HAS_CHANGES" != "true" ]; then
            echo "Plan proposed nothing, apply was skipped." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Red on purpose: the change is merged but not applied, and the next
          # run on main keeps it selected until someone applies it.
          if [ "$PLAN_HAS_DESTROYS" = "true" ] && [ "$ALLOW_DESTROY" != "true" ] \
            && [ "$DESTROY_APPROVED" != "true" ]; then
            msg="The plan destroys or replaces resources and the merged pull request did not approve them after its plan, so the apply did not run by itself."
            msg="$msg Check the plan of this run, then run the workflow on main by hand with allow_destroy."
            echo "::error::$msg"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$APPLY_RESULT" != "success" ]; then
            echo "::error::the plan proposed a change but apply ended as '$APPLY_RESULT'"
            exit 1
          fi
          if [ "$VERIFICATION" != "passed" ]; then
            echo "::error::the apply went through but its verification is '${VERIFICATION:-missing}' (verify: $VERIFY_RESULT)"
            exit 1
          fi
          echo "Apply went through and verified." >>"$GITHUB_STEP_SUMMARY"
