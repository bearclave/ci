              """True when the path or anything above it is marked in a sensitive/unknown map."""
              if tree is True:
                  return True
              for step in path:
                  if isinstance(tree, dict):
                      tree = tree.get(step)
                  elif isinstance(tree, list) and isinstance(step, int) and step < len(tree):
                      tree = tree[step]
                  else:
                      return False
