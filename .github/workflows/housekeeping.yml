# The weekly housekeeping report of the whole organisation
# (src/housekeeping.py; bearclave/governance standards/workflow.md
# #housekeeping): in every repository that is not archived and has issues,
# branches without a pull request over 30 days and pull requests without an
# update over 14 days, in one issue of that repository (type Debt, assigned
# to the owner, vars.OWNER) that every run updates and that closes itself once
# nothing is stale. It deletes nothing.
#
# One scheduled run here instead of a caller in every repository, as the
# GitHub App bearclave-bot: the job signs in to Azure as sp-project-sync by
# OIDC on the environment project-sync (main only; the upkeep of the
# organisation's issues and Projects, docs/identities.md) and reads the App's
# key from kv-githubbot. No secret in GitHub. A manual run is a dry run unless
# dry-run is unticked.
name: housekeeping

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report, write no issue
        type: boolean
        default: true

permissions: {}

concurrency:
  group: housekeeping
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: project-sync
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PROJECT_SYNC }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      OWNER: ${{ vars.OWNER }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to Azure
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      - name: Stale branches and pull requests
        run: |
          set -euo pipefail
          args=(--org)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 src/housekeeping.py "${args[@]}"
