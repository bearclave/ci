# GENERATED by tools/build.py from templates/static-web-app.yml - edit the template or src/, not this file.
# The pipeline of a static website (app-web-bearclave, app-web-matejhrabalek):
# the common site checks (src/site_checks.py: the config and its security
# headers, the pages against the CSP, well-formed HTML, links), ESLint and the
# site's own checks, then the deployment. Two models, chosen by the inputs:
#
# Environments (staging-swa-name set; bearclave/governance standards/
# workflow.md, Applications) - default branch `staging`, production `prod`:
#
#   pull request into staging -> checks, the build, a preview in the staging
#                                SWA (pr<number>, noindex); closing it
#                                deletes the preview
#   push to staging           -> checks, the build (artifact `site`, a tar of
#                                app and api with its sha256 and commit),
#                                deployment into the staging SWA with noindex,
#                                smoke test of staging-url
#   push to prod              -> (the fast-forward of promote.yml) no build:
#                                the artifact of the successful staging run of
#                                the same commit is deployed into the
#                                production SWA, smoke test of url
#
# Single environment (staging-swa-name empty; the callers before v2.8):
# push to the branch -> deployment into the environment when something under
# deploy-paths changed since the last successful run of that branch.
#
#   jobs:
#     security:
#       if: github.event.action != 'closed' && github.ref != 'refs/heads/prod'
#       uses: bearclave/ci/.github/workflows/security.yml@v2
#       permissions:
#         contents: read
#     pipeline:
#       needs: security          # nothing is deployed past a failed scan
#       if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.security.result) }}
#       uses: bearclave/ci/.github/workflows/static-web-app.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#         actions: read
#       with:
#         swa-name: stapp-web-sro-weu-001
#         swa-resource-group: rg-web-sro-weu-001
#         site-checks: |                   # optional: what only this site checks
#           node --test tests/
#         url: https://bearclave.cz/        # the smoke test after a deployment
#         environment: prod
#         client-id: ${{ vars.AZURE_CLIENT_ID }}
#         staging-swa-name: ${{ vars.STAGING_SWA_NAME }}
#         staging-swa-resource-group: ${{ vars.STAGING_SWA_RESOURCE_GROUP }}
#         staging-url: ${{ vars.STAGING_URL }}
#         staging-client-id: ${{ vars.AZURE_CLIENT_ID_STAGING }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#
# Each identity may deploy its one Static Web App and nothing else, federated
# on its environment only: prod (deployment branch prod), staging (branch
# staging) and preview (refs/pull/*/merge, the staging SWA again). A run from
# any other branch gets no token. The required check is "pipeline / gate".
name: static-web-app

on:
  workflow_call:
    inputs:
      swa-name:
        description: Name of the Static Web App
        type: string
        required: true
      swa-resource-group:
        description: Its resource group
        type: string
        required: true
      site-checks:
        description: Commands of the site's own checks, one per line, run on the Node of the runner, after the common ones
        type: string
        default: ""
      app-location:
        description: Directory with the static content
        type: string
        default: ./src
      api-location:
        description: Directory with the Azure Functions API
        type: string
        default: ./api
      deploy-paths:
        description: Paths whose change triggers a deployment, space-separated
        type: string
        default: src api
      url:
        description: Public URL of the site; after a deployment it must answer 200 (the smoke test). Empty skips the test with a warning
        type: string
        default: ""
      swa-cli-version:
        description: Version of @azure/static-web-apps-cli
        type: string
        default: 2.0.10
      environment:
        description: Environment of the production deploy job (prod); empty deploys without one
        type: string
        default: ""
      client-id:
        description: Client ID of the identity that deploys production
        type: string
        required: true
      staging-swa-name:
        description: Name of the staging Static Web App; set, it switches on the environment model (staging, previews, prod from the staging build)
        type: string
        default: ""
      staging-swa-resource-group:
        description: Its resource group
        type: string
        default: ""
      staging-url:
        description: URL of the staging site (its azurestaticapps.net name); empty takes the one the deployment prints
        type: string
        default: ""
      staging-client-id:
        description: Client ID of the identity that deploys staging and the previews
        type: string
        default: ""
      staging-branch:
        description: Branch deployed to staging (the default branch)
        type: string
        default: staging
      prod-branch:
        description: Branch deployed to production, moved only by promote.yml
        type: string
        default: prod
      staging-environment:
        description: Environment of the staging deploy job
        type: string
        default: staging
      preview-environment:
        description: Environment of the preview jobs of a pull request; empty means no previews
        type: string
        default: preview
      preview-limit:
        description: Preview environments the staging SWA allows (Free 3, Standard 10)
        type: number
        default: 3
      artifact-retention-days:
        description: Days the build of a staging run is kept (at most the organisation's artifact retention, 30 today); a commit is promoted only while its build exists
        type: number
        default: 30
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Not on a closed pull request and not on prod: production takes the build
  # its commit got on staging, checked there.
  site:
    if: >-
      github.event.action != 'closed'
      && !(inputs.staging-swa-name != '' && github.ref == format('refs/heads/{0}', inputs.prod-branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The whole site is static, so nothing compiles; these checks stand in
      # for what only the deployed site or a failed deployment would show.
      - name: Common site checks
        env:
          APP_LOCATION: ${{ inputs.app-location }}
        run: |
          script="$RUNNER_TEMP/site_checks.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """The checks every static website of the organisation passes before a deploy.

          Usage: site_checks.py [<app location>]       (default: src)

          What only a deployed site, or a failed deployment, would show otherwise:

            config    staticwebapp.config.json is valid JSON, no route twice (with and
                      without a trailing slash is the same route, and Static Web Apps
                      then rejects the whole deployment), every rewrite target exists
            headers   globalHeaders carry a Content-Security-Policy without
                      'unsafe-inline' or 'unsafe-eval' for scripts, framing forbidden
                      (frame-ancestors or X-Frame-Options), Strict-Transport-Security,
                      X-Content-Type-Options: nosniff and a Referrer-Policy
            csp       no page needs what the policy forbids: inline scripts, event
                      handler attributes, <style> blocks and style attributes, data:
                      URLs - each only where the policy does not allow it
            html      every page is well formed: a doctype, <html lang>, a charset, a
                      non-empty <title>, end tags that match, no id twice
            links     every internal href and src leads to a file or a route of the
                      config, every #anchor to an id on its page; no empty href or "#"
            seo       internal links are root-relative (/x, never x), so a page reads
                      the same under any route; every page that is not noindex has a
                      canonical, and where it has hreflang links, one of them is the
                      page itself (Google ignores the set otherwise), one is
                      x-default, and each leads to a page; sitemap.xml lists only
                      pages that exist, and every canonical

          Every finding is a GitHub annotation on its file; the exit code is 1 when
          there is one. What is specific to a site (its tests, generated content)
          stays in the site's own `site-checks` command.
          """
          import html.parser
          import json
          import os
          import re
          import sys

          VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "source", "track", "wbr"}
          # End tags HTML lets out; they never count as a mismatch.
          OPTIONAL_END = {"html", "head", "body", "p", "li", "dt", "dd", "option", "optgroup", "tr", "td", "th",
                          "thead", "tbody", "tfoot", "colgroup", "caption", "rt", "rp"}
          EXTERNAL = re.compile(r"^(?:[a-z][a-z0-9+.-]*:|//)", re.I)
          REQUIRED_HEADERS = ("Content-Security-Policy", "Strict-Transport-Security", "X-Content-Type-Options",
                              "Referrer-Policy")


          class Findings:
              def __init__(self):
                  self.items = []

              def add(self, path, line, check, message):
                  self.items.append((path, line, check, message))


          def csp_directives(policy: str) -> dict:
              out = {}
              for part in policy.split(";"):
                  words = part.split()
                  if words:
                      out.setdefault(words[0].lower(), [w.lower() for w in words[1:]])
              return out


          def source_list(directives: dict, name: str) -> list:
              """The sources a fetch directive allows, falling back to default-src."""
              for d in (name, "script-src" if name.startswith("script-src-") else None,
                        "style-src" if name.startswith("style-src-") else None, "default-src"):
                  if d and d in directives:
                      return directives[d]
              return ["*"]


          class Page(html.parser.HTMLParser):
              """The parts of a page the checks need, with line numbers."""

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.doctype = False
                  self.lang = None
                  self.charset = False
                  self.title, self.in_title = None, False
                  self.stack, self.mismatches = [], []
                  self.ids = {}
                  self.refs = []          # (line, attribute, value)
                  self.inline_scripts, self.styles, self.style_attrs, self.handlers = [], [], [], []
                  self.in_script = None
                  self.canonical = None   # (line, href)
                  self.hreflangs = []     # (line, lang, href)
                  self.noindex = False

              def handle_decl(self, decl):
                  if decl.lower().startswith("doctype"):
                      self.doctype = True

              def handle_starttag(self, tag, attrs):
                  line = self.getpos()[0]
                  a = {k.lower(): (v or "") for k, v in attrs}
                  if tag == "html":
                      self.lang = a.get("lang") or ""
                  if tag == "meta" and ("charset" in a or a.get("http-equiv", "").lower() == "content-type"):
                      self.charset = True
                  if tag == "title":
                      self.in_title, self.title = True, self.title or ""
                  if tag == "meta" and a.get("name", "").lower() == "robots" and "noindex" in a.get("content", "").lower():
                      self.noindex = True
                  if tag == "link":
                      rel = a.get("rel", "").lower().split()
                      if "canonical" in rel and self.canonical is None:
                          self.canonical = (line, a.get("href", ""))
                      if "alternate" in rel and "hreflang" in a:
                          self.hreflangs.append((line, a["hreflang"], a.get("href", "")))
                  if "id" in a:
                      self.ids.setdefault(a["id"], []).append(line)
                  if tag == "a" and "name" in a:
                      self.ids.setdefault(a["name"], []).append(line)
                  for k in ("href", "src"):
                      if k in a and not (tag == "link" and k == "href" and "alternate" in a.get("rel", "").split()
                                         and EXTERNAL.match(a[k])):
                          self.refs.append((line, k, a[k]))
                  if tag == "script":
                      kind = a.get("type", "").lower()
                      if "src" not in a and kind not in ("application/ld+json", "application/json", "importmap"):
                          self.inline_scripts.append(line)
                      self.in_script = tag
                  if tag == "style":
                      self.styles.append(line)
                  if "style" in a:
                      self.style_attrs.append(line)
                  self.handlers += [(line, k) for k in a if k.startswith("on")]
                  if tag not in VOID:
                      self.stack.append((tag, line))

              def handle_startendtag(self, tag, attrs):
                  self.handle_starttag(tag, attrs)
                  if tag not in VOID and self.stack and self.stack[-1][0] == tag:
                      self.stack.pop()

              def handle_endtag(self, tag):
                  line = self.getpos()[0]
                  if tag == "title":
                      self.in_title = False
                  if tag in VOID:
                      return
                  if not any(t == tag for t, _ in self.stack):
                      self.mismatches.append((line, f"</{tag}> closes nothing"))
                      return
                  while self.stack:
                      open_tag, open_line = self.stack.pop()
                      if open_tag == tag:
                          break
                      if open_tag not in OPTIONAL_END:
                          self.mismatches.append((open_line, f"<{open_tag}> is never closed (</{tag}> on line {line})"))

              def handle_data(self, data):
                  if self.in_title:
                      self.title += data

              def close(self):
                  super().close()
                  for tag, line in self.stack:
                      if tag not in OPTIONAL_END:
                          self.mismatches.append((line, f"<{tag}> is never closed"))


          def check_config(app: str, rel: str, findings: Findings):
              path = os.path.join(app, "staticwebapp.config.json")
              where = os.path.join(rel, "staticwebapp.config.json")
              if not os.path.isfile(path):
                  findings.add(where, 1, "config", "staticwebapp.config.json is missing")
                  return {}
              try:
                  with open(path, encoding="utf-8") as fh:
                      config = json.load(fh)
              except ValueError as e:
                  findings.add(where, getattr(e, "lineno", 1), "config", f"not valid JSON: {e}")
                  return {}
              seen = {}
              for route in config.get("routes") or []:
                  name = str(route.get("route", ""))
                  key = name.rstrip("/").lower() or "/"
                  if key in seen:
                      findings.add(where, 1, "config", f'route "{name}" is the same route as "{seen[key]}"')
                  seen[key] = name
                  target = route.get("rewrite")
                  if target and not target.startswith("/api") and not os.path.exists(os.path.join(app, target.lstrip("/"))):
                      findings.add(where, 1, "config", f'rewrite "{name}" -> "{target}" has no file')
              for code, override in (config.get("responseOverrides") or {}).items():
                  target = (override or {}).get("rewrite")
                  if target and not os.path.exists(os.path.join(app, target.lstrip("/"))):
                      findings.add(where, 1, "config", f'responseOverrides {code} rewrites to "{target}", which has no file')
              fallback = (config.get("navigationFallback") or {}).get("rewrite")
              if fallback and not os.path.exists(os.path.join(app, fallback.lstrip("/"))):
                  findings.add(where, 1, "config", f'navigationFallback rewrites to "{fallback}", which has no file')

              headers = {k.lower(): str(v) for k, v in (config.get("globalHeaders") or {}).items()}
              for name in REQUIRED_HEADERS:
                  if name.lower() not in headers:
                      findings.add(where, 1, "headers", f"globalHeaders has no {name}")
              if headers.get("x-content-type-options", "nosniff").lower() != "nosniff":
                  findings.add(where, 1, "headers", "X-Content-Type-Options is not nosniff")
              directives = csp_directives(headers.get("content-security-policy", ""))
              if headers.get("content-security-policy"):
                  scripts = source_list(directives, "script-src")
                  for bad in ("'unsafe-inline'", "'unsafe-eval'"):
                      if bad in scripts:
                          findings.add(where, 1, "headers", f"the Content-Security-Policy allows {bad} for scripts")
                  if "*" in scripts:
                      findings.add(where, 1, "headers", "the Content-Security-Policy allows scripts from anywhere")
                  if "frame-ancestors" not in directives and "x-frame-options" not in headers:
                      findings.add(where, 1, "headers", "framing is not forbidden (frame-ancestors or X-Frame-Options)")
              return {"config": config, "csp": directives}


          def resolver(app: str, config: dict):
              routes = {}
              prefixes = []
              for route in config.get("routes") or []:
                  name = str(route.get("route", ""))
                  if name.endswith("/*"):
                      prefixes.append(name[:-1])
                  elif route.get("rewrite"):
                      routes[name.rstrip("/") or "/"] = os.path.join(app, route["rewrite"].lstrip("/"))
                  else:
                      routes[name.rstrip("/") or "/"] = None

              def resolve(page: str, path: str):
                  """(exists, the file it reaches or None)."""
                  if path.startswith("/"):
                      url = path
                  else:
                      base = "/" + os.path.relpath(os.path.dirname(page), app).replace(os.sep, "/").strip(".")
                      url = os.path.normpath(os.path.join(base, path)).replace(os.sep, "/")
                      url += "/" if path.endswith("/") and not url.endswith("/") else ""
                  if url.startswith("/api/") or url == "/api":
                      return True, None
                  key = url.rstrip("/") or "/"
                  if key in routes:
                      return True, routes[key]
                  local = os.path.join(app, url.lstrip("/"))
                  if os.path.isfile(local):
                      return True, local
                  if os.path.isdir(local) and os.path.isfile(os.path.join(local, "index.html")):
                      return True, os.path.join(local, "index.html")
                  if any(url.startswith(p) for p in prefixes) and os.path.exists(local):
                      return True, None
                  return False, None
              return resolve


          def check_pages(app: str, root: str, context: dict, findings: Findings):
              config, csp = context.get("config") or {}, context.get("csp") or {}
              pages = sorted(os.path.join(d, f) for d, _, files in os.walk(app) for f in files if f.endswith(".html"))
              parsed = {}
              for page in pages:
                  p = Page()
                  with open(page, encoding="utf-8") as fh:
                      p.feed(fh.read())
                  p.close()
                  parsed[page] = p
              resolve = resolver(app, config)
              scripts, styles = source_list(csp, "script-src"), source_list(csp, "style-src")
              attr_styles = source_list(csp, "style-src-attr")
              images = source_list(csp, "img-src")
              for page, p in parsed.items():
                  where = os.path.relpath(page, root)
                  if not p.doctype:
                      findings.add(where, 1, "html", "no <!DOCTYPE html>")
                  if not p.lang:
                      findings.add(where, 1, "html", "<html> has no lang")
                  if not p.charset:
                      findings.add(where, 1, "html", "no <meta charset>")
                  if not (p.title or "").strip():
                      findings.add(where, 1, "html", "no <title>, or an empty one")
                  for line, message in p.mismatches:
                      findings.add(where, line, "html", message)
                  for name, lines in p.ids.items():
                      if len(lines) > 1:
                          findings.add(where, lines[1], "html", f'id "{name}" is used {len(lines)} times')
                  if csp:
                      if "'unsafe-inline'" not in scripts:
                          for line in p.inline_scripts:
                              findings.add(where, line, "csp", "an inline <script>; the policy allows no inline scripts")
                          for line, attr in p.handlers:
                              findings.add(where, line, "csp", f"an event handler attribute ({attr}); the policy forbids it")
                      if "'unsafe-inline'" not in styles:
                          for line in p.styles:
                              findings.add(where, line, "csp", "a <style> block; the policy allows no inline styles")
                      if "'unsafe-inline'" not in attr_styles:
                          for line in p.style_attrs:
                              findings.add(where, line, "csp", "a style attribute; the policy allows no inline styles")
                  for line, attr, value in p.refs:
                      value = value.strip()
                      if value in ("", "#"):
                          findings.add(where, line, "links", f'{attr}="{value}" leads nowhere')
                          continue
                      if value.lower().startswith("data:"):
                          if csp and "data:" not in (images if attr == "src" else source_list(csp, "default-src")):
                              findings.add(where, line, "csp", f"a data: URL in {attr}; the policy does not allow data:")
                          continue
                      if EXTERNAL.match(value):
                          continue
                      if not value.startswith(("/", "#")):
                          findings.add(where, line, "seo", f'{attr}="{value}" is relative; links start with /')
                      base, _, anchor = value.partition("#")
                      path = base.split("?", 1)[0]
                      if path == "":
                          if anchor and anchor not in p.ids:
                              findings.add(where, line, "links", f'#{anchor} is not an id on this page')
                          continue
                      ok, target = resolve(page, path)
                      if not ok:
                          findings.add(where, line, "links", f'{attr}="{value}" leads to no file and no route')
                      elif anchor and target and target.endswith(".html") and target in parsed \
                              and anchor not in parsed[target].ids:
                          findings.add(where, line, "links", f'{value}: #{anchor} is not an id on that page')
              check_seo(app, root, parsed, resolve, findings)
              return len(pages)


          ORIGIN = re.compile(r"^https?://[^/]+", re.I)


          def check_seo(app: str, root: str, parsed: dict, resolve, findings: Findings):
              canonicals = []
              for page, p in parsed.items():
                  if p.noindex:
                      continue
                  where = os.path.relpath(page, root)
                  if not p.canonical or not p.canonical[1].strip():
                      findings.add(where, 1, "seo", "no canonical link")
                      continue
                  canonicals.append((where, p.canonical[0], p.canonical[1]))
                  if not p.hreflangs:
                      continue
                  line = p.hreflangs[0][0]
                  if p.canonical[1] not in [h for _, _, h in p.hreflangs]:
                      findings.add(where, line, "seo", "no hreflang link to the page itself; Google ignores the set")
                  if "x-default" not in [lang.lower() for _, lang, _ in p.hreflangs]:
                      findings.add(where, line, "seo", "no hreflang x-default")
                  for hline, lang, href in p.hreflangs:
                      if not resolve(page, ORIGIN.sub("", href) or "/")[0]:
                          findings.add(where, hline, "seo", f'hreflang "{lang}" -> {href} leads to no page')
              sitemap = os.path.join(app, "sitemap.xml")
              if not os.path.isfile(sitemap):
                  return
              where = os.path.relpath(sitemap, root)
              with open(sitemap, encoding="utf-8") as fh:
                  text = fh.read()
              locs = re.findall(r"<loc>\s*([^<\s]+)\s*</loc>", text)
              index = os.path.join(app, "index.html")
              for loc in locs:
                  if not resolve(index, ORIGIN.sub("", loc) or "/")[0]:
                      findings.add(where, 1, "seo", f"{loc} leads to no page")
              for page_where, line, canonical in canonicals:
                  if canonical not in locs:
                      findings.add(where, 1, "seo", f"{canonical} (canonical of {page_where}) is not in the sitemap")


          def escape(text: str) -> str:
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(app: str = "src", root: str = ".") -> int:
              app_path = os.path.normpath(os.path.join(root, app))
              rel = os.path.relpath(app_path, root)
              findings = Findings()
              context = check_config(app_path, rel, findings)
              count = check_pages(app_path, root, context, findings)
              for path, line, check, message in findings.items:
                  print(f"::error file={path},line={line},title=site {check}::{escape(message)}")
              lines = ["## Site checks", "", f"{count} pages in `{rel}`: "
                       + (f"{len(findings.items)} findings." if findings.items else "everything holds.")]
              if findings.items:
                  lines += ["", "| Check | Where | What |", "|---|---|---|"]
                  lines += [f"| {c} | `{p}:{n}` | {m.replace('|', '/')} |" for p, n, c, m in findings.items]
              text = "\n".join(lines) + "\n"
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 1 if findings.items else 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
          __CI_EOF__
          python3 "$script" "$APP_LOCATION"

      - name: Site checks of the repository
        if: inputs.site-checks != ''
        env:
          CHECKS: ${{ inputs.site-checks }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [ -n "${cmd// }" ] || continue
            echo "::group::$cmd"
            bash -euo pipefail -c "$cmd"
            echo "::endgroup::"
          done <<<"$CHECKS"

      # In the same job: a job of its own costs a minute even where there is
      # no JavaScript to lint.
      # ESLint over the JavaScript git tracks, with the repository's
      # eslint.config.mjs (managed by governance tools/sync.py: the recommended
      # rules, the repository's own section below its marker). A repository with a
      # package.json that pins eslint in devDependencies runs that version from its
      # lock file; any other runs the versions below through npx. Errors fail,
      # warnings are annotations only.
      - name: JavaScript in the repository
        id: js
        run: |
          count=$(git ls-files '*.js' '*.mjs' '*.cjs' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No JavaScript."
            echo "lint=false" >>"$GITHUB_OUTPUT"
          elif [ ! -f eslint.config.mjs ]; then
            echo "::warning title=eslint::$count JavaScript files without eslint.config.mjs - run tools/sync.py of governance for this repository"
            echo "lint=false" >>"$GITHUB_OUTPUT"
          else
            echo "lint=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.js.outputs.lint == 'true'
        with:
          node-version: "24"

      - name: ESLint
        if: steps.js.outputs.lint == 'true'
        env:
          ESLINT_VERSION: "10.14.0"
          ESLINT_JS_VERSION: "10.0.1"
          GLOBALS_VERSION: "17.14.0"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.js' '*.mjs' '*.cjs')
          if [ -f package.json ] && jq -e '.devDependencies.eslint' package.json >/dev/null; then
            npm ci --ignore-scripts --no-audit --no-fund
            eslint=(npx --no-install eslint)
          else
            eslint=(npx -y -p "eslint@$ESLINT_VERSION" -p "@eslint/js@$ESLINT_JS_VERSION" -p "globals@$GLOBALS_VERSION" eslint)
          fi
          "${eslint[@]}" --version
          report="$RUNNER_TEMP/eslint.json"
          rc=0
          "${eslint[@]}" --config eslint.config.mjs --no-warn-ignored --format json --output-file "$report" "${files[@]}" || rc=$?
          if [ ! -s "$report" ]; then
            echo "::error title=eslint::eslint ended with $rc and wrote no report"
            exit 1
          fi
          jq -r --arg root "$PWD/" '.[] | (.filePath | ltrimstr($root)) as $f | .messages[]
            | "::\(if .severity == 2 then "error" else "warning" end) file=\($f),line=\(.line // 1),col=\(.column // 1),title=\(.ruleId // "eslint")::\(.message | gsub("\n"; " "))"' "$report"
          jq -r '"ESLint: \(length) files, \(map(.errorCount) | add) errors, \(map(.warningCount) | add) warnings"' "$report" |
            tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      # The one build of the commit: what staging, a preview and production
      # deploy. A tar keeps .well-known and every other hidden file.
      - name: Package the build
        if: inputs.staging-swa-name != ''
        env:
          APP_LOCATION: ${{ inputs.app-location }}
          API_LOCATION: ${{ inputs.api-location }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/app" "$RUNNER_TEMP/build"
          cp -a "$APP_LOCATION/." "$stage/app/"
          if [ -d "$API_LOCATION" ]; then
            mkdir -p "$stage/api"
            cp -a "$API_LOCATION/." "$stage/api/"
          fi
          printf '%s\n' "$GITHUB_SHA" >"$stage/COMMIT"
          tar -C "$stage" --sort=name -cf "$RUNNER_TEMP/build/site.tar" .
          (cd "$RUNNER_TEMP/build" && sha256sum site.tar >site.tar.sha256)
          echo "Build: $(cut -c1-12 "$RUNNER_TEMP/build/site.tar.sha256") (sha256 of site.tar)." >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the build
        if: inputs.staging-swa-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            ${{ runner.temp }}/build/site.tar
            ${{ runner.temp }}/build/site.tar.sha256
          if-no-files-found: error
          # A pull request's build serves only its preview.
          retention-days: ${{ github.event_name == 'pull_request' && 1 || inputs.artifact-retention-days }}

  # The site is deployed only when the content actually changed. The check is
  # a step rather than a path filter on the trigger, so that the checks run
  # on every push and every pull request.
  # The single environment model (no staging-swa-name).
  deploy:
    needs: site
    if: inputs.staging-swa-name == '' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      # The base commit is the head of the last successful run on this branch.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compared with the head of the last successful run on the branch, not with the
      # previous push: a deployment that failed, or a run a newer push took the
      # place of, leaves its content to the next run instead of losing it.
      # Without such a run the site is deployed.
      - name: Did the content change
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_PATHS: ${{ inputs.deploy-paths }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "yes=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # The caller's workflow file, e.g. ci.yml.
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=$GITHUB_REF_NAME&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty') || BASE=""
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No successful run on $GITHUB_REF_NAME to compare with; deploying." >>"$GITHUB_STEP_SUMMARY"
            echo "yes=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Compared with \`$BASE\`, the last successful run." >>"$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086 # the paths are meant to split
          if git diff --quiet "$BASE" HEAD -- $DEPLOY_PATHS; then
            echo "yes=false" >>"$GITHUB_OUTPUT"
            echo "Nothing under the deployed paths changed." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "yes=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.changed.outputs.yes == 'true'
        with:
          client-id: ${{ inputs.client-id }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      - name: Deploy
        if: steps.changed.outputs.yes == 'true'
        env:
          SWA_NAME: ${{ inputs.swa-name }}
          SWA_RG: ${{ inputs.swa-resource-group }}
          APP_LOCATION: ${{ inputs.app-location }}
          API_LOCATION: ${{ inputs.api-location }}
          SWA_CLI: ${{ inputs.swa-cli-version }}
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" \
            --resource-group "$SWA_RG" --query "properties.apiKey" -o tsv)
          # The token is a deployment credential; without this it would end up
          # in the log the moment any command echoes it.
          echo "::add-mask::$TOKEN"
          npx -y "@azure/static-web-apps-cli@$SWA_CLI" deploy "$APP_LOCATION" \
            --api-location "$API_LOCATION" \
            --env production \
            --deployment-token "$TOKEN" \
            --no-use-keychain

      # The CLI returns before the new content is served everywhere, so the
      # test retries for about two minutes before the run turns red.
      - name: Smoke test
        if: steps.changed.outputs.yes == 'true'
        env:
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "::warning title=smoke test::no url input - the deployment is not checked"
            exit 0
          fi
          code=000
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL") || code=000
            [ "$code" = 200 ] && break
            echo "Attempt $attempt: $URL answered $code."
            sleep 15
          done
          if [ "$code" != 200 ]; then
            echo "::error title=smoke test::$URL answered $code after the deployment"
            exit 1
          fi
          echo "Smoke test: $URL answered 200." >>"$GITHUB_STEP_SUMMARY"

  # A pull request into staging: its build in a preview environment of the
  # staging SWA, noindex.
  preview:
    needs: site
    if: >-
      inputs.staging-swa-name != '' && inputs.preview-environment != ''
      && github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.preview-environment }}
    permissions:
      contents: read
      id-token: write
    env:
      CLIENT_ID: ${{ inputs.staging-client-id }}
      SWA_NAME: ${{ inputs.staging-swa-name }}
      SWA_RG: ${{ inputs.staging-swa-resource-group }}
      SWA_ENV: pr${{ github.event.pull_request.number }}
      SITE_URL: ""
      NOINDEX: "true"
      PREVIEW: "true"
      BUILD_RUN: ""
    steps:
      # The deployment of a built site (static-web-app.yml, environment model): the
      # artifact `site` of a run - this one, or BUILD_RUN when the job found the
      # staging run of its commit - checked against its sha256 and its commit,
      # noindex added outside production, signed in, deployed into SWA_ENV of
      # SWA_NAME, then the smoke test. The job sets in env: CLIENT_ID, SWA_NAME,
      # SWA_RG, SWA_ENV (production or a preview name), SITE_URL (may be empty),
      # NOINDEX (true outside production), PREVIEW (true for a pull request),
      # BUILD_RUN (empty for this run).
      - name: Build of this run
        if: env.BUILD_RUN == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/build

      - name: Build of the staging run
        if: env.BUILD_RUN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/build
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}

      # The same bytes the staging run built and tested, of the same commit: a
      # production deployment never builds anything of its own.
      - name: Unpack and verify the build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build"
          sha256sum -c site.tar.sha256
          mkdir -p "$RUNNER_TEMP/site"
          tar -C "$RUNNER_TEMP/site" -xf site.tar
          built=$(cat "$RUNNER_TEMP/site/COMMIT")
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$built" != "$GITHUB_SHA" ]; then
            echo "::error title=build::the artifact was built from $built, not $GITHUB_SHA"
            exit 1
          fi
          {
            echo "Build of \`$built\`, $(cut -c1-12 site.tar.sha256) (sha256 of site.tar)."
            echo "Deploying into \`$SWA_NAME\`, environment \`$SWA_ENV\`."
          } >>"$GITHUB_STEP_SUMMARY"

      # Staging and previews are public on *.azurestaticapps.net and must stay out
      # of search engines; production must never carry the header. The sites share
      # one staticwebapp.config.json, so the header is added to the deployed copy
      # here and never committed.
      - name: Search engines
        env:
          CONFIG: ${{ runner.temp }}/site/app/staticwebapp.config.json
        run: |
          set -euo pipefail
          python3 - "$CONFIG" <<'__CI_EOF__'
          import json, os, sys
          path, noindex = sys.argv[1], os.environ["NOINDEX"] == "true"
          config = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          headers = config.setdefault("globalHeaders", {})
          present = [k for k in headers if k.lower() == "x-robots-tag"]
          if noindex:
              for k in present:
                  del headers[k]
              headers["X-Robots-Tag"] = "noindex, nofollow"
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2, ensure_ascii=False)
              print("X-Robots-Tag: noindex, nofollow added to the deployed copy.")
          elif present:
              print(f"::error title=noindex::staticwebapp.config.json sets {present[0]}; production must be indexed")
              sys.exit(1)
          __CI_EOF__

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      # The Free plan has three preview environments. A pull request that finds them
      # taken by others gets no preview (a warning): staging still checks the
      # deployment before production.
      - name: Room for the preview
        id: room
        if: env.PREVIEW == 'true'
        env:
          LIMIT: ${{ inputs.preview-limit }}
        run: |
          set -euo pipefail
          envs=$(az staticwebapp environment list --name "$SWA_NAME" --resource-group "$SWA_RG" \
            --query "[?buildId != 'default'].buildId" -o tsv 2>/dev/null) || envs=""
          if grep -qx "$SWA_ENV" <<<"$envs"; then
            echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          taken=$(grep -c . <<<"$envs" || true)
          if [ "$taken" -ge "$LIMIT" ]; then
            echo "::warning title=preview::all $LIMIT preview environments of $SWA_NAME are taken ($(tr '\n' ' ' <<<"$envs")); no preview for this pull request"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.room.outputs.skip != 'true'
        env:
          SWA_CLI: ${{ inputs.swa-cli-version }}
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" \
            --resource-group "$SWA_RG" --query "properties.apiKey" -o tsv)
          # The token is a deployment credential; without this it would end up
          # in the log the moment any command echoes it.
          echo "::add-mask::$TOKEN"
          api=()
          [ -d "$RUNNER_TEMP/site/api" ] && api=(--api-location "$RUNNER_TEMP/site/api")
          npx -y "@azure/static-web-apps-cli@$SWA_CLI" deploy "$RUNNER_TEMP/site/app" \
            "${api[@]}" \
            --env "$SWA_ENV" \
            --deployment-token "$TOKEN" \
            --no-use-keychain | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.azurestaticapps\.net' "$RUNNER_TEMP/deploy.log" | tail -1 || true)
          echo "url=$url" >>"$GITHUB_OUTPUT"
          [ -z "$url" ] || echo "Deployed: $url" >>"$GITHUB_STEP_SUMMARY"

      # The CLI returns before the new content is served everywhere, so the test
      # retries for about four minutes before the run turns red: the URL answers
      # 200, the X-Robots-Tag header is there outside production and absent in it,
      # and the front page is the index.html of this build.
      - name: Smoke test
        if: steps.room.outputs.skip != 'true'
        env:
          DEPLOYED: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          URL=${SITE_URL:-${DEPLOYED:+$DEPLOYED/}}
          if [ -z "$URL" ]; then
            echo "::warning title=smoke test::no url - the deployment is not checked"
            exit 0
          fi
          want=""
          if [[ "$URL" =~ ^https://[^/]+/?$ ]] && [ -f "$RUNNER_TEMP/site/app/index.html" ]; then
            want=$(sha256sum <"$RUNNER_TEMP/site/app/index.html" | cut -d' ' -f1)
          fi
          problem="no answer"
          for attempt in $(seq 1 16); do
            : >"$RUNNER_TEMP/headers"; : >"$RUNNER_TEMP/body"
            code=$(curl -sS -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -w '%{http_code}' \
              --max-time 15 "$URL") || code=000
            robots=$(grep -ci '^x-robots-tag:.*noindex' "$RUNNER_TEMP/headers" || true)
            got=$(sha256sum <"$RUNNER_TEMP/body" | cut -d' ' -f1)
            if [ "$code" != 200 ]; then
              problem="answered $code"
            elif [ "$NOINDEX" = "true" ] && [ "$robots" = 0 ]; then
              problem="has no X-Robots-Tag noindex"
            elif [ "$NOINDEX" != "true" ] && [ "$robots" != 0 ]; then
              problem="carries X-Robots-Tag noindex"
            elif [ -n "$want" ] && [ "$got" != "$want" ]; then
              problem="does not serve the index.html of this build yet"
            else
              problem=""
              break
            fi
            echo "Attempt $attempt: $URL $problem."
            sleep 15
          done
          if [ -n "$problem" ]; then
            echo "::error title=smoke test::$URL $problem after the deployment"
            exit 1
          fi
          echo "Smoke test: $URL answered 200${want:+ with the front page of this build}." >>"$GITHUB_STEP_SUMMARY"

  # A closed pull request gives its preview environment back. A failure only
  # warns: the pull request is done, and the next preview reports a full SWA.
  preview-cleanup:
    if: >-
      inputs.staging-swa-name != '' && inputs.preview-environment != ''
      && github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.preview-environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.staging-client-id }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      - name: Delete the preview
        env:
          SWA_NAME: ${{ inputs.staging-swa-name }}
          SWA_RG: ${{ inputs.staging-swa-resource-group }}
          SWA_ENV: pr${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Without --environment-name the command deletes the production
          # environment of the SWA; only a preview name gets this far.
          if ! [[ "$SWA_ENV" =~ ^pr[0-9]+$ ]]; then
            echo "::error::refusing to delete environment '$SWA_ENV'"
            exit 1
          fi
          if az staticwebapp environment delete --name "$SWA_NAME" --resource-group "$SWA_RG" \
              --environment-name "$SWA_ENV" --yes --output none; then
            echo "Preview $SWA_ENV deleted." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=preview::$SWA_ENV of $SWA_NAME was not deleted (gone already, or the delete failed)"
          fi

  # A push to staging: the build of this run into the staging SWA, noindex.
  deploy-staging:
    needs: site
    if: >-
      inputs.staging-swa-name != '' && github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', inputs.staging-branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.staging-environment }}
    permissions:
      contents: read
      id-token: write
    env:
      CLIENT_ID: ${{ inputs.staging-client-id }}
      SWA_NAME: ${{ inputs.staging-swa-name }}
      SWA_RG: ${{ inputs.staging-swa-resource-group }}
      SWA_ENV: production
      SITE_URL: ${{ inputs.staging-url }}
      NOINDEX: "true"
      PREVIEW: "false"
      BUILD_RUN: ""
    steps:
      # The deployment of a built site (static-web-app.yml, environment model): the
      # artifact `site` of a run - this one, or BUILD_RUN when the job found the
      # staging run of its commit - checked against its sha256 and its commit,
      # noindex added outside production, signed in, deployed into SWA_ENV of
      # SWA_NAME, then the smoke test. The job sets in env: CLIENT_ID, SWA_NAME,
      # SWA_RG, SWA_ENV (production or a preview name), SITE_URL (may be empty),
      # NOINDEX (true outside production), PREVIEW (true for a pull request),
      # BUILD_RUN (empty for this run).
      - name: Build of this run
        if: env.BUILD_RUN == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/build

      - name: Build of the staging run
        if: env.BUILD_RUN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/build
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}

      # The same bytes the staging run built and tested, of the same commit: a
      # production deployment never builds anything of its own.
      - name: Unpack and verify the build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build"
          sha256sum -c site.tar.sha256
          mkdir -p "$RUNNER_TEMP/site"
          tar -C "$RUNNER_TEMP/site" -xf site.tar
          built=$(cat "$RUNNER_TEMP/site/COMMIT")
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$built" != "$GITHUB_SHA" ]; then
            echo "::error title=build::the artifact was built from $built, not $GITHUB_SHA"
            exit 1
          fi
          {
            echo "Build of \`$built\`, $(cut -c1-12 site.tar.sha256) (sha256 of site.tar)."
            echo "Deploying into \`$SWA_NAME\`, environment \`$SWA_ENV\`."
          } >>"$GITHUB_STEP_SUMMARY"

      # Staging and previews are public on *.azurestaticapps.net and must stay out
      # of search engines; production must never carry the header. The sites share
      # one staticwebapp.config.json, so the header is added to the deployed copy
      # here and never committed.
      - name: Search engines
        env:
          CONFIG: ${{ runner.temp }}/site/app/staticwebapp.config.json
        run: |
          set -euo pipefail
          python3 - "$CONFIG" <<'__CI_EOF__'
          import json, os, sys
          path, noindex = sys.argv[1], os.environ["NOINDEX"] == "true"
          config = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          headers = config.setdefault("globalHeaders", {})
          present = [k for k in headers if k.lower() == "x-robots-tag"]
          if noindex:
              for k in present:
                  del headers[k]
              headers["X-Robots-Tag"] = "noindex, nofollow"
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2, ensure_ascii=False)
              print("X-Robots-Tag: noindex, nofollow added to the deployed copy.")
          elif present:
              print(f"::error title=noindex::staticwebapp.config.json sets {present[0]}; production must be indexed")
              sys.exit(1)
          __CI_EOF__

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      # The Free plan has three preview environments. A pull request that finds them
      # taken by others gets no preview (a warning): staging still checks the
      # deployment before production.
      - name: Room for the preview
        id: room
        if: env.PREVIEW == 'true'
        env:
          LIMIT: ${{ inputs.preview-limit }}
        run: |
          set -euo pipefail
          envs=$(az staticwebapp environment list --name "$SWA_NAME" --resource-group "$SWA_RG" \
            --query "[?buildId != 'default'].buildId" -o tsv 2>/dev/null) || envs=""
          if grep -qx "$SWA_ENV" <<<"$envs"; then
            echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          taken=$(grep -c . <<<"$envs" || true)
          if [ "$taken" -ge "$LIMIT" ]; then
            echo "::warning title=preview::all $LIMIT preview environments of $SWA_NAME are taken ($(tr '\n' ' ' <<<"$envs")); no preview for this pull request"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.room.outputs.skip != 'true'
        env:
          SWA_CLI: ${{ inputs.swa-cli-version }}
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" \
            --resource-group "$SWA_RG" --query "properties.apiKey" -o tsv)
          # The token is a deployment credential; without this it would end up
          # in the log the moment any command echoes it.
          echo "::add-mask::$TOKEN"
          api=()
          [ -d "$RUNNER_TEMP/site/api" ] && api=(--api-location "$RUNNER_TEMP/site/api")
          npx -y "@azure/static-web-apps-cli@$SWA_CLI" deploy "$RUNNER_TEMP/site/app" \
            "${api[@]}" \
            --env "$SWA_ENV" \
            --deployment-token "$TOKEN" \
            --no-use-keychain | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.azurestaticapps\.net' "$RUNNER_TEMP/deploy.log" | tail -1 || true)
          echo "url=$url" >>"$GITHUB_OUTPUT"
          [ -z "$url" ] || echo "Deployed: $url" >>"$GITHUB_STEP_SUMMARY"

      # The CLI returns before the new content is served everywhere, so the test
      # retries for about four minutes before the run turns red: the URL answers
      # 200, the X-Robots-Tag header is there outside production and absent in it,
      # and the front page is the index.html of this build.
      - name: Smoke test
        if: steps.room.outputs.skip != 'true'
        env:
          DEPLOYED: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          URL=${SITE_URL:-${DEPLOYED:+$DEPLOYED/}}
          if [ -z "$URL" ]; then
            echo "::warning title=smoke test::no url - the deployment is not checked"
            exit 0
          fi
          want=""
          if [[ "$URL" =~ ^https://[^/]+/?$ ]] && [ -f "$RUNNER_TEMP/site/app/index.html" ]; then
            want=$(sha256sum <"$RUNNER_TEMP/site/app/index.html" | cut -d' ' -f1)
          fi
          problem="no answer"
          for attempt in $(seq 1 16); do
            : >"$RUNNER_TEMP/headers"; : >"$RUNNER_TEMP/body"
            code=$(curl -sS -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -w '%{http_code}' \
              --max-time 15 "$URL") || code=000
            robots=$(grep -ci '^x-robots-tag:.*noindex' "$RUNNER_TEMP/headers" || true)
            got=$(sha256sum <"$RUNNER_TEMP/body" | cut -d' ' -f1)
            if [ "$code" != 200 ]; then
              problem="answered $code"
            elif [ "$NOINDEX" = "true" ] && [ "$robots" = 0 ]; then
              problem="has no X-Robots-Tag noindex"
            elif [ "$NOINDEX" != "true" ] && [ "$robots" != 0 ]; then
              problem="carries X-Robots-Tag noindex"
            elif [ -n "$want" ] && [ "$got" != "$want" ]; then
              problem="does not serve the index.html of this build yet"
            else
              problem=""
              break
            fi
            echo "Attempt $attempt: $URL $problem."
            sleep 15
          done
          if [ -n "$problem" ]; then
            echo "::error title=smoke test::$URL $problem after the deployment"
            exit 1
          fi
          echo "Smoke test: $URL answered 200${want:+ with the front page of this build}." >>"$GITHUB_STEP_SUMMARY"

  # A push to prod (the fast-forward of promote.yml): the build of the
  # successful staging run of the same commit into the production SWA. No
  # checks and no build here; the commit had them on staging.
  deploy-prod:
    if: >-
      inputs.staging-swa-name != '' && github.event_name != 'pull_request'
      && github.ref == format('refs/heads/{0}', inputs.prod-branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      # The staging run of the commit and its artifact.
      actions: read
    env:
      CLIENT_ID: ${{ inputs.client-id }}
      SWA_NAME: ${{ inputs.swa-name }}
      SWA_RG: ${{ inputs.swa-resource-group }}
      SWA_ENV: production
      SITE_URL: ${{ inputs.url }}
      NOINDEX: "false"
      PREVIEW: "false"
      BUILD_RUN: ""
    steps:
      # The same choice as src/promote.py: the newest run of the commit on
      # staging from a push or a manual run, which must have succeeded.
      - name: Find the staging build
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING: ${{ inputs.staging-branch }}
        run: |
          set -euo pipefail
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&branch=$STAGING&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_branch == \"$STAGING\" and (.event == \"push\" or .event == \"workflow_dispatch\"))]
                  | sort_by(.created_at, .id) | last // empty | \"\(.id) \(.status) \(.conclusion)\"")
          read -r id status conclusion <<<"${run:-none none none}"
          if [ "$id" = none ]; then
            echo "::error title=deploy::$GITHUB_SHA has no run of $wf on $STAGING: production deploys only a build that staging ran. Promote with promote.yml."
            exit 1
          fi
          if [ "$status" != completed ] || [ "$conclusion" != success ]; then
            echo "::error title=deploy::the staging run $id of $GITHUB_SHA is $status/$conclusion, not a success"
            exit 1
          fi
          echo "BUILD_RUN=$id" >>"$GITHUB_ENV"
          echo "Staging run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" >>"$GITHUB_STEP_SUMMARY"

      # The deployment of a built site (static-web-app.yml, environment model): the
      # artifact `site` of a run - this one, or BUILD_RUN when the job found the
      # staging run of its commit - checked against its sha256 and its commit,
      # noindex added outside production, signed in, deployed into SWA_ENV of
      # SWA_NAME, then the smoke test. The job sets in env: CLIENT_ID, SWA_NAME,
      # SWA_RG, SWA_ENV (production or a preview name), SITE_URL (may be empty),
      # NOINDEX (true outside production), PREVIEW (true for a pull request),
      # BUILD_RUN (empty for this run).
      - name: Build of this run
        if: env.BUILD_RUN == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/build

      - name: Build of the staging run
        if: env.BUILD_RUN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/build
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}

      # The same bytes the staging run built and tested, of the same commit: a
      # production deployment never builds anything of its own.
      - name: Unpack and verify the build
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/build"
          sha256sum -c site.tar.sha256
          mkdir -p "$RUNNER_TEMP/site"
          tar -C "$RUNNER_TEMP/site" -xf site.tar
          built=$(cat "$RUNNER_TEMP/site/COMMIT")
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$built" != "$GITHUB_SHA" ]; then
            echo "::error title=build::the artifact was built from $built, not $GITHUB_SHA"
            exit 1
          fi
          {
            echo "Build of \`$built\`, $(cut -c1-12 site.tar.sha256) (sha256 of site.tar)."
            echo "Deploying into \`$SWA_NAME\`, environment \`$SWA_ENV\`."
          } >>"$GITHUB_STEP_SUMMARY"

      # Staging and previews are public on *.azurestaticapps.net and must stay out
      # of search engines; production must never carry the header. The sites share
      # one staticwebapp.config.json, so the header is added to the deployed copy
      # here and never committed.
      - name: Search engines
        env:
          CONFIG: ${{ runner.temp }}/site/app/staticwebapp.config.json
        run: |
          set -euo pipefail
          python3 - "$CONFIG" <<'__CI_EOF__'
          import json, os, sys
          path, noindex = sys.argv[1], os.environ["NOINDEX"] == "true"
          config = json.load(open(path, encoding="utf-8")) if os.path.exists(path) else {}
          headers = config.setdefault("globalHeaders", {})
          present = [k for k in headers if k.lower() == "x-robots-tag"]
          if noindex:
              for k in present:
                  del headers[k]
              headers["X-Robots-Tag"] = "noindex, nofollow"
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(config, f, indent=2, ensure_ascii=False)
              print("X-Robots-Tag: noindex, nofollow added to the deployed copy.")
          elif present:
              print(f"::error title=noindex::staticwebapp.config.json sets {present[0]}; production must be indexed")
              sys.exit(1)
          __CI_EOF__

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.CLIENT_ID }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      # The Free plan has three preview environments. A pull request that finds them
      # taken by others gets no preview (a warning): staging still checks the
      # deployment before production.
      - name: Room for the preview
        id: room
        if: env.PREVIEW == 'true'
        env:
          LIMIT: ${{ inputs.preview-limit }}
        run: |
          set -euo pipefail
          envs=$(az staticwebapp environment list --name "$SWA_NAME" --resource-group "$SWA_RG" \
            --query "[?buildId != 'default'].buildId" -o tsv 2>/dev/null) || envs=""
          if grep -qx "$SWA_ENV" <<<"$envs"; then
            echo "skip=false" >>"$GITHUB_OUTPUT"; exit 0
          fi
          taken=$(grep -c . <<<"$envs" || true)
          if [ "$taken" -ge "$LIMIT" ]; then
            echo "::warning title=preview::all $LIMIT preview environments of $SWA_NAME are taken ($(tr '\n' ' ' <<<"$envs")); no preview for this pull request"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        if: steps.room.outputs.skip != 'true'
        env:
          SWA_CLI: ${{ inputs.swa-cli-version }}
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" \
            --resource-group "$SWA_RG" --query "properties.apiKey" -o tsv)
          # The token is a deployment credential; without this it would end up
          # in the log the moment any command echoes it.
          echo "::add-mask::$TOKEN"
          api=()
          [ -d "$RUNNER_TEMP/site/api" ] && api=(--api-location "$RUNNER_TEMP/site/api")
          npx -y "@azure/static-web-apps-cli@$SWA_CLI" deploy "$RUNNER_TEMP/site/app" \
            "${api[@]}" \
            --env "$SWA_ENV" \
            --deployment-token "$TOKEN" \
            --no-use-keychain | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.azurestaticapps\.net' "$RUNNER_TEMP/deploy.log" | tail -1 || true)
          echo "url=$url" >>"$GITHUB_OUTPUT"
          [ -z "$url" ] || echo "Deployed: $url" >>"$GITHUB_STEP_SUMMARY"

      # The CLI returns before the new content is served everywhere, so the test
      # retries for about four minutes before the run turns red: the URL answers
      # 200, the X-Robots-Tag header is there outside production and absent in it,
      # and the front page is the index.html of this build.
      - name: Smoke test
        if: steps.room.outputs.skip != 'true'
        env:
          DEPLOYED: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          URL=${SITE_URL:-${DEPLOYED:+$DEPLOYED/}}
          if [ -z "$URL" ]; then
            echo "::warning title=smoke test::no url - the deployment is not checked"
            exit 0
          fi
          want=""
          if [[ "$URL" =~ ^https://[^/]+/?$ ]] && [ -f "$RUNNER_TEMP/site/app/index.html" ]; then
            want=$(sha256sum <"$RUNNER_TEMP/site/app/index.html" | cut -d' ' -f1)
          fi
          problem="no answer"
          for attempt in $(seq 1 16); do
            : >"$RUNNER_TEMP/headers"; : >"$RUNNER_TEMP/body"
            code=$(curl -sS -D "$RUNNER_TEMP/headers" -o "$RUNNER_TEMP/body" -w '%{http_code}' \
              --max-time 15 "$URL") || code=000
            robots=$(grep -ci '^x-robots-tag:.*noindex' "$RUNNER_TEMP/headers" || true)
            got=$(sha256sum <"$RUNNER_TEMP/body" | cut -d' ' -f1)
            if [ "$code" != 200 ]; then
              problem="answered $code"
            elif [ "$NOINDEX" = "true" ] && [ "$robots" = 0 ]; then
              problem="has no X-Robots-Tag noindex"
            elif [ "$NOINDEX" != "true" ] && [ "$robots" != 0 ]; then
              problem="carries X-Robots-Tag noindex"
            elif [ -n "$want" ] && [ "$got" != "$want" ]; then
              problem="does not serve the index.html of this build yet"
            else
              problem=""
              break
            fi
            echo "Attempt $attempt: $URL $problem."
            sleep 15
          done
          if [ -n "$problem" ]; then
            echo "::error title=smoke test::$URL $problem after the deployment"
            exit 1
          fi
          echo "Smoke test: $URL answered 200${want:+ with the front page of this build}." >>"$GITHUB_STEP_SUMMARY"

  gate:
    needs: [site, deploy, preview, preview-cleanup, deploy-staging, deploy-prod]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # needs of the gate job, as JSON: anything but success or skipped fails it.
      # A skipped job counts as passed in a required check, so the gate - which
      # always runs - is the one the ruleset requires.
      - name: Everything needed passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
