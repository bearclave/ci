name: checks

on:
  workflow_call:
    inputs:
      command:
        description: Commands run in the checkout of the repository; empty runs nothing
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    if: inputs.command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository checks
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"

  gate:
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Everything needed passed
        env:
          CHECKS: ${{ needs.checks.result }}
        run: |
          case "$CHECKS" in
            success|skipped) echo "checks: $CHECKS" ;;
            *) echo "::error::checks ended as '$CHECKS'"; exit 1 ;;
          esac
