# The workflows of this repository checked on this repository: a pull request
# runs them from its own branch, so a change is tried out before a release
# tag moves and every other repository picks it up.
name: ci

on:
  pull_request:
    branches: [main]
  # main holds only what a pull request already checked; the weekly run is
  # there for new gitleaks rules over the old history.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # The scripts the workflows carry, and the workflows written from them.
  pipeline:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
    with:
      command: |
        python3 -m unittest discover -s tests -v
        python3 src/pr_check.py --self-test
        python3 src/layout_check.py --self-test
        python3 src/schema_check.py --self-test
        pwsh -NoProfile -Command '$r = Invoke-Pester ./tests/m365 -PassThru -Output Detailed; if ($r.FailedCount -gt 0) { exit 1 }'
        tools/build.py --check
        yq -o=json . tests/fixtures/selftest.yaml >"$RUNNER_TEMP/conventions.json"
        python3 src/conventions.py "$RUNNER_TEMP/conventions.json" . --skip todo-issue,markdown-links
        yq -o=json . tests/fixtures/sentinel-selftest.yaml >"$RUNNER_TEMP/sentinel-lint.json"
        python3 src/sentinel_lint.py "$RUNNER_TEMP/sentinel-lint.json" .
