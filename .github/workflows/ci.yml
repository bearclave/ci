# The workflows of this repository checked on this repository: a pull request
# runs them from its own branch, so a change is tried out before the v1 tag
# moves and every other repository picks it up.
name: ci

on:
  pull_request:
    branches: [main]
  # main holds only what a pull request already checked; the weekly run is
  # there for new gitleaks rules over the old history.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  conventions:
    uses: ./.github/workflows/conventions.yml
    permissions:
      contents: read
    with:
      config: tests/fixtures/selftest.yaml

  # The scripts the workflows carry, and the workflows written from them.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Workflows match their templates
        run: ./build.py --check
