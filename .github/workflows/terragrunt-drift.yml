      - name: Release stale state locks
        continue-on-error: true
        run: |
          set -euo pipefail
          value() { sed -n "s/^ *$1 *= *\"\(.*\)\"/\1/p" account.hcl; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          release-stale-locks.py \
            "$(value storage_account_name)" "$(value container_name)" 70

      # A repository that manages GitHub itself (iac-github) signs in to GitHub as
      # a GitHub App. Its private key, App ID and installation ID are in a Key
      # Vault the job's Azure identity may read: the read-only App's vault for a
      # pull request, the App with write access for main. The provider reads the
      # GITHUB_APP_* variables (app_auth in root.hcl).
      - name: GitHub App credentials
        if: env.GITHUB_APP_VAULT != ''
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none
          pem="$RUNNER_TEMP/github-app.pem"
          install -m 600 /dev/null "$pem"
          az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-key \
            --query value -o tsv >"$pem"
          app_id=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-id --query value -o tsv)
          installation=$(az keyvault secret show --vault-name "$GITHUB_APP_VAULT" --name github-app-installation-id --query value -o tsv)
          {
            echo "GITHUB_APP_ID=$app_id"
            echo "GITHUB_APP_INSTALLATION_ID=$installation"
            echo "GITHUB_APP_PEM_FILE=$pem"
          } >>"$GITHUB_ENV"
          echo "GitHub App $app_id, installation $installation, from $GITHUB_APP_VAULT."

      - name: Plan over the whole tree
        env:
          TG_PROVIDER_CACHE: "1"
          TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
          TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ github.workspace }}/iac-modules
        run: |
          set -euo pipefail
          mkdir -p "$TG_PROVIDER_CACHE_DIR"
          set +e
          terragrunt run --all plan --json-out-dir "$RUNNER_TEMP/plan-json" \
            --non-interactive --no-color 2>&1 | tee plan.txt
          rc=${PIPESTATUS[0]}
          set -e
          # A unit that fails is reported by the summary below together with
          # everything else, so the raw exit code only matters when nothing at
          # all came out.
          [ -s plan.txt ] || exit "$rc"

      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-${{ github.run_id }}
          path: plan.txt
          retention-days: 30

      # A plan only sees what the code manages; a rule clicked together in
      # the portal stays invisible to it. Reported, not failed: such a rule
      # may be a deliberate experiment.
      - name: Analytic rules outside the code
        if: always() && inputs.analytic-rules-path != ''
        continue-on-error: true
        env:
          RULES: ${{ inputs.analytic-rules-path }}
        run: portal-rules.py "$RUNNER_TEMP/plan-json" "$RULES"

      # The whole tree once a week, so a check that a new trivy version brings
      # or a setting changed outside the code shows up here even when no pull
      # request touches the unit. The JSON stays in the runner's temp.
      - name: Security findings in the plan
        id: trivy
        if: always()
        run: |
          rc=0
          trivy-plans.sh "$RUNNER_TEMP/plan-json" trivy || rc=$?
          case "$rc" in
            0) echo "found=false" >>"$GITHUB_OUTPUT" ;;
            3) echo "found=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # Terragrunt returns zero even when the plan proposes changes, so the
      # verdict comes from the summary.
      - name: Verdict
        if: always()
        run: |
          set -euo pipefail
          [ -s plan.txt ] || { echo "::error::no plan produced"; exit 1; }
          plan-summary.py plan.txt --fail-on-change --drift \
            --json-dir="$RUNNER_TEMP/plan-json" --trivy=trivy \
            --artifact="drift-$GITHUB_RUN_ID" >>"$GITHUB_STEP_SUMMARY"

      - name: No unaccepted security finding
        if: always() && steps.trivy.outputs.found == 'true'
        run: |
          echo "::error::trivy found a HIGH or CRITICAL setting (Security findings in the summary). Fix it, or accept it in .github/trivyignore.yaml with the reason."
          exit 1
