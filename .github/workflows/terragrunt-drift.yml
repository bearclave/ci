# GENERATED by tools/build.py from templates/terragrunt-drift.yml - edit the template or src/, not this file.
# A plan over the whole tree, once a week, for a repository that uses
# terragrunt.yml. Anything it proposes means either something was changed
# outside the code, or the code does not converge. Either way the run has to
# be red.
#
# The main pipeline only plans the units a change touches, and that selection
# does not pull in units that DEPEND on a changed one. This is what catches
# those.
#
# The caller owns the schedule and shares its concurrency group with the push
# runs of ci.yml: the plan here locks the state too, and a drift plan in the
# middle of an apply would read a half-applied state.
#
#   jobs:
#     drift:
#       uses: bearclave/ci/.github/workflows/terragrunt-drift.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         client-id: ${{ vars.AZURE_CLIENT_ID_PLATFORM }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#       secrets:
#         modules-deploy-key: ${{ secrets.MODULES_DEPLOY_KEY }}
name: terragrunt-drift

on:
  workflow_call:
    inputs:
      client-id:
        description: The full identity, so that drift sees everything; federated on main
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        default: ""
      analytic-rules-path:
        description: Unit of the Sentinel analytic rules; rules in the workspace but not in code are reported
        type: string
        default: ""
      github-app-vault:
        description: Key Vault with the GitHub App (iac-github)
        type: string
        default: ""
    secrets:
      modules-deploy-key:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ inputs.tenant-id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
  # A run queued from any other branch than main gets no token: the identity
  # is federated on main.
  ARM_CLIENT_ID: ${{ inputs.client-id }}
  GITHUB_APP_VAULT: ${{ inputs.github-app-vault }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bearclave/iac-modules
          path: iac-modules
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          for tool in "$@"; do
            "install_$tool"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Terragrunt scripts
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/select-units.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Works out from git which units a change touches.

          Usage: select-units.py <base> [--no-expand]

          Compares <base> with HEAD and prints one JSON object:

            all      true when the whole tree has to run
            units    the units to run when not the whole tree, with everything they
                     depend on (see expand-dependencies.py); --no-expand leaves that out
            deleted  units whose directory is gone: they only exist in <base> and are
                     planned, and applied, as a destroy from there
            renamed  [old, new] pairs of a unit directory that moved. The state key is
                     the unit's path, so a move is a new unit plus a deleted one; the
                     workflow refuses it
            base     the commit compared against, or null when there was none to use

          What decides the selection:

          - A change to root.hcl, account.hcl or anything under _common/ touches every
            unit: the whole tree runs.
          - A context file (mg.hcl, subscription.hcl, region.hcl, rg.hcl) applies to
            the unit in its own directory and every unit below it.
          - Any other file belongs to the nearest unit above it. A file of a deleted
            unit belongs to nobody - that unit runs as a destroy.
          - A file outside every unit (the workflows, the scripts) changes how the tree
            is planned, so when nothing else is touched the whole tree runs.
          - No usable <base> (unknown, not an ancestor of HEAD) or no difference at all
            means the whole tree.

          What stays out are the units that DEPEND on a changed one: if the groups unit
          changes and memberships stands on its outputs, this selection will not run
          memberships. That is what the weekly drift job over the whole tree is for.
          """
          import json
          import os
          import pathlib
          import subprocess
          import sys

          CONTEXT = {"mg.hcl", "subscription.hcl", "region.hcl", "rg.hcl"}
          UNIT = "terragrunt.hcl"


          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=check)


          def unit_dirs(ref: str) -> set:
              """Every directory that holds a terragrunt.hcl at the given commit."""
              files = git("ls-tree", "-r", "--name-only", ref).stdout.splitlines()
              return {f[: -len(UNIT) - 1] for f in files if f.endswith("/" + UNIT)}


          def is_global(path: str) -> bool:
              return path in ("root.hcl", "account.hcl") or path.startswith("_common/")


          def owner(path: str, units: set) -> str:
              """The nearest unit directory above the path, or None."""
              d = os.path.dirname(path)
              while d:
                  if d in units:
                      return d
                  d = os.path.dirname(d)
              return None


          def expand(units: list) -> list:
              """The units plus everything they depend on, via expand-dependencies.py."""
              script = pathlib.Path(__file__).with_name("expand-dependencies.py")
              out = subprocess.run([sys.executable, str(script)], input="\n".join(units),
                                   capture_output=True, text=True, check=True).stdout
              return sorted({line.strip() for line in out.splitlines() if line.strip()})


          def select(base: str, do_expand: bool = True) -> dict:
              result = {"all": False, "units": [], "deleted": [], "renamed": [], "base": None}

              usable = (base and git("cat-file", "-e", f"{base}^{{commit}}", check=False).returncode == 0
                        and git("merge-base", "--is-ancestor", base, "HEAD", check=False).returncode == 0)
              if not usable:
                  result["all"] = True
                  return result
              result["base"] = git("rev-parse", f"{base}^{{commit}}").stdout.strip()

              head_units = unit_dirs("HEAD")
              base_units = unit_dirs(base)
              gone = base_units - head_units

              changes = []
              for line in git("diff", "--name-status", "-M", base, "HEAD").stdout.splitlines():
                  status, *paths = line.split("\t")
                  changes.append((status[0], paths))
              if not changes:
                  result["all"] = True
                  return result

              selected, outside = set(), False
              for status, paths in changes:
                  if status == "R":
                      old, new = paths
                      if old.endswith("/" + UNIT) and new.endswith("/" + UNIT):
                          old_dir, new_dir = os.path.dirname(old), os.path.dirname(new)
                          if old_dir in gone and new_dir not in base_units:
                              result["renamed"].append([old_dir, new_dir])
                              continue
                  for path in paths:
                      if is_global(path):
                          result["all"] = True
                      if os.path.basename(path) in CONTEXT:
                          here = os.path.dirname(path)
                          selected |= {u for u in head_units if u == here or u.startswith(here + "/")}
                          continue
                      if path.endswith("/" + UNIT) and os.path.dirname(path) in gone:
                          continue
                      unit = owner(path, head_units | gone)
                      if unit in head_units:
                          selected.add(unit)
                      elif unit is None:
                          outside = True

              renamed_old = {old for old, _ in result["renamed"]}
              result["deleted"] = sorted(gone - renamed_old)
              if result["all"]:
                  return result
              if not selected:
                  # Only the workflows, the scripts or the docs changed, or only units
                  # were deleted. The first changes how everything is planned.
                  result["all"] = outside
                  return result
              result["units"] = expand(sorted(selected)) if do_expand else sorted(selected)
              return result


          if __name__ == "__main__":
              args = [a for a in sys.argv[1:] if not a.startswith("--")]
              print(json.dumps(select(args[0] if args else "", "--no-expand" not in sys.argv)))
          __CI_EOF__
          cat >"$d/expand-dependencies.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Expands a set of units with everything they depend on, transitively.

          `--queue-include-dir` runs exactly the directories it is handed; terragrunt
          does not pull a unit's dependencies into the queue by itself. A change that
          touches only a child therefore runs against a parent that may not exist yet,
          which is how a key vault came to be created before its resource group.

          Reads unit paths on stdin, writes the closure on stdout.
          """
          import json
          import subprocess
          import sys

          selected = {line.strip() for line in sys.stdin if line.strip()}
          if not selected:
              sys.exit(0)

          found = json.loads(subprocess.run(
              ["terragrunt", "find", "--dependencies", "--json"],
              capture_output=True, text=True, check=True,
          ).stdout)
          units = found if isinstance(found, list) else found.get("units", [])
          dependencies = {
              u["path"]: u.get("dependencies") or []
              for u in units if u.get("type") == "unit"
          }

          closure, queue = set(), list(selected)
          while queue:
              unit = queue.pop()
              if unit in closure:
                  continue
              closure.add(unit)
              queue.extend(dependencies.get(unit, []))

          for unit in sorted(closure):
              print(unit)
          __CI_EOF__
          cat >"$d/check-principal-refs.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Fails when a principal this change creates is referenced by display name.

          `dependencies` only orders the run. A plan creates nothing, so a lookup by
          display name goes to Entra and finds nothing for a group or service principal
          that the same change is still only planning. The reference has to go through
          a dependency output as "id:${dependency...}" instead.
          """
          import pathlib
          import re
          import subprocess
          import sys

          BASE = sys.argv[1] if len(sys.argv) > 1 else "origin/main"

          EMAIL = re.compile(r'"([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)"')

          # Guests are users too; a new one referenced by address fails the same way.
          SOURCES = [
              ("group", "tenant/groups/terragrunt.hcl", re.compile(r'"(sg-[A-Za-z0-9._-]+)"\s*=')),
              ("sp", "tenant/applications/terragrunt.hcl", re.compile(r'"(sp-[A-Za-z0-9._-]+)"\s*=')),
              ("user", "tenant/users/terragrunt.hcl", EMAIL),
              ("user", "tenant/external-users/terragrunt.hcl", EMAIL),
          ]
          REFERENCE = re.compile(r'"(group|sp|user):([^"$]+)"')


          def added(path, pattern):
              """Names present now and absent at the merge base.

              The comparison is between two whole files rather than over the diff: a
              changed description touches the line a name sits on, which would otherwise
              read as a new name.
              """
              merge_base = subprocess.run(
                  ["git", "merge-base", BASE, "HEAD"],
                  capture_output=True, text=True, check=False,
              ).stdout.strip() or BASE
              before = subprocess.run(
                  ["git", "show", f"{merge_base}:{path}"],
                  capture_output=True, text=True, check=False,
              ).stdout
              now = pathlib.Path(path).read_text(encoding="utf-8")
              return set(pattern.findall(now)) - set(pattern.findall(before))


          references = {}
          for unit in pathlib.Path(".").rglob("terragrunt.hcl"):
              if ".terragrunt-cache" in unit.parts:
                  continue
              for kind, name in REFERENCE.findall(unit.read_text(encoding="utf-8")):
                  references.setdefault((kind, name), set()).add(str(unit))

          problems = []
          for kind, path, pattern in SOURCES:
              for name in added(path, pattern):
                  where = references.get((kind, name))
                  if where:
                      problems.append((f"{kind}:{name}", sorted(where)))

          if problems:
              print("Principals created by this change and referenced by name:\n", file=sys.stderr)
              for reference, units in problems:
                  print(f"  {reference}", file=sys.stderr)
                  for unit in units:
                      print(f"      {unit}", file=sys.stderr)
              print(
                  '\nA plan creates nothing, so the lookup fails before they exist.\n'
                  'Include the dependency and use "group-id:${dependency...}" for a group\n'
                  'or "id:${dependency...}" for a service principal - a bare GUID carries\n'
                  'no type, so the prefix has to.',
                  file=sys.stderr,
              )
              sys.exit(1)

          print("principal references OK")
          __CI_EOF__
          cat >"$d/release-stale-locks.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Releases state locks that a killed GitHub job left behind.

          Terraform locks a state by taking a lease on its blob, and that lease never
          expires. A job that is cancelled or runs out of time while terraform holds it
          leaves the lock behind, and every later plan and apply of that unit fails on
          "Error acquiring the state lock" until someone runs force-unlock.

          A lock is released only when a GitHub runner took it ("Who" is runner@...) and
          it is older than any job is allowed to run, so the job that took it is gone. A
          lock taken on a workstation, or by a job still running, stays.

          A lock whose ID is given on the command line is released whatever its age: for
          a lock known to be dead, such as one left by a run cancelled a moment ago.

          Usage: release-stale-locks.py <storage-account> <container> <minutes> [<lock-id>...]
          """
          import base64
          import datetime
          import json
          import subprocess
          import sys


          def az(*args: str) -> str:
              return subprocess.run(
                  ["az", *args, "--auth-mode", "login", "--only-show-errors"],
                  capture_output=True, text=True, check=True,
              ).stdout


          def main(account: str, container: str, minutes: int, dead: tuple = ()) -> int:
              where = ["--account-name", account, "--container-name", container]
              leased = json.loads(az(
                  "storage", "blob", "list", *where, "--num-results", "*",
                  "--query", "[?properties.lease.state=='leased'].name", "--output", "json",
              ))
              now = datetime.datetime.now(datetime.timezone.utc)
              for name in leased:
                  metadata = json.loads(az(
                      "storage", "blob", "metadata", "show", *where, "--name", name, "--output", "json",
                  )) or {}
                  raw = next((v for k, v in metadata.items() if k.lower() == "terraformlockid"), None)
                  try:
                      info = json.loads(base64.b64decode(raw))
                      # Go writes nanoseconds, which strptime does not take.
                      created = datetime.datetime.strptime(
                          info["Created"][:19], "%Y-%m-%dT%H:%M:%S",
                      ).replace(tzinfo=datetime.timezone.utc)
                  except (TypeError, ValueError, KeyError):
                      print(f"{name}: leased without terraform lock info "
                            f"(metadata keys: {', '.join(metadata) or 'none'}), left alone")
                      continue
                  age = int((now - created).total_seconds() // 60)
                  who = info.get("Who", "")
                  named = info.get("ID") in dead
                  if not named and (not who.startswith("runner@") or age < minutes):
                      print(f"{name}: locked by {who} {age} min ago, left alone")
                      continue
                  az("storage", "blob", "lease", "break", *where, "--blob-name", name)
                  print(f"{name}: released lock {info.get('ID')} ({info.get('Operation')}) "
                        f"taken by {who} {age} min ago" + (", named as dead" if named else ""))
              return 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1], sys.argv[2], int(sys.argv[3]), tuple(sys.argv[4:])))
          __CI_EOF__
          cat >"$d/plan-summary.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns the output of a terragrunt plan into the plan comment of a pull request.

          Usage: plan-summary.py <plan.txt> [options]

          The comment, top to bottom:

            ## 📋 Plan complete            (## ❌ Plan failed on an error, a unit without
                                            a result or a failed check)
            repo · commit · units · ➕ created · ✏️ updated · 🗑️ destroyed · ♻️ replaced
            ### ⚠️ Destroys and replaces   icon | Resource | Name | Unit | Why
            ### Changes                    icon | Resource | Name | What changes | From | To
            imports that change nothing, as one count line
            ### ❌ Errors, ### 🛡️ Security findings   when there are any
            **Status:** security findings, formatting and validation
            **Needed:** what has to happen next (an approval of a destroy, a fix, a merge)
            <details> per unit: what terraform printed, as a diff </details>

          The tables come from the plans in JSON (--json-dir, plan_details.py): one row
          per change that matters, in standard wording. A unit without a JSON plan gets
          one row per resource from the text. The raw plan stays in the run artifact.

          A comment on GitHub holds at most 65 536 characters. When the comment does not
          fit into MAX, the details are shortened (the largest unit first), then left
          out; the tables are never cut while anything else can be. What was cut is said
          at the end.

          The output of run --all is interleaved across units, every line prefixed with
          "[<unit>] terraform:"; the lines are grouped back by unit and the prefix is
          dropped.

          Options:
            --fail-on-change   exit non-zero when the plan proposes anything at all or a
                               unit ended in an error (the gate of the weekly drift job;
                               terragrunt itself returns zero even when there are changes)
            --github-output    write has_changes, has_errors and has_destroys to
                               $GITHUB_OUTPUT; a plan that destroys or replaces is not
                               applied by a push, it waits for a manual run
            --json-dir=<dir>   the plans in JSON, <dir>/<unit>/tfplan.json
            --trivy=<dir>      trivy's JSON reports over those plans, one per unit
            --checks=<list>    results of the checks of the same job, as
                               name=outcome,name=outcome (formatting=success,...)
            --changes-out=<f>  write the entries of the tables as JSON, for the apply
                               comment (apply-summary.py); text only, nothing sensitive
            --artifact=<name>  the artifact the raw plan is in (default plan-$GITHUB_RUN_ID)
            --repo=, --commit= what the heading line names (default $GITHUB_REPOSITORY,
                               $GITHUB_SHA)
            --drift            the weekly drift check: "Drift check" in the heading and
                               no "Needed" line
            --nothing-selected the change selects no unit; plan.txt may be missing
            --no-plan          no plan was produced; plan.txt may be missing

          An import, a move, a forget (a removed block with destroy = false) and a change
          of outputs alone count as a change too: each reaches the state only through
          apply, and dependent units read outputs from there. A unit terragrunt queued
          that printed neither a plan nor an error counts as an error: the run was
          cancelled, or terragrunt failed before terraform started.
          """
          import json
          import os
          import pathlib
          import re
          import sys

          import plan_details
          from plan_details import NONE, code

          RE_UNIT = re.compile(r"\[([^\]]+)\] terraform:")
          RE_PLAN = re.compile(
              r"Plan: (?:(\d+) to import, )?(\d+) to add, (\d+) to change, (\d+) to destroy")
          # The second form is what a destroy plan prints when the state is empty.
          RE_NOOP = re.compile(
              r"No changes\. (?:Your infrastructure matches the configuration"
              r"|No objects need to be destroyed)")
          RE_ERROR = re.compile(r"^\s*Error: (.+)$")
          RE_WARNING = re.compile(r"^\s*Warning: ")
          # The queue terragrunt prints before it starts, one unit per branch of a tree.
          RE_QUEUE = re.compile(r"The following units will be run")
          RE_BRANCH = re.compile(r"^[\s│]*[├╰└]── (\S+)\s*$")
          # The heading terraform puts above each resource in the plan. Headings sit at
          # the left edge; the comments inside a resource are indented deeper.
          RE_RESOURCE = re.compile(
              r"^ {0,2}# (.+?) (will be created|will be updated in-place|will be destroyed"
              r"|(?:is tainted, so )?must be replaced|will be replaced, as requested"
              r"|will be read during apply|will be imported"
              r"|will no longer be managed by Terraform.*|has moved to .+)$"
          )
          RE_IMPORTED = re.compile(r"^ {0,2}# \(imported from ")
          # Terraform indents in steps of four and puts the action symbol two columns
          # in, so a symbol anywhere else is part of a value.
          RE_SIGN = re.compile(r"^( +)([-+~]) ")

          MAX = 60_000
          MAX_ERROR_LINES = 25


          def fenced(lines: list, lang: str = "") -> list:
              """A code block whose fence is longer than any run of backticks inside."""
              longest = max((len(r) for line in lines for r in re.findall(r"`+", line)), default=0)
              fence = "`" * max(3, longest + 1)
              return [fence + lang, *lines, fence]


          def highlight(line: str) -> str:
              """Moves the action symbol to the first column, where a diff block colours it.

              `~` becomes `!`, the marker of a changed line in a diff block. The rest of
              the line keeps its columns.
              """
              m = RE_SIGN.match(line)
              if not m or len(m.group(1)) % 4 != 2:
                  return line
              sign = "!" if m.group(2) == "~" else m.group(2)
              return sign + m.group(1) + line[m.end() - 1:]


          def parse(streams: dict) -> dict:
              """Splits the output of one unit into resources, outputs, errors and the plan line.

              Each stream (STDOUT, STDERR, ...) is read on its own: terraform prints the
              plan to stdout and the errors to stderr, and the two can interleave.
              """
              unit = {"resources": [], "outputs": [], "errors": [], "plan": None}
              for lines in streams.values():
                  mode = None
                  for text in lines:
                      in_block = text[:1].isspace() or text.startswith(("-/+", "+/-"))
                      if mode == "resources" and in_block:
                          if m := RE_RESOURCE.match(text):
                              unit["resources"].append({"address": m.group(1), "what": m.group(2),
                                                        "lines": [text]})
                          elif unit["resources"]:
                              unit["resources"][-1]["lines"].append(text)
                          continue
                      if mode == "outputs" and text[:1].isspace():
                          unit["outputs"].append(text)
                          continue
                      if mode == "error" and not (RE_ERROR.match(text) or RE_WARNING.match(text)):
                          unit["errors"][-1].append(text)
                          continue
                      mode = None
                      if text.startswith("Terraform will perform the following actions:"):
                          mode = "resources"
                      elif text.startswith("Changes to Outputs:"):
                          mode = "outputs"
                          unit["outputs"].append(text)
                      elif text.startswith("Plan: "):
                          unit["plan"] = text[len("Plan: "):].rstrip(".")
                      elif RE_ERROR.match(text):
                          mode = "error"
                          unit["errors"].append([text])
              return unit


          def loose_errors(lines: list, known: set) -> list:
              """Error blocks terragrunt printed outside any unit and no unit reported.

              Terragrunt repeats every failed unit's error in its closing report, so an
              error seen in a unit already is skipped. A block runs to the next empty line.
              """
              blocks = {}
              for i, line in enumerate(lines):
                  m = RE_ERROR.match(line.split("terraform:")[-1])
                  if not m or m.group(1).strip() in known or m.group(1).strip() in blocks:
                      continue
                  indent = len(line) - len(line.lstrip())
                  block = []
                  for follow in lines[i:]:
                      if not follow:
                          break
                      block.append(follow[indent:] if follow[:indent].isspace() else follow.strip())
                  blocks[m.group(1).strip()] = [b.rstrip() for b in block]
              return list(blocks.values())


          def trivy_findings(reports: str) -> list:
              """(unit, severity, id, title, resource) for every failed trivy check.

              Reads every JSON report in the directory, one per unit; the target of a
              result is the plan file as <unit>/tfplan.json.
              """
              if not reports or not os.path.isdir(reports):
                  return []
              found = set()
              for report_path in sorted(pathlib.Path(reports).glob("*.json")):
                  report = json.loads(report_path.read_text(encoding="utf-8") or "{}")
                  for result in report.get("Results") or []:
                      unit = report.get("Unit") or os.path.dirname(result.get("Target", "")) or "?"
                      for m in result.get("Misconfigurations") or []:
                          if m.get("Status") != "FAIL":
                              continue
                          found.add((unit, m.get("Severity", ""), m.get("AVDID") or m.get("ID", ""),
                                     m.get("Title", ""), (m.get("CauseMetadata") or {}).get("Resource", "")))
              return sorted(found)


          def read_output(path: str):
              """units {unit: (add, chg, dst, imp)}, parsed per unit, loose lines, queue, errors."""
              units, errors, streams, loose, queued = {}, [], {}, [], {}
              unit, in_queue = "?", False
              if not path or not os.path.isfile(path):
                  return units, {}, loose, queued, errors
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  if in_queue and (m := RE_BRANCH.match(line)):
                      queued[m.group(1)] = None
                  elif line.strip() != ".":
                      in_queue = bool(RE_QUEUE.search(line))
                  m = RE_UNIT.search(line)
                  if m:
                      unit = m.group(1)
                      label = line[:m.start()].split()
                      stream = label[-1] if label and re.fullmatch(r"[A-Z]+", label[-1]) else ""
                      text = line[m.end():]
                      streams.setdefault(unit, {}).setdefault(stream, []).append(
                          text[1:] if text.startswith(" ") else text)
                  else:
                      loose.append(line)
                  if m := RE_PLAN.search(line):
                      imp, add, chg, dst = (int(g or 0) for g in m.groups())
                      units[unit] = (add, chg, dst, imp)
                  elif RE_NOOP.search(line):
                      units.setdefault(unit, (0, 0, 0, 0))
                  if m := RE_ERROR.match(line.split("terraform:")[-1]):
                      errors.append(m.group(1).strip())
              parsed = {u: parse(s) for u, s in streams.items()}
              # Terraform prints no "Plan:" line when only outputs change.
              for u, p in parsed.items():
                  if p["outputs"]:
                      units.setdefault(u, (0, 0, 0, 0))
              return units, parsed, loose, queued, errors


          def plural(n: int, word: str) -> str:
              return f"{n} {word}{'s' * (n != 1)}"


          def cell(text: str) -> str:
              """Text for a table cell; code spans have their pipes escaped already."""
              text = str(text).replace("\n", " ")
              return text if "`" in text else text.replace("|", "\\|")


          def checks_of(spec: str) -> list:
              """[(name, outcome)] from name=outcome,name=outcome."""
              out = []
              for part in (spec or "").split(","):
                  if "=" in part:
                      name, outcome = part.split("=", 1)
                      out.append((name.strip(), outcome.strip() or "skipped"))
              return out


          def main(path: str, opts: dict) -> int:
              drift = "drift" in opts
              units, parsed, loose, queued, errors = read_output(path)

              # Every resource the plan touches, from JSON where there is one.
              entries, from_json, outputs = [], set(), {}
              for u, p in sorted(parsed.items()):
                  plan_json = pathlib.Path(opts.get("json-dir") or "", u, "tfplan.json")
                  got = None
                  if opts.get("json-dir") and plan_json.is_file():
                      try:
                          plan = plan_details.load(plan_json)
                          got = plan_details.entries(plan, u)
                          outs = [k for k, v in (plan.get("output_changes") or {}).items()
                                  if (v or {}).get("actions") not in (["no-op"], None)]
                          if outs:
                              outputs[u] = outs
                          from_json.add(u)
                      except (ValueError, KeyError, TypeError, AttributeError) as e:
                          print(f"::warning::{u}: the JSON plan could not be read ({e})", file=sys.stderr)
                  if got is None:
                      got = []
                      for r in p["resources"]:
                          imported = any(RE_IMPORTED.match(x) for x in r["lines"])
                          if e := plan_details.text_entry(r["address"], r["what"], u, imported):
                              got.append(e)
                      if p["outputs"]:
                          outputs[u] = ["(see the details)"]
                  entries += got
              entries.sort(key=lambda e: (plan_details.ORDER.get(e["action"], 9), e["unit"],
                                          plan_details.natural(e["address"])))

              count = {a: sum(e["action"] == a for e in entries) for a in plan_details.ICONS}
              count["import"] = sum(e["action"] == "import" or e["imported"] for e in entries)
              destructive = [e for e in entries if e["action"] in ("destroy", "replace")]
              listed = [e for e in entries if e["action"] not in ("destroy", "replace") and not e["noop_import"]]
              noop_imports = {}
              for e in entries:
                  if e["noop_import"]:
                      noop_imports[e["unit"]] = noop_imports.get(e["unit"], 0) + 1

              # Text totals still decide: they count what the JSON might not have.
              whats = [r["what"] for p in parsed.values() for r in p["resources"]]
              text_changes = any(any(t) for t in units.values()) or any(
                  w.startswith(("has moved to ", "will no longer be managed")) for w in whats)
              changes = bool(text_changes or entries or outputs)

              # The same failure (an expired login, say) tends to hit many units at once.
              failed = {}
              for u, p in parsed.items():
                  for block in p["errors"]:
                      failed.setdefault(tuple(block), {})[u] = None
              known = {RE_ERROR.match(b[0]).group(1).strip() for b in failed}
              for block in loose_errors(loose, known):
                  failed.setdefault(tuple(block), {})[None] = None
              missing = [u for u in queued if u not in units and not parsed.get(u, {}).get("errors")]
              checks = checks_of(opts.get("checks", ""))
              bad_checks = [n for n, o in checks if o not in ("success", "skipped")]
              no_plan = "no-plan" in opts or (not parsed and not units and "nothing-selected" not in opts
                                              and not (path and os.path.isfile(path) and os.path.getsize(path)))
              is_failed = bool(failed or missing or bad_checks or no_plan)

              all_units = sorted(set(units) | set(parsed) | set(missing))
              changed_units = sorted({e["unit"] for e in entries} | set(outputs)
                                     | {u for u, t in units.items() if any(t)})
              unchanged = [u for u in all_units if u not in changed_units and u in units]
              many = len({e["unit"] for e in listed}) > 1
              findings = trivy_findings(opts.get("trivy"))

              diffs = {}
              for u in changed_units:
                  p = parsed.get(u)
                  if not p:
                      continue
                  blocks = [r["lines"] for r in p["resources"]]
                  if p["outputs"]:
                      blocks.append(p["outputs"])
                  diffs[u] = [line for i, b in enumerate(blocks)
                              for line in ([""] if i else []) + [highlight(x) for x in b]]

              artifact = opts.get("artifact")
              if artifact is None and os.environ.get("GITHUB_RUN_ID"):
                  artifact = f"plan-{os.environ['GITHUB_RUN_ID']}"
              where = f"artifact {code(artifact)} (plan.txt)" if artifact else "plan.txt"
              repo = opts.get("repo") or os.environ.get("GITHUB_REPOSITORY", "")
              commit = opts.get("commit") or os.environ.get("GITHUB_SHA", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")

              title = "Drift check" if drift else "Plan"
              heading = f"## ❌ {title} failed" if is_failed else f"## 📋 {title} complete"
              line = []
              if repo:
                  line.append(code(repo))
              if commit:
                  line.append(f"[{code(commit[:7])}]({server}/{repo}/commit/{commit})" if repo else code(commit[:7]))
              line.append(plural(len(all_units), "unit"))
              line += [f"➕ {count['create']}", f"✏️ {count['update']}", f"🗑️ {count['destroy']}",
                       f"♻️ {count['replace']}"]
              line += [f"{plan_details.ICONS[a]} {count[a]} {w}" for a, w in
                       (("import", "imported"), ("move", "moved"), ("forget", "forgotten")) if count[a]]

              status = []
              if opts.get("trivy") is not None:
                  status.append(f"🛡️ {plural(len(findings), 'security finding')} (below)" if findings
                                else "🛡️ no security findings")
              if checks:
                  ok = [n for n, o in checks if o == "success"]
                  if ok:
                      status.append("✅ " + " and ".join(ok) + " passed")
                  status += [f"❌ {n} failed" for n in bad_checks]
              if failed or missing:
                  status.append("❌ " + plural(len({u for s in failed.values() for u in s if u} | set(missing))
                                               or 1, "unit") + " without a plan")

              needed = []
              if failed or missing or no_plan:
                  needed.append("fix the errors above; the plan runs again on the next push")
              if bad_checks:
                  needed.append("fix " + " and ".join(bad_checks))
              if findings:
                  needed.append("fix the security findings or accept them in "
                                "`.github/trivyignore.yaml` with the reason")
              if destructive:
                  needed.append("approval of the destroy: after the merge the apply waits, run the "
                                "workflow on `main` by hand with `allow_destroy`")
              if not needed:
                  needed.append("review and merge; the apply on `main` runs by itself" if changes
                                else "nothing; merging applies nothing")

              def render(shown: dict, details: bool = True, compact: bool = False, cap=None,
                         error_lines=None) -> str:
                  out = [heading, "", " · ".join(line), ""]

                  if destructive:
                      out += ["### ⚠️ Destroys and replaces", "",
                              "| | Resource | Name | Unit | Why |", "|---|---|---|---|---|"]
                      out += [f"| {e['icon']} | {e['kind']} | {code(e['name'])} | {code(e['unit'])} "
                              f"| {cell(e['why']) or NONE} |" for e in destructive]
                      out.append("")

                  rows = []
                  for e in listed:
                      name = code(e["name"]) + (f"<br><sub>{code(e['unit'])}</sub>" if many else "")
                      those = e["rows"]
                      if compact and len(those) > 1:
                          those = [(f"{plural(len(those), 'change')}, see the details", NONE, NONE)]
                      for what, frm, to in those:
                          rows.append(f"| {e['icon']} | {e['kind']} | {name} | {cell(what)} | {frm} | {to} |")
                  if rows or not destructive:
                      out += ["### Changes", ""]
                  if rows:
                      out += ["| | Resource | Name | What changes | From | To |",
                              "|---|---|---|---|---|---|"]
                      out += rows[:cap] if cap is not None else rows
                      if cap is not None and cap < len(rows):
                          out.append(f"| | | | _{len(rows) - cap} more rows, see {where}_ | | |")
                      out.append("")
                  elif not destructive and not noop_imports:
                      if outputs:
                          out += ["Only output values change, in " + ", ".join(code(u) for u in outputs)
                                  + ".", ""]
                      elif "nothing-selected" in opts:
                          out += ["Nothing to plan: the change selects no unit.", ""]
                      elif not is_failed:
                          out += ["None: the plan matches what is deployed.", ""]
                      else:
                          out += ["No plan to show.", ""]
                  if noop_imports:
                      n = sum(noop_imports.values())
                      out += [f"📥 **Imported without a change:** {n} — "
                              + ", ".join(f"{code(u)} ({c})" for u, c in sorted(noop_imports.items())) + ".", ""]

                  if is_failed and (failed or missing or no_plan):
                      out += ["### ❌ Errors", ""]
                      if no_plan and not failed and not missing:
                          out += [f"No plan was produced, see the run log and {where}.", ""]
                      if missing:
                          out += ["**Without a result:** " + ", ".join(code(u) for u in missing), "",
                                  "Queued, but neither a plan nor an error came out: the run was "
                                  "cancelled, or terragrunt failed before terraform started.", ""]
                      for block, sources in failed.items():
                          names = [code(u) for u in sources if u is not None]
                          if None in sources:
                              names.append("outside a unit")
                          body = list(block)
                          if error_lines is not None and len(body) > error_lines:
                              body = body[:error_lines] + [f"... {len(block) - error_lines} more lines"]
                          out += [f"**{', '.join(names)}**", ""] + fenced(body) + [""]

                  if findings:
                      out += ["### 🛡️ Security findings", "",
                              "trivy over the plan, HIGH and CRITICAL. A finding that is accepted "
                              "goes into `.github/trivyignore.yaml` with the reason.", "",
                              "| Unit | Severity | Check | Resource |", "|---|---|---|---|"]
                      out += [f"| {code(u)} | {sev} | {cell(cid)}: {cell(title_)} | {code(res) if res else ''} |"
                              for u, sev, cid, title_, res in findings]
                      out.append("")

                  if status:
                      out += ["**Status:** " + " · ".join(status), ""]
                  if not drift:
                      out += ["**Needed:** " + "; ".join(needed) + ".", ""]

                  cut_notes = []
                  body = []
                  for u in changed_units:
                      lines = diffs.get(u) or []
                      if not lines:
                          continue
                      p = parsed[u]
                      n = shown.get(u, len(lines))
                      body.append(f"#### {code(u)}" + (f" ({p['plan']})" if p["plan"] else ""))
                      body.append("")
                      if n == 0:
                          body += ["_Left out, the comment would be too long._", ""]
                          cut_notes.append(code(u))
                          continue
                      text = lines[:n]
                      while text and not text[-1]:
                          text.pop()
                      body += fenced(text, "diff")
                      if n < len(lines):
                          body += ["", f"_{len(lines) - n} of {len(lines)} lines left out._"]
                          cut_notes.append(code(u))
                      body.append("")
                  if unchanged:
                      body.append(f"**{plural(len(unchanged), 'unit')} without a change:** "
                                  + ", ".join(code(u) for u in unchanged))
                      body.append("")
                  if body and details:
                      out += ["<details><summary>Details per unit</summary>", ""] + body + ["</details>", ""]

                  notes = []
                  if not details and body:
                      notes.append("the details per unit are left out")
                  elif cut_notes:
                      notes.append("the details of " + ", ".join(cut_notes) + " are shortened")
                  if compact:
                      notes.append("resources with several changes are one row each")
                  if error_lines is not None and any(len(b) > error_lines for b in failed):
                      notes.append("long error messages are shortened")
                  if notes:
                      out.append(f"_Cut to fit a comment: {'; '.join(notes)}. The full plan is in {where}._")
                  else:
                      out.append(f"_The raw plan is in {where}._")
                  return "\n".join(out)

              # The details go first, from the largest unit down: as much of the
              # largest as the overflow needs, then the next one if that was not enough.
              shown = {}
              text = render(shown)
              for u in sorted(diffs, key=lambda u: -sum(len(x) + 1 for x in diffs[u])):
                  n = len(diffs[u])
                  while n and len(text) > MAX:
                      over = len(text) - MAX
                      while n and over > 0:
                          n -= 1
                          over -= len(diffs[u][n]) + 1
                      shown[u] = n
                      text = render(shown)
              attempts = [dict(details=False), dict(details=False, error_lines=MAX_ERROR_LINES),
                          dict(details=False, error_lines=MAX_ERROR_LINES, compact=True)]
              for kwargs in attempts:
                  if len(text) <= MAX:
                      break
                  text = render(shown, **kwargs)
              if len(text) > MAX:
                  # Last of all the rows of the changes table; the destroys stay whole.
                  lo, hi = 0, len(listed) * 50
                  while lo < hi:
                      mid = (lo + hi + 1) // 2
                      if len(render(shown, details=False, error_lines=MAX_ERROR_LINES, compact=True,
                                    cap=mid)) <= MAX:
                          lo = mid
                      else:
                          hi = mid - 1
                  text = render(shown, details=False, error_lines=MAX_ERROR_LINES, compact=True, cap=lo)
              if len(text) > MAX:
                  text = cut(text, MAX, where)
              print(text)

              if out_path := opts.get("changes-out"):
                  pathlib.Path(out_path).write_text(json.dumps({
                      "repo": repo, "commit": commit, "units": all_units, "entries": entries,
                      "noop_imports": noop_imports, "failed": is_failed,
                  }, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")

              if "github-output" in opts and (path_out := os.environ.get("GITHUB_OUTPUT")):
                  with open(path_out, "a", encoding="utf-8") as fh:
                      fh.write(f"has_changes={str(changes).lower()}\n")
                      fh.write(f"has_errors={str(bool(errors or missing)).lower()}\n")
                      has_destroys = bool(destructive) or any(
                          r["what"] == "will be destroyed" or "replaced" in r["what"]
                          for p in parsed.values() for r in p["resources"])
                      fh.write(f"has_destroys={str(has_destroys).lower()}\n")

              if "fail-on-change" in opts and (changes or errors or missing):
                  totals = ", ".join(f"{count[a]} {w}" for a, w in (
                      ("create", "to create"), ("update", "to update"), ("destroy", "to destroy"),
                      ("replace", "to replace"), ("import", "to import"), ("move", "to move"),
                      ("forget", "to forget")) if count[a] or a in ("create", "update", "destroy"))
                  if outputs:
                      totals += f", outputs change in {plural(len(outputs), 'unit')}"
                  print(f"\nDRIFT: {totals}, {plural(len(errors), 'error')}"
                        + (f", {plural(len(missing), 'unit')} without a result" if missing else "") + ".",
                        file=sys.stderr)
                  return 1
              return 0


          def cut(text: str, limit: int, where: str) -> str:
              """Last resort when even the shortest form is too long.

              Cuts whole lines from the end and closes a code block left open.
              """
              note = f"\n\n_Cut off to fit a comment; the full plan is in {where}._"
              kept, size, fence = [], 0, None
              for line in text.split("\n"):
                  after = fence
                  if m := re.match(r"^(`{3,})", line):
                      if fence is None:
                          after = m.group(1)
                      elif line.strip() == fence:
                          after = None
                  if size + len(line) + 1 + (len(after) + 1 if after else 0) + len(note) > limit:
                      break
                  kept.append(line)
                  size += len(line) + 1
                  fence = after
              if fence:
                  kept.append(fence)
              return "\n".join(kept) + note


          if __name__ == "__main__":
              args = sys.argv[1:]
              paths = [a for a in args if not a.startswith("--")]
              opts = {}
              for a in args:
                  if a.startswith("--"):
                      key, _, value = a[2:].partition("=")
                      opts[key] = value
              sys.exit(main(paths[0] if paths else "", opts))
          __CI_EOF__
          cat >"$d/apply-summary.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Turns the output of a terragrunt apply into the apply comment of the merged pull request.

          Usage: apply-summary.py <apply.txt> --changes=<changes.json> [options]

          The comment, top to bottom:

            ## ✅ Apply complete            (## ❌ Apply failed when the apply job did not
                                             succeed or any resource failed)
            repo · merge commit · units · duration · run
            icon | Resource | Name | What happened | Result
            imports that changed nothing, as one count line
            ### ❌ Errors                   when there are any
            ### Verification               what the post-apply checks reported

          What was meant to happen comes from changes.json, the entries the plan job of
          the same run wrote (plan-summary.py --changes-out): the apply runs the plan's
          selection, so the rows are the rows of the plan comment, in the past tense.
          What did happen comes from the apply output, per resource: a "... complete"
          line is done, an error "with <address>" is failed. A unit that finished
          ("Apply complete!") has applied everything it planned, moves and imports
          included; a unit that failed leaves the rest of its resources not applied; a
          unit that never started is not run.

          The Verification section is filled from --verification=<dir>: every *.md file
          in it, in name order, as it is. A post-apply check writes its result there as
          markdown (a table | Check | Result | Detail | is the convention, see the
          README) and uploads it as an artifact named verification-<run id>[-<name>];
          the report job downloads all of them before it renders. Without any, the
          section says that no check has reported.

          Options:
            --changes=<f>       changes.json of the plan job
            --verification=<d>  directory of the post-apply checks' markdown
            --outcome=<r>       result of the apply job (success, failure, cancelled)
            --started=<epoch>, --ended=<epoch>  when the apply job ran
            --repo=, --commit=  what the heading line names (default $GITHUB_REPOSITORY,
                                $GITHUB_SHA)
          """
          import json
          import os
          import pathlib
          import re
          import sys

          MAX = 60_000
          MAX_ERROR_LINES = 25
          NONE = "—"
          RE_UNIT = re.compile(r"\[([^\]]+)\] terraform:")
          RE_DONE = re.compile(r"^(\S.*?): (Creation|Modifications|Destruction|Import) complete")
          RE_START = re.compile(r"^(\S.*?): (Creating|Modifying|Destroying|Importing|Reading)\.\.\.")
          RE_UNIT_DONE = re.compile(r"^(?:Apply|Destroy) complete! Resources:")
          RE_ERROR = re.compile(r"^\s*Error: (.+)$")
          RE_WARNING = re.compile(r"^\s*Warning: ")
          RE_WITH = re.compile(r"^\s*with (\S+?),\s*$")


          def code(text) -> str:
              text = str(text).replace("|", "\\|")
              tick = "``" if "`" in text else "`"
              pad = " " if tick == "``" else ""
              return f"{tick}{pad}{text}{pad}{tick}"


          def fenced(lines: list) -> list:
              longest = max((len(r) for line in lines for r in re.findall(r"`+", line)), default=0)
              fence = "`" * max(3, longest + 1)
              return [fence, *lines, fence]


          def plural(n: int, word: str) -> str:
              return f"{n} {word}{'s' * (n != 1)}"


          def duration(start: str, end: str) -> str:
              try:
                  s = int(end) - int(start)
              except (TypeError, ValueError):
                  return ""
              if s < 0:
                  return ""
              return f"{s // 60} min {s % 60} s" if s >= 60 else f"{s} s"


          def read_apply(path: str) -> dict:
              """Per unit: resources done, failed (address -> error), error blocks, finished."""
              units = {}
              if not path or not os.path.isfile(path):
                  return units
              modes = {}
              for line in open(path, encoding="utf-8", errors="replace"):
                  line = line.rstrip("\n")
                  m = RE_UNIT.search(line)
                  if not m:
                      continue
                  unit = m.group(1)
                  label = line[:m.start()].split()
                  stream = label[-1] if label and re.fullmatch(r"[A-Z]+", label[-1]) else ""
                  text = line[m.end():]
                  text = text[1:] if text.startswith(" ") else text
                  u = units.setdefault(unit, {"done": set(), "started": set(), "failed": {},
                                              "errors": [], "finished": False})
                  key = (unit, stream)
                  if modes.get(key) == "error" and not (RE_ERROR.match(text) or RE_WARNING.match(text)):
                      u["errors"][-1].append(text)
                      if w := RE_WITH.match(text):
                          u["failed"][w.group(1)] = RE_ERROR.match(u["errors"][-1][0]).group(1).strip()
                      continue
                  modes[key] = None
                  if d := RE_DONE.match(text):
                      u["done"].add(d.group(1))
                  elif s := RE_START.match(text):
                      u["started"].add(s.group(1))
                  elif RE_UNIT_DONE.match(text):
                      u["finished"] = True
                  elif RE_ERROR.match(text):
                      modes[key] = "error"
                      u["errors"].append([text])
              return units


          def past(what: str, frm: str, to: str) -> str:
              """A row of the plan comment, said of what happened."""
              if what.startswith("updated"):
                  return "updated"
              if frm == "(sensitive)" or to == "(sensitive)":
                  return f"{what} changed (sensitive)"
              if frm != NONE or to != NONE:
                  return f"{what} changed: {frm} → {to}"
              return what


          def result(entry: dict, units: dict, outcome: str) -> str:
              u = units.get(entry["unit"])
              if u is None:
                  return "⏭️ not run"
              if entry["address"] in u["failed"]:
                  return "❌ failed: " + u["failed"][entry["address"]].replace("|", "\\|")
              if entry["address"] in u["done"] or u["finished"]:
                  return "✅ done"
              if u["errors"] or entry["address"] in u["started"] or outcome != "success":
                  return "⏭️ not applied"
              return "✅ done"


          def main(path: str, opts: dict) -> int:
              changes = {}
              if opts.get("changes") and os.path.isfile(opts["changes"]):
                  changes = json.loads(pathlib.Path(opts["changes"]).read_text(encoding="utf-8"))
              entries = [e for e in changes.get("entries", []) if not e.get("noop_import")]
              noop_imports = changes.get("noop_imports") or {}
              outcome = opts.get("outcome") or "success"
              units = read_apply(path)

              results = [(e, result(e, units, outcome)) for e in entries]
              any_failed = any(r.startswith("❌") for _, r in results) or any(
                  u["errors"] for u in units.values())
              ok = outcome == "success" and not any_failed

              repo = opts.get("repo") or changes.get("repo") or os.environ.get("GITHUB_REPOSITORY", "")
              commit = opts.get("commit") or os.environ.get("GITHUB_SHA", "")
              server = os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              run_id = os.environ.get("GITHUB_RUN_ID", "")
              planned = changes.get("units") or sorted(units)
              applied = sorted({e["unit"] for e in entries} | set(units))

              line = []
              if repo:
                  line.append(code(repo))
              if commit:
                  line.append(f"merge [{code(commit[:7])}]({server}/{repo}/commit/{commit})"
                              if repo else code(commit[:7]))
              line.append(plural(len(applied or planned), "unit"))
              if took := duration(opts.get("started"), opts.get("ended")):
                  line.append(f"⏱️ {took}")
              if run_id and repo:
                  line.append(f"[run]({server}/{repo}/actions/runs/{run_id})")

              many = len({e["unit"] for e in entries}) > 1
              rows = []
              for e, res in results:
                  name = code(e["name"]) + (f"<br><sub>{code(e['unit'])}</sub>" if many else "")
                  for what, frm, to in e["rows"] or [("changed", NONE, NONE)]:
                      rows.append(f"| {e['icon']} | {e['kind']} | {name} | {past(what, frm, to)} | {res} |")

              failed_blocks = {}
              for unit, u in units.items():
                  for block in u["errors"]:
                      failed_blocks.setdefault(tuple(block), []).append(unit)

              verification = []
              vdir = opts.get("verification")
              if vdir and os.path.isdir(vdir):
                  for f in sorted(pathlib.Path(vdir).rglob("*.md")):
                      text = f.read_text(encoding="utf-8").strip()
                      if text:
                          verification.append(text)

              def render(cap=None, error_lines=None) -> str:
                  out = ["## ✅ Apply complete" if ok else "## ❌ Apply failed", "", " · ".join(line), ""]
                  if rows:
                      out += ["| | Resource | Name | What happened | Result |", "|---|---|---|---|---|"]
                      out += rows[:cap] if cap is not None else rows
                      if cap is not None and cap < len(rows):
                          out.append(f"| | | | _{len(rows) - cap} more rows, see the run log_ | |")
                      out.append("")
                  elif not noop_imports:
                      out += ["Nothing was planned to change." if outcome == "success"
                              else "No plan of this run to compare with, see the run log.", ""]
                  if noop_imports:
                      n = sum(noop_imports.values())
                      out += [f"📥 **Imported without a change:** {n} — "
                              + ", ".join(f"{code(u)} ({c})" for u, c in sorted(noop_imports.items())) + ".", ""]
                  if failed_blocks or outcome != "success":
                      out += ["### ❌ Errors", ""]
                      if not failed_blocks:
                          out += [f"The apply job ended as `{outcome}` without an error from terraform; "
                                  "see the run log.", ""]
                      for block, names in failed_blocks.items():
                          body = list(block)
                          if error_lines is not None and len(body) > error_lines:
                              body = body[:error_lines] + [f"... {len(block) - error_lines} more lines"]
                          out += [f"**{', '.join(code(u) for u in names)}**", ""] + fenced(body) + [""]
                  out += ["### Verification", ""]
                  out += ["\n\n".join(verification) if verification
                          else "_No post-apply check has reported._", ""]
                  notes = []
                  if error_lines is not None:
                      notes.append("long error messages are shortened")
                  if cap is not None and cap < len(rows):
                      notes.append(f"{len(rows) - cap} rows of the table are left out")
                  if notes:
                      out.append(f"_Cut to fit a comment: {'; '.join(notes)}. The full output is in the "
                                 "run log._")
                  return "\n".join(out).rstrip() + "\n"

              text = render()
              if len(text) > MAX:
                  text = render(error_lines=MAX_ERROR_LINES)
              if len(text) > MAX:
                  lo, hi = 0, len(rows)
                  while lo < hi:
                      mid = (lo + hi + 1) // 2
                      if len(render(cap=mid, error_lines=MAX_ERROR_LINES)) <= MAX:
                          lo = mid
                      else:
                          hi = mid - 1
                  text = render(cap=lo, error_lines=MAX_ERROR_LINES)
              sys.stdout.write(text)
              return 0


          if __name__ == "__main__":
              args = sys.argv[1:]
              paths = [a for a in args if not a.startswith("--")]
              opts = {}
              for a in args:
                  if a.startswith("--"):
                      key, _, value = a[2:].partition("=")
                      opts[key] = value
              sys.exit(main(paths[0] if paths else "", opts))
