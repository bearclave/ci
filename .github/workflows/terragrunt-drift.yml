# GENERATED by tools/build.py from templates/terragrunt-drift.yml - edit the template or src/, not this file.
# A plan over the whole tree, once a week, for a repository that uses
# terragrunt.yml. Anything it proposes means either something was changed
# outside the code, or the code does not converge. Either way the run has to
# be red.
#
# The main pipeline only plans the units a change touches, and that selection
# does not pull in units that DEPEND on a changed one. This is what catches
# those.
#
# The caller owns the schedule and shares its concurrency group with the push
# runs of ci.yml: the plan here locks the state too, and a drift plan in the
# middle of an apply would read a half-applied state.
#
# It runs as the read-only plan identity, federated on main (a scheduled run
# runs on main): a drift check only reads, and the identity that writes is
# federated on the apply job's environment alone. In iac-github that is the
# read-only GitHub App as well.
#
#   jobs:
#     drift:
#       uses: bearclave/ci/.github/workflows/terragrunt-drift.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#         github-app-vault: kv-githubro-sec-weu-001   # iac-github only
#       secrets:
#         modules-deploy-key: ${{ secrets.MODULES_DEPLOY_KEY }}
name: terragrunt-drift

on:
  workflow_call:
    inputs:
      client-id:
        description: The read-only plan identity (AZURE_CLIENT_ID_PLAN), federated on main
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        default: ""
      analytic-rules-path:
        description: Unit of the Sentinel analytic rules; rules in the workspace but not in code are reported
        type: string
        default: ""
      github-app-vault:
        description: Key Vault with the read-only GitHub App (iac-github)
        type: string
        default: ""
      modules-repository:
        description: The repository of the Terraform modules the units take their source from (a rename of it is this default)
        type: string
        default: bearclave/iac-modules
    secrets:
      modules-deploy-key:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  MODULES_REPO: ${{ inputs.modules-repository }}
  MODULES_DIR: ${{ github.workspace }}/modules-repo
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ inputs.tenant-id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
  # A run queued from any other branch than main gets no token: the identity
  # is federated on main.
  ARM_CLIENT_ID: ${{ inputs.client-id }}
  GITHUB_APP_VAULT: ${{ inputs.github-app-vault }}

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history says when imports.hcl and moves.hcl were added.
          fetch-depth: 0
          persist-credentials: false

      # Terragrunt cannot authenticate its own git against a private repository,
      # so the modules go on disk and TG_SOURCE_MAP points there. The map drops
      # the ?ref= of a source, so the checkout itself takes modules_ref.
      - name: Modules ref
        id: modules-ref
        run: |
          ref=$(sed -nE 's/^[[:space:]]*modules_ref[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' account.hcl | head -n1)
          if ! printf '%s' "$ref" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error file=account.hcl::no valid modules_ref in account.hcl"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.MODULES_REPO }}
          path: modules-repo
          ref: ${{ steps.modules-ref.outputs.ref }}
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # Every Terragrunt script, for terragrunt-drift.yml, whose one job runs most
      # of them. The jobs of terragrunt-jobs.yml include only the fragments they
      # need (scripts-select.yml says why).
      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint terraform-docs
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          install_terraform_docs() {
            [ -x "$BIN/terraform-docs" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
                  "$TERRAFORM_DOCS_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" terraform-docs && mv "$t/terraform-docs" "$BIN/"
          }

          for tool in "$@"; do
            "install_${tool//-/_}"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      # The scripts of the select job (terragrunt-jobs.yml). Every job of the
      # pipeline carries only the scripts it runs: GitHub rejects a workflow file
      # that is too large when it reads .github/workflows on a push to ci (#48).
      - name: Selection scripts
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/select-units.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Works out from git which units a change touches.

          Usage: select-units.py <base> [--no-expand] [--push] [--moves=<state-moves.json>]

          Compares <base> with HEAD and prints one JSON object:

            all      true when the whole tree has to run
            units    the units to run when not the whole tree, with everything they
                     depend on; --no-expand leaves the dependencies out
            deleted  units whose directory is gone: they only exist in <base> and are
                     planned, and applied, as a destroy from there
            moved    [old, new] pairs of a unit directory whose state went with it:
                     its state key (the path without "infrastructure/") is unchanged,
                     or .github/state-moves.yaml lists the move. The new path is
                     planned, the old one is not destroyed, and the plan of the new
                     path may create and destroy nothing (check-moves.py)
            renamed  [old, new] pairs of a unit directory that moved without its
                     state; the workflow refuses them
            excluded units of HEAD whose exclude block keeps them out of a plan (a
                     device not under Terraform yet): terragrunt skips them, the lock
                     file check too
            base     the commit compared against, or null when there was none to use

          <state-moves.json> is .github/state-moves.yaml as JSON (yq):
          {"moves": [{"from": <state key>, "to": <state key>}]}. A key is the unit
          path with the "infrastructure/" prefix trimmed. `to` may be a new unit (the
          owner copied the state blob) or an existing one (the owner moved the
          resources into its state). An entry whose `from` is not a unit gone in this
          change is ignored (it is stale once merged); one whose `to` is no unit fails.

          What decides the selection:

          - root.hcl and account.hcl touch every unit: the whole tree runs.
          - A file under _common/ selects the units that include or read it, as
            `terragrunt find --reading --include` reports them; one that no unit
            reports (a template, a script, a deleted file), or a tree terragrunt
            cannot read, runs the whole tree.
          - A context file (CONTEXT) applies to the unit in its own directory, every
            unit below it, and any other unit that reads it.
          - Any other file belongs to the nearest unit above it: the <key>.yaml of a
            collection, in a subfolder or not, plans its collection unit, a Logic App
            definition.json or workflows/<name>/workflow.json its Logic App. A file of
            a deleted unit belongs to nobody - that unit runs as a destroy.
          - A file outside every unit (the workflows, the scripts) changes how the tree
            is planned, so when nothing else is touched the whole tree runs - except
            what never reaches a plan (the same as changes.py): .claude/, Markdown,
            and .github/ but its workflows, tool-versions.env and trivyignore.yaml.
            With --push (the push of a merge) such a change selects nothing instead:
            the pull request planned the whole tree with the same workflows and nothing
            of a unit changed, so there is nothing to apply. Anything else that is in
            the change (a unit, a context file) is selected as usual.
          - No usable <base> (unknown, not an ancestor of HEAD) or no difference at all
            means the whole tree.

          What stays out are the units that DEPEND on a changed one: if the groups unit
          changes and memberships stands on its outputs, this selection will not run
          memberships. That is what the weekly drift job over the whole tree is for.
          """
          import json
          import os
          import subprocess
          import sys

          CONTEXT = {"mg.hcl", "subscription.hcl", "region.hcl", "rg.hcl", "device.hcl", "workspace.hcl"}
          UNIT = "terragrunt.hcl"
          CONTENT = "infrastructure/"
          # What under .github/ changes a plan (changes.py has the same list).
          PLAN_INPUTS = (".github/workflows/", ".github/tool-versions.env", ".github/trivyignore.yaml")


          def no_plan_impact(path: str) -> bool:
              """A file outside every unit that cannot change how the tree is planned."""
              if path.startswith(".claude/") or path.lower().endswith(".md"):
                  return True
              return path.startswith(".github/") and not path.startswith(PLAN_INPUTS)


          def key(unit: str) -> str:
              """The state key of a unit: its path without the content folder."""
              return unit[len(CONTENT):] if unit.startswith(CONTENT) else unit


          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=check)


          def unit_dirs(ref: str) -> set:
              """Every directory that holds a terragrunt.hcl at the given commit."""
              files = git("ls-tree", "-r", "--name-only", ref).stdout.splitlines()
              return {f[: -len(UNIT) - 1] for f in files if f.endswith("/" + UNIT)}


          def owner(path: str, units: set) -> str:
              """The nearest unit directory above the path, or None."""
              d = os.path.dirname(path)
              while d:
                  if d in units:
                      return d
                  d = os.path.dirname(d)
              return None


          class Graph:
              """The units of HEAD as terragrunt sees them, asked for once and only if needed."""

              def __init__(self):
                  self._units = None

              def units(self) -> list:
                  if self._units is None:
                      out = subprocess.run(
                          ["terragrunt", "find", "--json", "--dependencies", "--reading", "--include", "--exclude"],
                          capture_output=True, text=True, check=True).stdout
                      found = json.loads(out or "[]")
                      found = found if isinstance(found, list) else found.get("units", [])
                      self._units = [u for u in found if u.get("type") == "unit"]
                  return self._units

              def excluded(self) -> list:
                  """Units an exclude block keeps out of a plan."""
                  out = []
                  for u in self.units():
                      ex = u.get("exclude") or {}
                      if ex.get("if") is True and {"all", "plan"} & set(ex.get("actions") or []):
                          out.append(u["path"])
                  return sorted(out)

              def readers(self, path: str) -> set:
                  """Units that include or read the file."""
                  out = set()
                  for u in self.units():
                      files = list(u.get("reading") or []) + list((u.get("include") or {}).values())
                      if any(os.path.normpath(os.path.relpath(f) if os.path.isabs(f) else f) == path
                             for f in files):
                          out.add(u["path"])
                  return out

              def expand(self, selected: list) -> list:
                  """The units plus everything they depend on, transitively.

                  --queue-include-dir runs exactly the directories it is handed;
                  terragrunt does not pull a unit's dependencies into the queue, and a
                  key vault came to be created before its resource group that way.
                  """
                  deps = {u["path"]: u.get("dependencies") or [] for u in self.units()}
                  closure, queue = set(), list(selected)
                  while queue:
                      unit = queue.pop()
                      if unit not in closure:
                          closure.add(unit)
                          queue.extend(deps.get(unit, []))
                  return sorted(closure)


          def read_moves(path: str) -> dict:
              """{from key: to key} from the JSON form of .github/state-moves.yaml."""
              if not path or not os.path.isfile(path):
                  return {}
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh) or {}
              moves, problems = {}, []
              entries = data.get("moves") if isinstance(data, dict) else None
              if not isinstance(entries, list):
                  entries, problems = [], ["moves: a list of {from, to} is expected"] if data else []
              for k, e in enumerate(entries, 1):
                  src, dst = (e or {}).get("from"), (e or {}).get("to")
                  if not (isinstance(src, str) and src and isinstance(dst, str) and dst):
                      problems.append(f"entry {k}: from and to must both be state keys")
                  elif src.startswith(CONTENT) or dst.startswith(CONTENT) or src.endswith(".tfstate") \
                          or dst.endswith(".tfstate"):
                      problems.append(f"entry {k}: a state key has no {CONTENT} prefix and no file name")
                  elif src == dst:
                      problems.append(f"entry {k}: from and to are the same")
                  elif src in moves:
                      problems.append(f"entry {k}: {src} is moved twice")
                  else:
                      moves[src.strip("/")] = dst.strip("/")
              if problems:
                  sys.exit("state-moves.yaml: " + "; ".join(problems))
              return moves


          def select(base: str, do_expand: bool = True, moves_file: str = "", graph=None, push: bool = False) -> dict:
              graph = graph or Graph()
              result = {"all": False, "units": [], "deleted": [], "moved": [], "renamed": [], "excluded": [],
                        "base": None}
              moves = read_moves(moves_file)
              try:
                  result["excluded"] = graph.excluded()
              except (OSError, subprocess.CalledProcessError, ValueError):
                  pass

              usable = (base and git("cat-file", "-e", f"{base}^{{commit}}", check=False).returncode == 0
                        and git("merge-base", "--is-ancestor", base, "HEAD", check=False).returncode == 0)
              if not usable:
                  result["all"] = True
                  return result
              result["base"] = git("rev-parse", f"{base}^{{commit}}").stdout.strip()

              head_units = unit_dirs("HEAD")
              base_units = unit_dirs(base)
              gone = base_units - head_units
              by_key = {key(u): u for u in head_units}

              changes = []
              for line in git("diff", "--name-status", "-M", base, "HEAD").stdout.splitlines():
                  status, *paths = line.split("\t")
                  changes.append((status[0], paths))
              if not changes:
                  result["all"] = True
                  return result

              # A unit whose state went with it: the same key, or a listed move.
              selected, moved_from = set(), set()
              for old in sorted(gone):
                  target = moves.get(key(old), key(old))
                  new = by_key.get(target)
                  if key(old) in moves and not new:
                      sys.exit(f"state-moves.yaml: {key(old)} moves to {target}, which is no unit")
                  if new and new != old and (target != key(old) or new not in base_units):
                      result["moved"].append([old, new])
                      moved_from.add(old)
                      selected.add(new)

              shared, outside = set(), False
              for status, paths in changes:
                  if status == "R":
                      old, new = paths
                      if old.endswith("/" + UNIT) and new.endswith("/" + UNIT):
                          old_dir, new_dir = os.path.dirname(old), os.path.dirname(new)
                          if old_dir in gone - moved_from and new_dir not in base_units:
                              result["renamed"].append([old_dir, new_dir])
                  for path in paths:
                      if path in ("root.hcl", "account.hcl"):
                          result["all"] = True
                          continue
                      if path.startswith("_common/"):
                          shared.add(path)
                          continue
                      if os.path.basename(path) in CONTEXT:
                          here = os.path.dirname(path)
                          selected |= {u for u in head_units if u == here or u.startswith(here + "/")}
                          shared.add(path)
                          continue
                      if path.endswith("/" + UNIT) and os.path.dirname(path) in gone:
                          continue
                      unit = owner(path, head_units | gone)
                      if unit in head_units:
                          selected.add(unit)
                      elif unit is None and not no_plan_impact(path):
                          outside = True

              renamed_old = {old for old, _ in result["renamed"]}
              result["deleted"] = sorted(gone - renamed_old - moved_from)
              if result["all"]:
                  return result
              for path in sorted(shared):
                  common = path.startswith("_common/")
                  if common and not os.path.isfile(path):
                      result["all"] = True
                      return result
                  try:
                      readers = graph.readers(path)
                  except (OSError, subprocess.CalledProcessError, ValueError):
                      if not common:
                          continue
                      readers = set()
                  if common and not readers:
                      result["all"] = True
                      return result
                  selected |= readers & head_units
              if not selected:
                  # Only the workflows or the scripts changed (they change how
                  # everything is planned), only what never reaches a plan, or only
                  # units were deleted.
                  result["all"] = outside and not push
                  return result
              if selected >= head_units:
                  result["all"] = True
                  return result
              result["units"] = graph.expand(sorted(selected)) if do_expand else sorted(selected)
              return result


          if __name__ == "__main__":
              args = [a for a in sys.argv[1:] if not a.startswith("--")]
              moves_arg = next((a.split("=", 1)[1] for a in sys.argv[1:] if a.startswith("--moves=")), "")
              print(json.dumps(select(args[0] if args else "", "--no-expand" not in sys.argv, moves_arg,
                                      push="--push" in sys.argv)))
          __CI_EOF__
          cat >"$d/base-commit.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """The commit a run on main compares against: the head of the last run whose apply went through.

          Usage: base-commit.py <repository> <workflow file>

          Prints the head commit of the newest run on main (a push or a manual run)
          that either

          - succeeded as a whole: its apply went through, or there was nothing to
            apply, or nothing relevant changed; or
          - failed after its apply succeeded: the job `apply` passed and only the
            verification (or the report) behind it failed. What it applied is in the
            state; comparing with the commit before it would select its units again
            and refuse a move of state that has already happened.

          A run whose apply failed, was held back (destroys without approval) or never
          started does not count, so the units it left out stay selected. Prints
          nothing when no such run is found: the whole tree runs then.

          Reads the runs and their jobs through `gh api` (GH_TOKEN, actions: read).
          """
          import json
          import subprocess
          import sys

          RUNS = 50
          JOB_LOOKUPS = 20


          def gh(path: str):
              out = subprocess.run(["gh", "api", path], capture_output=True, text=True, check=True).stdout
              return json.loads(out or "{}")


          def applied(jobs: list) -> bool:
              """The job apply of the run (named `<caller job> / apply` in a reusable workflow) passed."""
              return any((j.get("name") == "apply" or str(j.get("name", "")).endswith(" / apply"))
                         and j.get("conclusion") == "success" for j in jobs)


          def pick(runs: list, jobs_of) -> str:
              lookups = 0
              for run in runs:
                  if run.get("event") not in ("push", "workflow_dispatch") or run.get("status") != "completed":
                      continue
                  if run.get("conclusion") == "success":
                      return run["head_sha"]
                  if run.get("conclusion") != "failure" or lookups >= JOB_LOOKUPS:
                      continue
                  lookups += 1
                  if applied(jobs_of(run["id"])):
                      return run["head_sha"]
              return ""


          def main(repo: str, workflow: str) -> int:
              runs = gh(f"repos/{repo}/actions/workflows/{workflow}/runs?branch=main&status=completed&per_page={RUNS}")
              runs = runs.get("workflow_runs") or []

              def jobs_of(run_id):
                  return gh(f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100").get("jobs") or []

              print(pick(runs, jobs_of))
              return 0


          if __name__ == "__main__":
              if len(sys.argv) != 3:
                  sys.exit(__doc__)
              sys.exit(main(*sys.argv[1:]))
          __CI_EOF__
          cat >"$d/check-principal-refs.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Fails when a principal this change creates is referenced by display name.

          `dependencies` only orders the run. A plan creates nothing, so a lookup by
          display name goes to Entra and finds nothing for a group or service principal
          that the same change is still only planning. The reference has to go through
          a dependency output as "id:${dependency...}" instead.
          """
          import pathlib
          import re
          import subprocess
          import sys

          BASE = sys.argv[1] if len(sys.argv) > 1 else "origin/main"

          EMAIL = re.compile(r'"([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)"')

          # Guests are users too; a new one referenced by address fails the same way.
          SOURCES = [
