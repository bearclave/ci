# GENERATED by tools/build.py from templates/dependabot-auto-merge.yml - edit the template or src/, not this file.
# Dependabot pull requests that merge themselves (bearclave/governance
# standards/workflow.md#merge), only where nothing reaches production:
#
# - the repository's custom property touches-production is false;
# - main has required status checks, so auto-merge waits for them green;
# - every update in the pull request is a patch or minor version
#   (src/dependabot_update.py reads Dependabot's commit message);
# - the pull request and every commit in it are Dependabot's.
#
# Anything else is left for the owner, as in every production repository.
#
# Caller, .github/workflows/dependabot-auto-merge.yml of the repository:
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, reopened, synchronize]
#   jobs:
#     auto-merge:
#       if: github.event.pull_request.user.login == 'dependabot[bot]'
#       uses: bearclave/ci/.github/workflows/dependabot-auto-merge.yml@v2
#       permissions:
#         contents: write
#         pull-requests: write
#       secrets:
#         bot-token: ${{ secrets.BOT_TOKEN }}   # optional, a Dependabot secret
#
# With a bot-token (bearclave-bot) the bot approves and merges, which the
# required approval needs. Without it auto-merge is only switched on: the
# owner's approval releases the merge, and a merge by the workflow's token
# starts no workflow on main. A run triggered by Dependabot reads only
# Dependabot secrets, so the token is stored there.
name: dependabot-auto-merge

on:
  workflow_call:
    secrets:
      bot-token:
        description: Token of bearclave-bot that approves and merges; optional
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Eligible
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/dependabot_update.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Whether a Dependabot pull request may merge itself: only patch and minor.

          Dependabot writes what it updates into the commit message, one entry per
          dependency (a group has several):

              updated-dependencies:
              - dependency-name: actions/checkout
                dependency-version: 7.0.2
                dependency-type: direct:production
                update-type: version-update:semver-patch

          The largest update type of all entries decides. An entry without an update
          type (a security update of an indirect dependency, a digest bump) or a major
          update keeps the pull request for the owner.

          Reads the commit message on stdin, prints the update type and exits 0 when
          the pull request is eligible, 1 when it is not.

          Usage: dependabot_update.py < message
                 dependabot_update.py --self-test
          """
          import re
          import sys

          ALLOWED = ("version-update:semver-patch", "version-update:semver-minor")
          ENTRY = re.compile(r"^- dependency-name: ", re.M)
          UPDATE = re.compile(r"^\s+update-type: (\S+)\s*$", re.M)


          def update_type(message: str) -> str:
              """The largest update type, or a reason why there is none."""
              entries = ENTRY.split(message)[1:]
              if not entries:
                  return "no updated-dependencies in the commit message"
              kinds = []
              for entry in entries:
                  m = UPDATE.search(entry)
                  if not m:
                      return "an update without update-type"
                  kinds.append(m.group(1))
              for kind in kinds:
                  if kind not in ALLOWED:
                      return kind
              return ALLOWED[1] if ALLOWED[1] in kinds else ALLOWED[0]


          def eligible(message: str) -> bool:
              return update_type(message) in ALLOWED


          def self_test() -> int:
              one = ("deps: bump x\n\n---\nupdated-dependencies:\n- dependency-name: actions/checkout\n"
                     "  dependency-version: 7.0.2\n  dependency-type: direct:production\n"
                     "  update-type: version-update:semver-patch\n...\n")
              group = one.replace("...\n", "- dependency-name: a/b\n  update-type: version-update:semver-minor\n...\n")
              major = one.replace("semver-patch", "semver-major")
              assert update_type(one) == ALLOWED[0] and eligible(one)
              assert update_type(group) == ALLOWED[1] and eligible(group)
              assert not eligible(major) and update_type(major) == "version-update:semver-major"
              assert not eligible(one.replace("  update-type: version-update:semver-patch\n", ""))
              assert not eligible("deps: bump x")
              print("self-test ok")
              return 0


          if __name__ == "__main__":
              if "--self-test" in sys.argv:
                  sys.exit(self_test())
              text = sys.stdin.read()
              print(update_type(text))
              sys.exit(0 if eligible(text) else 1)
          __CI_EOF__
          skip() { echo "::notice::Left for the owner: $1"; echo "Left for the owner: $1" >>"$GITHUB_STEP_SUMMARY"; exit 0; }
          production=$(gh api "repos/$REPOSITORY/properties/values" \
            --jq '.[] | select(.property_name == "touches-production") | .value')
          [ "$production" = "false" ] || skip "touches-production is '${production:-unset}'"
          checks=$(gh api "repos/$REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks")] | length')
          [ "$checks" -gt 0 ] || skip "main has no required checks to wait for"
          # Not github.actor, which a re-run by someone else can make look like
          # Dependabot: every commit has to be Dependabot's.
          authors=$(gh api "repos/$REPOSITORY/pulls/$NUMBER/commits" --jq '[.[].author.login // "?"] | unique | join(",")')
          [ "$authors" = "dependabot[bot]" ] || skip "commits by $authors"
          message=$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA" --jq .commit.message)
          if kind=$(python3 "$RUNNER_TEMP/dependabot_update.py" <<<"$message"); then
            echo "Update type: $kind" >>"$GITHUB_STEP_SUMMARY"
            echo "merge=true" >>"$GITHUB_OUTPUT"
          else
            skip "$kind"
          fi

      - name: Approve and switch on auto-merge
        if: steps.eligible.outputs.merge == 'true'
        env:
          BOT_TOKEN: ${{ secrets.bot-token }}
          WORKFLOW_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -n "$BOT_TOKEN" ]; then
            GH_TOKEN="$BOT_TOKEN" gh pr review "$NUMBER" --repo "$REPOSITORY" --approve \
              --body "Patch or minor update in a repository without production; merges when the required checks pass."
            GH_TOKEN="$BOT_TOKEN" gh pr merge "$NUMBER" --repo "$REPOSITORY" --auto --squash
          else
            GH_TOKEN="$WORKFLOW_TOKEN" gh pr merge "$NUMBER" --repo "$REPOSITORY" --auto --squash
            echo "Auto-merge on; it waits for the owner's approval where one is required." >>"$GITHUB_STEP_SUMMARY"
          fi
