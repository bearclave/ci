# GENERATED by tools/build.py from templates/pr.yml - edit the template or src/, not this file.
# The pull request check of the organisation standards
# (bearclave/governance standards/workflow.md): a Conventional Commit title,
# a <type>/<slug> branch, the sections of the description (Dependabot
# excepted); it sets the type:*, breaking and size:* labels and assigns the
# author (an App's pull request: the owner, vars.OWNER). It also checks,
# in every repository and the same job:
#
# - the root layout against governance standards/layout.yaml (a managed copy
#   in src/layout.yaml), with the exceptions in the repository's
#   .github/conventions.yaml (layout: exceptions:);
# - the conventions every repository has (src/conventions.py --only):
#   todo-issue (a to-do comment names its issue) and markdown-links (a
#   relative link in Markdown leads to a file and heading of the repository;
#   offline, nothing is fetched) and collection-schema (every <key>.yaml of a
#   collection matches the JSON Schema of its module, .github/schemas/),
#   with the levels and exceptions of .github/conventions.yaml;
# - markdownlint (markdownlint-cli2, the image pinned by its digest below)
#   over the Markdown git tracks, with the rules of src/markdownlint.yaml;
#   .github/markdownlint.yaml of the repository replaces them rule by rule.
#
# .claude/ is left out of the last two: the standards there are managed
# copies, checked where they are written (governance).
#
# Every repository has the same caller, .github/workflows/pr.yml (managed by
# governance/sync.py), and the check reports as "pr / check":
#
#   on:
#     pull_request:
#       branches: [main, staging]   # staging: the default branch of the applications
#       types: [opened, edited, reopened, synchronize, ready_for_review]
#   jobs:
#     pr:
#       uses: bearclave/ci/.github/workflows/pr.yml@v2
#       permissions:
#         contents: read
#         pull-requests: write
#
# Generated files do not count for the size: mark them linguist-generated in
# .gitattributes; lock files never count.
name: pr

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Title, branch, description, labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSIGNEES: ${{ join(github.event.pull_request.assignees.*.login, ',') }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          OWNER: ${{ vars.OWNER }}
        run: |
          cat >"$RUNNER_TEMP/pr_check.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """The `pr` check: a pull request follows the standards of the organisation.

          bearclave/governance standards/workflow.md is the rule this enforces:

          - the title is a Conventional Commit (it becomes the commit on main); a bot
            title over 72 characters only warns, since the bot writes it itself
            (Dependabot: "... in the actions group");
          - the branch is <type>/<slug> (bot branches excepted);
          - the description keeps the sections of the template - people and Apps
            (bearclave-bot opens the agents' pull requests, so Review is enforced for
            them too); only Dependabot, which writes its own description, is exempt;

          and it keeps the pull request tidy:

          - type:*, breaking and size:* labels follow the title and the diff;
          - a pull request nobody is assigned to is assigned to its author, or to the
            owner (OWNER, the organisation variable) when the author is an App.

          Reads the event from the environment (PR_NUMBER, PR_TITLE, PR_BODY,
          PR_BRANCH, PR_AUTHOR, PR_ASSIGNEES, PR_LABELS, PR_HEAD_SHA, GITHUB_REPOSITORY,
          OWNER) and talks to GitHub through `gh` with GH_TOKEN. Exit code 1 when a rule is
          broken; the labels and the assignee are set either way.

          Usage: pr_check.py            (in a workflow)
                 pr_check.py --self-test
          """
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys

          TYPES = ("feat", "fix", "perf", "refactor", "docs", "test", "ci", "chore", "deps", "revert")
          TITLE = re.compile(
              r"^(?P<type>" + "|".join(TYPES) + r")"
              r"(?:\((?P<scope>[a-z0-9][a-z0-9._/-]*)\))?"
              r"(?P<breaking>!)?: (?P<summary>\S.*)$"
          )
          BRANCH = re.compile(r"^(?:" + "|".join(TYPES) + r")/[a-z0-9][a-z0-9-]*$")
          BOT_BRANCH = re.compile(r"^(?:dependabot/.+|chore/tombstones)$")
          # Writes its own description and gets a read-only token in pull request runs.
          DEPENDABOT = "dependabot[bot]"
          SECTIONS = ("Why", "What changes", "Impact", "Verification", "Review", "Links")
          SIZES = (("size:xs", 10), ("size:s", 50), ("size:m", 200), ("size:l", 500), ("size:xl", None))
          # Never counted: lock files and what .gitattributes marks linguist-generated.
          NOT_COUNTED = ("*package-lock.json", "*.lock", "*.terraform.lock.hcl", "*uv.lock", "*poetry.lock")


          def title_too_long(title: str) -> list:
              if len(title) > 72:
                  return [f"The title is {len(title)} characters; at most 72 (it becomes the commit subject)."]
              return []


          def title_problems(title: str) -> list:
              """Format of the title; its length is title_too_long()."""
              m = TITLE.match(title)
              if not m:
                  return [f"The title '{title}' is not '<type>(<scope>)!: <summary>' with type one of "
                          f"{', '.join(TYPES)}."]
              problems = []
              summary = m.group("summary")
              if summary[0].isupper() and not summary.split()[0].isupper():
                  problems.append("The summary starts with a lowercase letter (imperative: 'add ...', not 'Add ...').")
              if summary.endswith("."):
                  problems.append("The title ends without a full stop.")
              return problems


          def branch_problems(branch: str) -> list:
              if BRANCH.match(branch) or BOT_BRANCH.match(branch):
                  return []
              return [f"The branch '{branch}' is not '<type>/<slug>' (lowercase, a-z 0-9 and -). "
                      "Rename it: git branch -m <type>/<slug>, push, open a new pull request."]


          def body_problems(body: str) -> list:
              missing = [s for s in SECTIONS if not re.search(rf"^##\s+{re.escape(s)}\s*$", body or "", re.M)]
              if not missing:
                  return []
              return ["The description is missing the section(s) " + ", ".join(f"'## {s}'" for s in missing)
                      + " of the template (write 'none' rather than delete a section)."]


          def generated_patterns(gitattributes: str) -> list:
              patterns = []
              for line in gitattributes.splitlines():
                  parts = line.split()
                  if len(parts) >= 2 and not parts[0].startswith("#") and (
                          "linguist-generated" in parts[1:] or "linguist-generated=true" in parts[1:]):
                      patterns.append(parts[0])
              return patterns


          def counted(path: str, patterns: list) -> bool:
              for pat in list(NOT_COUNTED) + patterns:
                  pat = pat.lstrip("/")
                  if fnmatch.fnmatch(path, pat) or fnmatch.fnmatch(path, pat.rstrip("/") + "/*"):
                      return False
              return True


          def size_label(lines: int) -> str:
              for label, limit in SIZES:
                  if limit is None or lines < limit:
                      return label
              return SIZES[-1][0]


          def wanted_labels(title: str, lines: int) -> set:
              labels = {size_label(lines)}
              m = TITLE.match(title)
              if m:
                  labels.add(f"type:{m.group('type')}")
                  if m.group("breaking"):
                      labels.add("breaking")
              return labels


          def managed(label: str) -> bool:
              return label.startswith(("type:", "size:")) or label == "breaking"


          def gh(*args, check=True) -> str:
              r = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and r.returncode != 0:
                  raise RuntimeError(f"gh {' '.join(args)}: {r.stderr.strip()}")
              return r.stdout


          def main() -> int:
              repo = os.environ["GITHUB_REPOSITORY"]
              number = os.environ["PR_NUMBER"]
              title = os.environ.get("PR_TITLE", "")
              author = os.environ.get("PR_AUTHOR", "")
              bot = author.endswith("[bot]")
              dependabot = author == DEPENDABOT

              problems = title_problems(title) + branch_problems(os.environ.get("PR_BRANCH", ""))
              warnings = []
              if bot:
                  # Shorten the title before the merge; the squash commit takes it.
                  warnings += title_too_long(title)
              else:
                  problems += title_too_long(title)
              if not dependabot:
                  problems += body_problems(os.environ.get("PR_BODY", ""))

              patterns = []
              try:
                  raw = gh("api", f"repos/{repo}/contents/.gitattributes?ref={os.environ.get('PR_HEAD_SHA', '')}",
                           "-H", "Accept: application/vnd.github.raw")
                  patterns = generated_patterns(raw)
              except RuntimeError:
                  pass  # no .gitattributes
              files = json.loads(gh("api", "--paginate", "--slurp", f"repos/{repo}/pulls/{number}/files?per_page=100"))
              lines = sum(f["additions"] + f["deletions"] for page in files for f in page if counted(f["filename"], patterns))

              have = {x for x in os.environ.get("PR_LABELS", "").split(",") if x}
              want = wanted_labels(title, lines)
              add = sorted(want - have)
              remove = sorted(x for x in have - want if managed(x))
              assignee = (os.environ.get("OWNER", "").strip() if bot else author)
              assign = not os.environ.get("PR_ASSIGNEES") and bool(assignee)

              summary = [f"## Pull request #{number}", "",
                         f"- Changed lines counted for the size: **{lines}** ({size_label(lines)})",
                         f"- Labels: {', '.join(sorted(want))}"]

              # Dependabot's token is read-only; its pull requests get their labels and
              # assignee from dependabot.yml.
              if dependabot:
                  summary.append("- Labels and assignee left to the bot's own configuration.")
              else:
                  edit = []
                  for label in add:
                      edit += ["--add-label", label]
                  for label in remove:
                      edit += ["--remove-label", label]
                  if assign:
                      edit += ["--add-assignee", assignee]
                  if edit:
                      try:
                          gh("pr", "edit", number, "--repo", repo, *edit)
                      except RuntimeError as e:
                          # A label iac-github has not created yet must not fail the check.
                          print(f"::warning::Could not update labels or assignee: {e}")

              for w in warnings:
                  print(f"::warning::{w}")
              for p in problems:
                  print(f"::error::{p}")
              summary += ["", "### Problems" if problems else "Title, branch and description follow the standard."]
              summary += [f"- {p}" for p in problems]
              if warnings:
                  summary += ["", "### Warnings"] + [f"- {w}" for w in warnings]
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                      f.write("\n".join(summary) + "\n")
              print("\n".join(summary))
              return 1 if problems else 0


          def self_test() -> int:
              assert not title_problems("feat(conditional-access): block legacy authentication")
              assert not title_problems("fix!: drop the old input")
              assert not title_problems("deps: bump actions/checkout from 7.0.1 to 7.0.2")
              assert not title_problems("ci(m365): run PSScriptAnalyzer on changed files")
              assert title_problems("Block legacy authentication")
              assert title_problems("feature: x")
              assert title_problems("feat: Block it")
              assert title_problems("feat: block it.")
              long = "deps: bump actions/upload-artifact from 7.0.1 to 7.0.2 in the actions group"
              assert not title_problems(long) and title_too_long(long) and not title_too_long("fix: x")
              assert not branch_problems("feat/42-ca-block-legacy")
              assert not branch_problems("dependabot/github_actions/actions-123")
              assert not branch_problems("chore/tombstones")
              assert branch_problems("feature/x") and branch_problems("feat/Upper") and branch_problems("worktree-x")
              body = "\n".join(f"## {s}\n\nnone\n" for s in SECTIONS)
              assert not body_problems(body) and body_problems("## Why\n")
              assert generated_patterns("ARM/_kql/** linguist-generated\n*.md text\n") == ["ARM/_kql/**"]
              assert not counted("ARM/_kql/a/b.kql", ["ARM/_kql/**"]) and not counted("api/package-lock.json", [])
              assert counted("src/main.tf", ["ARM/_kql/**"])
              assert size_label(0) == "size:xs" and size_label(199) == "size:m" and size_label(500) == "size:xl"
              assert wanted_labels("feat(x)!: y", 3) == {"type:feat", "breaking", "size:xs"}
              print("self-test ok")
              return 0


          if __name__ == "__main__":
              sys.exit(self_test() if "--self-test" in sys.argv else main())
          __CI_EOF__
          python3 "$RUNNER_TEMP/pr_check.py"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      - name: Root layout
        if: ${{ !cancelled() }}
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          cat >"$RUNNER_TEMP/layout.yaml" <<'__CI_EOF__'
          # Managed by bearclave/governance (tools/sync.py) - do not edit here.
          # Root layout of the repositories, read by the layout check of bearclave/ci
          # (a step of "pr / check"). The rules in prose: layout.md.
          #
          # A repository's entries are the union of `common`, its group (the name
          # prefix: iac-, app-, template-/content-, none = platform) and its pipeline
          # (the shared workflow its ci.yml calls). A top-level folder is also allowed
          # when it holds what its `content` kind names:
          #   units    a Terragrunt unit (terragrunt.hcl) somewhere below it
          #   modules  a Terraform module (*.tf) somewhere below it
          # `forbidden` takes folders of `common` away from a group or pipeline.
          # Anything else needs an exception with a reason in .github/conventions.yaml:
          #   layout:
          #     exceptions:
          #       - path: extensions
          #         reason: One folder per VS Code extension, each a package of its own.

          common:
            # Root entries every repository has.
            required:
              - README.md
              - .gitattributes
              - .editorconfig
              - .claude
              - .github
            # Root files that Git, GitHub, an ecosystem or a tool read from the root.
            files:
              - README.md
              - .gitignore
              - .gitattributes
              - .editorconfig
              - .gitleaks.toml
              - .mcp.json
              - LICENSE
              - .tflint.hcl
              - eslint.config.mjs
              - .dockerignore
              - Dockerfile
              - package.json
              - package-lock.json
              - pyproject.toml
              - uv.lock
            # The folder vocabulary (layout.md#folders).
            folders:
              - .claude
              - .github
              - src
              - tests
              - tools
              - docs
              - _common
              # settings.json only: the yaml.schemas of the collections.
              - .vscode
            # What .github/ may hold: GitHub, CI, and the configs only the pipeline reads.
            github:
              - workflows
              - CODEOWNERS
              - SECURITY.md
              - ISSUE_TEMPLATE
              - pull_request_template.md
              - markdownlint.yaml
              - dependabot.yml
              - release.yml
              - tool-versions.env
              - conventions.yaml
              - state-moves.yaml
              # The JSON Schemas of the collections, copied from their modules.
              - schemas
              - sentinel-lint.yaml
              - trivyignore.yaml
              - pssa.psd1
            # docs/: flat, kebab-case names.
            docs_name: '^[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+)?$'

          groups:
            app:
              folders: [config, content, data, deploy, lib]
            template:
              # content-sentinel: the catalogue, in the collection folders of iac-sentinel.
              folders: [content]

          pipelines:
            # Every unit under infrastructure/. No tools/ and no deploy/: a script
            # the pipeline runs lives in bearclave/ci, one a person runs in the
            # know-how repository, the bootstrap is a procedure in docs/setup.md.
            terragrunt:
              required: [root.hcl, account.hcl, infrastructure]
              files: [root.hcl, account.hcl]
              folders: [infrastructure]
              forbidden: [tools, deploy]
            terragrunt-home:
              required: [root.hcl, account.hcl, infrastructure]
              files: [root.hcl, account.hcl]
              folders: [infrastructure]
              forbidden: [tools, deploy]
            terraform-modules:
              # The settings of the README tables of terraform-docs.
              files: [.terraform-docs.yml]
              content: modules
            m365-dsc:
              # Retired: iac-m365 alone, until it is archived. tenant.psd1 is the
              # tenant context of the configuration, as account.hcl is for Terragrunt.
              files: [tenant.psd1]
              folders: [config, content, data, deploy, lib]
            static-web-app:
              # api/ is the Functions folder the Static Web App deploys.
              folders: [api]
            container: {}
            content-sentinel:
              # The content and its generated Terragrunt view, until the catalogue is
              # converted to the YAML of iac-sentinel (content/, pipeline checks).
              folders: [ARM, terragrunt]
            checks: {}
            ci:
              # The workflow templates build.py writes .github/workflows/ from.
              folders: [templates]
          __CI_EOF__
          cat >"$RUNNER_TEMP/layout_check.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks the root layout of a repository against governance standards/layout.yaml.

          Usage: layout_check.py <layout.json> <exceptions.json> <repository name> [<root>]
                 layout_check.py --self-test
          """
          import datetime
          import fnmatch
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile

          PIPELINES = ("terragrunt-home", "terragrunt", "terraform-modules", "m365-dsc",
                       "static-web-app", "container", "content-sentinel", "checks")


          def group_of(name: str) -> str:
              for prefix, group in (("iac-", "iac"), ("app-", "app"), ("template-", "template"), ("content-", "template")):
                  if name.startswith(prefix):
                      return group
              return "platform"


          def pipeline_of(name: str, root: str) -> str:
              """The shared workflow the repository's ci.yml calls; ci runs its own."""
              if name == "ci":
                  return "ci"
              try:
                  with open(os.path.join(root, ".github", "workflows", "ci.yml"), encoding="utf-8") as fh:
                      text = fh.read()
              except OSError:
                  return ""
              for m in re.finditer(r"uses:\s*\S*?\.github/workflows/([\w-]+)\.yml", text):
                  if m.group(1) in PIPELINES:
                      return m.group(1)
              return ""


          def tracked(root: str) -> list:
              out = subprocess.run(["git", "-C", root, "ls-files"], capture_output=True, text=True, check=True).stdout
              return out.splitlines()


          def merged(layout: dict, group: str, pipeline: str, key: str) -> set:
              parts = [layout.get("common") or {}, (layout.get("groups") or {}).get(group) or {},
                       (layout.get("pipelines") or {}).get(pipeline) or {}]
              return {x for p in parts for x in (p.get(key) or [])}


          def content_kind(layout: dict, group: str, pipeline: str) -> str:
              return ((layout.get("pipelines") or {}).get(pipeline) or {}).get("content", "")


          def holds(files: list, folder: str, kind: str) -> bool:
              inside = [f for f in files if f.startswith(folder + "/")]
              if kind == "units":
                  return any(f.rsplit("/", 1)[-1] == "terragrunt.hcl" for f in inside)
              if kind == "modules":
                  return any(f.endswith(".tf") for f in inside)
              return False


          def check(layout: dict, config: dict, name: str, root: str) -> tuple:
              """(errors as (path, message), warnings)."""
              group, pipeline = group_of(name), pipeline_of(name, root)
              errors, warnings = [], []
              if not pipeline:
                  return [(".github/workflows/ci.yml", "no shared pipeline of bearclave/ci found in ci.yml")], []
              exceptions = config.get("exceptions") or []
              for k, e in enumerate(exceptions):
                  if not str(e.get("path", "")).strip() or not str(e.get("reason", "")).strip():
                      errors.append((".github/conventions.yaml", f"layout exception {k + 1} needs a path and a reason"))
              used = set()

              def excepted(path: str) -> bool:
                  for k, e in enumerate(exceptions):
                      if e.get("path") and e.get("reason") and fnmatch.fnmatchcase(path, str(e["path"])):
                          used.add(k)
                          return True
                  return False

              files = tracked(root)
              root_files = {f for f in files if "/" not in f}
              root_dirs = {f.split("/", 1)[0] for f in files if "/" in f}
              allowed_files = merged(layout, group, pipeline, "files")
              allowed_dirs = merged(layout, group, pipeline, "folders")
              kind = content_kind(layout, group, pipeline)

              for entry in sorted(merged(layout, group, pipeline, "required")):
                  if entry not in root_files | root_dirs and not excepted(entry):
                      errors.append((entry, f"{entry} is required in the root"))
              for entry in sorted(root_files):
                  if entry not in allowed_files and not excepted(entry):
                      errors.append((entry, f"{entry} does not belong in the root (layout.md: .github/, tools/, docs/ or a folder)"))
              forbidden = merged(layout, group, pipeline, "forbidden")
              for entry in sorted(root_dirs):
                  if entry in forbidden:
                      if not excepted(entry):
                          errors.append((entry, f"{entry}/ has no place in a {pipeline} repository (layout.md: "
                                                "a pipeline's script lives in bearclave/ci, a person's in the "
                                                "know-how repository, a bootstrap in docs/setup.md)"))
                      continue
                  if entry in allowed_dirs or (kind and holds(files, entry, kind)) or excepted(entry):
                      continue
                  errors.append((entry, f"{entry}/ is not a folder of the layout for {group}/{pipeline}"))

              allowed_github = merged(layout, group, pipeline, "github")
              for entry in sorted({f.split("/")[1] for f in files if f.startswith(".github/")}):
                  if entry not in allowed_github and not excepted(f".github/{entry}"):
                      errors.append((f".github/{entry}", f".github/{entry} does not belong in .github/ (GitHub and CI only)"))

              docs_name = (layout.get("common") or {}).get("docs_name")
              if docs_name:
                  for entry in sorted({f.split("/")[1] for f in files if f.startswith("docs/")}):
                      if not re.match(docs_name, entry) and not excepted(f"docs/{entry}"):
                          errors.append((f"docs/{entry}", f"docs/{entry} is not a kebab-case name"))

              for k, e in enumerate(exceptions):
                  if k not in used and e.get("path") and e.get("reason"):
                      warnings.append((".github/conventions.yaml", f"layout exception for {e['path']} matches nothing"))
                  # review (YYYY-MM-DD) is optional here: a layout exception is
                  # structure. A date that has passed only warns.
                  review = str(e.get("review") or "")
                  if review and not re.match(r"^\d{4}-\d{2}-\d{2}$", review):
                      errors.append((".github/conventions.yaml", f"layout exception for {e.get('path')}: review {review!r} is not YYYY-MM-DD"))
                  elif review and review < datetime.date.today().isoformat():
                      warnings.append((".github/conventions.yaml",
                                       f"layout exception for {e.get('path')} was due for review on {review}"))
              return errors, warnings


          def main(layout_path: str, config_path: str, name: str, root: str = ".") -> int:
              with open(layout_path, encoding="utf-8") as fh:
                  layout = json.load(fh) or {}
              with open(config_path, encoding="utf-8") as fh:
                  config = json.load(fh) or {}
              errors, warnings = check(layout, config, name, root)
              for path, message in errors:
                  print(f"::error file={path},title=layout::{message}")
              for path, message in warnings:
                  print(f"::warning file={path},title=layout::{message}")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write("## Layout\n\n")
                      if not errors and not warnings:
                          fh.write(f"The root follows the layout ({group_of(name)}/{pipeline_of(name, root)}).\n")
                      for path, message in errors + warnings:
                          fh.write(f"- `{path}`: {message}\n")
              return 1 if errors else 0


          def self_test() -> int:
              layout = {"common": {"required": ["README.md", ".github"], "files": ["README.md", ".gitignore"],
                                   "folders": [".github", "src", "tools", "docs"], "github": ["workflows"],
                                   "docs_name": r"^[a-z0-9]+(-[a-z0-9]+)*(\.[a-z0-9]+)?$"},
                        "groups": {"app": {"folders": ["content"]}},
                        "pipelines": {"terragrunt": {"required": ["root.hcl", "infrastructure"], "files": ["root.hcl"],
                                                     "folders": ["infrastructure"], "forbidden": ["tools", "deploy"]},
                                      "terraform-modules": {"content": "modules"}, "checks": {}}}
              cases = [
                  ("iac-x", "terragrunt", ["README.md", "root.hcl", "infrastructure/mg/rg/terragrunt.hcl",
                                           "docs/setup.md"], {}, 0),
                  ("iac-x", "terragrunt", ["README.md", "root.hcl", "SETUP.md", "scripts/a.sh", "docs/Setup.md",
                                           "infrastructure/a/terragrunt.hcl"], {}, 3),
                  # Units outside infrastructure/, tools/ and deploy/ in an IaC repository.
                  ("iac-x", "terragrunt", ["README.md", "root.hcl", "infrastructure/a/terragrunt.hcl",
                                           "mg/rg/terragrunt.hcl", "tools/a.sh", "deploy/a.yaml"], {}, 3),
                  ("iac-x", "terragrunt", ["README.md", "root.hcl", "mg/terragrunt.hcl"], {}, 2),
                  ("iac-x", "terragrunt", ["README.md", "root.hcl", "infrastructure/a/terragrunt.hcl",
                                           "tenant/g/terragrunt.hcl", "tools/a.sh"],
                   {"exceptions": [{"path": "tenant", "reason": "retired"},
                                   {"path": "tools", "reason": "moving out"}]}, 0),
                  ("iac-modules", "terraform-modules", ["README.md", "azure/key-vault/main.tf", "tools/catalog.py"], {}, 0),
                  ("app-x", "checks", ["README.md", "content/a.txt", ".github/scripts/a.sh"], {}, 1),
                  ("handbook", "checks", ["README.md", "gotchas/a.md"],
                   {"exceptions": [{"path": "gotchas", "reason": "content"}]}, 0),
                  ("handbook", "checks", ["gotchas/a.md"], {"exceptions": [{"path": "gotchas"}]}, 3),
              ]
              failed = 0
              for name, pipeline, paths, config, expected in cases:
