# GENERATED by tools/build.py from templates/promote.yml - edit the template or src/, not this file.
# Release of an application by a click (bearclave/governance
# standards/workflow.md, Applications): the commit of staging (its head unless
# a commit is given) goes to production. src/promote.py checks that the
# newest successful run of the caller's pipeline for the commit deployed
# staging (its job deploy-staging) and that the build artifact is still
# there; then, as the GitHub App bearclave-promote, it fast-forwards prod
# (the production job deploys the build of that same run, chosen by the same
# rule), waits for the production run of the push and, once it is green,
# tags vX.Y.Z and publishes the release. The version comes from
# the pull request titles since the last tag (src/release_version.py),
# unless one is given.
#
# A container (container.yml with environments) has no build artifact: its
# caller passes artifact: "", staging-job: deploy and prod-job: deploy. Its
# production run deploys the image :sha-<commit>, and the tag pushed here
# makes the caller's ci.yml (trigger push: tags: ['v*']) tag it :vX.Y.Z.
#
# The job signs in to Azure by OIDC as the repository's promote identity,
# federated on the environment `promote` (deployment branches: staging), and
# reads the key of bearclave-promote from its own vault
# (kv-ghpromote-sec-weu-001). That App is installed only on the applications,
# so its key reaches nothing else; bearclave-bot's key is never read here.
# The rulesets let only bearclave-promote move prod and create v* tags there.
#
# Caller, .github/workflows/promote.yml of an application:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         sha:
#           description: Commit of staging to release (empty = the head of staging)
#           type: string
#           default: ""
#         version:
#           description: vX.Y.Z instead of the calculated one (empty = calculate)
#           type: string
#           default: ""
#         dry-run:
#           description: Only check and show what would happen
#           type: boolean
#           default: false
#   permissions: {}
#   jobs:
#     promote:
#       uses: bearclave/ci/.github/workflows/promote.yml@v2
#       permissions:
#         contents: read
#         actions: read
#         id-token: write
#       with:
#         sha: ${{ inputs.sha }}
#         version: ${{ inputs.version }}
#         dry-run: ${{ inputs.dry-run }}
#         client-id: ${{ vars.AZURE_CLIENT_ID_PROMOTE }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
name: promote

on:
  workflow_call:
    inputs:
      sha:
        description: Commit of the staging branch to release; empty takes its head
        type: string
        default: ""
      version:
        description: vX.Y.Z instead of the calculated one; empty calculates it
        type: string
        default: ""
      dry-run:
        description: Only check and show what would happen; nothing is written
        type: boolean
        default: false
      workflow:
        description: File name of the pipeline that builds and deploys to staging
        type: string
        default: ci.yml
      artifact:
        description: Name of the build artifact production deploys, checked in the staging run; empty skips the check
        type: string
        default: site
      staging-job:
        description: Job of the pipeline that deploys staging; it must have succeeded in the staging run (empty skips the check)
        type: string
        default: deploy-staging
      prod-job:
        description: Job of the pipeline that deploys production; it must have succeeded in the production run before anything is tagged (empty skips the check)
        type: string
        default: deploy-prod
      wait-minutes:
        description: How long to wait for the production run before giving up, 0 to 30 (nothing is tagged then)
        type: number
        default: 20
      vault:
        description: Key Vault with the key, App ID and installation ID of bearclave-promote
        type: string
        default: kv-ghpromote-sec-weu-001
      staging-branch:
        description: Branch that runs in staging (the default branch)
        type: string
        default: staging
      prod-branch:
        description: Branch that runs in production
        type: string
        default: prod
      environment:
        description: Environment of the job; the promote identity is federated on it
        type: string
        default: promote
      client-id:
        description: Client ID of the promote identity (Key Vault Secrets User on the vault of bearclave-promote)
        type: string
        required: true
      tenant-id:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    # The wait for the production run included.
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    # One promotion of a repository at a time, whatever the caller does.
    concurrency:
      group: promote-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      # The staging run of the commit and its artifacts.
      actions: read
      id-token: write
    env:
      STAGING_BRANCH: ${{ inputs.staging-branch }}
      PROD_BRANCH: ${{ inputs.prod-branch }}
    steps:
      - name: Run from the staging branch, with a full commit SHA
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA_INPUT" =~ ^([0-9a-f]{40})?$ ]]; then
            echo "::error title=promote::sha must be empty or a full 40-character commit SHA"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/$STAGING_BRANCH" ]; then
            echo "::error title=promote::run it from $STAGING_BRANCH, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promote"
          cat >"$RUNNER_TEMP/promote/release_version.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """The next release of a repository, from the commits on main since its last tag.

          bearclave/governance standards/versioning.md is the rule: every commit on main
          is a squashed pull request whose subject is the pull request title, so the
          Conventional Commit types since the last vX.Y.Z decide the bump:

          - `!` after the type or a `BREAKING CHANGE:` footer -> major (minor before v1.0.0)
          - otherwise `feat` -> minor
          - otherwise `fix`, `perf`, `refactor`, `deps`, `revert` -> patch
          - only `docs`, `test`, `ci`, `chore` -> no release

          A repository without a tag starts at v1.0.0. An explicit version overrides the
          calculation; it has to be a vX.Y.Z above the last tag.

          Writes `version` (empty when no release is needed), `previous` and `bump` to
          GITHUB_OUTPUT and a preview of the notes to GITHUB_STEP_SUMMARY.

          Usage: release_version.py [<vX.Y.Z>]   (in the checkout, full history)
                 release_version.py --self-test
          """
          import os
          import re
          import subprocess
          import sys
          import tempfile

          TITLE = re.compile(r"^(?P<type>[a-z]+)(?:\([^)]*\))?(?P<breaking>!)?: \S")
          VERSION = re.compile(r"v([0-9]+)\.([0-9]+)\.([0-9]+)")
          FOOTER = re.compile(r"^BREAKING[ -]CHANGE: ", re.M)
          PATCH = ("fix", "perf", "refactor", "deps", "revert")
          NONE = ("docs", "test", "ci", "chore")
          ORDER = ("major", "minor", "patch", "none")
          # The sections of .github/release.yml, by commit type.
          SECTIONS = (("Breaking changes", None), ("Features", ("feat",)), ("Fixes", ("fix", "revert")),
                      ("Performance", ("perf",)), ("Dependencies", ("deps",)))


          def parse(version: str) -> tuple:
              m = VERSION.fullmatch(version)
              if not m:
                  raise ValueError(f"'{version}' is not vX.Y.Z")
              return tuple(int(x) for x in m.groups())


          def bump_of(subject: str, body: str) -> str:
              """major, minor, patch, none - or other for a subject that is no Conventional Commit."""
              m = TITLE.match(subject)
              if not m:
                  return "other"
              if m.group("breaking") or FOOTER.search(body or ""):
                  return "major"
              kind = m.group("type")
              if kind == "feat":
                  return "minor"
              if kind in PATCH:
                  return "patch"
              if kind in NONE:
                  return "none"
              return "other"


          def next_version(previous: str, bumps: list) -> tuple:
              """(version, bump); version is empty when nothing calls for a release."""
              if not previous:
                  return "v1.0.0", "first"
              found = [b for b in ORDER if b in bumps]
              bump = found[0] if found else "none"
              major, minor, patch = parse(previous)
              if bump == "major" and major == 0:
                  bump = "minor"
              if bump == "major":
                  return f"v{major + 1}.0.0", bump
              if bump == "minor":
                  return f"v{major}.{minor + 1}.0", bump
              if bump == "patch":
                  return f"v{major}.{minor}.{patch + 1}", bump
              return "", bump


          def notes(commits: list) -> list:
              """Markdown preview of the notes, grouped like .github/release.yml."""
              lines = []
              used = set()
              for title, types in SECTIONS:
                  picked = [i for i, (s, b) in enumerate(commits) if i not in used and (
                      bump_of(s, b) == "major" if types is None else
                      (TITLE.match(s) and TITLE.match(s).group("type") in types))]
                  if picked:
                      lines += ["", f"### {title}"] + [f"- {commits[i][0]}" for i in picked]
                      used.update(picked)
              rest = [s for i, (s, _) in enumerate(commits) if i not in used]
              if rest:
                  lines += ["", "### Other"] + [f"- {s}" for s in rest]
              return lines


          def git(*args) -> str:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=True).stdout


          def last_tag() -> str:
              tags = [t for t in git("tag", "--list", "v*.*.*", "--merged", "HEAD").split() if VERSION.fullmatch(t)]
              return max(tags, key=parse) if tags else ""


          def commits_since(tag: str) -> list:
              span = [f"{tag}..HEAD"] if tag else ["HEAD"]
              raw = git("log", "--first-parent", "--format=%s%x1f%b%x1e", *span)
              return [tuple(c.strip("\n").split("\x1f", 1)) for c in raw.split("\x1e") if c.strip()]


          def main(wanted: str) -> int:
              previous = last_tag()
              commits = commits_since(previous)
              bumps = [bump_of(s, b) for s, b in commits]
              version, bump = next_version(previous, bumps)
              if wanted:
                  try:
                      parse(wanted)
                      # A rerun (promote.yml) of a commit already tagged with that version.
                      here = git("tag", "--points-at", "HEAD").split()
                      if previous and wanted not in here and parse(wanted) <= parse(previous):
                          raise ValueError(f"{wanted} is not above the last tag {previous}")
                  except ValueError as e:
                      print(f"::error::{e}")
                      return 1
                  version, bump = wanted, "given"

              others = [s for (s, _), b in zip(commits, bumps) if b == "other"]
              summary = [f"## Release of {os.environ.get('GITHUB_REPOSITORY', 'this repository')}", "",
                         f"- Last tag: {previous or 'none'}",
                         f"- Pull requests since: {len(commits)}",
                         f"- Bump: {bump}",
                         f"- Next version: **{version or 'none, no release needed'}**"]
              if others:
                  summary += ["", f"{len(others)} commit(s) are not Conventional Commits and do not count "
                                  "for the bump (history from before the standards)."]
              if version:
                  summary += ["", "## Notes (preview; the release generates them from the labels)"] + notes(commits)
              # An application is released by promote.yml as bearclave-promote, not by hand.
              if version and not os.environ.get("RELEASED_BY_PROMOTE"):
                  summary += ["", "## Signed tag by hand", "", "```bash",
                              "git switch main && git pull --ff-only",
                              f'git tag -s {version} -m "{version}" && git push origin {version}',
                              f"gh release create {version} --verify-tag --generate-notes", "```"]
              for w in others[:20]:
                  print(f"::warning::Not a Conventional Commit, not counted: {w}")
              print("\n".join(summary))
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                      f.write("\n".join(summary) + "\n")
              if os.environ.get("GITHUB_OUTPUT"):
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                      f.write(f"version={version}\nprevious={previous}\nbump={bump}\n")
              return 0


          def self_test() -> int:
              assert bump_of("feat(x): add y", "") == "minor"
              assert bump_of("fix!: drop z", "") == "major"
              assert bump_of("refactor: move", "Why\n\nBREAKING CHANGE: input renamed") == "major"
              assert bump_of("deps: bump a from 1 to 2 (#3)", "") == "patch"
              assert bump_of("docs: readme", "") == "none"
              assert bump_of("Kopie sdilenych workflow (#5)", "") == "other"
              assert next_version("", []) == ("v1.0.0", "first")
              assert next_version("v2.4.1", ["patch", "minor", "none"]) == ("v2.5.0", "minor")
              assert next_version("v2.4.1", ["major"]) == ("v3.0.0", "major")
              assert next_version("v0.3.1", ["major"]) == ("v0.4.0", "minor")
              assert next_version("v2.4.1", ["none", "other"]) == ("", "none")
              with tempfile.TemporaryDirectory() as d:
                  os.chdir(d)
                  git("init", "-q", "-b", "main")
                  for msg in ("chore: init", "feat: add a (#1)", "fix: b (#2)"):
                      git("-c", "user.name=t", "-c", "user.email=t@t", "-c", "commit.gpgsign=false",
                          "commit", "-q", "--allow-empty", "-m", msg)
                      if msg == "feat: add a (#1)":
                          git("-c", "tag.gpgsign=false", "tag", "v1.2.0")
                  assert last_tag() == "v1.2.0" and [s for s, _ in commits_since("v1.2.0")] == ["fix: b (#2)"]
              print("self-test ok")
              return 0


          if __name__ == "__main__":
              if "--self-test" in sys.argv:
                  sys.exit(self_test())
              sys.exit(main(sys.argv[1] if len(sys.argv) > 1 else ""))
          __CI_EOF__
          cat >"$RUNNER_TEMP/promote/github_bot.py" <<'__CI_EOF__'
          """GitHub API and the sign-in as bearclave-bot, for the workflows of this
          repository that write to other repositories (deps.yml, ci-pins.yml,
          housekeeping.yml, project-sync.yml); promote.yml signs in the same way as
          the App bearclave-promote, from its own vault.

          The job signs in to Azure by OIDC as the identity of its environment
          (docs/identities.md) and Bot reads the App's key, App ID and installation
          ID from the Key Vault kv-githubbot-sec-weu-001. No secret in GitHub, nothing
          printed. A dry run reads with GH_TOKEN instead.

          The owner, whom the pull requests are assigned to, is the organisation
          variable OWNER (the environment variable of the same name); without it they
          are assigned to nobody.
          """
          import base64
          import json
          import os
          import subprocess
          import sys
          import tempfile
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          ORG = "bearclave"
          VAULT = "kv-githubbot-sec-weu-001"
          API = "https://api.github.com"

          def owner() -> str:
              """The login pull requests and issues are assigned to (vars.OWNER), or ''."""
              return os.environ.get("OWNER", "").strip()


          class NotFound(Exception):
              pass


          class ApiError(Exception):
              pass


          def request(method: str, url: str, token: str = "", payload=None, accept: str = "application/vnd.github+json",
                      raw: bool = False):
              """JSON (or bytes with raw) of a call; a path is relative to the GitHub API."""
              if url.startswith("/"):
                  url = API + url
              data = json.dumps(payload).encode() if payload is not None else None
              headers = {"Accept": accept, "User-Agent": "bearclave-ci", "Content-Type": "application/json"}
              if url.startswith(API):
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=120) as resp:
                          body = resp.read()
                          return body if raw else (json.loads(body) if body else None)
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          raise NotFound(url) from None
                      if e.code >= 500 and attempt < 2:
                          time.sleep(5 * (attempt + 1))
                          continue
                      raise ApiError(f"{method} {url}: {e.code} {e.reason} {e.read().decode(errors='replace')[:500]}") from None
                  except urllib.error.URLError as e:
                      if attempt < 2:
                          time.sleep(5 * (attempt + 1))
                          continue
                      raise ApiError(f"{method} {url}: {e.reason}") from None


          def paginate(path: str, token: str, limit: int = 1000) -> list:
              """Every item of a list endpoint, up to limit."""
              items, page = [], 1
              sep = "&" if "?" in path else "?"
              while len(items) < limit:
                  batch = request("GET", f"{path}{sep}per_page=100&page={page}", token)
                  if isinstance(batch, dict):  # e.g. {"total_count":..., "items": [...]}
                      batch = batch.get("items") or batch.get("repositories") or []
                  items += batch
                  if len(batch) < 100:
                      break
                  page += 1
              return items[:limit]


          def file_text(repo: str, path: str, ref: str, token: str):
              """Text of a file at ref, or None when it does not exist."""
              try:
                  quoted = urllib.parse.quote(path)
                  return request("GET", f"/repos/{repo}/contents/{quoted}?ref={ref}", token,
                                 accept="application/vnd.github.raw", raw=True).decode("utf-8")
              except NotFound:
                  return None


          def repositories(token: str) -> list:
              """The organisation's repositories that are not archived."""
              try:
                  repos = paginate(f"/orgs/{ORG}/repos?type=all", token)
              except ApiError:
                  # An installation token lists the repositories it was granted.
                  repos = paginate("/installation/repositories", token)
              return sorted((r for r in repos if not r.get("archived")), key=lambda r: r["name"])


          def commit_files(repo: str, token: str, base_sha: str, branch: str, files: dict, message: str) -> str:
              """One commit on top of base_sha with files {path: text} on branch.

              Made through the API, so GitHub signs it. The branch is created, or
              moved when it is left over from an earlier run (the caller checks that
              no pull request is open on it)."""
              base_tree = request("GET", f"/repos/{repo}/git/commits/{base_sha}", token)["tree"]["sha"]
              tree = []
              for path, text in sorted(files.items()):
                  blob = request("POST", f"/repos/{repo}/git/blobs", token,
                                 {"content": base64.b64encode(text.encode()).decode(), "encoding": "base64"})
                  tree.append({"path": path, "mode": "100644", "type": "blob", "sha": blob["sha"]})
              new_tree = request("POST", f"/repos/{repo}/git/trees", token, {"base_tree": base_tree, "tree": tree})
              commit = request("POST", f"/repos/{repo}/git/commits", token,
                               {"message": message, "tree": new_tree["sha"], "parents": [base_sha]})
              try:
                  request("GET", f"/repos/{repo}/git/ref/heads/{branch}", token)
                  request("PATCH", f"/repos/{repo}/git/refs/heads/{branch}", token, {"sha": commit["sha"], "force": True})
              except NotFound:
                  request("POST", f"/repos/{repo}/git/refs", token, {"ref": f"refs/heads/{branch}", "sha": commit["sha"]})
              return commit["sha"]


          def open_pull(repo: str, branch: str, token: str):
              """The open pull request from branch, or None."""
              pulls = request("GET", f"/repos/{repo}/pulls?state=open&head={ORG}:{branch}", token)
              return pulls[0] if pulls else None


          def create_pull(repo: str, token: str, branch: str, base: str, title: str, body: str,
                          labels=("type:deps",)) -> dict:
              """A pull request assigned to the owner, with its labels. Nobody approves
              or merges it but the owner."""
              pr = request("POST", f"/repos/{repo}/pulls", token, {"title": title, "head": branch, "base": base, "body": body})
              try:
                  request("POST", f"/repos/{repo}/issues/{pr['number']}/labels", token, {"labels": list(labels)})
                  if login := owner():
                      request("POST", f"/repos/{repo}/issues/{pr['number']}/assignees", token, {"assignees": [login]})
                  else:
                      print(f"::warning::{repo}#{pr['number']}: no OWNER variable, nobody assigned")
              except ApiError as e:
                  print(f"::warning::{repo}#{pr['number']}: labels or assignee not set: {e}")
              return pr


          # --- sign-in as bearclave-bot ---------------------------------------------------

          def secret(name: str, vault: str = VAULT) -> str:
              r = subprocess.run(["az", "keyvault", "secret", "show", "--vault-name", vault, "--name", name,
                                  "--query", "value", "-o", "tsv"], capture_output=True, text=True)
              if r.returncode != 0:
                  sys.exit(f"cannot read {name} from {vault}: {r.stderr.strip()}")
              return r.stdout.strip()


          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()


          def jwt(app_id: str, pem: str) -> str:
              now = int(time.time())
              head = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode())
              body = b64(json.dumps({"iat": now - 60, "exp": now + 540, "iss": app_id}).encode())
              with tempfile.TemporaryDirectory() as tmp:
                  path = os.path.join(tmp, "key.pem")
                  fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, "w") as f:
                      f.write(pem)
                  signature = subprocess.run(["openssl", "dgst", "-sha256", "-sign", path],
                                             input=f"{head}.{body}".encode(), capture_output=True, check=True).stdout
              return f"{head}.{body}.{b64(signature)}"


          class Bot:
              """Installation tokens of bearclave-bot (or of bearclave-promote from its own vault), each limited to what a step needs."""

              def __init__(self, vault: str = VAULT):
                  # Another App (bearclave-promote) keeps the same three secrets in a
                  # vault of its own.
                  self.app_id = secret("github-app-id", vault)
                  self.installation = secret("github-app-installation-id", vault)
                  self._pem = secret("github-app-key", vault)

              def token(self, permissions: dict, repositories=None) -> str:
                  payload = {"permissions": permissions}
                  if repositories:
                      payload["repositories"] = list(repositories)
                  body = request("POST", f"/app/installations/{self.installation}/access_tokens",
                                 jwt(self.app_id, self._pem), payload)
                  return body["token"]


          READ = {"contents": "read", "metadata": "read", "pull_requests": "read"}
          # Writing a branch whose commit changes .github/workflows needs workflows too.
          WRITE = {"contents": "write", "pull_requests": "write", "issues": "write", "workflows": "write", "metadata": "read"}


          def say(line: str = "") -> None:
              print(line)
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as f:
                      f.write(line + "\n")
          __CI_EOF__
          cat >"$RUNNER_TEMP/promote/promote.py" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Promotes a commit of an application's staging branch to production.

          bearclave/governance standards/workflow.md (applications) is the rule: the
          default branch `staging` is what runs in staging, `prod` is what runs in
          production and moves only forward, by this script as the GitHub App
          bearclave-promote (installed only on the applications; its key in a Key
          Vault of its own). A promotion is a release:

          1. checks: the commit is on staging and prod is its ancestor (a
             fast-forward); the newest successful run of the caller's pipeline for the
             commit on staging has a successful staging deployment job; the build
             artifact that production will deploy is still there;
          2. fast-forwards prod to the commit; its push deploys the build of the
             same run - the production job of static-web-app.yml chooses it by the
             same rule (pick_run, then the job); container.yml deploys the image
             :sha-<commit> that staging pushed, so neither needs the version yet;
          3. waits for that production run and, only when it succeeded, tags the
             commit vX.Y.Z (annotated, by the App) and publishes the release with
             notes generated from the pull requests. The tag's push makes
             container.yml tag the image :vX.Y.Z too (the caller's run on the tag,
             which neither counts as a staging nor as a production run).

          The version comes from src/release_version.py (VERSION, worked out in the
          step before). Every step is skipped when it is already done, so a rerun
          after a failure finishes the job: a prod already at the commit is not moved
          again, a commit already tagged is not tagged twice.

          Reading uses GH_TOKEN (the run's own token: actions, contents read);
          writing an installation token of the App limited to this repository, read
          from PROMOTE_VAULT by github_bot.Bot after the job signed in to Azure.

          Environment: GITHUB_REPOSITORY, GH_TOKEN, STAGING_BRANCH, PROD_BRANCH,
          WORKFLOW (the caller's pipeline file, e.g. ci.yml), STAGING_JOB and
          PROD_JOB (the jobs that deploy staging and production, e.g. deploy-staging,
          deploy-prod; each must have succeeded), ARTIFACT (the build artifact;
          empty skips that check), VERSION, SHA (the checkout's HEAD), PROMOTE_VAULT,
          WAIT_MINUTES (for the production run).

          Usage: promote.py            check, then write as bearclave-promote
                 promote.py --dry-run  check and say what would happen
          """
          import datetime
          import os
          import re
          import subprocess
          import sys
          import time

          import github_bot as gh

          VERSION = re.compile(r"v[0-9]+\.[0-9]+\.[0-9]+")
          SHA = re.compile(r"[0-9a-f]{40}")
          VAULT = "kv-ghpromote-sec-weu-001"
          # What the installation token may do, on this repository only. Moving a
          # branch to a commit that changes .github/workflows needs `workflows` too.
          TOKEN_PERMISSIONS = {"contents": "write", "workflows": "write", "metadata": "read"}
          POLL_SECONDS = 20
          # The job of promote.yml times out after 35 minutes; the wait has to end first.
          MAX_WAIT_MINUTES = 30


          class Refused(Exception):
              """The commit may not be promoted; the message says why and what to do."""


          def is_version(tag: str) -> bool:
              return bool(VERSION.fullmatch(tag or ""))


          def parse(tag: str) -> tuple:
              return tuple(int(x) for x in tag[1:].split("."))


          def pick_run(runs: list, branch: str):
              """The newest successful run of the commit on branch, from a push or a manual run."""
              good = [r for r in runs if r.get("head_branch") == branch
                      and r.get("event") in ("push", "workflow_dispatch")
                      and r.get("status") == "completed" and r.get("conclusion") == "success"]
              return max(good, key=lambda r: (r.get("created_at", ""), r.get("id", 0)), default=None)


          def check_run(run, sha: str, branch: str, workflow: str) -> None:
              if run is None:
                  raise Refused(f"no successful run of {workflow} for {sha[:7]} on {branch}: staging never got "
                                f"this commit (a newer push may have taken its place). Promote the head of {branch}.")


          def check_job(jobs: list, name: str) -> None:
              """Refused unless the run's job `name` (in a caller: `pipeline / name`) succeeded."""
              mine = [j for j in jobs if j.get("name", "").split(" / ")[-1] == name]
              if not mine:
                  raise Refused(f"the staging run has no job '{name}': it did not deploy staging.")
              if not all(j.get("conclusion") == "success" for j in mine):
                  raise Refused(f"the job '{name}' of the staging run did not succeed "
                                f"({', '.join(str(j.get('conclusion')) for j in mine)}).")


          def check_artifact(artifacts: list, name: str, now: datetime.datetime) -> dict:
              """The live artifact called name, or Refused; production deploys it."""
              found = [a for a in artifacts if a.get("name") == name]
              if not found:
                  raise Refused(f"the run has no artifact '{name}': production would have nothing to deploy.")
              live = [a for a in found if not a.get("expired")]
              if not live:
                  raise Refused(f"the artifact '{name}' has expired: promote a newer commit of staging "
                                f"(it contains this one).")
              art = max(live, key=lambda a: a.get("created_at", ""))
              expires = art.get("expires_at")
              if expires:
                  left = datetime.datetime.fromisoformat(expires.replace("Z", "+00:00")) - now
                  if left < datetime.timedelta(hours=1):
                      raise Refused(f"the artifact '{name}' expires within an hour ({expires}); "
                                    f"promote a newer commit of staging.")
              return art


          def plan(sha: str, prod_sha: str, prod_is_ancestor: bool, on_staging: bool,
                   tags_at_sha: list, version: str, existing_tags: list) -> dict:
              """What to do: {'move': 'create'|'fast-forward'|None, 'tag': vX.Y.Z|None,
              'release': vX.Y.Z}, or Refused."""
              if not SHA.fullmatch(sha or ""):
                  raise Refused(f"'{sha}' is not a full commit SHA")
              if not on_staging:
                  raise Refused(f"{sha[:7]} is not on the staging branch; only a commit of staging is promoted.")
              if prod_sha and not prod_is_ancestor:
                  raise Refused(f"prod ({prod_sha[:7]}) is not an ancestor of {sha[:7]}: prod moves only "
                                f"forward. To roll back, revert on staging and promote the revert.")
              move = None if prod_sha == sha else ("fast-forward" if prod_sha else "create")
              released = sorted((t for t in tags_at_sha if is_version(t)), key=parse)
              if released and version and version not in released:
                  raise Refused(f"{sha[:7]} is already released as {released[-1]}; it gets no second version "
                                f"({version}). Leave the version input empty to finish that release.")
              if released:
                  # A rerun after the tag, or a commit released earlier: only what is missing.
                  return {"move": move, "tag": None, "release": released[-1]}
              if not version:
                  raise Refused("nothing since the last release calls for one (only docs, test, ci or chore); "
                                "give the version input (vX.Y.Z) to release anyway.")
              if not is_version(version):
                  raise Refused(f"'{version}' is not vX.Y.Z")
              if version in existing_tags:
                  raise Refused(f"{version} already exists on another commit; give a higher version.")
              return {"move": move, "tag": version, "release": version}


          def wait_minutes(value) -> int:
              """The minutes to wait for the production run, or Refused."""
              try:
                  minutes = int(value)
              except (TypeError, ValueError):
                  raise Refused(f"wait-minutes '{value}' is not a number") from None
              if not 0 <= minutes <= MAX_WAIT_MINUTES:
                  raise Refused(f"wait-minutes is {minutes}; it must be 0 to {MAX_WAIT_MINUTES}, because the job "
                                f"times out after 35 minutes")
              return minutes


          def prod_state(runs: list, branch: str):
              """(state, run) of the newest production run of the commit: 'none',
              'pending', 'success' or 'failure'."""
              mine = [r for r in runs if r.get("head_branch") == branch and r.get("event") in ("push", "workflow_dispatch")]
              run = max(mine, key=lambda r: (r.get("created_at", ""), r.get("id", 0)), default=None)
              if run is None:
                  return "none", None
              if run.get("status") != "completed":
                  return "pending", run
              return ("success" if run.get("conclusion") == "success" else "failure"), run


          # --- git and GitHub --------------------------------------------------------------

          def git(*args, check=True) -> subprocess.CompletedProcess:
              return subprocess.run(["git", *args], capture_output=True, text=True, check=check)


          def remote_sha(branch: str) -> str:
              r = git("rev-parse", "--verify", "-q", f"refs/remotes/origin/{branch}^{{commit}}", check=False)
              return r.stdout.strip() if r.returncode == 0 else ""


          def is_ancestor(older: str, newer: str) -> bool:
              return git("merge-base", "--is-ancestor", older, newer, check=False).returncode == 0


          def runs_of(repo: str, workflow: str, sha: str, branch: str, token: str) -> list:
              return gh.request("GET", f"/repos/{repo}/actions/workflows/{workflow}/runs"
                                       f"?head_sha={sha}&branch={branch}&per_page=100", token)["workflow_runs"]


          def wait_for_prod(repo: str, workflow: str, sha: str, prod: str, token: str, minutes: int, sleep=time.sleep):
              """The successful production run of the commit, or Refused."""
              deadline = time.monotonic() + minutes * 60
              while True:
                  state, run = prod_state(runs_of(repo, workflow, sha, prod, token), prod)
                  if state == "success":
                      return run
                  if state == "failure":
                      raise Refused(f"the production run {run.get('html_url')} ended {run.get('conclusion')}: "
                                    f"nothing is tagged. Fix it (a transient error: run {workflow} by hand on "
                                    f"{prod}), then promote again - prod is already at the commit.")
                  if time.monotonic() > deadline:
                      raise Refused(f"the production run of {sha[:7]} did not finish within {minutes} minutes "
                                    f"({state}); promote again once it is green, it then tags.")
                  sleep(POLL_SECONDS)


          def main(dry_run: bool) -> int:
              repo = os.environ["GITHUB_REPOSITORY"]
              staging = os.environ["STAGING_BRANCH"]
              prod = os.environ.get("PROD_BRANCH") or "prod"
              workflow = os.environ["WORKFLOW"]
              staging_job = os.environ.get("STAGING_JOB", "")
              artifact = os.environ.get("ARTIFACT", "")
              version = os.environ.get("VERSION", "")
              vault = os.environ.get("PROMOTE_VAULT") or VAULT
              prod_job = os.environ.get("PROD_JOB", "")
              sha = os.environ.get("SHA") or git("rev-parse", "HEAD").stdout.strip()
              read = os.environ["GH_TOKEN"]

              # The checkout (fetch-depth 0) brought every branch and tag; it keeps no
              # credentials, so nothing is fetched here.
              staging_sha = remote_sha(staging)
              prod_sha = remote_sha(prod)

              gh.say(f"## Promote {sha[:7]} of {repo}{' (dry run)' if dry_run else ''}")
              gh.say()
              gh.say(f"- {staging}: {staging_sha[:7] or 'missing'}, {prod}: {prod_sha[:7] or 'not created yet'}")
              try:
                  if not SHA.fullmatch(sha):
                      raise Refused(f"'{sha}' is not a full commit SHA")
                  minutes = wait_minutes(os.environ.get("WAIT_MINUTES") or 20)
                  if not staging_sha:
                      raise Refused(f"the branch {staging} does not exist")
                  on_staging = is_ancestor(sha, staging_sha)
                  run = pick_run(runs_of(repo, workflow, sha, staging, read), staging)
                  check_run(run, sha, staging, workflow)
                  gh.say(f"- Staging run: {run['html_url']}")
                  if staging_job:
                      jobs = gh.request("GET", f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100", read)["jobs"]
                      check_job(jobs, staging_job)
                      gh.say(f"- Its job {staging_job}: success")
                  if artifact:
                      arts = gh.request("GET", f"/repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100",
                                        read)["artifacts"]
                      art = check_artifact(arts, artifact, datetime.datetime.now(datetime.timezone.utc))
                      gh.say(f"- Build artifact: '{artifact}' of that run, expires {art.get('expires_at')}")
                  tags_at = git("tag", "--points-at", sha).stdout.split()
                  existing = git("tag", "--list", "v*").stdout.split()
                  todo = plan(sha, prod_sha, is_ancestor(prod_sha, sha) if prod_sha else True,
                              on_staging, tags_at, version, existing)
              except Refused as e:
                  print(f"::error title=promote::{e}")
                  gh.say(f"\n**Refused:** {e}")
                  return 1

              gh.say(f"- {prod}: {todo['move'] or 'already at the commit'}")
              gh.say(f"- Tag: {todo['tag'] or 'already tagged ' + todo['release']}, once production is deployed")
              gh.say(f"- Release: {todo['release']}")
              if dry_run:
                  gh.say("\nDry run: nothing written.")
                  return 0

              token = gh.Bot(vault).token(TOKEN_PERMISSIONS, [repo.split("/", 1)[1]])
              print(f"::add-mask::{token}")
              if todo["move"] == "create":
                  gh.request("POST", f"/repos/{repo}/git/refs", token, {"ref": f"refs/heads/{prod}", "sha": sha})
              elif todo["move"] == "fast-forward":
                  # force false: GitHub refuses anything but a fast-forward.
                  gh.request("PATCH", f"/repos/{repo}/git/refs/heads/{prod}", token, {"sha": sha, "force": False})
              if todo["move"]:
                  gh.say(f"\n{prod} is at {sha[:7]}; waiting for its production run.")
              try:
                  prod_run = wait_for_prod(repo, workflow, sha, prod, read, minutes)
                  if prod_job:
                      # A green run whose deployment was skipped deployed nothing.
                      jobs = gh.request("GET", f"/repos/{repo}/actions/runs/{prod_run['id']}/jobs?per_page=100", read)["jobs"]
                      check_job(jobs, prod_job)
              except Refused as e:
                  print(f"::error title=promote::{e}")
                  gh.say(f"\n**Not released:** {e}")
                  return 1
              gh.say(f"Production run: {prod_run['html_url']} (success)")
              if todo["tag"]:
                  tag = gh.request("POST", f"/repos/{repo}/git/tags", token,
                                   {"tag": todo["tag"], "message": todo["tag"], "object": sha, "type": "commit"})
                  gh.request("POST", f"/repos/{repo}/git/refs", token,
                             {"ref": f"refs/tags/{todo['tag']}", "sha": tag["sha"]})
                  gh.say(f"Tagged {todo['tag']}.")
              try:
                  existing_release = gh.request("GET", f"/repos/{repo}/releases/tags/{todo['release']}", token)
              except gh.NotFound:
                  existing_release = None
              if existing_release:
                  gh.say(f"Release {todo['release']}: {existing_release.get('html_url')} (already published)")
              else:
                  rel = gh.request("POST", f"/repos/{repo}/releases", token,
                                   {"tag_name": todo["release"], "name": todo["release"],
                                    "generate_release_notes": True, "make_latest": "true"})
                  gh.say(f"Release {todo['release']}: {rel.get('html_url')}")
              return 0


          if __name__ == "__main__":
              sys.exit(main("--dry-run" in sys.argv[1:]))
          __CI_EOF__

      - name: Next version
        id: next
        env:
          VERSION: ${{ inputs.version }}
          RELEASED_BY_PROMOTE: "true"
        run: python3 "$RUNNER_TEMP/promote/release_version.py" "$VERSION"

      - name: Sign in to Azure
        if: ${{ !inputs.dry-run }}
        env:
          AZURE_CLIENT_ID: ${{ inputs.client-id }}
          AZURE_TENANT_ID: ${{ inputs.tenant-id }}
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
          ARTIFACT: ${{ inputs.artifact }}
          STAGING_JOB: ${{ inputs.staging-job }}
          PROD_JOB: ${{ inputs.prod-job }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
          PROMOTE_VAULT: ${{ inputs.vault }}
          VERSION: ${{ steps.next.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          export SHA
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 "$RUNNER_TEMP/promote/promote.py" "${args[@]}"
