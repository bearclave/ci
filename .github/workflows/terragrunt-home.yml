# GENERATED by tools/build.py from templates/terragrunt-home.yml - edit the template or src/, not this file.
# The pipeline of the home network (iac-home): a router reached through
# WireGuard, a certificate renewed on schedule.
#
# Pull request into main -> plan of every unit, summarised in the run
# Push to main            -> plan, then apply in the home-prod environment
# Schedule (weekly)       -> plan of main; renews the Let's Encrypt
#                           certificate when due, any other change is drift
#                           and fails the run
# Manual run on main      -> as a push
#
# GitHub's runners reach the router through WireGuard: the runner joins the
# home network with the repository's own script (vpn-script up|down), which
# reads its keys from the vault and maps the router's internal name.
#
# One router, one state, one WireGuard peer: the caller's concurrency group
# never lets two runs overlap, a pull request plan included.
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/terragrunt-home.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#       with:
#         client-id: ${{ vars.AZURE_CLIENT_ID }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#       secrets:
#         modules-deploy-key: ${{ secrets.MODULES_DEPLOY_KEY }}
#
# Versions: TERRAFORM_VERSION and TERRAGRUNT_* in the caller's
# .github/tool-versions.env. The required check is "pipeline / gate".
name: terragrunt-home

on:
  workflow_call:
    inputs:
      client-id:
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      environment:
        type: string
        default: home-prod
      working-directory:
        description: Directory whose units are planned and applied
        type: string
        default: router-hap
      renewal-unit:
        description: Unit under working-directory a scheduled run may apply (certificate renewal)
        type: string
        default: letsencrypt
      vpn-script:
        description: Script of the repository that joins (up) and leaves (down) the home network (default tools/home-vpn.sh, or scripts/home-vpn.sh before the move to tools/)
        type: string
        default: ""
      shellcheck-paths:
        description: Shell scripts of the repository to check, space-separated globs (default tools/*.sh tools/bootstrap/render.sh nas/acme/*.sh, or the same under scripts/ and bootstrap/ before the move to tools/)
        type: string
        default: ""
      conventions-config:
        description: Path of the conventions file (default .github/conventions.yaml, or conventions.yaml where it is still in the root)
        type: string
        default: ""
    secrets:
      modules-deploy-key:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ inputs.tenant-id }}
  ARM_CLIENT_ID: ${{ inputs.client-id }}
  TG_NON_INTERACTIVE: "true"
  # Plain log lines, so the plan summary can be read from them.
  TG_NO_COLOR: "true"
  TG_SOURCE_MAP: git::https://github.com/bearclave/iac-modules=${{ github.workspace }}/iac-modules

jobs:
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conventions
        env:
          CONFIG: ${{ inputs.conventions-config }}
        run: |
          script="$RUNNER_TEMP/conventions.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks a repository against the conventions its conventions.yaml names.

          Usage: conventions.py <config.json> [<repository root>]

          The workflow converts conventions.yaml to JSON first (yq), so that this script
          needs nothing beyond the Python standard library. The config:

            rules:       <rule>: {level: error | warn | off, ...parameters}
            units:       globs of the unit files (terragrunt.hcl) for the terragrunt rules
            exceptions:  [{rule, path (a glob), match (optional text on the line),
                           reason, review (YYYY-MM-DD)}] - an exception without a reason
                           is itself an error; the review date is checked by
                           exception_review.py, which warns once it has passed

          Every violation becomes a GitHub annotation on its file and line, and a row
          in the job summary. The exit code is 1 when an error-level violation is not
          covered by an exception, or when the config itself is wrong.

          The rules read HCL through the small parser below: blocks, attributes,
          strings, heredocs and comments, enough to know what is a `default` inside a
          `variable` block and what is a comment above an attribute. Expressions are
          kept as tokens, not evaluated.
          """
          import json
          import os
          import re
          import subprocess
          import sys

          # --------------------------------------------------------------------------
          # HCL tokens and structure

          GUID = r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
          RE_IDENT = re.compile(r"[A-Za-z_][A-Za-z0-9_-]*")
          RE_HEREDOC = re.compile(r"<<-?([A-Za-z_][A-Za-z0-9_]*)[ \t]*\n")


          class Token:
              __slots__ = ("kind", "value", "line")

              def __init__(self, kind, value, line):
                  self.kind, self.value, self.line = kind, value, line

              def __repr__(self):
                  return f"{self.kind}:{self.value!r}@{self.line}"


          def tokenize(text: str):
              """Tokens plus the set of lines that carry a comment."""
              tokens, comments = [], set()
              i, line, n = 0, 1, len(text)
              while i < n:
                  c = text[i]
                  if c == "\n":
                      tokens.append(Token("nl", "\n", line))
                      line += 1
                      i += 1
                  elif c in " \t\r":
                      i += 1
                  elif c == "#" or text.startswith("//", i):
                      comments.add(line)
                      while i < n and text[i] != "\n":
                          i += 1
                  elif text.startswith("/*", i):
                      end = text.find("*/", i + 2)
                      end = n if end < 0 else end + 2
                      for k in range(text.count("\n", i, end) + 1):
                          comments.add(line + k)
                      line += text.count("\n", i, end)
                      i = end
                  elif c == '"':
                      start_line = line
                      i, value = read_string(text, i + 1)
                      line += value.count("\n")
                      tokens.append(Token("str", value, start_line))
                  elif (m := RE_HEREDOC.match(text, i)):
                      marker, start_line = m.group(1), line
                      body_start = m.end()
                      j, body = body_start, []
                      line += 1
                      while j < n:
                          end = text.find("\n", j)
                          end = n if end < 0 else end
                          current = text[j:end]
                          if current.strip() == marker:
                              j = end
                              break
                          body.append(current)
                          line += 1
                          j = end + 1
                      tokens.append(Token("str", "\n".join(body), start_line))
                      i = j
                  elif (m := RE_IDENT.match(text, i)):
                      tokens.append(Token("ident", m.group(0), line))
                      i = m.end()
                  else:
                      tokens.append(Token("punct", c, line))
                      i += 1
              tokens.append(Token("nl", "\n", line))
              return tokens, comments


          def read_string(text: str, i: int):
              """The raw content of a quoted string from i to its closing quote."""
              out, n, depth = [], len(text), 0
              while i < n:
                  c = text[i]
                  if c == "\\" and i + 1 < n:
                      out.append(text[i:i + 2])
                      i += 2
                      continue
                  if depth == 0 and c == '"':
                      return i + 1, "".join(out)
                  if text.startswith(("${", "%{"), i):
                      depth += 1
                      out.append(text[i:i + 2])
                      i += 2
                      continue
                  if depth and c == "{":
                      depth += 1
                  elif depth and c == "}":
                      depth -= 1
                  elif depth and c == '"':
                      j, inner = read_string(text, i + 1)
                      out.append('"' + inner + '"')
                      i = j
                      continue
                  out.append(c)
                  i += 1
              return n, "".join(out)


          class Block:
              def __init__(self, kind, labels, line):
                  self.kind, self.labels, self.line = kind, labels, line
                  self.attrs, self.blocks = {}, []

              def find(self, kind):
                  return [b for b in self.blocks if b.kind == kind]


          class Attr:
              def __init__(self, name, line, value):
                  self.name, self.line, self.value = name, line, value

              def string(self):
                  """The value when it is one plain string, else None."""
                  if len(self.value) == 1 and self.value[0].kind == "str":
                      return self.value[0].value
                  return None

              def text(self):
                  return "".join(t.value if t.kind != "str" else f'"{t.value}"' for t in self.value)


          OPEN, CLOSE = "([{", ")]}"


          def parse(tokens):
              root = Block("<file>", [], 1)
              body(tokens, 0, root)
              return root


          def body(tokens, i, block):
              """Fills block from tokens[i] up to its closing brace; returns the index after."""
              n = len(tokens)
              while i < n:
                  t = tokens[i]
                  if t.kind == "nl":
                      i += 1
                      continue
                  if t.kind == "punct" and t.value == "}":
                      return i + 1
                  if t.kind == "ident":
                      j = i + 1
                      if j < n and tokens[j].kind == "punct" and tokens[j].value in "=:":
                          start, depth, k = j + 1, 0, j + 1
                          while k < n:
                              tk = tokens[k]
                              if tk.kind == "punct" and tk.value in OPEN:
                                  depth += 1
                              elif tk.kind == "punct" and tk.value in CLOSE:
                                  if depth == 0:
                                      break
                                  depth -= 1
                              elif tk.kind == "nl" and depth == 0:
                                  break
                              k += 1
                          value = [x for x in tokens[start:k] if x.kind != "nl"]
                          block.attrs[t.value] = Attr(t.value, t.line, value)
                          i = k
                          continue
                      labels = []
                      while j < n and tokens[j].kind in ("str", "ident"):
                          labels.append(tokens[j].value)
                          j += 1
                      if j < n and tokens[j].kind == "punct" and tokens[j].value == "{":
                          child = Block(t.value, labels, t.line)
                          block.blocks.append(child)
                          i = body(tokens, j + 1, child)
                          continue
                  i += 1
              return i


          def literal(tokens):
              """A literal value (string, number, bool, list, object) from tokens, or None."""
              try:
                  value, rest = _literal(tokens, 0)
              except (IndexError, ValueError):
                  return None
              return value if rest == len(tokens) else None


          def _literal(tokens, i):
              t = tokens[i]
              if t.kind == "str":
                  return t.value, i + 1
              if t.kind == "ident" and t.value in ("true", "false", "null"):
                  return {"true": True, "false": False, "null": None}[t.value], i + 1
              if t.kind == "punct" and t.value == "[":
                  out, i = [], i + 1
                  while not (tokens[i].kind == "punct" and tokens[i].value == "]"):
                      v, i = _literal(tokens, i)
                      out.append(v)
                      if tokens[i].kind == "punct" and tokens[i].value == ",":
                          i += 1
                  return out, i + 1
              if t.kind == "punct" and t.value == "{":
                  out, i = {}, i + 1
                  while not (tokens[i].kind == "punct" and tokens[i].value == "}"):
                      key = tokens[i].value
                      if tokens[i + 1].kind != "punct" or tokens[i + 1].value not in "=:":
                          raise ValueError("not an object")
                      v, i = _literal(tokens, i + 2)
                      out[key] = v
                      if tokens[i].kind == "punct" and tokens[i].value == ",":
                          i += 1
                  return out, i + 1
              raise ValueError("not a literal")


          def load(path):
              with open(path, encoding="utf-8") as fh:
                  tokens, comments = tokenize(fh.read())
              return parse(tokens), tokens, comments


          # --------------------------------------------------------------------------
          # The repository

          def glob_re(pattern: str):
              """A glob where * stays within a directory and **/ spans any number of them."""
              out, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif pattern[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  elif pattern[i] == "?":
                      out, i = out + "[^/]", i + 1
                  else:
                      out, i = out + re.escape(pattern[i]), i + 1
              return re.compile(out + r"\Z")


          def matches(path: str, *patterns) -> bool:
              return any(glob_re(p).match(path) for p in patterns)


          class Repo:
              def __init__(self, root):
                  self.root = root
                  out = subprocess.run(["git", "ls-files"], cwd=root, capture_output=True,
                                       text=True, check=True).stdout
                  self.files = sorted(f for f in out.splitlines() if os.path.isfile(os.path.join(root, f)))
                  self._cache = {}

              def glob(self, *patterns):
                  return [f for f in self.files if matches(f, *patterns)]

              def hcl(self, path):
                  if path not in self._cache:
                      self._cache[path] = load(os.path.join(self.root, path))
                  return self._cache[path]

              def exists(self, path):
                  return path in self.files


          class Report:
              def __init__(self):
                  self.items = []

              def add(self, rule, path, line, message):
                  self.items.append({"rule": rule, "path": path, "line": line, "message": message})


          # --------------------------------------------------------------------------
          # Rules. Each takes (repo, params, units, report) and adds what it finds.

          def rule_variable_no_default(repo, params, units, report):
              """Module variables have no default; `optional(type, default)` counts too."""
              for path in repo.glob(*params.get("files", ["**/*.tf"])):
                  root, _, _ = repo.hcl(path)
                  for var in root.find("variable"):
                      name = var.labels[0] if var.labels else "?"
                      if "default" in var.attrs:
                          report.add("variable-no-default", path, var.attrs["default"].line,
                                     f'variable "{name}" has a default')
                      if "type" in var.attrs:
                          for line in optional_defaults(var.attrs["type"].value):
                              report.add("variable-no-default", path, line,
                                         f'variable "{name}": optional() with a default')


          def optional_defaults(tokens):
              """Lines of optional(...) calls that pass a second argument."""
              out = []
              for k, t in enumerate(tokens):
                  if t.kind == "ident" and t.value == "optional" and k + 1 < len(tokens) \
                          and tokens[k + 1].value == "(":
                      depth, j = 0, k + 1
                      while j < len(tokens):
                          v = tokens[j]
                          if v.kind == "punct" and v.value in OPEN:
                              depth += 1
                          elif v.kind == "punct" and v.value in CLOSE:
                              depth -= 1
                              if depth == 0:
                                  break
                          elif v.kind == "punct" and v.value == "," and depth == 1:
                              out.append(t.line)
                              break
                          j += 1
              return out


          def rule_variable_documented(repo, params, units, report):
              """Every module variable says what it is (description) and what it takes (type)."""
              for path in repo.glob(*params.get("files", ["**/*.tf"])):
                  root, _, _ = repo.hcl(path)
                  for var in root.find("variable"):
                      missing = [a for a in ("description", "type") if a not in var.attrs]
                      if missing:
                          report.add("variable-documented", path, var.line,
                                     f'variable "{var.labels[0] if var.labels else "?"}" has no '
                                     + " and no ".join(missing))


          def rule_module_source(repo, params, units, report):
              """A unit takes its module from git, through the modules and modules_ref of root.hcl."""
              pattern = re.compile(params.get(
                  "pattern", r"^\$\{include\.root\.locals\.modules\}//[^?]+\?ref=\$\{include\.root\.locals\.modules_ref\}$"))
              for path in units:
                  root, _, _ = repo.hcl(path)
                  sources = [b.attrs["source"] for b in root.find("terraform") if "source" in b.attrs]
                  if not sources:
                      report.add("module-source", path, 1, "the unit names no terraform source")
                  for attr in sources:
                      value = attr.string()
                      if value is None or not pattern.match(value):
                          report.add("module-source", path, attr.line,
                                     f"source {attr.text()} is not the module from git with modules_ref")


          def rule_dependencies_in_common(repo, params, units, report):
              """A dependency is declared once, in the shared directory, with its mocks."""
              where = params.get("dir", "_common/deps")
              for path in units:
                  root, _, _ = repo.hcl(path)
                  for dep in root.find("dependency"):
                      report.add("dependencies-in-common", path, dep.line,
                                 f'dependency "{dep.labels[0] if dep.labels else "?"}" belongs in {where}/')


          def rule_mock_outputs(repo, params, units, report):
              """Every dependency has mocks, and the mocks never reach an apply or a destroy."""
              where = params.get("dir", "_common/deps").rstrip("/")
              forbidden = set(params.get("forbidden_commands", ["apply", "destroy"]))
              mocks = {}
              if params.get("mocks_file") and repo.exists(params["mocks_file"]):
                  mroot, _, _ = repo.hcl(params["mocks_file"])
                  for loc in mroot.find("locals"):
                      for name, attr in loc.attrs.items():
                          mocks[name] = literal(attr.value)
              for path in repo.glob(f"{where}/*.hcl"):
                  root, _, _ = repo.hcl(path)
                  for dep in root.find("dependency"):
                      label = dep.labels[0] if dep.labels else "?"
                      for needed in ("mock_outputs", "mock_outputs_allowed_terraform_commands"):
                          if needed not in dep.attrs:
                              report.add("mock-outputs", path, dep.line, f'dependency "{label}" has no {needed}')
                      attr = dep.attrs.get("mock_outputs_allowed_terraform_commands")
                      if not attr:
                          continue
                      commands = literal(attr.value)
                      ref = attr.text()
                      if commands is None and (m := re.fullmatch(r"local\.mocks\.(\w+)", ref)):
                          commands = mocks.get(m.group(1))
                      if not isinstance(commands, list):
                          report.add("mock-outputs", path, attr.line,
                                     f"cannot tell which commands {ref} allows")
                      elif bad := sorted(forbidden & set(commands)):
                          report.add("mock-outputs", path, attr.line,
                                     f'dependency "{label}" allows its mocks in {", ".join(bad)}')


          def rule_tags_required(repo, params, units, report):
              """Context files carry the tags their level owns, with an allowed value."""
              allowed = {}
              if params.get("allowed_values") and repo.exists(params["allowed_values"]):
                  aroot, _, _ = repo.hcl(params["allowed_values"])
                  for loc in aroot.find("locals"):
                      if "allowed" in loc.attrs:
                          allowed = literal(loc.attrs["allowed"].value) or {}
              for name, keys in (params.get("files") or {}).items():
                  for path in repo.glob(f"**/{name}"):
                      root, _, _ = repo.hcl(path)
                      attrs = {}
                      for loc in root.find("locals"):
                          attrs.update(loc.attrs)
                      for key in keys:
                          if key not in attrs:
                              report.add("tags-required", path, 1, f"{name} sets no {key}")
                              continue
                          value = attrs[key].string()
                          if key in allowed and value not in allowed[key]:
                              report.add("tags-required", path, attrs[key].line,
                                         f"{key} = {attrs[key].text()} is not one of {', '.join(allowed[key])}")


          def rule_no_hardcoded_ids(repo, params, units, report):
              """Units take subscription and tenant IDs from the context, never written out."""
              known = set()
              for path in repo.glob(*params.get("id_files", ["account.hcl", "**/subscription.hcl"])):
                  _, tokens, _ = repo.hcl(path)
                  known |= {t.value.lower() for t in tokens if t.kind == "str" and re.fullmatch(GUID, t.value)}
              sub = re.compile(r"/subscriptions/" + GUID, re.I)
              for path in units:
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind != "str":
                          continue
                      if sub.search(t.value):
                          report.add("no-hardcoded-ids", path, t.line, "a resource ID with a subscription written out")
                      elif any(g.lower() in known for g in re.findall(GUID, t.value)):
                          report.add("no-hardcoded-ids", path, t.line,
                                     "a subscription or tenant ID written out instead of taken from the context")


          def rule_no_hardcoded_location(repo, params, units, report):
              """The region comes from region.hcl."""
              regions = {r.lower() for r in params.get("locations", [])}
              for path in units:
                  _, tokens, _ = repo.hcl(path)
                  for t in tokens:
                      if t.kind == "str" and t.value.lower() in regions:
                          report.add("no-hardcoded-location", path, t.line,
                                     f'region "{t.value}" written out instead of taken from region.hcl')


          def rule_no_envcommon(repo, params, units, report):
              """No _envcommon: every unit carries its own inputs."""
              for path in repo.files:
                  if "_envcommon/" in f"/{path}" or path.startswith("_envcommon/"):
                      report.add("no-envcommon", path, 1, "_envcommon is not used here")


          def rule_lock_none_needs_reason(repo, params, units, report):
              """An unlocked resource in a resource group of high criticality says why."""
              levels = set(params.get("criticality", ["high"]))
              for path in units:
                  root, _, comments = repo.hcl(path)
                  attr = None
                  for item in [root] + root.blocks:
                      if "inputs" in item.attrs:
                          obj = item.attrs["inputs"]
                          for k, t in enumerate(obj.value):
                              if t.kind == "ident" and t.value == "lock" and k + 2 < len(obj.value) \
                                      and obj.value[k + 1].value in "=:" and obj.value[k + 2].kind == "str":
                                  attr = (t.line, obj.value[k + 2].value)
                  if not attr or attr[1] != "none":
                      continue
                  rg = nearest(repo, os.path.dirname(path), "rg.hcl")
                  if not rg:
                      continue
                  rroot, _, _ = repo.hcl(rg)
                  crit = None
                  for loc in rroot.find("locals"):
                      if "criticality" in loc.attrs:
                          crit = loc.attrs["criticality"].string()
                  line = attr[0]
                  if crit in levels and line not in comments and (line - 1) not in comments:
                      report.add("lock-none-needs-reason", path, line,
                                 f'lock = "none" in a resource group of criticality {crit}, with no comment saying why')


          def nearest(repo, directory, name):
              while True:
                  candidate = os.path.join(directory, name) if directory else name
                  if repo.exists(candidate):
                      return candidate
                  if not directory:
                      return None
                  directory = os.path.dirname(directory)


          RULES = {
              "variable-no-default": rule_variable_no_default,
              "variable-documented": rule_variable_documented,
              "module-source": rule_module_source,
              "dependencies-in-common": rule_dependencies_in_common,
              "mock-outputs": rule_mock_outputs,
              "tags-required": rule_tags_required,
              "no-hardcoded-ids": rule_no_hardcoded_ids,
              "no-hardcoded-location": rule_no_hardcoded_location,
              "no-envcommon": rule_no_envcommon,
              "lock-none-needs-reason": rule_lock_none_needs_reason,
          }
          LEVELS = ("error", "warn", "off")


          # --------------------------------------------------------------------------

          def check(config: dict, root: str):
              """(violations with their level and exception, config errors)."""
              errors = []
              rules = config.get("rules") or {}
              for name, params in rules.items():
                  if name not in RULES:
                      errors.append(f"unknown rule {name!r}; known: {', '.join(sorted(RULES))}")
                  elif (params or {}).get("level", "error") not in LEVELS:
                      errors.append(f"rule {name}: level must be one of {', '.join(LEVELS)}")
              exceptions = config.get("exceptions") or []
              for k, e in enumerate(exceptions):
                  if not str(e.get("reason", "")).strip():
                      errors.append(f"exception {k + 1} ({e.get('rule')}, {e.get('path')}) has no reason")
                  if e.get("rule") not in RULES:
                      errors.append(f"exception {k + 1} names an unknown rule {e.get('rule')!r}")
              if errors:
                  return [], errors

              repo = Repo(root)
              units = repo.glob(*(config.get("units") or []))
              report = Report()
              for name, params in rules.items():
                  params = params or {}
                  if params.get("level", "error") == "off":
                      continue
                  try:
                      RULES[name](repo, params, units, report)
                  except (OSError, ValueError) as e:
                      errors.append(f"rule {name} could not run: {e}")
              lines = {}
              for v in report.items:
                  v["level"] = (rules[v["rule"]] or {}).get("level", "error")
                  v["exception"] = None
                  for e in exceptions:
                      if e["rule"] != v["rule"] or not matches(v["path"], e.get("path", "**")):
                          continue
                      if e.get("match"):
                          if v["path"] not in lines:
                              with open(os.path.join(root, v["path"]), encoding="utf-8") as fh:
                                  lines[v["path"]] = fh.read().splitlines()
                          text = lines[v["path"]][v["line"] - 1] if 0 < v["line"] <= len(lines[v["path"]]) else ""
                          if e["match"] not in text and e["match"] not in v["message"]:
                              continue
                      v["exception"] = e["reason"]
                      break
              return report.items, errors


          def escape(text: str) -> str:
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(config_path: str, root: str = ".") -> int:
              with open(config_path, encoding="utf-8") as fh:
                  config = json.load(fh) or {}
              violations, errors = check(config, root)
              for e in errors:
                  print(f"::error title=conventions::{escape(e)}")
              failing = 0
              for v in violations:
                  if v["exception"]:
                      continue
                  kind = "error" if v["level"] == "error" else "warning"
                  failing += kind == "error"
                  print(f"::{kind} file={v['path']},line={v['line']},title={v['rule']}::{escape(v['message'])}")

              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              out = ["## Conventions", ""]
              active = [v for v in violations if not v["exception"]]
              accepted = [v for v in violations if v["exception"]]
              if not violations and not errors:
                  out.append("Every rule holds.")
              for title, rows, extra in (("Violations", active, "level"), ("Accepted", accepted, "exception")):
                  if not rows:
                      continue
                  out += ["", f"### {title}", "", f"| Rule | Where | What | {extra.capitalize()} |", "|---|---|---|---|"]
                  out += [f"| {v['rule']} | `{v['path']}:{v['line']}` | {v['message'].replace('|', '/')} "
                          f"| {str(v[extra]).replace('|', '/')} |" for v in rows]
              if errors:
                  out += ["", "### Config errors", ""] + [f"- {e}" for e in errors]
              text = "\n".join(out) + "\n"
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(text)
              else:
                  print(text)
              return 1 if failing or errors else 0


          if __name__ == "__main__":
              sys.exit(main(*sys.argv[1:3]))
          __CI_EOF__
          if [ -z "$CONFIG" ]; then
            CONFIG=.github/conventions.yaml
            [ -f "$CONFIG" ] || CONFIG=conventions.yaml
          fi
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found"
            exit 1
          fi
          yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/conventions.json"
          python3 "$script" "$RUNNER_TEMP/conventions.json" .

      # Every exception of the repository (conventions, Sentinel lint, trivy) has a
      # reason and a review date; a date that has passed is a warning.
      - name: Exception reviews
        if: ${{ !cancelled() }}
        run: |
          script="$RUNNER_TEMP/exception_review.py"
          cat >"$script" <<'__CI_EOF__'
          #!/usr/bin/env python3
          """Checks the exceptions of a repository: each says why, and when to look again.

          Usage: exception_review.py [--today YYYY-MM-DD] <kind>=<file> [<kind>=<file> ...]

          Kinds and the file each reads (the YAML ones converted to JSON by yq first,
          so that this needs nothing beyond the standard library):

            conventions  .github/conventions.yaml   exceptions[]: rule, path, reason, review
                                                    layout.exceptions[]: path, reason, review (optional)
            sentinel     .github/sentinel-lint.yaml exceptions[]: rule, path, reason, review
            trivy        .github/trivyignore.yaml   <section>[]: id, paths, statement, review
            gitleaks     .gitleaks.toml             [[allowlists]]: description ending in
                                                    "review: YYYY-MM-DD"

          `review` is the date (YYYY-MM-DD) by which the exception is looked at again:
          still needed, still for the same reason. A date that has passed is a warning,
          not a failure - the finding stays accepted until someone decides. A missing
          reason or a date that is not a date fails; a missing date is a warning.

          `<file>` is what the annotation names; `<kind>=<file>:<json>` reads the
          converted JSON from <json> and names <file>.
          """
          import datetime
          import json
          import os
          import re
          import sys
          import tomllib

          RE_DATE = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          RE_GITLEAKS_REVIEW = re.compile(r"^\s*review:\s*(\S+)\s*$", re.I | re.M)
          TRIVY_SECTIONS = ("misconfigurations", "vulnerabilities", "secrets", "licenses")


          def entries(kind: str, data) -> list:
              """(label, reason, review, required) for every exception in the file."""
              out = []
              if kind == "conventions":
                  for e in (data or {}).get("exceptions") or []:
                      out.append((f"{e.get('rule')} {e.get('path', '')}".strip(), e.get("reason"), e.get("review"), True))
                  for e in ((data or {}).get("layout") or {}).get("exceptions") or []:
                      # The layout exceptions are structure (a folder that has to be
                      # where it is); a review date is welcome but not asked for.
                      out.append((f"layout {e.get('path')}", e.get("reason"), e.get("review"), False))
              elif kind == "sentinel":
                  for e in (data or {}).get("exceptions") or []:
                      rule = e.get("rule") if "check" not in e else e.get("check")
                      path = e.get("path") if "check" not in e else e.get("rule")
                      out.append((f"{rule} {path or ''}".strip(), e.get("reason"), e.get("review"), True))
              elif kind == "trivy":
                  for section in TRIVY_SECTIONS:
                      for e in (data or {}).get(section) or []:
                          paths = e.get("paths") or []
                          where = f" ({len(paths)} paths)" if len(paths) > 1 else (f" {paths[0]}" if paths else "")
                          out.append((f"{e.get('id')}{where}", e.get("statement"), e.get("review"), True))
              elif kind == "gitleaks":
                  lists = list(data.get("allowlists") or [])
                  if data.get("allowlist"):
                      lists.insert(0, data["allowlist"])
                  for k, e in enumerate(lists):
                      description = str(e.get("description") or "")
                      m = RE_GITLEAKS_REVIEW.search(description)
                      reason = RE_GITLEAKS_REVIEW.sub("", description).strip()
                      out.append((f"allowlist {k + 1}", reason, m.group(1) if m else None, True))
              else:
                  raise ValueError(f"unknown kind {kind!r}")
              return out


          def review(kind: str, data, today: datetime.date) -> tuple:
              """(errors, warnings, rows) for one file; rows feed the job summary."""
              errors, warnings, rows = [], [], []
              for label, reason, date, required in entries(kind, data):
                  if not str(reason or "").strip():
                      errors.append(f"exception {label} has no reason")
                  if date in (None, ""):
                      if required:
                          warnings.append(f"exception {label} has no review date (review: YYYY-MM-DD)")
                      continue
                  date = str(date)
                  if not RE_DATE.match(date):
                      errors.append(f"exception {label}: review {date!r} is not a date (YYYY-MM-DD)")
                      continue
                  try:
                      due = datetime.date.fromisoformat(date)
                  except ValueError:
                      errors.append(f"exception {label}: review {date!r} is not a date (YYYY-MM-DD)")
                      continue
                  if due < today:
                      warnings.append(f"exception {label} was due for review on {date}: is it still needed?")
                  rows.append((label, date, due < today))
              return errors, warnings, rows


          def load(kind: str, path: str):
              if kind == "gitleaks":
                  with open(path, "rb") as fh:
                      return tomllib.load(fh)
              with open(path, encoding="utf-8") as fh:
                  return json.load(fh)


          def escape(text: str) -> str:
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main(args: list) -> int:
              today = datetime.date.today()
              if args[:1] == ["--today"]:
                  today, args = datetime.date.fromisoformat(args[1]), args[2:]
              if not args:
                  print(__doc__)
                  return 2
              failed, summary = False, []
              for arg in args:
                  kind, _, rest = arg.partition("=")
                  name, _, source = rest.partition(":")
                  try:
                      data = load(kind, source or name)
                      errors, warnings, rows = review(kind, data, today)
                  except (OSError, ValueError, tomllib.TOMLDecodeError) as e:
                      errors, warnings, rows = [f"cannot read: {e}"], [], []
                  for e in errors:
                      print(f"::error file={name},title=exception::{escape(e)}")
                  for w in warnings:
                      print(f"::warning file={name},title=exception review::{escape(w)}")
                  failed |= bool(errors)
                  summary += [f"| `{name}` | {label.replace('|', '/')} | {date}{' - **due**' if due else ''} |"
                              for label, date, due in rows]
              if summary:
                  text = "## Exceptions\n\n| File | Exception | Review |\n|---|---|---|\n" + "\n".join(summary) + "\n"
                  if os.environ.get("GITHUB_STEP_SUMMARY"):
                      with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                          fh.write(text)
                  else:
                      print(text)
              return 1 if failed else 0


          if __name__ == "__main__":
              sys.exit(main(sys.argv[1:]))
          __CI_EOF__
          args=()
          for pair in conventions:.github/conventions.yaml conventions:conventions.yaml \
              sentinel:.github/sentinel-lint.yaml sentinel:sentinel-lint.yaml \
              trivy:.github/trivyignore.yaml trivy:.trivyignore.yaml; do
            kind=${pair%%:*} file=${pair#*:}
            # The first of the two paths of a kind wins (.github/ before the root).
            case " ${args[*]} " in *" $kind="*) continue ;; esac
            [ -f "$file" ] || continue
            json="$RUNNER_TEMP/review-$kind.json"
            yq -o=json '.' "$file" >"$json"
            args+=("$kind=$file:$json")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "No exception files."
            exit 0
          fi
          python3 "$script" "${args[@]}"

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      certificates_due: ${{ steps.plan.outputs.certificates_due }}
      drift: ${{ steps.plan.outputs.drift }}
    env:
      # A preview does not lock the state: a cancelled run would leave its
      # lock behind.
      TF_CLI_ARGS_plan: ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Terragrunt cannot authenticate its own git against a private repository,
      # so the modules go on disk and TG_SOURCE_MAP points there.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bearclave/iac-modules
          path: iac-modules
          ssh-key: ${{ secrets.modules-deploy-key }}
          persist-credentials: false

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          for tool in "$@"; do
            "install_$tool"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Install terragrunt and wireguard-tools
        run: |
          set -euo pipefail
          install-tools.sh terragrunt
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools >/dev/null

      - name: HCL formatting
        run: terragrunt hcl fmt --check --diff

      - name: Shell scripts
        env:
          SCRIPTS: ${{ inputs.shellcheck-paths || (hashFiles('tools/home-vpn.sh') != '' && 'tools/*.sh tools/bootstrap/render.sh nas/acme/*.sh' || 'scripts/*.sh bootstrap/render.sh nas/acme/*.sh') }}
        run: |
          # shellcheck disable=SC2086 # the globs are meant to expand
          shellcheck $SCRIPTS

      - name: Join the home network
        env:
          VPN: ${{ inputs.vpn-script || (hashFiles('tools/home-vpn.sh') != '' && 'tools/home-vpn.sh' || 'scripts/home-vpn.sh') }}
        run: '"./$VPN" up'

      # Changes are read from the plan output (a "Plan:" line); run --all does
      # not pass terraform's detailed exit code through reliably. The run
      # summary gets every unit's plan line, the log the full plans.
      - name: Plan
        id: plan
        working-directory: ${{ inputs.working-directory }}
        env:
          RENEWAL: ${{ inputs.renewal-unit }}
        run: |
          set -uo pipefail
          terragrunt run --all -- plan -no-color 2>&1 | tee "$RUNNER_TEMP/plan.txt"
          rc=${PIPESTATUS[0]}
          changes=false
          grep -q "Plan: [0-9]" "$RUNNER_TEMP/plan.txt" && changes=true
          certificates=false
          grep -q "\[$RENEWAL\] terraform: Plan: [0-9]" "$RUNNER_TEMP/plan.txt" && certificates=true
          drift=false
          grep -E "\[[a-z]+\] terraform: Plan: [0-9]" "$RUNNER_TEMP/plan.txt" | grep -vq "\[$RENEWAL\]" && drift=true
          {
            echo "has_changes=$changes"
            echo "certificates_due=$certificates"
            echo "drift=$drift"
          } >>"$GITHUB_OUTPUT"
          {
            echo "## Plan"
            echo
            echo '```'
            grep -E "^\S+ STDOUT \[[a-z]+\] terraform: (Plan:|No changes)" "$RUNNER_TEMP/plan.txt" \
              | sed -E 's/^\S+ STDOUT \[([a-z]+)\] terraform: /\1: /' || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
