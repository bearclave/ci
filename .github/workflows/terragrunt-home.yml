          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      - name: Install terragrunt and wireguard-tools
        run: |
          set -euo pipefail
          install-tools.sh terragrunt
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools >/dev/null

      - name: Join the home network
        env:
          VPN: ${{ inputs.vpn-script || (hashFiles('tools/home-vpn.sh') != '' && 'tools/home-vpn.sh' || 'scripts/home-vpn.sh') }}
        run: '"./$VPN" up'

      # A scheduled run applies the certificate renewal and nothing else.
      - name: Apply
        working-directory: ${{ inputs.working-directory }}
        env:
          EVENT: ${{ github.event_name }}
          RENEWAL: ${{ inputs.renewal-unit }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then
            cd "$RENEWAL" && terragrunt apply -auto-approve -no-color
          else
            terragrunt run --all -- apply -auto-approve -no-color
          fi

      - name: Leave the home network
        if: always()
        env:
          VPN: ${{ inputs.vpn-script || (hashFiles('tools/home-vpn.sh') != '' && 'tools/home-vpn.sh' || 'scripts/home-vpn.sh') }}
        run: '"./$VPN" down'

  # The required check, and the drift verdict of a scheduled run.
  gate:
    needs: [conventions, plan, apply]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # needs of the gate job, as JSON: anything but success or skipped fails it.
      # A skipped job counts as passed in a required check, so the gate - which
      # always runs - is the one the ruleset requires.
      - name: Everything needed passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"

      # Schedule: anything but the certificate that differs from main is drift.
      - name: No drift
        if: github.event_name == 'schedule' && needs.plan.outputs.drift == 'true'
        run: |
          echo "::error::drift: the router differs from main (plan in the run summary)"
          exit 1
