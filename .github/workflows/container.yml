# GENERATED by tools/build.py from templates/container.yml - edit the template or src/, not this file.
# The pipeline of a containerised application (app-home). Two flows,
# chosen by the input environments.
#
# environments: false (the default, the flow until v2.7):
#
#   pull request -> ESLint over the JavaScript of the repository, lint and
#                   tests in the image's test stage, the image build (not
#                   published)
#   push to main -> the same, then the image goes to GHCR as :main and :<sha>
#   release      -> the same, then the image goes to GHCR as :vX.Y.Z and
#                   :<sha>, with APP_VERSION vX.Y.Z (a published release or a
#                   pushed vX.Y.Z tag; the caller adds the trigger:
#                   `release: types: [published]`)
#
# environments: true (default branch staging, prod moved by promote.yml):
#
#   pull request     -> the same checks and build, nothing published
#   push to staging  -> the same, then the image goes to GHCR as :staging and
#                       :sha-<commit>; deploy to the environment staging on
#                       the NAS runner, smoke test of url-staging
#   push to prod     -> no build: the image :sha-<commit> of that commit (built
#                       when it was on staging) gets the tag vX.Y.Z that
#                       promote.yml put on the commit; deploy to the
#                       environment prod, smoke test of url-prod
#
# The deploy job runs on the NAS runner (deploy-runner, docs/runners.md) and
# checks out nothing: it runs only the steps below. It signs in over SSH as
# deploy-host with the environment secret DEPLOY_KEY, a key whose forced
# command on the NAS deploys one application to one environment; the job
# passes only the image tag, which the NAS checks again. The smoke test reads
# <url>/healthz and wants JSON whose version is the deployed tag (the NAS
# sets APP_VERSION to it).
#
# Only the docker CLI is used: the organisation allows no third-party actions.
#
#   jobs:
#     pipeline:
#       needs: security          # nothing is published past a failed scan
#       uses: bearclave/ci/.github/workflows/container.yml@v2
#       permissions:
#         contents: read
#         packages: write
#       with:
#         image: ghcr.io/bearclave/home-app
#         environments: true                                    # since v2.8
#         deploy-host: ci-deploy@172.16.10.10
#         deploy-host-key: ${{ vars.NAS_HOST_KEY }}
#         url-staging: https://byt-staging.bearclave.cz
#         url-prod: https://byt.bearclave.cz
#       secrets:
#         # An environment secret: empty here, the deploy job's environment
#         # supplies it (GitHub passes it by name).
#         DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
#
# The required check is "pipeline / gate".
name: container

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag, ghcr.io/<owner>/<name>
        type: string
        required: true
      test-target:
        description: Dockerfile stage that runs lint and tests
        type: string
        default: test
      environments:
        description: The staging/prod flow (push to staging builds and deploys staging, push to prod retags and deploys prod); false keeps main and release tags
        type: boolean
        default: false
      deploy-host:
        description: SSH destination of the deployment, user@address (environments only)
        type: string
        default: ""
      deploy-host-key:
        description: Public host key of deploy-host, "<type> <base64>", checked by SSH (environments only)
        type: string
        default: ""
      url-staging:
        description: Base URL the smoke test reads after a deployment to staging
        type: string
        default: ""
      url-prod:
        description: Base URL the smoke test reads after a deployment to prod
        type: string
        default: ""
      deploy-runner:
        description: runs-on of the deploy job, as JSON
        type: string
        default: '["self-hosted", "nas"]'
    secrets:
      DEPLOY_KEY:
        description: Environment secret of staging and prod - the SSH key of deploy-host (environments only)
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Lint and tests run inside the image's test stage, on the same Python and
  # packages as the app. A push to prod builds nothing: it ships the image
  # staging built.
  build:
    if: ${{ !(inputs.environments && github.ref == 'refs/heads/prod') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # In the same job: a job of its own costs a minute even where there is
      # no JavaScript to lint.
      # ESLint over the JavaScript git tracks, with the repository's
      # eslint.config.mjs (managed by governance tools/sync.py: the recommended
      # rules, the repository's own section below its marker). A repository with a
      # package.json that pins eslint in devDependencies runs that version from its
      # lock file; any other runs the versions below through npx. Errors fail,
      # warnings are annotations only.
      - name: JavaScript in the repository
        id: js
        run: |
          count=$(git ls-files '*.js' '*.mjs' '*.cjs' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No JavaScript."
            echo "lint=false" >>"$GITHUB_OUTPUT"
          elif [ ! -f eslint.config.mjs ]; then
            echo "::warning title=eslint::$count JavaScript files without eslint.config.mjs - run tools/sync.py of governance for this repository"
            echo "lint=false" >>"$GITHUB_OUTPUT"
          else
            echo "lint=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.js.outputs.lint == 'true'
        with:
          node-version: "24"

      - name: ESLint
        if: steps.js.outputs.lint == 'true'
        env:
          ESLINT_VERSION: "10.14.0"
          ESLINT_JS_VERSION: "10.0.1"
          GLOBALS_VERSION: "17.14.0"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.js' '*.mjs' '*.cjs')
          if [ -f package.json ] && jq -e '.devDependencies.eslint' package.json >/dev/null; then
            npm ci --ignore-scripts --no-audit --no-fund
            eslint=(npx --no-install eslint)
          else
            eslint=(npx -y -p "eslint@$ESLINT_VERSION" -p "@eslint/js@$ESLINT_JS_VERSION" -p "globals@$GLOBALS_VERSION" eslint)
          fi
          "${eslint[@]}" --version
          report="$RUNNER_TEMP/eslint.json"
          rc=0
          "${eslint[@]}" --config eslint.config.mjs --no-warn-ignored --format json --output-file "$report" "${files[@]}" || rc=$?
          if [ ! -s "$report" ]; then
            echo "::error title=eslint::eslint ended with $rc and wrote no report"
            exit 1
          fi
          jq -r --arg root "$PWD/" '.[] | (.filePath | ltrimstr($root)) as $f | .messages[]
            | "::\(if .severity == 2 then "error" else "warning" end) file=\($f),line=\(.line // 1),col=\(.column // 1),title=\(.ruleId // "eslint")::\(.message | gsub("\n"; " "))"' "$report"
          jq -r '"ESLint: \(length) files, \(map(.errorCount) | add) errors, \(map(.warningCount) | add) warnings"' "$report" |
            tee -a "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Lint and tests
        env:
          TARGET: ${{ inputs.test-target }}
        run: docker build --target "$TARGET" .

      - name: Image
        env:
          IMAGE: ${{ inputs.image }}
        run: docker build --build-arg "APP_VERSION=${GITHUB_SHA::7}" -t "$IMAGE:ci" .

  publish:
    if: >-
      github.event_name != 'pull_request'
      && ((inputs.environments && github.ref == 'refs/heads/staging')
          || (!inputs.environments
              && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # staging is :staging and :sha-<commit>; without environments a
      # release tag names the version and main is :main.
      - name: Build
        env:
          IMAGE: ${{ inputs.image }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::7}
          if [ "$ENVIRONMENTS" = true ]; then
            version=sha-$GITHUB_SHA
            tags=(staging "sha-$GITHUB_SHA")
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a release tag vX.Y.Z"
              exit 1
            fi
            version=$GITHUB_REF_NAME
            tags=("$GITHUB_REF_NAME" "$short")
          else
            version=$short
            tags=(main "$short")
          fi
          args=()
          for t in "${tags[@]}"; do args+=(-t "$IMAGE:$t"); done
          docker build --build-arg "APP_VERSION=$version" "${args[@]}" .
          echo "Image \`$IMAGE\` as ${tags[*]}, APP_VERSION $version." >>"$GITHUB_STEP_SUMMARY"

      - name: Push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push --all-tags "$IMAGE"
          docker logout ghcr.io

  # prod gets exactly what ran on staging: the image of the commit, under
  # the version promote.yml tagged it with. Nothing is built.
  retag:
    if: inputs.environments && github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # promote.yml pushes the tag together with prod or just before it; a
      # few retries cover a tag that arrives a moment after the push.
      - name: Version on the commit
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            versions=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
              --jq '.[] | [.ref, .object.type, .object.sha] | @tsv' |
              while IFS=$'\t' read -r ref type sha; do
                # An annotated tag points at a tag object, which points at the commit.
                [ "$type" = tag ] && sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
                [ "$sha" = "$GITHUB_SHA" ] && echo "${ref#refs/tags/}"
              done | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            [ -n "$versions" ] && break
            sleep 10
          done
          if [ -z "$versions" ]; then
            echo "::error::no tag vX.Y.Z on $GITHUB_SHA: prod moves only by promote.yml, which tags the commit"
            exit 1
          fi
          if [ "$(wc -l <<<"$versions")" -ne 1 ]; then
            echo "::error::more than one version on $GITHUB_SHA: $(tr '\n' ' ' <<<"$versions")"
            exit 1
          fi
          echo "version=$versions" >>"$GITHUB_OUTPUT"

      - name: Tag the image of the commit
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if ! docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" >/dev/null; then
            echo "::error::$IMAGE:sha-$GITHUB_SHA does not exist: the commit was not built on staging"
            exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE:sha-$GITHUB_SHA"
          docker logout ghcr.io
          echo "Image \`$IMAGE:sha-$GITHUB_SHA\` tagged \`$VERSION\`, not rebuilt." >>"$GITHUB_STEP_SUMMARY"

  # On the NAS runner, in the environment of the branch; nothing of the
  # repository is checked out or run here.
  deploy:
    needs: [publish, retag]
    if: >-
      !cancelled() && inputs.environments && github.event_name == 'push'
      && ((github.ref == 'refs/heads/staging' && needs.publish.result == 'success')
          || (github.ref == 'refs/heads/prod' && needs.retag.result == 'success'))
    runs-on: ${{ fromJSON(inputs.deploy-runner) }}
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name }}
      url: ${{ github.ref_name == 'prod' && inputs.url-prod || inputs.url-staging }}
    steps:
      - name: Deploy
        id: deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ inputs.deploy-host }}
          HOST_KEY: ${{ inputs.deploy-host-key }}
          TAG: ${{ github.ref_name == 'prod' && needs.retag.outputs.version || format('sha-{0}', github.sha) }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_HOST" ] || [ -z "$HOST_KEY" ]; then
            echo "::error::DEPLOY_KEY (secret of the environment $GITHUB_REF_NAME), deploy-host and deploy-host-key are needed"
            exit 1
          fi
          dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$dir"
          install -m 600 /dev/null "$dir/key"
          printf '%s\n' "$DEPLOY_KEY" >"$dir/key"
          printf '%s %s\n' "${DEPLOY_HOST#*@}" "$HOST_KEY" >"$dir/known_hosts"
          # The forced command on the NAS decides the application and the
          # environment; the only word passed is the image tag.
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o ConnectTimeout=15 "$DEPLOY_HOST" "$TAG"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - name: Forget the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"

      - name: Smoke test
        env:
          URL: ${{ github.ref_name == 'prod' && inputs.url-prod || inputs.url-staging }}
          TAG: ${{ steps.deploy.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "::error::no url-$GITHUB_REF_NAME for the smoke test"
            exit 1
          fi
          body=""
          for _ in $(seq 1 30); do
            body=$(curl -sSf --max-time 10 "$URL/healthz" 2>/dev/null || true)
            if [ "$(jq -r '.version // empty' <<<"$body" 2>/dev/null)" = "$TAG" ]; then
              unit=$(jq -r '.unit // "n/a"' <<<"$body")
              echo "$URL serves $TAG (unit: $unit)." | tee -a "$GITHUB_STEP_SUMMARY"
              [ "$unit" = ok ] || [ "$unit" = n/a ] ||
                echo "::warning::$URL is up, but reports unit: $unit"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$URL/healthz does not report version $TAG after 5 minutes (last answer: ${body:-none})"
          exit 1

  gate:
    needs: [build, publish, retag, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # needs of the gate job, as JSON: anything but success or skipped fails it.
      # A skipped job counts as passed in a required check, so the gate - which
      # always runs - is the one the ruleset requires.
      - name: Everything needed passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"
