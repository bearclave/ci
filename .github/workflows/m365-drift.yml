# GENERATED by tools/build.py from templates/m365-drift.yml - edit the template or src/, not this file.
# The weekly check of a Microsoft365DSC repository (iac-m365). It does the two
# things the pull request pipeline cannot:
#
#   1. a plan over the whole tenant even when nothing changed in the repository
#      - the configuration drifts when somebody reaches into a portal
#   2. tombstones - what is in the tenant and not in the configuration
#
# Tombstones are never applied on their own. A false positive would otherwise
# delete something like a Conditional Access policy with nobody watching, so
# they collect in one long-lived pull request instead.
#
# The caller owns the schedule and shares its concurrency group with the push
# runs of ci.yml: both work against the tenant.
#
#   jobs:
#     drift:
#       uses: bearclave/ci/.github/workflows/m365-drift.yml@v2
#       permissions:
#         contents: write
#         id-token: write
#         pull-requests: write
#       with:
#         client-id: ${{ vars.AZURE_CLIENT_ID }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
name: m365-drift

on:
  workflow_call:
    inputs:
      client-id:
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        required: true
      tombstone-branch:
        description: Branch of the long-lived pull request with what the tenant has beyond the configuration
        type: string
        default: chore/tombstones

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PS_MODULES: ~/.local/share/powershell/Modules

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      # The tombstone branch is pushed from here, so the token stays. Nothing
      # uploads the workspace itself - the artifact below lists three files by
      # name - so the credential in .git/config does not leave the runner.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      # The pipeline scripts travel inside the workflow (see build.py): the
      # caller's token cannot read bearclave/ci. They land in $RUNNER_TEMP/ci,
      # which goes on PATH.
      - name: Pipeline scripts
        run: |
          d="$RUNNER_TEMP/ci"
          mkdir -p "$d"
          cat >"$d/install-tools.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # shellcheck disable=SC2317,SC2329  # install_* are called indirectly by name
          # Install pinned tools into a cacheable directory and put them on PATH. Every
          # download is checked against the sha256 in the calling repository's
          # tool-versions.env.
          #
          # Usage: install-tools.sh terragrunt trivy tflint terraform-docs
          #
          # TOOL_VERSIONS  the versions file (default .github/tool-versions.env)
          # TOOLS_DIR      where the binaries go (default ~/.cache/iac-tools/bin)
          set -euo pipefail

          # shellcheck disable=SC1090
          source "${TOOL_VERSIONS:-.github/tool-versions.env}"

          BIN=${TOOLS_DIR:-$HOME/.cache/iac-tools/bin}
          mkdir -p "$BIN"

          fetch() {
            local url=$1 want=$2 out=$3
            curl -fsSL --retry 3 "$url" -o "$out"
            echo "$want  $out" | sha256sum -c - >/dev/null
          }

          install_terragrunt() {
            [ -x "$BIN/terragrunt" ] && return 0
            fetch "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
                  "$TERRAGRUNT_SHA256" "$BIN/terragrunt"
          }

          install_trivy() {
            [ -x "$BIN/trivy" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
                  "$TRIVY_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" trivy && mv "$t/trivy" "$BIN/"
          }

          install_tflint() {
            [ -x "$BIN/tflint" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip" \
                  "$TFLINT_SHA256" "$t/a.zip"
            unzip -q "$t/a.zip" -d "$t" tflint && mv "$t/tflint" "$BIN/"
          }

          install_terraform_docs() {
            [ -x "$BIN/terraform-docs" ] && return 0
            local t; t=$(mktemp -d)
            fetch "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
                  "$TERRAFORM_DOCS_SHA256" "$t/a.tgz"
            tar -xzf "$t/a.tgz" -C "$t" terraform-docs && mv "$t/terraform-docs" "$BIN/"
          }

          for tool in "$@"; do
            "install_${tool//-/_}"
            chmod +x "$BIN/$tool"
            echo "$tool $("$BIN/$tool" --version 2>&1 | head -1)"
          done

          [ -n "${GITHUB_PATH:-}" ] && echo "$BIN" >>"$GITHUB_PATH"
          exit 0
          __CI_EOF__
          cat >"$d/pr-comment.sh" <<'__CI_EOF__'
          #!/usr/bin/env bash
          # Put the plan summary into the pull request as ONE comment. The comment is
          # found by the marker on its first line and rewritten, so a pull request with
          # ten pushes does not collect ten walls of stale numbers.
          #
          # Usage: pr-comment.sh <pr-number> <markdown-file> <marker>
          set -euo pipefail

          PR=${1:?missing pull request number}
          FILE=${2:?missing markdown file}
          MARKER=${3:?missing marker}
          REPO=${GITHUB_REPOSITORY:?missing GITHUB_REPOSITORY}

          BODY=$(printf '<!-- %s -->\n%s\n' "$MARKER" "$(cat "$FILE")")

          ID=$(gh api --paginate "/repos/$REPO/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"<!-- $MARKER -->\"))) | .[0].id // empty")

          if [ -n "$ID" ]; then
            gh api -X PATCH "/repos/$REPO/issues/comments/$ID" -f body="$BODY" >/dev/null
            echo "comment $ID rewritten"
          else
            gh api -X POST "/repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "comment created"
          fi
          __CI_EOF__
          chmod +x "$d"/*
          echo "$d" >>"$GITHUB_PATH"

      - name: Microsoft365DSC scripts
        run: |
          d="$RUNNER_TEMP/ci"
          cat >"$d/install-modules.ps1" <<'__CI_EOF__'
          #!/usr/bin/env pwsh
          <#
              Installs the PowerShell modules every job needs, into the CurrentUser path
              the cache is keyed on.

              One list for validate, plan, apply and drift on purpose: with a smaller set
              for the validation job, whichever job ran first would populate the cache and
              the next one would skip installing and fail on a missing module.
          #>
          [CmdletBinding()]
          param(
              # Run from the root of the calling repository; the script itself travels
              # inside the workflow (bearclave/ci).
              [string] $VersionFile = '.github/tool-versions.env'
          )

          $ErrorActionPreference = 'Stop'

          $version = (Get-Content $VersionFile | Select-String '^M365DSC_VERSION=(.+)$').Matches[0].Groups[1].Value
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

          if (-not (Get-Module -ListAvailable Microsoft365DSC | Where-Object { $_.Version.ToString() -eq $version })) {
              Install-Module -Name Microsoft365DSC -RequiredVersion $version -Force -AllowClobber -Scope CurrentUser
          }
          foreach ($name in @('Pester', 'PSScriptAnalyzer')) {
              if (-not (Get-Module -ListAvailable $name)) {
                  Install-Module -Name $name -Force -SkipPublisherCheck -Scope CurrentUser
              }
          }

          & ./src/Runner/Install-M365Dependencies.ps1 -ModuleVersion $version

          # A restored cache that is missing resources is worse than no cache: the plan
          # gets far enough to look like a real answer and then reports whole workloads as
          # "Microsoft365DSC has no resource X". The module ships around 540 resources, so
          # anything far below that is a half-unpacked archive - reinstall over it once,
          # and if it is still short, stop here rather than in the middle of a plan.
          function Get-ResourceCount {
              param([string] $Base)
              if (-not $Base) { return 0 }
              @(Get-ChildItem -Path (Join-Path $Base 'DscResources') -Directory -ErrorAction SilentlyContinue).Count
          }

          function Get-Base {
              (Get-Module -ListAvailable Microsoft365DSC -Refresh |
                  Where-Object { $_.Version.ToString() -eq $version } | Select-Object -First 1).ModuleBase
          }

          $base = Get-Base
          $count = Get-ResourceCount -Base $base
          if ($count -lt 500) {
              "Microsoft365DSC $version has only $count resources in '$base', installing again"
              Install-Module -Name Microsoft365DSC -RequiredVersion $version -Force -AllowClobber -Scope CurrentUser
              $base = Get-Base
              $count = Get-ResourceCount -Base $base
          }
          if ($count -lt 500) {
              throw "Microsoft365DSC $version in '$base' is incomplete: $count resources."
          }

          "Microsoft365DSC $version in $base ($count resources)"
          __CI_EOF__
          cat >"$d/select-types.ps1" <<'__CI_EOF__'
          #!/usr/bin/env pwsh
          <#
              What the plan reads: the whole tenant, only some instance types, or
              nothing. Compares HEAD with -Base (the target branch of a pull request, or
              the head of the last successful run on main) and writes mode and types to
              $GITHUB_OUTPUT. A base that is missing or not an ancestor of HEAD means
              the whole tenant.

              Needs what Get-BcContext needs (M365_APPLICATION_ID and the certificate),
              since the instances come from the same evaluation the plan uses.
          #>
          [CmdletBinding()]
          param(
              [string] $Base
          )

          $ErrorActionPreference = 'Stop'
          # git answers some questions by its exit code alone.
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          # Run from the root of the calling repository (the script travels inside the
          # workflow, so its own location says nothing about the repository).
          $repoRoot = (Get-Location).Path
          Import-Module (Join-Path $PSScriptRoot 'Selection.psm1') -Force

          function Write-Selection($selection) {
              $types = $selection.Types -join ','
              Write-Host "mode=$($selection.Mode) types=$types ($($selection.Reason))"
              if ($env:GITHUB_OUTPUT) {
                  "mode=$($selection.Mode)" | Add-Content $env:GITHUB_OUTPUT
                  "types=$types" | Add-Content $env:GITHUB_OUTPUT
              }
              if ($env:GITHUB_STEP_SUMMARY) {
                  "Plan scope: **$($selection.Mode)** $(if ($types) { "($types)" }) - $($selection.Reason)." |
                      Add-Content $env:GITHUB_STEP_SUMMARY
              }
          }

          $usable = $false
          if ($Base) {
              git cat-file -e "$Base^{commit}" 2>$null
              if ($LASTEXITCODE -eq 0) {
                  git merge-base --is-ancestor $Base HEAD
                  $usable = $LASTEXITCODE -eq 0
              }
          }
          if (-not $usable) {
              Write-Selection ([pscustomobject]@{ Mode = 'all'; Types = @(); Reason = "no usable base commit ('$Base')" })
              exit 0
          }

          $changed = @(git diff --name-only $Base HEAD)
          $instances = @()
          if ($changed | Where-Object { $_ -match '^config/.+\.ps1$' }) {
              Import-Module (Join-Path $repoRoot 'src/Runner/Runner.psm1') -Force
              $context = Get-BcContext -RepoRoot $repoRoot
              $instances = @(Get-BcInstances -Context $context)
          }
          Write-Selection (Get-BcSelection -Changed $changed -Instances $instances)
          exit 0
          __CI_EOF__
          cat >"$d/Selection.psm1" <<'__CI_EOF__'
          # Which instance types a change touches, so that a plan does not read the
          # whole tenant when one policy changed. Used by select-types.ps1; the logic is
          # here, apart from git and the tenant, so the tests can run it on lists.

          Set-StrictMode -Version Latest

          function Get-BcSelection {
              <#
                  Decides from the changed paths and the instances what to plan.

                  Returns Mode 'all' (the whole tenant), 'types' (only Types) or 'none'
                  (nothing that a plan reads changed), with the reason.

                  - src/, tenant.psd1, .github/ and any data file under config/ (a
                    .psd1 every fragment can read, a profile a gap deploys) change how
                    everything is evaluated: the whole tenant.
                  - A fragment (config/**/*.ps1) selects the types of the instances it
                    defines. A fragment that is gone selects nothing: the runner does not
                    remove what is no longer described, the weekly tombstones report
                    does.
                  - Anything else (docs, tests, READMEs) selects nothing.
              #>
              [CmdletBinding()]
              param(
                  [AllowEmptyCollection()] [string[]] $Changed,
                  [AllowEmptyCollection()] [object[]] $Instances
              )

              $Changed = @($Changed | Where-Object { $_ })
              if ($Changed.Count -eq 0) {
                  return [pscustomobject]@{ Mode = 'all'; Types = @(); Reason = 'no difference to the base: the whole tenant' }
              }

              $global = @($Changed | Where-Object { $_ -match '^(src/|\.github/)' -or $_ -eq 'tenant.psd1' -or ($_ -match '^config/' -and $_ -notmatch '\.(ps1|md)$') })
              if ($global.Count -gt 0) {
                  return [pscustomobject]@{ Mode = 'all'; Types = @(); Reason = "$($global[0]) changes how everything is evaluated" }
              }

              $fragments = @($Changed | Where-Object { $_ -match '^config/.+\.ps1$' })
              $types = @($Instances | Where-Object { $_.Source -in $fragments } | ForEach-Object { $_.Type } | Sort-Object -Unique)
              if ($types.Count -eq 0) {
                  return [pscustomobject]@{ Mode = 'none'; Types = @(); Reason = 'no fragment that describes an instance changed' }
              }
              [pscustomobject]@{ Mode = 'types'; Types = $types; Reason = "fragments changed: $($fragments -join ', ')" }
          }

          Export-ModuleMember -Function Get-BcSelection
          __CI_EOF__
          cat >"$d/plan-outputs.ps1" <<'__CI_EOF__'
          #!/usr/bin/env pwsh
          <#
              Turns the plan into the facts the workflow needs: whether anything would
              change, whether anything failed, and which instances differ. The apply job
              runs off the first one - an apply with nothing to do is a minute of the
              quota for nothing - and writes only the last.
          #>
          [CmdletBinding()]
          param(
              [Parameter(Mandatory)] [string] $PlanPath
          )

          $ErrorActionPreference = 'Stop'

          $plan = Get-Content -Raw -Path $PlanPath | ConvertFrom-Json
          $changed = @($plan.Changed).Count
          $failed = @($plan.Failed).Count
          $informational = @($plan.Informational).Count

          # The apply writes only these: the instances the plan found different, by
          # type and name, so it does not read the whole tenant a second time.
          $types = @($plan.Changed | ForEach-Object { $_.Type } | Sort-Object -Unique) -join ','
          $names = @($plan.Changed | ForEach-Object { $_.Name } | Sort-Object -Unique) -join ','

          if ($env:GITHUB_OUTPUT) {
              Add-Content -Path $env:GITHUB_OUTPUT -Value "has_changes=$(($changed -gt 0).ToString().ToLowerInvariant())"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "has_failures=$(($failed -gt 0).ToString().ToLowerInvariant())"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "changed_types=$types"
              Add-Content -Path $env:GITHUB_OUTPUT -Value "changed_names=$names"
          }

          "$changed to change, $failed failed, $informational report-only"
          __CI_EOF__

      - name: Restore PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PS_MODULES }}
          key: psmodules-v2-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env', 'src/Runner/Install-M365Dependencies.ps1') }}

      # The script installs what is missing and always checks the result, so a
      # cache restored short of a few resources fails here rather than in the
      # middle of a plan.
      - name: PowerShell modules
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/ci/install-modules.ps1"'

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.client-id }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      # Exchange Online and Purview cannot use workload identity federation, so
      # every workload signs in with a certificate. Azure itself is reached
      # federated and the certificate is fetched there - no secret is in the
      # repository or in the workflow variables.
      - name: Certificate from the key vault
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tenant = Import-PowerShellDataFile ./tenant.psd1
          $pfx = Join-Path $env:RUNNER_TEMP 'dsc-m365.pfx'
          az keyvault secret download --vault-name $tenant.Pipeline.KeyVault `
            --name $tenant.Pipeline.Certificate --file $pfx --encoding base64
          "M365_CERTIFICATE_PATH=$pfx" | Add-Content $env:GITHUB_ENV

      - name: Plan over the whole tenant
        id: plan
        env:
          M365_APPLICATION_ID: ${{ inputs.client-id }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:M365DSC_VERSION = (Get-Content .github/tool-versions.env |
            Select-String '^M365DSC_VERSION=(.+)$').Matches[0].Groups[1].Value
          ./src/Runner/Invoke-M365.ps1 -Action plan -PlanPath plan.json -ReportPath plan.md
          Get-Content plan.md | Add-Content $env:GITHUB_STEP_SUMMARY

      # A report, not a gate: when the export of one workload fails, the rest of
      # the run is still worth finishing.
      - name: Tombstones
        id: tombstones
        continue-on-error: true
        env:
          M365_APPLICATION_ID: ${{ inputs.client-id }}
        shell: pwsh
        run: |
          $env:M365DSC_VERSION = (Get-Content .github/tool-versions.env |
            Select-String '^M365DSC_VERSION=(.+)$').Matches[0].Groups[1].Value
          ./src/Runner/Invoke-M365.ps1 -Action tombstones -ReportPath tombstones.md
          Get-Content tombstones.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Product list
        continue-on-error: true
        env:
          M365_APPLICATION_ID: ${{ inputs.client-id }}
        shell: pwsh
        run: |
          $env:M365DSC_VERSION = (Get-Content .github/tool-versions.env |
            Select-String '^M365DSC_VERSION=(.+)$').Matches[0].Groups[1].Value
          ./tools/Update-SelfServicePurchaseProducts.ps1

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-${{ github.run_id }}
          path: |
            plan.json
            plan.md
            tombstones.md
          retention-days: 30

      # The branch is rebuilt over main and force-pushed every week, so the
      # diff in the pull request always matches the tenant as it is now. Commits
      # piling up would be unreadable within a month.
      - name: Pull request with what changed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOMBSTONE_BRANCH: ${{ inputs.tombstone-branch }}
        run: |
          set -euo pipefail
          # Only config/ is committed; plan.json and the reports sit in the
          # working tree as artifacts and must not count as a change.
          if [ -z "$(git status --porcelain -- config/)" ]; then
            echo "nothing changed, the branch is left alone" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.email 'noreply@bearclave.cz'
          git config user.name 'M365 drift'
          git checkout -B "$TOMBSTONE_BRANCH"
          git add config/
          git commit -m "chore(m365): update the product list from the weekly drift"
          git push --force origin "$TOMBSTONE_BRANCH"
          if ! gh pr view "$TOMBSTONE_BRANCH" --json number >/dev/null 2>&1; then
            body=$(printf '%s\n' \
              "## Why" "" \
              "The weekly drift found configuration in the tenant that the repository does not describe." "" \
              "## What changes" "" \
              "- config/ as the drift run read it; the branch is rebuilt every week, so the diff always matches the tenant as it is now." "" \
              "## Impact" "" "- Production: none until merged; review every instance before merging." "" \
              "## Verification" "" "Drift run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "" \
              "## Review" "" "none" "" "## Links" "" "none")
            gh pr create --base main --head "$TOMBSTONE_BRANCH" \
              --title "chore(m365): tenant instances outside the configuration" \
              --body "$body"
          fi

      # The plan itself decides the verdict: the runner returns a non-zero code
      # only when an instance failed, and drift is a change, not a failure.
      - name: Verdict
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path plan.json)) { throw 'no plan produced' }
          $out = & "$env:RUNNER_TEMP/ci/plan-outputs.ps1" -PlanPath plan.json
          $out
          $plan = Get-Content -Raw plan.json | ConvertFrom-Json
          if (@($plan.Changed).Count -gt 0 -or @($plan.Failed).Count -gt 0) {
            "::error::$out"
            exit 1
          }
