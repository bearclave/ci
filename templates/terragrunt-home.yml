# The pipeline of the home network (iac-home): the jobs of terragrunt.yml
# (templates/_fragments/terragrunt-jobs.yml) with the defaults of a router
# reached through WireGuard and a certificate renewed on schedule.
#
# Pull request into main -> select, validate and plan the affected units
#                           through WireGuard under the read-only identity,
#                           a plan comment, destroy / approved, conventions
# Push to main            -> plan (read-only identity), then apply in
#                           home-prod under the identity that writes, its
#                           verification and the apply comment
# Schedule (weekly)       -> plan of the whole tree; applies the renewal unit
#                           (Let's Encrypt) when it is due, any other change is
#                           drift and fails the run
# Manual run on main      -> as a push
#
# The runner joins the home network with src/terragrunt/home-vpn.sh
# (vpn-script up|down), which signs in to Azure, reads its keys from the
# vault and maps the router's internal name. One router, one WireGuard peer:
# the plan runs as one job, and the caller's concurrency group never lets two
# runs overlap, a pull request plan included.
#
# The configuration reads the router's password from the vault while it is
# parsed (run_cmd), so validate signs in as the plan identity too.
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/terragrunt-home.yml@v2
#       if: github.event_name != 'pull_request_review'
#       permissions:
#         contents: write        # verify: the revert branch
#         id-token: write
#         pull-requests: write
#         issues: write          # verify: the issue
#         actions: read
#       with:
#         client-id-plan: ${{ vars.AZURE_CLIENT_ID_PLAN }}
#         client-id-apply: ${{ vars.AZURE_CLIENT_ID_APPLY }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         allow-destroy: ${{ inputs.allow_destroy == true }}
#       secrets:
#         modules-deploy-key: ${{ secrets.MODULES_DEPLOY_KEY }}
#     review:                    # destroy / approved after a later review
#       if: github.event_name == 'pull_request_review'
#       uses: bearclave/ci/.github/workflows/destroy-review.yml@v2
#
# client-id-plan and client-id-apply replace client-id (one identity for
# both, until v2.4): a pull request must not get the identity that writes.
#
# Versions: TERRAFORM_VERSION, TERRAGRUNT_*, TRIVY_* in the caller's
# .github/tool-versions.env; every unit commits its .terraform.lock.hcl.
# The required check is "pipeline / gate".
name: terragrunt-home

on:
  workflow_call:
    inputs:
      relevant-paths:
        description: Regular expression of the paths whose change needs a plan (grep -E over the changed files)
        type: string
        default: '^(infrastructure/|_common/|\.github/)|^(root|account)\.hcl$'
      environment:
        description: Environment of the apply job; its branch policy allows main only
        type: string
        default: home-prod
      client-id-plan:
        description: Client ID of the read-only identity every plan runs as (pull request, main, schedule)
        type: string
        required: true
      client-id-apply:
        description: Client ID of the identity the apply job runs as; federated on the environment only
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        description: Default subscription of the azurerm provider; empty where the repository has none
        type: string
        default: ""
      conventions:
        description: Run the conventions check (conventions.yaml) on pull requests
        type: boolean
        default: true
      conventions-config:
        description: Path of the conventions file (default .github/conventions.yaml, or conventions.yaml where it is still in the root)
        type: string
        default: ""
      sentinel-lint:
        description: Not used here; the jobs are those of terragrunt.yml
        type: boolean
        default: false
      sentinel-config:
        description: Not used here; the jobs are those of terragrunt.yml
        type: string
        default: ""
      principal-refs:
        description: Not used here; the jobs are those of terragrunt.yml
        type: boolean
        default: false
      github-app-vault-plan:
        description: Not used here; the jobs are those of terragrunt.yml
        type: string
        default: ""
      github-app-vault-apply:
        description: Not used here; the jobs are those of terragrunt.yml
        type: string
        default: ""
      scope:
        description: "changed = affected units only, all = the whole tree (manual runs)"
        type: string
        default: changed
      allow-destroy:
        description: Apply also what destroys or replaces resources (manual runs)
        type: boolean
        default: false
      plan-shards:
        description: Not used here; behind the VPN the plan is one job
        type: number
        default: 1
      require-lock-files:
        description: A unit without a committed .terraform.lock.hcl fails validate (false only warns)
        type: boolean
        default: true
      validate-sign-in:
        description: Sign in to Azure as the plan identity in validate; the configuration reads the router's password while it is parsed
        type: boolean
        default: true
      vpn-script:
        description: Script that joins (up) and leaves (down) the home network; a script of ci by its name, or a path in the repository
        type: string
        default: home-vpn.sh
      renewal-unit:
        description: Unit a scheduled run applies when its plan proposes something (the certificate)
        type: string
        default: infrastructure/router/letsencrypt
    secrets:
      modules-deploy-key:
        description: Read-only deploy key of bearclave/iac-modules
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  MODULES_DIR: ${{ github.workspace }}/iac-modules
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ inputs.tenant-id }}
  ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
  # The plan identity everywhere; the apply job sets its own.
  ARM_CLIENT_ID: ${{ inputs.client-id-plan }}
  GITHUB_APP_VAULT: ""

jobs:
  @@include templates/_fragments/terragrunt-jobs.yml@@
