# The pipeline of content-sentinel, the catalogue of Sentinel content: the
# analytic rules against what Sentinel takes, and the generated views
# (terragrunt/, ARM/_kql/, CATALOG.md) up to date with ARM/.
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/content-sentinel.yml@v2
#       permissions:
#         contents: read
#
# The required check is "pipeline / gate".
name: content-sentinel

on:
  workflow_call:
    inputs:
      sentinel-config:
        description: Path of the Sentinel lint config
        type: string
        default: sentinel-lint.yaml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      @@include templates/_fragments/sentinel-steps.yml@@

  # terragrunt/, ARM/_kql/ and CATALOG.md are generated from ARM/. A change
  # to ARM/ without running the generators leaves the views behind.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Views match ARM/
        run: |
          set -euo pipefail
          python3 _tools/generate_kql.py --check
          python3 _tools/generate_catalog.py --check
          python3 _tools/convert_to_terragrunt.py >/dev/null
          if ! git diff --exit-code --stat -- terragrunt/; then
            echo "::error::terragrunt/ is not what _tools/convert_to_terragrunt.py writes from ARM/ - run it and commit"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- terragrunt/)" ]; then
            git status --porcelain -- terragrunt/
            echo "::error::terragrunt/ is missing files _tools/convert_to_terragrunt.py writes - run it and commit"
            exit 1
          fi

  gate:
    needs: [sentinel, generated]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      @@include templates/_fragments/gate-step.yml@@
