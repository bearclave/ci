# The pipeline of a Microsoft365DSC repository (iac-m365):
#
# Pull request into main -> schema check, gap tests, PSScriptAnalyzer, plan,
#                           and the plan summary into the pull request; a pull
#                           request touching only docs or tests skips the plan
# Push to main            -> plan, then apply, but only if the plan actually
#                           proposes something; the checks already ran on the
#                           pull request
#
# The plan reads only the instance types the change touches (select-types.ps1):
# a changed fragment selects the types it defines, a change to the runner, a
# data file, tenant.psd1 or the workflows the whole tenant. On main the change
# is counted from the last successful run, so what a failed apply left out is
# selected again. The apply then writes only the instances the plan found
# different. The weekly drift (m365-drift.yml) reads the whole tenant.
#
# Everything runs on ubuntu-latest: after the scope was narrowed to the tenant
# settings, the whole plan was verified on Unix and Windows would cost twice
# the quota for nothing.
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/m365-dsc.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#         pull-requests: write
#         actions: read
#       with:
#         client-id: ${{ vars.AZURE_CLIENT_ID }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#
# Versions: M365DSC_VERSION in the caller's .github/tool-versions.env.
# The required check is "pipeline / gate".
name: m365-dsc

on:
  workflow_call:
    inputs:
      client-id:
        description: Client ID of sp-dsc-m365 (federated on pull_request, main and the environment)
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        required: true
      environment:
        type: string
        default: m365-prod
      relevant-paths:
        description: Regular expression of the paths whose change needs a plan
        type: string
        default: '^(config/|src/|\.github/)|^tenant\.psd1$'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Install-Module -Scope CurrentUser lands here, and the path is already on
  # PSModulePath. One cache for every job: the plan needs the runtime
  # dependencies as well, and a cache holding only Microsoft365DSC would let
  # the plan skip installing them and then fail on a missing module.
  PS_MODULES: ~/.local/share/powershell/Modules

jobs:
  # A skipped job reports as passed, so a pull request that touches nothing a
  # plan reads (docs, tests) is green without one. Outside a pull request the
  # caller's push paths have already decided.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Paths the change touches
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RELEVANT: ${{ inputs.relevant-paths }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          # A file list that cannot be read plans rather than skips.
          if ! files=$(gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only); then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE "$RELEVANT" <<<"$files"; then
            echo "relevant=true" >>"$GITHUB_OUTPUT"
          else
            echo "relevant=false" >>"$GITHUB_OUTPUT"
            echo "Nothing to plan: the change touches no fragment, runner, tenant.psd1 or workflow." >>"$GITHUB_STEP_SUMMARY"
          fi

  # Runs without signing in and catches the same class of mistake as the plan,
  # only faster: a misspelled property, a value outside the enumeration, a
  # missing key. On a pull request only: a push to main carries exactly what
  # the pull request checked.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history, to tell which files the pull request changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      @@include templates/_fragments/m365-setup.yml@@

      - name: Configuration against the schemas
        shell: pwsh
        run: |
          ./tools/Test-Configuration.ps1

      - name: Gap tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Invoke-Pester ./tests -Output Detailed -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      # Only this repository's own code. Pointed at the root, the analyser
      # would also read the installed Microsoft365DSC, whose resources trip it
      # by the hundred. Only the files the pull request changed, which takes
      # seconds instead of two minutes; all of them when the settings or the
      # workflow changed.
      - name: PSScriptAnalyzer
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = if (Test-Path ./.github/pssa.psd1) { './.github/pssa.psd1' } else { './.pssa.psd1' }
          $changed = @(git diff --name-only "$env:PR_BASE...HEAD")
          if ($changed | Where-Object { $_ -match '^(\.pssa\.psd1$|\.github/)' }) {
            $paths = @('src', 'tools', 'tests', 'config')
          }
          else {
            $paths = @($changed | Where-Object {
                $_ -match '^(src|tools|tests|config)/.+\.(ps1|psm1|psd1)$' -and (Test-Path $_)
              })
          }
          if ($paths.Count -eq 0) { 'No PowerShell file changed.'; exit 0 }
          "Analysing: $($paths -join ', ')"
          $findings = $paths | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings $settings
          }
          @($findings) | Sort-Object Severity, ScriptName, Line |
            Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize |
            Out-String -Width 200
          if (@($findings | Where-Object Severity -eq 'Error').Count -gt 0) { exit 1 }

  plan:
    needs: [changes, validate]
    # validate is skipped on a push; !cancelled() so that skip does not skip
    # the plan too, and a failed changes job still plans.
    if: >-
      ${{ !cancelled()
          && needs.changes.outputs.relevant != 'false'
          && (needs.validate.result == 'success' || needs.validate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      # The base commit is the head of the last successful run on main.
      actions: read
    outputs:
      has_changes: ${{ steps.outputs.outputs.has_changes }}
      changed_types: ${{ steps.outputs.outputs.changed_types }}
      changed_names: ${{ steps.outputs.outputs.changed_names }}
    steps:
      # The whole history, to compare with the base commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pull request is compared with its base branch. On main the base is
      # the head of the last successful run - its apply went through or had
      # nothing to do - so a change a failed apply left out is selected again.
      # Without one the whole tenant is planned.
      - name: Base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            # The caller's workflow file, e.g. ci.yml.
            wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty') || base=""
            [ -n "$base" ] || echo "::warning::No successful run on main found; the whole tenant is planned."
          fi
          echo "sha=$base" >>"$GITHUB_OUTPUT"

      @@include templates/_fragments/m365-setup.yml@@

      @@include templates/_fragments/m365-signin.yml@@

      # The instances come from the same evaluation the plan uses, so this
      # needs the sign-in values too.
      - name: What the change touches
        id: scope
        env:
          M365_APPLICATION_ID: ${{ inputs.client-id }}
          BASE: ${{ steps.base.outputs.sha }}
        shell: pwsh
        run: '& "$env:RUNNER_TEMP/ci/select-types.ps1" -Base $env:BASE'

      - name: Plan
        env:
          M365_APPLICATION_ID: ${{ inputs.client-id }}
          SCOPE_MODE: ${{ steps.scope.outputs.mode }}
          SCOPE_TYPES: ${{ steps.scope.outputs.types }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:SCOPE_MODE -eq 'none') {
            '**Nothing to plan.** The change touches no fragment that describes an instance.' |
              Set-Content plan.md
            @{ Total = 0; Results = @(); Changed = @(); Failed = @(); Informational = @(); InDesiredState = $true } |
              ConvertTo-Json | Set-Content plan.json
            exit 0
          }
          $env:M365DSC_VERSION = (Get-Content .github/tool-versions.env |
            Select-String '^M365DSC_VERSION=(.+)$').Matches[0].Groups[1].Value
          $arguments = @{ Action = 'plan'; PlanPath = 'plan.json'; ReportPath = 'plan.md' }
          if ($env:SCOPE_MODE -eq 'types') { $arguments.Type = $env:SCOPE_TYPES }
          ./src/Runner/Invoke-M365.ps1 @arguments

      - name: Summary
        id: outputs
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path plan.json)) { 'no plan produced' >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          & "$env:RUNNER_TEMP/ci/plan-outputs.ps1" -PlanPath plan.json
          Get-Content plan.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload the plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ github.run_id }}
          path: |
            plan.json
            plan.md
          retention-days: 30

      - name: Comment into the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s plan.md ] || exit 0
          pr-comment.sh "$PR_NUMBER" plan.md m365-plan

  # Writes only the instances the plan found different, by type and name; the
  # runner tests each of them again before and after writing.
  apply:
    needs: plan
    if: >-
      ${{ !cancelled()
          && github.event_name != 'pull_request'
          && needs.plan.result == 'success'
          && needs.plan.outputs.has_changes == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      @@include templates/_fragments/m365-setup.yml@@

      @@include templates/_fragments/m365-signin.yml@@

      - name: Apply
        env:
          M365_APPLICATION_ID: ${{ inputs.client-id }}
          CHANGED_TYPES: ${{ needs.plan.outputs.changed_types }}
          CHANGED_NAMES: ${{ needs.plan.outputs.changed_names }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CHANGED_TYPES -or -not $env:CHANGED_NAMES) { throw 'The plan named no instance to write.' }
          $env:M365DSC_VERSION = (Get-Content .github/tool-versions.env |
            Select-String '^M365DSC_VERSION=(.+)$').Matches[0].Groups[1].Value
          ./src/Runner/Invoke-M365.ps1 -Action apply -ReportPath apply.md `
            -Type $env:CHANGED_TYPES -Name $env:CHANGED_NAMES
          Get-Content apply.md | Add-Content $env:GITHUB_STEP_SUMMARY

  # The required check. On a pull request: every check passed (or was
  # skipped). On main: in Azure DevOps a skipped apply stage left the run
  # green. An apply that was due and did not succeed has to be red.
  gate:
    needs: [changes, validate, plan, apply]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checks passed
        if: github.event_name == 'pull_request'
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"

      - name: The apply had to run
        if: github.event_name != 'pull_request'
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
          APPLY_RESULT: ${{ needs.apply.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan ended as '$PLAN_RESULT'"; exit 1
          fi
          if [ "$PLAN_HAS_CHANGES" != "true" ]; then
            echo "Plan proposed nothing, apply was skipped." >>"$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ "$APPLY_RESULT" != "success" ]; then
            echo "::error::the plan proposed a change but apply ended as '$APPLY_RESULT'"; exit 1
          fi
          echo "Apply went through." >>"$GITHUB_STEP_SUMMARY"
