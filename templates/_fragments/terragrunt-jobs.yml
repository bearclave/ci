# What the run works on, in seconds and without signing in anywhere: which
# paths the change touches, the conventions and the Sentinel lint (pull
# request only), the base commit, the principal references, the unit
# selection and its split into the plan jobs. validate and the plan jobs
# both start from it, side by side. One job instead of five, because every
# job bills a whole minute however short it is; nothing in it signs in or
# writes. A pull request outside the relevant paths is green without a plan
# (the later jobs skip on `relevant`, and a skipped job reports as passed).
# The conventions and the lint do not stop the plan: their steps carry on
# after a failure and the gate reads `lint`. Outside a pull request the
# caller's push paths have already decided.
select:
  runs-on: ubuntu-24.04
  timeout-minutes: 15
  permissions:
    contents: read
    pull-requests: read
    # The base commit is the head of the last successful run on main.
    actions: read
  outputs:
    relevant: ${{ steps.diff.outputs.relevant }}
    lint: ${{ (steps.conventions.outcome == 'failure' || steps.sentinel.outcome == 'failure') && 'failed' || 'passed' }}
    selection: ${{ steps.units.outputs.selection }}
    shards: ${{ steps.shards.outputs.shards }}
  steps:
    # A file list that cannot be read plans rather than skips.
    - name: Paths the change touches
      id: diff
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REPO: ${{ github.repository }}
        RELEVANT: ${{ inputs.relevant-paths }}
      run: |
        set -euo pipefail
        if [ "$EVENT" != "pull_request" ]; then
          echo "relevant=true" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        cat >"$RUNNER_TEMP/changes.py" <<'__CI_EOF__'
        @@include src/terragrunt/changes.py@@
        __CI_EOF__
        if ! gh pr diff "$PR_NUMBER" --repo "$REPO" --name-only >"$RUNNER_TEMP/files"; then
          echo "relevant=true" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        # Markdown inside a unit still counts: the units of the head commit.
        # A tree that cannot be read or is truncated leaves the list empty,
        # and then every Markdown file counts.
        : >"$RUNNER_TEMP/units"
        if grep -qi '\.md$' "$RUNNER_TEMP/files"; then
          gh api "repos/$REPO/git/trees/$HEAD_SHA?recursive=1" \
            --jq 'select(.truncated | not) | .tree[] | select(.type == "blob") | .path | select(endswith("terragrunt.hcl"))' \
            >"$RUNNER_TEMP/units" || : >"$RUNNER_TEMP/units"
        fi
        python3 "$RUNNER_TEMP/changes.py" "$RELEVANT" "$RUNNER_TEMP/files" "$RUNNER_TEMP/units" >>"$GITHUB_OUTPUT"
        if grep -q '^relevant=false$' "$GITHUB_OUTPUT"; then
          echo "Nothing to plan: the change touches no unit, context file or workflow (Dependabot and release configs, .claude/ and Markdown outside the units do not count)." >>"$GITHUB_STEP_SUMMARY"
        fi

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    # The rules in conventions.yaml; on a pull request only, main holds
    # nothing a pull request has not checked. The same step as
    # _fragments/conventions-steps.yml, which carries on after a failure here.
    # A file of its own: actionlint cannot take a step script of about 64 KB.
    - name: Conventions, the rules of what is left behind
      if: github.event_name == 'pull_request' && inputs.conventions
      run: |
        cat >"$RUNNER_TEMP/conventions_left.py" <<'__CI_EOF__'
        @@include src/conventions_left.py@@
        __CI_EOF__

    - name: Conventions
      id: conventions
      if: github.event_name == 'pull_request' && inputs.conventions
      continue-on-error: true
      env:
        CONFIG: ${{ inputs.conventions-config }}
      run: |
        script="$RUNNER_TEMP/conventions.py"
        cat >"$script" <<'__CI_EOF__'
        @@include src/conventions.py@@
        __CI_EOF__
        if [ -z "$CONFIG" ]; then
          CONFIG=.github/conventions.yaml
          [ -f "$CONFIG" ] || CONFIG=conventions.yaml
        fi
        if [ ! -f "$CONFIG" ]; then
          echo "::error::$CONFIG not found"
          exit 1
        fi
        yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/conventions.json"
        # The rules every repository has run in pr / check (pr.yml).
        python3 "$script" "$RUNNER_TEMP/conventions.json" . --skip todo-issue,markdown-links,collection-schema

    # The analytic rules, against what Sentinel takes (sentinel-lint.yaml).
    - name: Analytic rules
      id: sentinel
      if: github.event_name == 'pull_request' && inputs.sentinel-lint
      continue-on-error: true
      env:
        CONFIG: ${{ inputs.sentinel-config }}
      run: |
        script="$RUNNER_TEMP/sentinel_lint.py"
        cat >"$script" <<'__CI_EOF__'
        @@include src/sentinel_lint.py@@
        __CI_EOF__
        if [ -z "$CONFIG" ]; then
          CONFIG=.github/sentinel-lint.yaml
          [ -f "$CONFIG" ] || CONFIG=sentinel-lint.yaml
        fi
        if [ ! -f "$CONFIG" ]; then
          echo "::error::$CONFIG not found"
          exit 1
        fi
        yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/sentinel-lint.json"
        python3 "$script" "$RUNNER_TEMP/sentinel-lint.json" .

    @@include templates/_fragments/scripts-common.yml@@

    @@include templates/_fragments/scripts-select.yml@@

    - name: Tool versions
      if: steps.diff.outputs.relevant != 'false'
      id: versions
      run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      if: steps.diff.outputs.relevant != 'false'
      with:
        terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Restore tools
      if: steps.diff.outputs.relevant != 'false'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TOOLS_DIR }}
        key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

    - name: Install terragrunt
      if: steps.diff.outputs.relevant != 'false'
      run: install-tools.sh terragrunt

    # A pull request is compared with its base branch. On main the base is
    # the head of the last run whose apply went through or had nothing to do
    # (a failed verification after a good apply counts: its changes are in
    # the state), so a change a failed or held-back apply left out is still
    # selected now. Runs on main never overlap (see concurrency).
    - name: Base commit
      if: steps.diff.outputs.relevant != 'false'
      id: base
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = "pull_request" ]; then
          base="$PR_BASE"
        else
          # The caller's workflow file, e.g. ci.yml.
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          base=$(base-commit.py "$GITHUB_REPOSITORY" "$wf") || base=""
          # Without it the units of an earlier failed apply could be left
          # out, so the whole tree runs instead.
          if [ -z "$base" ]; then
            echo "::warning::No run on main with a successful apply found; the whole tree runs."
          fi
        fi
        echo "sha=$base" >>"$GITHUB_OUTPUT"
        echo "Compared with \`$base\`." >>"$GITHUB_STEP_SUMMARY"

    # imports.hcl and moves.hcl are deleted in the pull request after their
    # apply; one older than this run's base is a warning, never a failure.
    - name: Temporary files
      if: steps.diff.outputs.relevant != 'false' && github.event_name != 'pull_request'
      env:
        BASE: ${{ steps.base.outputs.sha }}
      run: stale-temp-files.py "$BASE"

    # A principal the same change creates cannot be referenced by display
    # name: `dependencies` orders the run but a plan creates nothing, so the
    # lookup goes to Entra and finds nothing. Caught here rather than by a
    # failed plan half an hour into the queue.
    - name: Principal references
      if: inputs.principal-refs && steps.diff.outputs.relevant != 'false'
      env:
        BASE: ${{ steps.base.outputs.sha }}
      run: |
        set -euo pipefail
        if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="HEAD~1"; fi
        check-principal-refs.py "$BASE"

    # A scheduled run (certificate renewal, iac-home) looks at the whole tree.
    - name: Select the units
      if: steps.diff.outputs.relevant != 'false'
      id: units
      env:
        SCOPE: ${{ github.event_name == 'schedule' && 'all' || inputs.scope }}
        EVENT: ${{ github.event_name }}
        BASE: ${{ steps.base.outputs.sha }}
      run: |
        set -euo pipefail
        # The moves of state the owner made for this change (format in
        # docs/terragrunt.md#moving-a-unit).
        moves=()
        if [ -f .github/state-moves.yaml ]; then
          yq -o=json '.' .github/state-moves.yaml >"$RUNNER_TEMP/state-moves.json"
          moves=(--moves="$RUNNER_TEMP/state-moves.json")
        fi
        # The push of a merge does not plan the whole tree for a change of
        # the workflows alone: its pull request did.
        push=()
        if [ "$EVENT" = "push" ]; then push=(--push); fi
        selection=$(select-units.py "$BASE" "${push[@]}" "${moves[@]}")
        if [ "$SCOPE" = "all" ]; then
          selection=$(jq -c '.all = true | .units = []' <<<"$selection")
        fi
        echo "selection=$selection" >>"$GITHUB_OUTPUT"
        # Paths shown as their state keys, without infrastructure/.
        jq -r '
          def key: sub("^infrastructure/"; "");
          (if .all then "Selected: the whole tree."
           elif (.units | length) > 0 then "Selected: " + (.units | map(key) | join(", ")) + "."
           else "Selected: no unit to plan." end),
          (if (.deleted | length) > 0
           then "Deleted, planned as a destroy: " + (.deleted | map(key) | join(", ")) + "."
           else empty end),
          (if (.moved | length) > 0
           then "Moved with their state: " + (.moved | map("\(.[0] | key) → \(.[1] | key)") | join(", ")) + "."
           else empty end),
          (.moved | map(select((.[0] | key) != (.[1] | key)) | .[0] | key) | unique
           | if length > 0
             then "Not destroyed; their old state blobs stay until the owner deletes them after the apply: "
                  + join(", ") + "."
             else empty end)
        ' <<<"$selection" >>"$GITHUB_STEP_SUMMARY"
        # The state key is the unit's path: a moved directory would be a new
        # unit that creates everything again, next to the old resources.
        if [ "$(jq '.renamed | length' <<<"$selection")" -gt 0 ]; then
          jq -r '.renamed[] | "::error::\(.[0]) moved to \(.[1]). Moving a unit changes its state key. Move its state first and list the move in .github/state-moves.yaml, or delete the unit in one pull request (it gets destroyed) and add it under the new path in the next."' <<<"$selection"
          exit 1
        fi

    # The selection split for the plan jobs: up to 20 units in one, at most
    # plan-shards of them, the units dealt out in turn. The whole tree is
    # listed unit by unit for that, the same directories select-units.py
    # counts as units. The deleted units go to the first share. Behind a
    # VPN there is one share: the network has one peer for the runners.
    - name: Shares of the plan
      if: steps.diff.outputs.relevant != 'false'
      id: shards
      env:
        SELECTION: ${{ steps.units.outputs.selection }}
        MAX_SHARDS: ${{ inputs.vpn-script != '' && 1 || inputs.plan-shards }}
      run: |
        set -euo pipefail
        if [ "$(jq -r .all <<<"$SELECTION")" = "true" ]; then
          units=$(git ls-files -- '*/terragrunt.hcl' | sed 's|/terragrunt\.hcl$||' |
            grep -vE '(^|/)\.' | jq -R . | jq -sc .)
        else
          units=$(jq -c .units <<<"$SELECTION")
        fi
        shards=$(jq -c --argjson units "$units" --argjson max "$MAX_SHARDS" '
          .deleted as $deleted | ($units | length) as $n
          | (if $n + ($deleted | length) == 0 then 0
             else [1, ([$max, (($n + 19) / 20 | floor)] | min)] | max end) as $k
          | [range($k) as $i | {
              name: "\($i + 1) of \($k)",
              index: $i,
              units: [$units | to_entries[] | select(.key % $k == $i) | .value],
              deleted: (if $i == 0 then $deleted else [] end)}]' <<<"$SELECTION")
        echo "shards=$shards" >>"$GITHUB_OUTPUT"
        jq -r '"Plan jobs: \(length)."' <<<"$shards" >>"$GITHUB_STEP_SUMMARY"

# Everything else that needs no state: formatting, the HCL, terraform
# validate of the selected units and the committed lock files. It runs next
# to the plan jobs (terraform validate takes minutes on the two cores), and
# the gate, the plan comment and apply all wait for it: nothing merges or
# applies without it. It signs in to Azure (the plan identity) only where
# the configuration reads a secret while it is parsed (validate-sign-in).
validate:
  needs: select
  if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.relevant != 'false' }}
  runs-on: ubuntu-24.04
  timeout-minutes: 15
  permissions:
    contents: read
    id-token: write
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    @@include templates/_fragments/modules-checkout.yml@@

    @@include templates/_fragments/scripts-common.yml@@

    - name: Tool versions
      id: versions
      run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Restore tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TOOLS_DIR }}
        key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

    - name: Restore provider cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.tgproviders
        key: providers-${{ runner.os }}-${{ hashFiles('account.hcl', '_common/templates/versions*.tf.tmpl') }}
        restore-keys: providers-${{ runner.os }}-

    - name: Install terragrunt
      run: install-tools.sh terragrunt

    - name: Sign in to Azure
      if: inputs.validate-sign-in
      run: |
        set -euo pipefail
        token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
        az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
          --federated-token "$token" --allow-no-subscriptions --output none

    - name: HCL formatting
      run: |
        terragrunt hcl fmt --check --diff || {
          echo "::error title=HCL formatting::An .hcl file is not formatted (diff above). Run 'terragrunt hcl fmt' and commit the result."
          exit 1
        }

    - name: HCL validation
      run: |
        terragrunt hcl validate || {
          echo "::error title=HCL validation::An .hcl file does not parse or refers to something that does not exist (errors above)."
          exit 1
        }

    # terraform validate needs the providers and the modules, so each unit
    # is initialised without its backend (TF_CLI_ARGS_init, in the init
    # terragrunt runs before validate): nothing signs in to Azure. A
    # dependency's outputs would come from its state; here every dependency
    # answers with the mock outputs it allows for validate.
    # The providers come through terragrunt's provider cache, as in the plan:
    # it downloads each one once, under a lock, and links it into the units.
    # A plain TF_PLUGIN_CACHE_DIR let one unit run a provider binary that
    # another unit was still writing ("text file busy", #34).
    - name: Terraform validate
      env:
        TG_PROVIDER_CACHE: "1"
        TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
        TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        TG_EXPERIMENT: optional-dependency-outputs
        TF_CLI_ARGS_init: -backend=false
        SELECTION: ${{ needs.select.outputs.selection }}
      run: |
        set -euo pipefail
        mkdir -p "$TG_PROVIDER_CACHE_DIR"
        mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
        if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
          echo "No unit to validate."
          exit 0
        fi
        args=(--queue-ignore-dag-order --no-dependency-outputs --non-interactive --no-color)
        for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
        # One annotation per unit and error, so the reason is on the run page.
        annotate() {
          sed -n "s/.*\[\([^]]*\)\] terraform: Error: \(.*\)/::error title=terraform validate::\1: \2/p" "$1" | sort -u
        }
        rc=0
        terragrunt run --all "${args[@]}" -- validate >validate.txt 2>&1 || rc=$?
        cat validate.txt
        if [ "$rc" -ne 0 ]; then
          annotate validate.txt
          echo "::error title=terraform validate::A unit does not initialise or validate (log above): its configuration, a module source, a provider version, or a dependency without mock outputs for validate."
          exit "$rc"
        fi

    # Every validated unit has its .terraform.lock.hcl committed (toolchain
    # standard), and init did not have to change it. A change means the lock
    # lacks a provider, holds a version the constraints no longer allow, or
    # lacks the linux checksums. A missing lock fails, or only warns with
    # require-lock-files false (a repository that has not committed them yet).
    - name: Lock files
      env:
        SELECTION: ${{ needs.select.outputs.selection }}
        REQUIRE: ${{ inputs.require-lock-files }}
      run: |
        set -euo pipefail
        if [ "$(jq -r .all <<<"$SELECTION")" = "true" ]; then
          mapfile -t units < <(git ls-files -- '*/terragrunt.hcl' | sed 's|/terragrunt\.hcl$||' | grep -vE '(^|/)\.')
        else
          mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
        fi
        level=error
        [ "$REQUIRE" = "true" ] || level=warning
        rc=0
        missing=0
        # A unit its exclude block keeps out (a device not under Terraform
        # yet) is never initialised and has no lock to hold.
        mapfile -t excluded < <(jq -r '.excluded[]?' <<<"$SELECTION")
        for u in "${units[@]}"; do
          if printf '%s\n' "${excluded[@]}" | grep -qxF -- "$u"; then continue; fi
          if ! git ls-files --error-unmatch -- "$u/.terraform.lock.hcl" >/dev/null 2>&1; then
            echo "::$level file=$u/terragrunt.hcl,title=Lock file::$u has no committed .terraform.lock.hcl. Run 'terragrunt run -- providers lock -platform=linux_amd64 -platform=darwin_arm64' in $u and commit the file."
            missing=$((missing + 1))
          fi
        done
        if [ "$missing" -gt 0 ] && [ "$level" = error ]; then rc=1; fi
        changed=$(git diff --name-only -- '*.terraform.lock.hcl')
        if [ -n "$changed" ]; then
          git diff -- '*.terraform.lock.hcl'
          while IFS= read -r f; do
            echo "::error file=$f,title=Lock file::$f does not match the providers terraform init chose (diff above). Run 'terragrunt run -- providers lock -platform=linux_amd64 -platform=darwin_arm64' in $(dirname "$f") and commit the file."
          done <<<"$changed"
          rc=1
        fi
        echo "Lock files: ${#units[@]} unit(s), $missing without a committed lock, $(grep -c . <<<"$changed" || true) changed by init." >>"$GITHUB_STEP_SUMMARY"
        exit "$rc"

# One share of the selection (select's shards), as many side by side as
# there are shares. Each leaves its plan.txt and what the comment shows of
# its JSON plans for the plan job.
plan-shard:
  name: plan (${{ matrix.shard.name }})
  needs: select
  # Next to validate, not after it; skipped where nothing is relevant.
  if: >-
    ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.relevant != 'false'
    && needs.select.outputs.shards != '[]' }}
  # The jobs that reach the managed resources (plan shares, apply) run where
  # those are reachable: a GitHub runner, or the NAS runner on the home
  # network for iac-home (network-runner, docs/runners.md). The other jobs
  # stay on GitHub.
  runs-on: ${{ fromJSON(inputs.network-runner) }}
  timeout-minutes: 20
  strategy:
    fail-fast: false
    matrix:
      shard: ${{ fromJSON(needs.select.outputs.shards) }}
  permissions:
    contents: read
    id-token: write
  # Every plan, on a pull request and on main, runs as the read-only plan
  # identity (ARM_CLIENT_ID and GITHUB_APP_VAULT of the workflow): a plan may
  # be queued from any branch, and the identity that writes is federated on
  # the environment of the apply job alone.
  env:
    TG_READONLY_PLAN: "true"
    # A plan on a pull request is only a preview, so it does not lock the
    # state. Every new push cancels the run before it, and a cancelled
    # terraform leaves its lock behind: the lease on the state blob never
    # expires and blocks the unit until someone runs force-unlock. The plan
    # on main, the one the apply is decided from, still locks.
    TF_CLI_ARGS_plan: ${{ github.event_name == 'pull_request' && '-lock=false' || '' }}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    @@include templates/_fragments/modules-checkout.yml@@

    @@include templates/_fragments/scripts-common.yml@@

    @@include templates/_fragments/scripts-plan.yml@@

    @@include templates/_fragments/scripts-vpn.yml@@

    - name: Tool versions
      id: versions
      run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Restore tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TOOLS_DIR }}
        key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

    # Without a shared cache each of the fifty units downloads its own copies
    # of the providers and the runner runs out of both disk and time.
    - name: Restore provider cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.tgproviders
        key: providers-${{ runner.os }}-${{ hashFiles('account.hcl', '_common/templates/versions*.tf.tmpl') }}
        restore-keys: providers-${{ runner.os }}-

    - name: Install terragrunt and trivy
      run: install-tools.sh terragrunt trivy

    @@include templates/_fragments/self-hosted-tools.yml@@

    # A job killed while terraform holds a state lock leaves the lock behind
    # for good. Locks a runner took more than 70 minutes ago are released
    # here: no job runs that long (apply has the longest timeout, 60), so
    # the job that took them is gone. Workstation locks stay. The first
    # share does it for all of them.
    - name: Release stale state locks
      if: matrix.shard.index == 0
      continue-on-error: true
      run: |
        set -euo pipefail
        value() { sed -n "s/^ *$1 *= *\"\(.*\)\"/\1/p" account.hcl; }
        token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
        az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
          --federated-token "$token" --allow-no-subscriptions --output none
        release-stale-locks.py \
          "$(value storage_account_name)" "$(value container_name)" 70

    @@include templates/_fragments/github-app.yml@@

    @@include templates/_fragments/vpn-up.yml@@

    # The units of this share that exist are planned from HEAD, in
    # dependency order among themselves. A deleted unit exists only in the
    # base commit, so it is planned as a destroy from a worktree of that
    # commit. Both land in the same plan.txt, under their unit paths, and as
    # JSON in $PLAN_JSON for the comment and for trivy. The JSON holds
    # sensitive values in clear text: it stays in the runner's temp and is
    # never uploaded.
    - name: Plan
      env:
        TG_PROVIDER_CACHE: "1"
        TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
        TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        SELECTION: ${{ needs.select.outputs.selection }}
        SHARD: ${{ toJSON(matrix.shard) }}
        PLAN_JSON: ${{ runner.temp }}/plan-json
      run: |
        set -euo pipefail
        mkdir -p "$TG_PROVIDER_CACHE_DIR"
        : >plan.txt
        mapfile -t units < <(jq -r '.units[]' <<<"$SHARD")
        mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SHARD")
        rc=0
        if [ "${#units[@]}" -gt 0 ]; then
          args=()
          for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
          set +e
          terragrunt run --all plan "${args[@]}" --json-out-dir "$PLAN_JSON" \
            --non-interactive --no-color 2>&1 | tee -a plan.txt
          rc=${PIPESTATUS[0]}
          set -e
        fi
        if [ "${#deleted[@]}" -gt 0 ]; then
          git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
          args=()
          for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
          set +e
          (cd "$RUNNER_TEMP/base" &&
            terragrunt run --all "${args[@]}" --json-out-dir "$PLAN_JSON" \
              --non-interactive --no-color -- plan -destroy) 2>&1 |
            tee -a plan.txt
          destroy_rc=${PIPESTATUS[0]}
          set -e
          [ "$destroy_rc" -eq 0 ] || rc=$destroy_rc
        fi
        exit "$rc"

    # A unit that moved with its state plans no create and no destroy;
    # one would mean the state did not come along.
    - name: Moved units keep their state
      if: always()
      env:
        SELECTION: ${{ needs.select.outputs.selection }}
        PLAN_JSON: ${{ runner.temp }}/plan-json
      run: |
        set -euo pipefail
        printf '%s' "$SELECTION" >"$RUNNER_TEMP/selection.json"
        check-moves.py "$RUNNER_TEMP/selection.json" "$PLAN_JSON"

    @@include templates/_fragments/vpn-down.yml@@

    # trivy over the plans, which carry the value of every setting; over the
    # bare modules it cannot tell what a variable will be. The verdict waits
    # until the findings are passed on for the comment.
    - name: Security findings in the plan
      id: trivy
      if: always()
      env:
        PLAN_JSON: ${{ runner.temp }}/plan-json
      run: |
        rc=0
        trivy-plans.sh "$PLAN_JSON" trivy || rc=$?
        case "$rc" in
          0) echo "found=false" >>"$GITHUB_OUTPUT" ;;
          3) echo "found=true" >>"$GITHUB_OUTPUT" ;;
          *) exit "$rc" ;;
        esac

    # What the comment shows of this share - the tables from the JSON plans
    # and the trivy findings - and the plan output, for the plan job.
    - name: Hand over the plan
      if: always()
      env:
        PLAN_JSON: ${{ runner.temp }}/plan-json
        INDEX: ${{ matrix.shard.index }}
      run: |
        set -euo pipefail
        mkdir -p part
        touch plan.txt
        plan-summary.py plan.txt --json-dir="$PLAN_JSON" --trivy=trivy \
          --export="part/shard-$INDEX.json" >/dev/null
        cp plan.txt "part/plan-$INDEX.txt"

    - name: Upload the share
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: plan-part-${{ github.run_id }}-${{ matrix.shard.index }}
        path: part/
        retention-days: 1

    - name: No unaccepted security finding
      if: always() && steps.trivy.outputs.found == 'true'
      run: |
        echo "::error::trivy found a HIGH or CRITICAL setting in the plan (Security findings in the summary). Fix it, or accept it in .github/trivyignore.yaml with the reason."
        exit 1

# The shares read back into one plan: one summary, one comment, and the
# verdict apply and destroy go by. It fails when a share did. It waits for
# validate too, whose result the comment shows.
plan:
  needs: [select, validate, plan-shard]
  if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.relevant != 'false' }}
  runs-on: ubuntu-24.04
  timeout-minutes: 10
  permissions:
    contents: read
    pull-requests: write
  outputs:
    has_changes: ${{ steps.summary.outputs.has_changes }}
    has_destroys: ${{ steps.summary.outputs.has_destroys }}
    renewal_due: ${{ steps.renewal.outputs.due }}
    drift: ${{ steps.renewal.outputs.drift }}
    planned_at: ${{ steps.planned.outputs.at }}
    selection: ${{ needs.select.outputs.selection }}
  steps:
    # Only the scripts this job runs; the rest stay with the plan jobs. A
    # step per large script: actionlint deadlocks on a run script of more
    # than about 64 KB.
    - name: Summary scripts
      run: |
        d="$RUNNER_TEMP/ci"
        mkdir -p "$d"
        cat >"$d/plan-summary.py" <<'__CI_EOF__'
        @@include src/terragrunt/plan-summary.py@@
        __CI_EOF__
        cat >"$d/pr-comment.sh" <<'__CI_EOF__'
        @@include src/pr-comment.sh@@
        __CI_EOF__
        chmod +x "$d"/*
        echo "$d" >>"$GITHUB_PATH"

    - name: Plan details script
      run: |
        d="$RUNNER_TEMP/ci"
        cat >"$d/plan_details.py" <<'__CI_EOF__'
        @@include src/terragrunt/plan_details.py@@
        __CI_EOF__

    # A share that failed before its upload is missing here: the summary
    # covers the rest and the last step fails the job.
    - name: Download the shares
      if: needs.select.outputs.shards != '[]'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: plan-part-${{ github.run_id }}-*
        path: parts
        merge-multiple: true

    # The plan comment (README, Plan and apply comments). Without a plan it
    # is still rewritten, or the pull request keeps showing the plan of an
    # earlier commit. changes.json - the text of its tables, nothing
    # sensitive - goes with the plan artifact for the apply comment.
    - name: Summary
      id: summary
      if: always()
      env:
        SHARDS: ${{ needs.select.outputs.shards }}
        COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        CHECKS: formatting and validation=${{ needs.validate.result }}
      run: |
        set -euo pipefail
        # No share was downloaded when nothing is selected: find would fail
        # on the missing directory and, under pipefail, the step.
        mkdir -p parts
        find parts -name 'plan-*.txt' -print0 2>/dev/null | sort -z |
          xargs -0 -r cat >plan.txt
        args=()
        if [ "$SHARDS" = "[]" ]; then
          args+=(--nothing-selected)
        elif [ ! -s plan.txt ]; then
          args+=(--no-plan)
        fi
        plan-summary.py plan.txt --github-output --import=parts --trivy= \
          --checks="$CHECKS" --commit="$COMMIT" --changes-out=changes.json "${args[@]}" \
          | tee plan.md
        cat plan.md >>"$GITHUB_STEP_SUMMARY"

    # A scheduled run of a repository with a renewal unit (iac-home: the
    # certificate) applies that unit when its plan proposes something; a
    # change in any other unit is drift and fails the run.
    - name: Renewal and drift
      id: renewal
      if: always() && inputs.renewal-unit != '' && github.event_name == 'schedule'
      env:
        CHANGED: ${{ steps.summary.outputs.changed_units }}
        RENEWAL: ${{ inputs.renewal-unit }}
      run: |
        set -euo pipefail
        CHANGED=${CHANGED:-[]}
        due=$(jq -r --arg u "$RENEWAL" 'any(.[]; . == $u)' <<<"$CHANGED")
        drift=$(jq -r --arg u "$RENEWAL" 'map(select(. != $u)) | length > 0' <<<"$CHANGED")
        echo "due=$due" >>"$GITHUB_OUTPUT"
        echo "drift=$drift" >>"$GITHUB_OUTPUT"
        echo "Renewal of \`$RENEWAL\` due: $due. Drift elsewhere: $drift." >>"$GITHUB_STEP_SUMMARY"

    - name: Upload the plan
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: plan-${{ github.run_id }}
        path: |
          plan.txt
          plan.md
          changes.json
        retention-days: 30

    - name: Comment into the pull request
      if: always() && github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        [ -s plan.md ] || exit 0
        pr-comment.sh "$PR_NUMBER" plan.md terragrunt-plan

    # The moment the plan could be read in the pull request: an approval of
    # its destroys counts only after it.
    # The label destroy-review.yml looks for: only a pull request whose plan
    # destroys or replaces something has an approval to wait for, so a review
    # of any other starts no job. Removed again when a later plan has none.
    - name: Label the pull request
      if: github.event_name == 'pull_request' && !cancelled() && steps.summary.outputs.has_destroys != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DESTROYS: ${{ steps.summary.outputs.has_destroys }}
      run: |
        set -euo pipefail
        if [ "$DESTROYS" = "true" ]; then
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" -f "labels[]=destroys" >/dev/null
        else
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/destroys" >/dev/null 2>&1 || true
        fi

    - name: Plan time
      id: planned
      if: always()
      run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

    - name: Every share planned
      if: always()
      env:
        RESULT: ${{ needs.plan-shard.result }}
      run: |
        case "$RESULT" in
          success|skipped) ;;
          *) echo "::error::a plan job ended as '$RESULT' (its log has the reason)"; exit 1 ;;
        esac

# GitHub Team has no approval on an environment of a private repository,
# so the approval of destroys and replaces is the owner's review of the pull
# request, given after its plan. On a pull request the gate checks it (the
# step "Destroys approved after the plan"): it passes when the plan has none,
# or when such a review exists; a review submitted later re-runs the failed
# gate (destroy-review.yml). That check is a step of the gate, not a job of
# its own, because a job of five seconds bills a whole minute. This job runs
# on main only, when the plan has destroys: it finds the merged pull request
# and tells the apply whether the gate of its run passed on an approval; it
# never fails there, the gate says what is missing.
destroy:
  name: destroy / approved
  needs: plan
  if: >-
    !cancelled() && github.event_name != 'pull_request'
    && needs.plan.outputs.has_destroys == 'true' && !inputs.allow-destroy
    && github.event_name != 'schedule'
  runs-on: ubuntu-24.04
  timeout-minutes: 5
  permissions:
    contents: read
    pull-requests: read
    actions: read
  outputs:
    approved: ${{ steps.merged.outputs.approved }}
  env:
    GH_TOKEN: ${{ github.token }}
  steps:
    - name: Approval script
      run: |
        d="$RUNNER_TEMP/ci"
        mkdir -p "$d"
        cat >"$d/destroy-approval.py" <<'__CI_EOF__'
        @@include src/terragrunt/destroy-approval.py@@
        __CI_EOF__
        chmod +x "$d/destroy-approval.py"
        echo "$d" >>"$GITHUB_PATH"

    - name: The merged pull request approved the destroys
      id: merged
      run: |
        # The caller's workflow file, e.g. ci.yml.
        wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
        destroy-approval.py main "$GITHUB_SHA" "$wf"

# Apply runs from main only. The environment allows deployments from main
# and nothing else, and it is also what makes the OIDC token carry the
# environment subject the apply identity is federated on.
#
# A plan that destroys or replaces anything is applied by a push only when
# the merged pull request approved it after its plan (destroy job), or by
# the manual run with allow-destroy. Otherwise the selection keeps those
# units, since this run does not end as a success. A scheduled run applies
# the renewal unit and nothing else, and only when it is due.
#
# The apply plans again rather than applying the plan job's saved plan: a
# unit reads the outputs of the units it depends on, which change in the same
# apply (a saved plan would carry the old ones), the plan is split across
# jobs, and a saved plan holds every sensitive value in clear text, which
# would have to travel as an artifact. The plan of the same run decides
# whether the apply runs, and the verification after it fails the run when
# the result differs from the code.
apply:
  needs: [validate, plan, destroy]
  if: >-
    !cancelled()
    && github.event_name != 'pull_request'
    && needs.validate.result == 'success'
    && needs.plan.result == 'success'
    && (
      (github.event_name == 'schedule' && needs.plan.outputs.renewal_due == 'true')
      || (github.event_name != 'schedule'
          && needs.plan.outputs.has_changes == 'true'
          && (needs.plan.outputs.has_destroys != 'true' || inputs.allow-destroy
              || needs.destroy.outputs.approved == 'true'))
    )
  runs-on: ${{ fromJSON(inputs.network-runner) }}
  timeout-minutes: 60
  environment: ${{ inputs.environment }}
  permissions:
    contents: read
    id-token: write
  outputs:
    verification: ${{ steps.verify.outputs.result }}
    started: ${{ steps.window.outputs.epoch }}
    ended: ${{ steps.ended.outputs.epoch }}
  # The identity that writes, in place of the plan identity of the workflow.
  # It is federated on this job's environment only.
  env:
    ARM_CLIENT_ID: ${{ inputs.client-id-apply }}
    GITHUB_APP_VAULT: ${{ inputs.github-app-vault-apply }}
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    @@include templates/_fragments/modules-checkout.yml@@

    @@include templates/_fragments/scripts-common.yml@@

    @@include templates/_fragments/scripts-vpn.yml@@

    @@include templates/_fragments/scripts-verify.yml@@

    - name: Tool versions
      id: versions
      run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Restore tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.TOOLS_DIR }}
        key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

    - name: Restore provider cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.workspace }}/.tgproviders
        key: providers-${{ runner.os }}-${{ hashFiles('account.hcl', '_common/templates/versions*.tf.tmpl') }}
        restore-keys: providers-${{ runner.os }}-

    - name: Install terragrunt
      run: install-tools.sh terragrunt

    @@include templates/_fragments/self-hosted-tools.yml@@

    @@include templates/_fragments/github-app.yml@@

    # What this run applies: the selection of the plan job, or on a
    # schedule the renewal unit alone.
    - name: Units to apply
      id: target
      env:
        EVENT: ${{ github.event_name }}
        SELECTION: ${{ needs.plan.outputs.selection }}
        RENEWAL: ${{ inputs.renewal-unit }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = schedule ]; then
          SELECTION=$(jq -c --arg u "$RENEWAL" '.all = false | .units = [$u] | .deleted = []' <<<"$SELECTION")
        fi
        echo "selection=$SELECTION" >>"$GITHUB_OUTPUT"

    @@include templates/_fragments/vpn-up.yml@@

    # A minute of slack: the Activity Log stamps an operation when Azure
    # received it, the runner's clock may differ.
    - name: Start of the apply
      id: window
      run: |
        echo "start=$(date -u -d '-1 minute' +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
        echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

    # The selection is the one the plan job made, not worked out again.
    # Deleted units go first: what replaces them under a new path may need
    # their names.
    - name: Destroy deleted units
      env:
        TG_PROVIDER_CACHE: "1"
        TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
        TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        SELECTION: ${{ steps.target.outputs.selection }}
      run: |
        set -euo pipefail
        mapfile -t deleted < <(jq -r '.deleted[]' <<<"$SELECTION")
        if [ "${#deleted[@]}" -eq 0 ]; then
          echo "No deleted unit."
          exit 0
        fi
        mkdir -p "$TG_PROVIDER_CACHE_DIR"
        git worktree add --detach "$RUNNER_TEMP/base" "$(jq -r .base <<<"$SELECTION")"
        args=()
        for u in "${deleted[@]}"; do args+=(--queue-include-dir "$u"); done
        cd "$RUNNER_TEMP/base"
        # destroy.txt is read by the apply comment.
        terragrunt run --all destroy "${args[@]}" --non-interactive --no-color 2>&1 |
          tee "$GITHUB_WORKSPACE/destroy.txt"

    - name: Apply
      id: apply
      env:
        TG_PROVIDER_CACHE: "1"
        TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
        TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        SELECTION: ${{ steps.target.outputs.selection }}
      run: |
        set -euo pipefail
        mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
        if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
          echo "No unit to apply."
          exit 0
        fi
        mkdir -p "$TG_PROVIDER_CACHE_DIR"
        args=()
        for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
        # apply.txt is read by the verification (check blocks) and the
        # apply comment.
        terragrunt run --all apply "${args[@]}" --non-interactive --no-color 2>&1 | tee apply.txt

    - name: End of the apply
      id: ended
      if: always()
      run: echo "epoch=$(date +%s)" >>"$GITHUB_OUTPUT"

    # Terraform masks what is sensitive, as in plan.txt.
    - name: Upload the apply output
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: apply-${{ github.run_id }}
        path: |
          apply.txt
          destroy.txt
        if-no-files-found: ignore
        retention-days: 30

    # Verification of what the apply did. It takes a minute or two: one more
    # plan of the applied units, at once, and a read of the Activity Log. It
    # never rolls anything back: a failure turns the run red and the verify
    # job opens an issue and a draft revert for the owner to decide.
    #
    # 1. The second plan has to propose nothing (-detailed-exitcode 0). The
    #    apply may have not converged (a provider that sets a value of its
    #    own, a resource that something changed at once). The plan JSON
    #    also carries the results of the check blocks and the subscriptions
    #    the units deploy to.
    - name: Plan again
      id: replan
      if: ${{ !cancelled() && steps.window.outcome == 'success' }}
      env:
        TG_PROVIDER_CACHE: "1"
        TG_PROVIDER_CACHE_DIR: ${{ github.workspace }}/.tgproviders
        TG_SOURCE_MAP: git::https://github.com/${{ env.MODULES_REPO }}=${{ env.MODULES_DIR }}
        SELECTION: ${{ steps.target.outputs.selection }}
        VERIFY_JSON: ${{ runner.temp }}/verify-json
      run: |
        set -euo pipefail
        mapfile -t units < <(jq -r '.units[]' <<<"$SELECTION")
        if [ "$(jq -r .all <<<"$SELECTION")" != "true" ] && [ "${#units[@]}" -eq 0 ]; then
          echo "rc=skipped" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        mkdir -p "$TG_PROVIDER_CACHE_DIR"
        args=()
        for u in "${units[@]}"; do args+=(--queue-include-dir "$u"); done
        set +e
        # The state is there now, so the units need not wait for each other.
        terragrunt run --all plan "${args[@]}" --queue-ignore-dag-order --json-out-dir "$VERIFY_JSON" \
          --non-interactive --no-color -- -detailed-exitcode 2>&1 | tee replan.txt
        rc=${PIPESTATUS[0]}
        set -e
        echo "rc=$rc" >>"$GITHUB_OUTPUT"

    # 2. Failed operations of the apply identity in the subscriptions the
    #    applied units deploy to, from the start of the apply until now. A
    #    repository without an azurerm provider (iac-github) skips this. The
    #    Activity Log lags behind by a minute or more: an operation that
    #    failed in the last moments may not be there yet.
    - name: Failed Azure operations
      if: ${{ !cancelled() && steps.window.outcome == 'success' }}
      # A log that cannot be read shows as unreadable, not as a failed apply.
      continue-on-error: true
      env:
        VERIFY_JSON: ${{ runner.temp }}/verify-json
        START: ${{ steps.window.outputs.start }}
      run: |
        set -euo pipefail
        mapfile -t subs < <({ verify-apply.py subscriptions "$VERIFY_JSON"; echo "$ARM_SUBSCRIPTION_ID"; } | grep . | sort -u)
        if [ "${#subs[@]}" -eq 0 ]; then
          jq -n '{skipped: "no applied unit deploys to an Azure subscription"}' >activity.json
          exit 0
        fi
        end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
        az login --service-principal --username "$ARM_CLIENT_ID" --tenant "$ARM_TENANT_ID" \
          --federated-token "$token" --allow-no-subscriptions --output none
        # The caller of an operation is the application ID or the object ID
        # of the service principal, depending on the provider.
        object_id=$(az ad sp show --id "$ARM_CLIENT_ID" --query id -o tsv 2>/dev/null || true)
        events='[]'
        errors='[]'
        for s in "${subs[@]}"; do
          if out=$(az monitor activity-log list --subscription "$s" --start-time "$START" \
            --end-time "$end" --status Failed --max-events 500 -o json 2>err.txt); then
            events=$(jq -c --argjson all "$events" --arg app "$ARM_CLIENT_ID" --arg obj "$object_id" '
              $all + [.[] | select(.caller == $app or (.caller == $obj and $obj != "")
                or (.claims.appid // "") == $app)]' <<<"$out")
          else
            errors=$(jq -c --arg e "$s: $(tail -1 err.txt)" '. + [$e]' <<<"$errors")
          fi
        done
        jq -n --argjson events "$events" --argjson errors "$errors" --arg start "$START" --arg end "$end" \
          --args '{subscriptions: $ARGS.positional, start: $start, end: $end, events: $events, errors: $errors}' \
          "${subs[@]}" >activity.json
        echo "$(jq '.events | length' activity.json) failed operation(s) in ${subs[*]}."

    # 3. The check blocks, from the second plan and from the warnings of
    #    the apply. Then verification.json and verification.md, the body of
    #    the apply comment's ### Verification section: the report job takes
    #    the artifact verification-<run id> (README, Apply comment).
    - name: Verification
      id: verify
      if: ${{ !cancelled() && steps.window.outcome == 'success' }}
      env:
        RC: ${{ steps.replan.outputs.rc || 'skipped' }}
        VERIFY_JSON: ${{ runner.temp }}/verify-json
      run: |
        set -euo pipefail
        verify-apply.py report --replan-rc "$RC" --json-dir "$VERIFY_JSON" \
          --replan-log replan.txt --apply-log apply.txt --activity activity.json \
          --out verification.json >verification.md
        printf '### Verification\n\n' >>"$GITHUB_STEP_SUMMARY"
        cat verification.md >>"$GITHUB_STEP_SUMMARY"
        result=$(jq -r .result verification.json)
        echo "result=$result" >>"$GITHUB_OUTPUT"
        [ "$result" = "passed" ] || echo "::error title=Verification::The apply did not verify (summary of this job). The verify job opens an issue and a draft revert."

    - name: Upload the verification
      if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verification-${{ github.run_id }}
        path: |
          verification.json
          verification.md
        retention-days: 30

    @@include templates/_fragments/vpn-down.yml@@

# The apply comment (apply-summary.py) on the pull request the applied
# commit came from: what the plan of this run meant to change, in the past
# tense, per resource whether it went through, and the verification. A job
# of its own, so that the apply identity needs no access to pull requests.
report:
  needs: [plan, apply]
  if: >-
    always() && github.event_name != 'pull_request'
    && contains(fromJSON('["success", "failure", "cancelled"]'), needs.apply.result)
  runs-on: ubuntu-24.04
  timeout-minutes: 5
  permissions:
    contents: read
    pull-requests: write
  steps:
    - name: Report scripts
      run: |
        d="$RUNNER_TEMP/ci"
        mkdir -p "$d"
        cat >"$d/apply-summary.py" <<'__CI_EOF__'
        @@include src/terragrunt/apply-summary.py@@
        __CI_EOF__
        cat >"$d/pr-comment.sh" <<'__CI_EOF__'
        @@include src/pr-comment.sh@@
        __CI_EOF__
        chmod +x "$d"/*
        echo "$d" >>"$GITHUB_PATH"

    - name: Plan of this run
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: plan-${{ github.run_id }}
        path: plan

    - name: Apply output
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: apply-${{ github.run_id }}
        path: apply

    # verification-<run id> from the apply job, and any other post-apply
    # check's verification-<run id>-<name> (README, Plan and apply comments).
    - name: Verification
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: verification-${{ github.run_id }}*
        path: verification

    - name: Summary
      env:
        OUTCOME: ${{ needs.apply.result }}
        STARTED: ${{ needs.apply.outputs.started }}
        ENDED: ${{ needs.apply.outputs.ended }}
      run: |
        set -euo pipefail
        apply-summary.py apply/destroy.txt apply/apply.txt --changes=plan/changes.json \
          --verification=verification --outcome="$OUTCOME" \
          --started="$STARTED" --ended="$ENDED" | tee apply.md
        cat apply.md >>"$GITHUB_STEP_SUMMARY"

    # The pull request merged as this commit; a commit pushed to main
    # directly has none, and the summary of the run is all there is. Each
    # run comments anew: the push and a later manual run are two applies. A
    # scheduled renewal belongs to no pull request.
    - name: Comment into the pull request
      if: github.event_name != 'schedule'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
          --jq '[.[] | select(.merged_at != null)][0].number // empty')
        if [ -z "$pr" ]; then
          echo "No merged pull request for $GITHUB_SHA; the summary of the run has the apply."
          exit 0
        fi
        pr-comment.sh "$pr" apply.md "terragrunt-apply-$GITHUB_RUN_ID"

# Runs only when the verification failed (a passed one is in the apply
# comment of the report job, and a job that only echoes bills a minute): a
# Bug issue (prio:high, source:drift) and a draft pull request that reverts
# the commit, and the run is red. The only job that may write to the
# repository.
verify:
  needs: apply
  if: ${{ !cancelled() && needs.apply.outputs.verification == 'failed' }}
  runs-on: ubuntu-24.04
  timeout-minutes: 10
  permissions:
    contents: write
    pull-requests: write
    issues: write
  steps:
    - name: Download the verification
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: verification-${{ github.run_id }}

    - name: Result
      env:
        RESULT: ${{ needs.apply.outputs.verification }}
      run: |
        { printf '### Verification\n\n'; cat verification.md; } >>"$GITHUB_STEP_SUMMARY"
        echo "Verification $RESULT."

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      if: needs.apply.outputs.verification == 'failed'
      with:
        ref: main
        path: repo
        fetch-depth: 0
        persist-credentials: false

    - name: Scripts
      if: needs.apply.outputs.verification == 'failed'
      run: |
        d="$RUNNER_TEMP/ci"
        mkdir -p "$d"
        cat >"$d/verify-failed.sh" <<'__CI_EOF__'
        @@include src/terragrunt/verify-failed.sh@@
        __CI_EOF__
        chmod +x "$d"/*
        echo "$d" >>"$GITHUB_PATH"

    - name: Issue and draft revert
      if: needs.apply.outputs.verification == 'failed'
      working-directory: repo
      env:
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ vars.OWNER }}
      run: verify-failed.sh ../verification.json ../verification.md

    - name: The verification has to pass
      if: needs.apply.outputs.verification == 'failed'
      run: |
        echo "::error::The apply went through but did not verify. See the summary, the issue and the draft revert; nothing was rolled back."
        exit 1

# The required check. On a pull request: every check passed (or was
# skipped). On main: in Azure DevOps a skipped apply stage left the run
# green, so eight applies in a row never happened and nothing said so. An
# apply that was due and did not succeed has to be red.
gate:
  needs: [select, validate, plan-shard, plan, destroy, apply, verify]
  if: always()
  runs-on: ubuntu-24.04
  timeout-minutes: 5
  permissions:
    contents: read
    # Read only: the approval check reads the reviews and the runs.
    pull-requests: read
    actions: read
  env:
    GH_TOKEN: ${{ github.token }}
  steps:
    - name: Approval script
      if: github.event_name == 'pull_request' && needs.plan.outputs.has_destroys == 'true'
      run: |
        d="$RUNNER_TEMP/ci"
        mkdir -p "$d"
        cat >"$d/destroy-approval.py" <<'__CI_EOF__'
        @@include src/terragrunt/destroy-approval.py@@
        __CI_EOF__
        chmod +x "$d/destroy-approval.py"
        echo "$d" >>"$GITHUB_PATH"

    # The name is read on main (destroy-approval.py STEP): only this step's
    # success means the destroys were approved. A plan without destroys needs
    # no approval, and a plan that did not run says so in the step below.
    - name: Destroys approved after the plan
      if: github.event_name == 'pull_request' && needs.plan.outputs.has_destroys == 'true'
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PLANNED_AT: ${{ needs.plan.outputs.planned_at }}
      run: destroy-approval.py pr "$PR_NUMBER" "$PLANNED_AT"

    - name: Checks passed
      if: always() && github.event_name == 'pull_request'
      env:
        RESULTS: ${{ toJSON(needs) }}
        LINT: ${{ needs.select.outputs.lint }}
      run: |
        failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
        if [ "$LINT" = "failed" ]; then
          failed="$failed"$'\n'"conventions or Sentinel lint: failed (annotations of the select job)"
        fi
        if [ -n "$failed" ]; then
          echo "::error::not passed: $(tr '\n' ' ' <<<"$failed")"
          exit 1
        fi
        jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"

    - name: The apply had to run
      if: github.event_name != 'pull_request'
      env:
        PLAN_RESULT: ${{ needs.plan.result }}
        PLAN_HAS_CHANGES: ${{ needs.plan.outputs.has_changes }}
        PLAN_HAS_DESTROYS: ${{ needs.plan.outputs.has_destroys }}
        ALLOW_DESTROY: ${{ inputs.allow-destroy }}
        DESTROY_APPROVED: ${{ needs.destroy.outputs.approved }}
        APPLY_RESULT: ${{ needs.apply.result }}
        SELECT_RESULT: ${{ needs.select.result }}
        VALIDATE_RESULT: ${{ needs.validate.result }}
        VERIFICATION: ${{ needs.apply.outputs.verification }}
        VERIFY_RESULT: ${{ needs.verify.result }}
        EVENT: ${{ github.event_name }}
        RENEWAL_UNIT: ${{ inputs.renewal-unit }}
        RENEWAL_DUE: ${{ needs.plan.outputs.renewal_due }}
        DRIFT: ${{ needs.plan.outputs.drift }}
      run: |
        if [ "$SELECT_RESULT" != "success" ]; then
          echo "::error::select ended as '$SELECT_RESULT', so nothing was planned"
          exit 1
        fi
        if [ "$VALIDATE_RESULT" != "success" ]; then
          echo "::error::validate ended as '$VALIDATE_RESULT', so nothing was applied"
          exit 1
        fi
        if [ "$PLAN_RESULT" != "success" ]; then
          echo "::error::plan ended as '$PLAN_RESULT'"
          exit 1
        fi
        # A schedule applies the due renewal and nothing else; any other
        # change is drift: the resources differ from main.
        if [ "$EVENT" = "schedule" ]; then
          if [ "$RENEWAL_DUE" = "true" ]; then
            if [ "$APPLY_RESULT" != "success" ] || [ "$VERIFICATION" != "passed" ]; then
              echo "::error::the renewal of $RENEWAL_UNIT was due but did not apply and verify (apply: $APPLY_RESULT, verification: ${VERIFICATION:-missing})"
              exit 1
            fi
            echo "Renewed $RENEWAL_UNIT." >>"$GITHUB_STEP_SUMMARY"
          fi
          drift=$PLAN_HAS_CHANGES
          [ -z "$RENEWAL_UNIT" ] || drift=$DRIFT
          if [ "$drift" = "true" ]; then
            echo "::error::drift: the resources differ from main (plan in the summary of this run)"
            exit 1
          fi
          echo "No drift." >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ "$PLAN_HAS_CHANGES" != "true" ]; then
          echo "Plan proposed nothing, apply was skipped." >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # Red on purpose: the change is merged but not applied, and the next
        # run on main keeps it selected until someone applies it.
        if [ "$PLAN_HAS_DESTROYS" = "true" ] && [ "$ALLOW_DESTROY" != "true" ] \
          && [ "$DESTROY_APPROVED" != "true" ]; then
          msg="The plan destroys or replaces resources and the merged pull request did not approve them after its plan, so the apply did not run by itself."
          msg="$msg Check the plan of this run, then run the workflow on main by hand with allow_destroy."
          echo "::error::$msg"
          echo "$msg" >>"$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        if [ "$APPLY_RESULT" != "success" ]; then
          echo "::error::the plan proposed a change but apply ended as '$APPLY_RESULT'"
          exit 1
        fi
        if [ "$VERIFICATION" != "passed" ]; then
          echo "::error::the apply went through but its verification is '${VERIFICATION:-missing}' (verify: $VERIFY_RESULT)"
          exit 1
        fi
        echo "Apply went through and verified." >>"$GITHUB_STEP_SUMMARY"
