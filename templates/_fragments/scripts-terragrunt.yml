@@include templates/_fragments/scripts-common.yml@@

- name: Terragrunt scripts
  run: |
    d="$RUNNER_TEMP/ci"
    cat >"$d/select-units.py" <<'__CI_EOF__'
    @@include src/terragrunt/select-units.py@@
    __CI_EOF__
    cat >"$d/base-commit.py" <<'__CI_EOF__'
    @@include src/terragrunt/base-commit.py@@
    __CI_EOF__
    cat >"$d/check-moves.py" <<'__CI_EOF__'
    @@include src/terragrunt/check-moves.py@@
    __CI_EOF__
    cat >"$d/check-principal-refs.py" <<'__CI_EOF__'
    @@include src/terragrunt/check-principal-refs.py@@
    __CI_EOF__
    cat >"$d/release-stale-locks.py" <<'__CI_EOF__'
    @@include src/terragrunt/release-stale-locks.py@@
    __CI_EOF__
    cat >"$d/portal-rules.py" <<'__CI_EOF__'
    @@include src/terragrunt/portal-rules.py@@
    __CI_EOF__
    cat >"$d/trivy-plans.sh" <<'__CI_EOF__'
    @@include src/terragrunt/trivy-plans.sh@@
    __CI_EOF__
    cat >"$d/home-vpn.sh" <<'__CI_EOF__'
    @@include src/terragrunt/home-vpn.sh@@
    __CI_EOF__
    chmod +x "$d"/*

# A step of its own: actionlint deadlocks on a run script of more than about
# 64 KB (it feeds shellcheck through a pipe), so the scripts are split.
- name: Verification script
  run: |
    d="$RUNNER_TEMP/ci"
    cat >"$d/verify-apply.py" <<'__CI_EOF__'
    @@include src/terragrunt/verify-apply.py@@
    __CI_EOF__
    chmod +x "$d/verify-apply.py"

# The plan comment's two scripts, a step each for the same reason.
- name: Plan summary script
  run: |
    d="$RUNNER_TEMP/ci"
    cat >"$d/plan-summary.py" <<'__CI_EOF__'
    @@include src/terragrunt/plan-summary.py@@
    __CI_EOF__
    chmod +x "$d/plan-summary.py"

- name: Plan details script
  run: |
    d="$RUNNER_TEMP/ci"
    cat >"$d/plan_details.py" <<'__CI_EOF__'
    @@include src/terragrunt/plan_details.py@@
    __CI_EOF__
