# Every Terragrunt script, for terragrunt-drift.yml, whose one job runs most
# of them. The jobs of terragrunt-jobs.yml include only the fragments they
# need (scripts-select.yml says why).
@@include templates/_fragments/scripts-common.yml@@

@@include templates/_fragments/scripts-select.yml@@

@@include templates/_fragments/scripts-plan.yml@@

@@include templates/_fragments/scripts-vpn.yml@@

@@include templates/_fragments/scripts-verify.yml@@

- name: Portal rules script
  run: |
    d="$RUNNER_TEMP/ci"
    cat >"$d/portal-rules.py" <<'__CI_EOF__'
    @@include src/terragrunt/portal-rules.py@@
    __CI_EOF__
    chmod +x "$d/portal-rules.py"
