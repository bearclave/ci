# The next release of a versioned repository (bearclave/governance
# standards/versioning.md): the next vX.Y.Z from the pull request titles merged
# since the last tag (src/release_version.py), a preview of the notes, and the
# commands that make the release by hand with a signed tag. It publishes
# nothing.
#
# A release is a tag signed with the owner's key; a workflow cannot sign with
# it, and the ruleset version-tags-creation lets only an owner create v* tags.
# So the workflow works out the version and the owner runs the printed
# commands (as in bearclave/ci, README Releasing). It needs no token and no
# secret: the repository's own read token is enough.
#
# Caller, .github/workflows/release.yml of a versioned repository (the
# owner runs it by hand before a release; no repository calls it yet):
#
#   on:
#     workflow_dispatch:
#       inputs:
#         version:
#           description: vX.Y.Z instead of the calculated one (empty = calculate)
#           type: string
#           default: ""
#   jobs:
#     release:
#       uses: bearclave/ci/.github/workflows/release.yml@v2
#       permissions:
#         contents: read
#       with:
#         version: ${{ inputs.version }}
#
# The same locally, in a checkout of main: python3 src/release_version.py
# of bearclave/ci.
name: release

on:
  workflow_call:
    inputs:
      version:
        description: vX.Y.Z instead of the calculated one; empty calculates it
        type: string
        default: ""
    outputs:
      version:
        description: The version proposed; empty when no release is needed
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Next version
        id: next
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cat >"$RUNNER_TEMP/release_version.py" <<'__CI_EOF__'
          @@include src/release_version.py@@
          __CI_EOF__
          python3 "$RUNNER_TEMP/release_version.py" "$VERSION"
