# Checks a repository against the conventions in its conventions.yaml: the
# rules, how strict each one is, and the exceptions with their reason. The
# rules themselves are in src/conventions.py of bearclave/ci.
#
#   jobs:
#     conventions:
#       uses: bearclave/ci/.github/workflows/conventions.yml@v1
#       permissions:
#         contents: read
#
# The check reports as "conventions / check".
name: conventions

on:
  workflow_call:
    inputs:
      config:
        description: Path of the conventions file in the calling repository
        type: string
        default: conventions.yaml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script travels inside this workflow (see build.py): the caller's
      # token cannot read bearclave/ci.
      - name: Conventions
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          script="$RUNNER_TEMP/conventions.py"
          cat >"$script" <<'PY'
          @@include src/conventions.py@@
          PY
          if [ ! -f "$CONFIG" ]; then
            echo "::error::$CONFIG not found"
            exit 1
          fi
          yq -o=json '.' "$CONFIG" >"$RUNNER_TEMP/conventions.json"
          python3 "$script" "$RUNNER_TEMP/conventions.json" .
