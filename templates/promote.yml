# Release of an application by a click (bearclave/governance
# standards/workflow.md, Applications): the commit of staging (its head unless
# a commit is given) goes to production. src/promote.py checks that the
# newest successful run of the caller's pipeline for the commit deployed
# staging (its job deploy-staging) and that the build artifact is still
# there; then, as the GitHub App bearclave-promote, it fast-forwards prod
# (the production job deploys the build of that same run, chosen by the same
# rule), waits for the production run of the push and, once it is green,
# tags vX.Y.Z and publishes the release. The version comes from
# the pull request titles since the last tag (src/release_version.py),
# unless one is given.
#
# A container (container.yml with environments) has no build artifact: its
# caller passes artifact: "", staging-job: deploy and prod-job: deploy. Its
# production run deploys the image :sha-<commit>, and the tag pushed here
# makes the caller's ci.yml (trigger push: tags: ['v*']) tag it :vX.Y.Z.
#
# The job signs in to Azure by OIDC as the repository's promote identity,
# federated on the environment `promote` (deployment branches: staging), and
# reads the key of bearclave-promote from its own vault
# (kv-ghpromote-sec-weu-001). That App is installed only on the applications,
# so its key reaches nothing else; bearclave-bot's key is never read here.
# The rulesets let only bearclave-promote move prod and create v* tags there.
#
# Caller, .github/workflows/promote.yml of an application:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         sha:
#           description: Commit of staging to release (empty = the head of staging)
#           type: string
#           default: ""
#         version:
#           description: vX.Y.Z instead of the calculated one (empty = calculate)
#           type: string
#           default: ""
#         dry-run:
#           description: Only check and show what would happen
#           type: boolean
#           default: false
#   permissions: {}
#   jobs:
#     promote:
#       uses: bearclave/ci/.github/workflows/promote.yml@v2
#       permissions:
#         contents: read
#         actions: read
#         id-token: write
#       with:
#         sha: ${{ inputs.sha }}
#         version: ${{ inputs.version }}
#         dry-run: ${{ inputs.dry-run }}
#         client-id: ${{ vars.AZURE_CLIENT_ID_PROMOTE }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
name: promote

on:
  workflow_call:
    inputs:
      sha:
        description: Commit of the staging branch to release; empty takes its head
        type: string
        default: ""
      version:
        description: vX.Y.Z instead of the calculated one; empty calculates it
        type: string
        default: ""
      dry-run:
        description: Only check and show what would happen; nothing is written
        type: boolean
        default: false
      workflow:
        description: File name of the pipeline that builds and deploys to staging
        type: string
        default: ci.yml
      artifact:
        description: Name of the build artifact production deploys, checked in the staging run; empty skips the check
        type: string
        default: site
      staging-job:
        description: Job of the pipeline that deploys staging; it must have succeeded in the staging run (empty skips the check)
        type: string
        default: deploy-staging
      prod-job:
        description: Job of the pipeline that deploys production; it must have succeeded in the production run before anything is tagged (empty skips the check)
        type: string
        default: deploy-prod
      wait-minutes:
        description: How long to wait for the production run before giving up, 0 to 30 (nothing is tagged then)
        type: number
        default: 20
      vault:
        description: Key Vault with the key, App ID and installation ID of bearclave-promote
        type: string
        default: kv-ghpromote-sec-weu-001
      staging-branch:
        description: Branch that runs in staging (the default branch)
        type: string
        default: staging
      prod-branch:
        description: Branch that runs in production
        type: string
        default: prod
      environment:
        description: Environment of the job; the promote identity is federated on it
        type: string
        default: promote
      client-id:
        description: Client ID of the promote identity (Key Vault Secrets User on the vault of bearclave-promote)
        type: string
        required: true
      tenant-id:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: ubuntu-24.04
    # The wait for the production run included.
    timeout-minutes: 35
    environment: ${{ inputs.environment }}
    # One promotion of a repository at a time, whatever the caller does.
    concurrency:
      group: promote-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      # The staging run of the commit and its artifacts.
      actions: read
      id-token: write
    env:
      STAGING_BRANCH: ${{ inputs.staging-branch }}
      PROD_BRANCH: ${{ inputs.prod-branch }}
    steps:
      - name: Run from the staging branch, with a full commit SHA
        env:
          SHA_INPUT: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA_INPUT" =~ ^([0-9a-f]{40})?$ ]]; then
            echo "::error title=promote::sha must be empty or a full 40-character commit SHA"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/$STAGING_BRANCH" ]; then
            echo "::error title=promote::run it from $STAGING_BRANCH, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/promote"
          cat >"$RUNNER_TEMP/promote/release_version.py" <<'__CI_EOF__'
          @@include src/release_version.py@@
          __CI_EOF__
          cat >"$RUNNER_TEMP/promote/github_bot.py" <<'__CI_EOF__'
          @@include src/github_bot.py@@
          __CI_EOF__
          cat >"$RUNNER_TEMP/promote/promote.py" <<'__CI_EOF__'
          @@include src/promote.py@@
          __CI_EOF__

      - name: Next version
        id: next
        env:
          VERSION: ${{ inputs.version }}
          RELEASED_BY_PROMOTE: "true"
        run: python3 "$RUNNER_TEMP/promote/release_version.py" "$VERSION"

      - name: Sign in to Azure
        if: ${{ !inputs.dry-run }}
        env:
          AZURE_CLIENT_ID: ${{ inputs.client-id }}
          AZURE_TENANT_ID: ${{ inputs.tenant-id }}
        run: |
          set -euo pipefail
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --allow-no-subscriptions --output none

      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
          ARTIFACT: ${{ inputs.artifact }}
          STAGING_JOB: ${{ inputs.staging-job }}
          PROD_JOB: ${{ inputs.prod-job }}
          WAIT_MINUTES: ${{ inputs.wait-minutes }}
          PROMOTE_VAULT: ${{ inputs.vault }}
          VERSION: ${{ steps.next.outputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          export SHA
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python3 "$RUNNER_TEMP/promote/promote.py" "${args[@]}"
