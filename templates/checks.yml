# The pipeline of a repository that builds and deploys nothing (governance,
# handbook, ops-tools, app-office-templates, vs-code-extensions, .github):
# ESLint where the repository has JavaScript, an optional command of the
# repository's own, then the gate the ruleset requires.
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/checks.yml@v2
#       permissions:
#         contents: read
#       with:
#         command: python3 tools/check.py    # optional
#
# The required check is "pipeline / gate".
name: checks

on:
  workflow_call:
    inputs:
      command:
        description: Commands run in the checkout of the repository; empty runs nothing
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    if: inputs.command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Repository checks
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"

  eslint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      @@include templates/_fragments/eslint-steps.yml@@

  gate:
    needs: [checks, eslint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      @@include templates/_fragments/gate-step.yml@@
