# The pipeline of a repository that builds and deploys nothing (governance,
# handbook, ops-tools, app-office-templates, vs-code-extensions, .github):
# ESLint where the repository has JavaScript, an optional command of the
# repository's own; the one job is the gate the ruleset requires.
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/checks.yml@v2
#       permissions:
#         contents: read
#       with:
#         command: python3 tools/check.py    # optional
#
# The required check is "pipeline / gate".
name: checks

on:
  workflow_call:
    inputs:
      command:
        description: Commands run in the checkout of the repository; empty runs nothing
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # One job, and it is the gate: ESLint where there is JavaScript, then the
  # repository's own command. A job of its own for ESLint cost a minute even
  # without any, and so did a gate that only read this job's result. Nothing
  # in it can be skipped (a skipped job would count as passed in a required
  # check): its steps carry on after a failure and the job ends red.
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      @@include templates/_fragments/eslint-steps.yml@@

      - name: Repository checks
        if: ${{ !cancelled() && inputs.command != '' }}
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"
