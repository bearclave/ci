# The pipeline of a repository of Terraform modules (terraform-modules). Nothing
# reaches a cloud: no credentials, no backend, no apply.
#
#   formatting, init -backend=false + validate per module, terraform test
#   where a module has tests/, tflint, trivy config over the modules, the
#   README tables (terraform-docs, where .terraform-docs.yml is), the catalog
#   (docs/catalog.md, where it is), and the conventions in conventions.yaml
#
#   jobs:
#     pipeline:
#       uses: bearclave/ci/.github/workflows/terraform-modules.yml@v2
#       permissions:
#         contents: read
#
# Versions: TERRAFORM_VERSION, TFLINT_*, TRIVY_*, TERRAFORM_DOCS_* in the caller's
# .github/tool-versions.env. The required check is "pipeline / gate".
name: terraform-modules

on:
  workflow_call:
    inputs:
      conventions-config:
        description: Path of the conventions file (default .github/conventions.yaml, or conventions.yaml where it is still in the root)
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools/bin
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tfcache

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history is what a pull request is compared with.
          fetch-depth: 0
          persist-credentials: false

      @@include templates/_fragments/scripts-common.yml@@

      # A pull request checks the modules it touches (and the ones that call
      # them); a push, and any change to what every module shares (the
      # workflows, the tool versions, the lint and docs settings, a _common
      # folder), checks all of them. Formatting, the catalog and trivy always
      # cover the whole repository.
      - name: Modules to check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cat >"$RUNNER_TEMP/changed-modules.py" <<'__CI_EOF__'
          @@include src/terraform/changed-modules.py@@
          __CI_EOF__
          python3 "$RUNNER_TEMP/changed-modules.py" "$RUNNER_TEMP/modules" "$BASE"

      - name: Tool versions
        id: versions
        run: grep '^TERRAFORM_VERSION=' .github/tool-versions.env >>"$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.versions.outputs.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Restore tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOLS_DIR }}
          key: tools-${{ runner.os }}-${{ hashFiles('.github/tool-versions.env') }}

      # Every module declares only a range, so the resolved provider is the
      # newest one that fits. Keyed on the declarations, not on a lock file -
      # the exact version is pinned by the consuming repository.
      - name: Restore provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: providers-${{ runner.os }}-${{ hashFiles('**/versions.tf') }}
          restore-keys: providers-${{ runner.os }}-

      - name: Install tools
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tools=(tflint trivy)
          if [ -f .terraform-docs.yml ]; then tools+=(terraform-docs); fi
          install-tools.sh "${tools[@]}"

      - name: Formatting
        run: terraform fmt -check -recursive -diff

      # init -backend=false + validate over every directory that holds .tf
      # files. One failing module does not stop the others, so a single run
      # reports everything that is broken.
      - name: Module validation
        run: |
          set -uo pipefail
          fail=0
          while read -r dir; do
            echo "::group::$dir"
            if ! terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null; then
              echo "::error file=$dir::terraform init failed"
              fail=1
            elif ! terraform -chdir="$dir" validate -no-color; then
              echo "::error file=$dir::terraform validate failed"
              fail=1
            fi
            echo "::endgroup::"
          done <"$RUNNER_TEMP/modules/validate.txt"
          exit $fail

      # Offline: the tests plan against mock_provider; the modules are
      # initialised by the step above.
      - name: Module tests
        run: |
          set -uo pipefail
          fail=0
          while read -r dir; do
            echo "::group::$dir"
            if ! terraform -chdir="$dir" test -no-color; then
              echo "::error file=$dir::terraform test failed"
              fail=1
            fi
            echo "::endgroup::"
          done <"$RUNNER_TEMP/modules/test.txt"
          exit $fail

      # The generated tables of every module README match the module.
      - name: README tables
        if: hashFiles('.terraform-docs.yml') != ''
        run: |
          set -uo pipefail
          fail=0
          while read -r dir; do
            if ! terraform-docs --config .terraform-docs.yml --output-check "$dir" >/dev/null; then
              echo "::error file=$dir/README.md::the terraform-docs part is not up to date; run 'terraform-docs --config .terraform-docs.yml $dir'"
              fail=1
            fi
          done <"$RUNNER_TEMP/modules/readme.txt"
          exit $fail

      - name: Catalog
        if: hashFiles('docs/catalog.md') != ''
        run: |
          cat >"$RUNNER_TEMP/catalog.py" <<'__CI_EOF__'
          @@include src/terraform/catalog.py@@
          __CI_EOF__
          python3 "$RUNNER_TEMP/catalog.py" . --check || {
            echo "::error file=docs/catalog.md::not up to date; run python3 <ci>/src/terraform/catalog.py ."
            exit 1
          }

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$PWD/.tflint.hcl"
          fail=0
          while read -r dir; do
            tflint --chdir="$dir" --config="$PWD/.tflint.hcl" || fail=1
          done <"$RUNNER_TEMP/modules/validate.txt"
          exit $fail

      - name: trivy config
        run: |
          ignore=.github/trivyignore.yaml
          [ -f "$ignore" ] || ignore=.trivyignore.yaml
          trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile "$ignore" .

  conventions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      @@include templates/_fragments/conventions-steps.yml@@

  gate:
    needs: [terraform, conventions]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      @@include templates/_fragments/gate-step.yml@@
