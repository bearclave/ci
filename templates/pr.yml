# The pull request check of the organisation standards
# (bearclave/governance standards/workflow.md): a Conventional Commit title,
# a <type>/<slug> branch, the sections of the description; it sets the
# type:*, breaking and size:* labels and assigns the author. It also checks
# the root layout against governance standards/layout.yaml (a managed copy in
# src/layout.yaml), with the exceptions in the repository's
# .github/conventions.yaml (layout: exceptions:).
#
# Every repository has the same caller, .github/workflows/pr.yml (managed by
# governance/sync.py), and the check reports as "pr / check":
#
#   on:
#     pull_request:
#       branches: [main]
#       types: [opened, edited, reopened, synchronize, ready_for_review]
#   jobs:
#     pr:
#       uses: bearclave/ci/.github/workflows/pr.yml@v2
#       permissions:
#         contents: read
#         pull-requests: write
#
# Generated files do not count for the size: mark them linguist-generated in
# .gitattributes; lock files never count.
name: pr

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Title, branch, description, labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSIGNEES: ${{ join(github.event.pull_request.assignees.*.login, ',') }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          cat >"$RUNNER_TEMP/pr_check.py" <<'__CI_EOF__'
          @@include src/pr_check.py@@
          __CI_EOF__
          python3 "$RUNNER_TEMP/pr_check.py"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      - name: Root layout
        if: ${{ !cancelled() }}
        env:
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          cat >"$RUNNER_TEMP/layout.yaml" <<'__CI_EOF__'
          @@include src/layout.yaml@@
          __CI_EOF__
          cat >"$RUNNER_TEMP/layout_check.py" <<'__CI_EOF__'
          @@include src/layout_check.py@@
          __CI_EOF__
          yq -o=json '.' "$RUNNER_TEMP/layout.yaml" >"$RUNNER_TEMP/layout.json"
          config=.github/conventions.yaml
          [ -f "$config" ] || config=conventions.yaml
          if [ -f "$config" ]; then
            yq -o=json '.layout // {}' "$config" >"$RUNNER_TEMP/layout-exceptions.json"
          else
            echo '{}' >"$RUNNER_TEMP/layout-exceptions.json"
          fi
          python3 "$RUNNER_TEMP/layout_check.py" "$RUNNER_TEMP/layout.json" \
            "$RUNNER_TEMP/layout-exceptions.json" "$REPOSITORY" .
