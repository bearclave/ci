# Security checks every repository in the organisation runs on its pull
# requests: no secret anywhere in the history, workflows that are sound and
# shell scripts without real defects.
#
# A caller needs one job, and the check it reports is "security / scan":
#
#   jobs:
#     security:
#       uses: bearclave/ci/.github/workflows/security.yml@v2
#       permissions:
#         contents: read
#
# The tools arrive as release binaries checked against the sha256 below: the
# organisation allows only GitHub-owned, verified, azure/* and hashicorp/*
# actions. Dependabot does not see these pins, so a version and its checksum
# are bumped here together, by hand. The checksum is the `digest` GitHub
# publishes with the release asset.
name: security

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: "1.30.1"
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
      # gitleaks reads the history, not just the tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Outside the checkout, so that none of the scanners reads the tools.
      - name: Install tools
        run: |
          bin="$RUNNER_TEMP/tools"
          mkdir -p "$bin"
          fetch() { # url sha256 file
            curl -fsSL --retry 3 "$1" -o "$3"
            echo "$2  $3" | sha256sum -c - >/dev/null
          }
          t=$(mktemp -d)
          gh_dl=https://github.com
          fetch "$gh_dl/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "$GITLEAKS_SHA256" "$t/gitleaks.tgz"
          tar -xzf "$t/gitleaks.tgz" -C "$bin" gitleaks
          fetch "$gh_dl/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            "$ACTIONLINT_SHA256" "$t/actionlint.tgz"
          tar -xzf "$t/actionlint.tgz" -C "$bin" actionlint
          fetch "$gh_dl/zizmorcore/zizmor/releases/download/v$ZIZMOR_VERSION/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            "$ZIZMOR_SHA256" "$t/zizmor.tgz"
          tar -xzf "$t/zizmor.tgz" -C "$bin" zizmor
          fetch "$gh_dl/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.gz" \
            "$SHELLCHECK_SHA256" "$t/shellcheck.tgz"
          tar -xzf "$t/shellcheck.tgz" -C "$t"
          mv "$t/shellcheck-v$SHELLCHECK_VERSION/shellcheck" "$bin/"
          echo "$bin" >>"$GITHUB_PATH"
          for tool in gitleaks actionlint zizmor shellcheck; do
            echo "$tool: $("$bin/$tool" --version 2>&1 | head -1)"
          done

      # Stands in for secret scanning, which a private repository gets only
      # with the paid Secret Protection add-on. A false positive is allowed in
      # the repository's .gitleaks.toml, with the reason and a review date in its
      # description.
      - name: gitleaks
        run: gitleaks git --no-banner --redact --exit-code 1 .

      # Every allowlist of .gitleaks.toml ends its description with
      # "review: YYYY-MM-DD"; a date that has passed is a warning.
      - name: gitleaks exception reviews
        if: ${{ !cancelled() && hashFiles('.gitleaks.toml') != '' }}
        run: |
          script="$RUNNER_TEMP/exception_review.py"
          cat >"$script" <<'__CI_EOF__'
          @@include src/exception_review.py@@
          __CI_EOF__
          python3 "$script" gitleaks=.gitleaks.toml

      # Also runs shellcheck over the scripts inside `run:`.
      - name: actionlint
        run: actionlint -color

      # The organisation's own reusable workflows are referenced by a moving
      # tag on purpose (see the README of bearclave/ci); everything else has
      # to be pinned to a commit, which the organisation enforces as well.
      #
      # ref-confusion is off: it reads the branches and tags of every action
      # referenced by a tag or branch, and the caller's token cannot read
      # bearclave/ci, so the audit ends in a fatal error. Nothing else
      # is referenced by a tag or branch - pinning to a commit is enforced -
      # so the audit has nothing left to check.
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          config="$RUNNER_TEMP/zizmor.yml"
          cat >"$config" <<'EOF'
          rules:
            ref-confusion:
              disable: true
            unpinned-uses:
              config:
                policies:
                  "bearclave/*": ref-pin
                  "*": hash-pin
          EOF
          zizmor --persona=regular --min-severity=medium --config "$config" .github/workflows

      # Warnings and errors only: the style notes would fail on intentional
      # word splitting.
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"
