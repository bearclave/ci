# The weekly housekeeping report (bearclave/governance
# standards/workflow.md#housekeeping): branches without a pull request older
# than branch-days, pull requests without an update for pr-days, in one issue
# of the repository (type Debt, assigned to the owner) that every run updates
# and that closes itself once nothing is stale. It deletes nothing.
#
# Caller, .github/workflows/housekeeping.yml of the repository:
#
#   on:
#     schedule:
#       - cron: "23 5 * * 1"
#     workflow_dispatch:
#   jobs:
#     housekeeping:
#       uses: bearclave/ci/.github/workflows/housekeeping.yml@v2
#       permissions:
#         contents: read
#         issues: write
#         pull-requests: read
name: housekeeping

on:
  workflow_call:
    inputs:
      branch-days:
        description: A branch without a pull request is stale after this many days
        type: number
        default: 30
      pr-days:
        description: A pull request without an update is stale after this many days
        type: number
        default: 14
      assignee:
        description: Who the report issue is assigned to
        type: string
        default: matej-hrabalek

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Stale branches and pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_DAYS: ${{ inputs.branch-days }}
          PR_DAYS: ${{ inputs.pr-days }}
          ASSIGNEE: ${{ inputs.assignee }}
        run: |
          cat >"$RUNNER_TEMP/housekeeping.py" <<'__CI_EOF__'
          @@include src/housekeeping.py@@
          __CI_EOF__
          python3 "$RUNNER_TEMP/housekeeping.py"
