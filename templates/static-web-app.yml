# The pipeline of a static website (app-web-bearclave, app-web-matejhrabalek):
# the common site checks (src/site_checks.py: the config and its security
# headers, the pages against the CSP, well-formed HTML, links), ESLint and the
# site's own checks on every run, and on main a deployment into its Static
# Web App - only when something under the deployed paths changed since the
# last successful run - followed by a smoke test of the site's URL.
#
#   jobs:
#     security:
#       uses: bearclave/ci/.github/workflows/security.yml@v2
#       permissions:
#         contents: read
#     pipeline:
#       needs: security          # nothing is deployed past a failed scan
#       uses: bearclave/ci/.github/workflows/static-web-app.yml@v2
#       permissions:
#         contents: read
#         id-token: write
#         actions: read
#       with:
#         swa-name: stapp-web-sro-weu-001
#         swa-resource-group: rg-web-sro-weu-001
#         site-checks: |                   # optional: what only this site checks
#           node --test tests/
#         url: https://bearclave.cz/        # optional: the smoke test after a deployment
#         environment: prod
#         client-id: ${{ vars.AZURE_CLIENT_ID }}
#         tenant-id: ${{ vars.AZURE_TENANT_ID }}
#         subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
#
# The identity may deploy the site's Static Web App and nothing else. With an
# environment it is federated on that environment (whose branch policy allows
# main only); without one on main. Either way a run from a branch gets no
# token. The required check is "pipeline / gate".
name: static-web-app

on:
  workflow_call:
    inputs:
      swa-name:
        description: Name of the Static Web App
        type: string
        required: true
      swa-resource-group:
        description: Its resource group
        type: string
        required: true
      site-checks:
        description: Commands of the site's own checks, one per line, run on the Node of the runner, after the common ones
        type: string
        default: ""
      app-location:
        description: Directory with the static content
        type: string
        default: ./src
      api-location:
        description: Directory with the Azure Functions API
        type: string
        default: ./api
      deploy-paths:
        description: Paths whose change triggers a deployment, space-separated
        type: string
        default: src api
      url:
        description: Public URL of the site; after a deployment it must answer 200 (the smoke test). Empty skips the test with a warning
        type: string
        default: ""
      swa-cli-version:
        description: Version of @azure/static-web-apps-cli
        type: string
        default: 2.0.10
      environment:
        description: Environment of the deploy job (prod); empty deploys without one
        type: string
        default: ""
      client-id:
        description: Client ID of the deploying identity
        type: string
        required: true
      tenant-id:
        type: string
        required: true
      subscription-id:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The whole site is static, so nothing compiles; these checks stand in
      # for what only the deployed site or a failed deployment would show.
      - name: Common site checks
        env:
          APP_LOCATION: ${{ inputs.app-location }}
        run: |
          script="$RUNNER_TEMP/site_checks.py"
          cat >"$script" <<'__CI_EOF__'
          @@include src/site_checks.py@@
          __CI_EOF__
          python3 "$script" "$APP_LOCATION"

      - name: Site checks of the repository
        if: inputs.site-checks != ''
        env:
          CHECKS: ${{ inputs.site-checks }}
        run: |
          set -euo pipefail
          while IFS= read -r cmd; do
            [ -n "${cmd// }" ] || continue
            echo "::group::$cmd"
            bash -euo pipefail -c "$cmd"
            echo "::endgroup::"
          done <<<"$CHECKS"

      # In the same job: a job of its own costs a minute even where there is
      # no JavaScript to lint.
      @@include templates/_fragments/eslint-steps.yml@@

  # The site is deployed only when the content actually changed. The check is
  # a step rather than a path filter on the trigger, so that the checks run
  # on every push and every pull request.
  deploy:
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      # The base commit is the head of the last successful run on main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Compared with the head of the last successful run on main, not with the
      # previous push: a deployment that failed, or a run a newer push took the
      # place of, leaves its content to the next run instead of losing it.
      # Without such a run the site is deployed.
      - name: Did the content change
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_PATHS: ${{ inputs.deploy-paths }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "yes=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # The caller's workflow file, e.g. ci.yml.
          wf=${GITHUB_WORKFLOW_REF%@*}; wf=${wf##*/}
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=main&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].head_sha // empty') || BASE=""
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No successful run on main to compare with; deploying." >>"$GITHUB_STEP_SUMMARY"
            echo "yes=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          echo "Compared with \`$BASE\`, the last successful run." >>"$GITHUB_STEP_SUMMARY"
          # shellcheck disable=SC2086 # the paths are meant to split
          if git diff --quiet "$BASE" HEAD -- $DEPLOY_PATHS; then
            echo "yes=false" >>"$GITHUB_OUTPUT"
            echo "Nothing under the deployed paths changed." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "yes=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: steps.changed.outputs.yes == 'true'
        with:
          client-id: ${{ inputs.client-id }}
          tenant-id: ${{ inputs.tenant-id }}
          subscription-id: ${{ inputs.subscription-id }}

      - name: Deploy
        if: steps.changed.outputs.yes == 'true'
        env:
          SWA_NAME: ${{ inputs.swa-name }}
          SWA_RG: ${{ inputs.swa-resource-group }}
          APP_LOCATION: ${{ inputs.app-location }}
          API_LOCATION: ${{ inputs.api-location }}
          SWA_CLI: ${{ inputs.swa-cli-version }}
        run: |
          set -euo pipefail
          TOKEN=$(az staticwebapp secrets list --name "$SWA_NAME" \
            --resource-group "$SWA_RG" --query "properties.apiKey" -o tsv)
          # The token is a deployment credential; without this it would end up
          # in the log the moment any command echoes it.
          echo "::add-mask::$TOKEN"
          npx -y "@azure/static-web-apps-cli@$SWA_CLI" deploy "$APP_LOCATION" \
            --api-location "$API_LOCATION" \
            --env production \
            --deployment-token "$TOKEN" \
            --no-use-keychain

      # The CLI returns before the new content is served everywhere, so the
      # test retries for about two minutes before the run turns red.
      - name: Smoke test
        if: steps.changed.outputs.yes == 'true'
        env:
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          if [ -z "$URL" ]; then
            echo "::warning title=smoke test::no url input - the deployment is not checked"
            exit 0
          fi
          code=000
          for attempt in 1 2 3 4 5 6 7 8; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$URL") || code=000
            [ "$code" = 200 ] && break
            echo "Attempt $attempt: $URL answered $code."
            sleep 15
          done
          if [ "$code" != 200 ]; then
            echo "::error title=smoke test::$URL answered $code after the deployment"
            exit 1
          fi
          echo "Smoke test: $URL answered 200." >>"$GITHUB_STEP_SUMMARY"

  gate:
    needs: [site, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      @@include templates/_fragments/gate-step.yml@@
